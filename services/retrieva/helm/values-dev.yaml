# dev (ns retrieva-dev) — Harbor images, 1 replica, free-tier AI (ollama-cloud + nvidia-embed).
secretsVaultPath: platform/retrieva-dev
postgres:
  enabled: true          # dev Postgres — the primary datastore (RTV-49 cutover complete)
ingress:
  host: retrieva-dev.10.0.0.200.nip.io
  tlsSecretName: retrieva-dev-tls
quota:
  name: retrieva-dev-quota
  limitRangeName: retrieva-dev-limits
  requestsCpu: "1"
  requestsMemory: 1800Mi   # +300Mi headroom for Postgres (req 256Mi) — RTV-46
  limitsCpu: "5"          # +1 CPU so the nightly pg-backup job fits (crew A2A ate the limits headroom) — RTV-85
  limitsMemory: 5Gi       # +1Gi: steady-state (backend+worker+crew+frontend+pg+redis) = 4032Mi of 4Gi → the 512Mi backup pod was quota-denied → DeadlineExceeded
  pods: "12"

# Dedicated BullMQ worker (retrieva-backend#437) — dev enables it first for verification.
worker:
  enabled: true

backend:
  image:
    repository: harbor.10.0.0.200.nip.io/library/retrieva-backend
    tag: d51149a
  workload:
    replicas: 1
  env:
    - { name: PORT, value: "3007" }
    - { name: NODE_ENV, value: "production" }
    - { name: LOG_LEVEL, value: "info" }
    - { name: DOCKER_ENV, value: "true" }
    # RTV-54 entity isolation — dev now ENFORCE (shadow observed clean: the scoped read
    # logged its would-be filter, no false denials). See retrieva authorization-model ADR.
    - { name: ENTITY_ISOLATION_MODE, value: "enforce" }
    - { name: DATABASE_URL,    valueFrom: { secretKeyRef: { name: retrieva-secrets, key: database-url } } }
    - { name: REDIS_URL,       valueFrom: { secretKeyRef: { name: retrieva-secrets, key: redis-url } } }
    - { name: REDIS_PASSWORD,  valueFrom: { secretKeyRef: { name: retrieva-secrets, key: redis-password } } }
    - { name: QDRANT_URL, value: "http://qdrant.ai.svc.cluster.local:6333" }
    - { name: INGEST_USE_DOCLING, value: "true" }
    - { name: MARKITDOWN_URL, value: "http://markitdown-proxy.ai.svc.cluster.local:8000" }
    - { name: DOCLING_URL, value: "http://docling.ai.svc.cluster.local:5001" }
    - { name: INGEST_VLM_CAPTION, value: "true" }          # dev validates VLM captioning
    # dev = FREE tier only (dev-free litellm access_group). Was azure-gpt-4.1-mini
    # (PAID Azure OpenAI) — the only paid leak in dev; paid models are prod-only.
    # nvidia-vision-90b = llama-3.2-90b-vision-instruct on NVIDIA NIM (free).
    - { name: VLM_CAPTION_MODEL, value: "nvidia-vision-90b" }
    - { name: QDRANT_API_KEY,  valueFrom: { secretKeyRef: { name: retrieva-secrets, key: qdrant-api-key } } }
    - { name: QDRANT_COLLECTION_NAME, value: "retrieva-dev" }   # dev's own collection
    - { name: LLM_PROVIDER, value: "azure_openai" }
    - { name: EMBEDDING_PROVIDER, value: "azure" }
    - { name: OLLAMA_BASE_URL, value: "http://litellm.ai.svc.cluster.local:4000" }
    - { name: AZURE_OPENAI_ENDPOINT, value: "http://litellm.ai.svc.cluster.local:4000" }
    - { name: AZURE_OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: retrieva-secrets, key: litellm-api-key } } }
    - { name: AZURE_OPENAI_LLM_DEPLOYMENT, value: "ollama-cloud" }      # dev free tier
    - { name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT, value: "nvidia-embed" }
    - { name: AZURE_OPENAI_API_VERSION, value: "2024-02-15-preview" }
    - { name: LLM_MODEL, value: "ollama-cloud" }
    - { name: EMBEDDING_MODEL, value: "nvidia-embed" }
    - { name: JUDGE_LLM_MODEL, value: "ollama-cloud" }
    # #618 — LLM reranker isolates the on-topic clause before the judge (dev: 0.500 -> 0.583, free).
    # Off in prod until validated there; fail-open so it can never make an assessment worse.
    - { name: ASSESSMENT_RERANK_ENABLED, value: "false" }  # off: full-doc A/B showed the weak-model LLM reranker net-NEGATIVE (0.556->0.444), drops the relevant chunk
    - { name: LANGFUSE_BASE_URL, value: "http://langfuse-web.langfuse.svc.cluster.local:3000" }
    - { name: LANGFUSE_TRACING_ENVIRONMENT, value: "development" }      # dev env in the shared project
    - { name: LANGFUSE_PROMPT_LABEL, value: "latest" }                 # dev iterates on latest
    - { name: LANGFUSE_PUBLIC_KEY, valueFrom: { secretKeyRef: { name: retrieva-secrets, key: langfuse-public-key } } }
    - { name: LANGFUSE_SECRET_KEY, valueFrom: { secretKeyRef: { name: retrieva-secrets, key: langfuse-secret-key } } }
    - { name: JWT_ACCESS_SECRET,  valueFrom: { secretKeyRef: { name: retrieva-secrets, key: jwt-access-secret } } }
    - { name: JWT_REFRESH_SECRET, valueFrom: { secretKeyRef: { name: retrieva-secrets, key: jwt-refresh-secret } } }
    - { name: ENCRYPTION_KEY,     valueFrom: { secretKeyRef: { name: retrieva-secrets, key: encryption-key } } }
    - { name: FRONTEND_URL, value: "https://retrieva-dev.10.0.0.200.nip.io" }
    - { name: ALLOWED_ORIGINS, value: "https://retrieva-dev.10.0.0.200.nip.io" }
    # RTV-81b — delegate the assessment gap node to the CrewAI crew over A2A (dev first). The crew
    # output is PROPOSED (never persisted); the supervisor's human gate stays authoritative. Paired
    # with crewA2A.enabled below (opens the backend→crew:8080 egress netpol).
    - { name: CREW_A2A_ENABLED, value: "true" }
    - { name: CREW_A2A_URL, value: "http://retrieva-assessment-crew.retrieva-dev.svc.cluster.local:8080" }
    # RTV-91 — Authentik discovery connector (dev first). The read-only connector lists apps from
    # the platform IdP and PROPOSES arrangements (human-confirmed; nothing auto-written). Internal
    # svc (http, no TLS). Token from Vault platform/retrieva-dev via the retrieva-secrets ES, gated
    # by authentik.enabled below (which also adds the key + opens the backend→authentik:80 egress).
    - { name: AUTHENTIK_BASE_URL, value: "http://authentik-server.authentik.svc.cluster.local" }
    - { name: AUTHENTIK_API_TOKEN, valueFrom: { secretKeyRef: { name: retrieva-secrets, key: authentik-api-token } } }
    # RTV-92 — ERPNext AP/ERP discovery connector (dev first). The read-only connector lists submitted
    # Purchase Invoices from the ERP and PROPOSES arrangements from supplier spend (human-confirmed;
    # nothing auto-written). Internal svc (http, no TLS). Creds from Vault platform/retrieva-dev via the
    # retrieva-secrets ES, gated by erpnext.enabled below (which opens the backend→erp:8080 egress).
    - { name: ERPNEXT_BASE_URL, value: "http://erpnext.erp.svc.cluster.local:8080" }
    # Frappe is multi-tenant + routes by Host → send the site name while dialing the internal svc
    # (ERPNEXT_HOST_HEADER, RTV-92 fix). Without it Frappe 404s ("site erpnext.erp.svc… does not exist").
    - { name: ERPNEXT_HOST_HEADER, value: "erp.devandre.sbs" }
    - { name: ERPNEXT_API_KEY, valueFrom: { secretKeyRef: { name: retrieva-secrets, key: erpnext-api-key } } }
    - { name: ERPNEXT_API_SECRET, valueFrom: { secretKeyRef: { name: retrieva-secrets, key: erpnext-api-secret } } }
    # RTV-91d — repeatable discovery sweep (dev). The API process registers the repeatable job
    # (ENABLED+HOURS); the worker process fans it out for ORG_ID across configured sources. Both
    # workloads reuse this env (worker.yaml re-renders backend.env). Idempotent: apps already in the
    # inbox are skipped, so a daily re-sweep is cheap. ORG_ID = the dev verification org.
    - { name: DISCOVERY_SCHEDULE_ENABLED, value: "true" }
    - { name: DISCOVERY_SCHEDULE_HOURS, value: "24" }
    - { name: DISCOVERY_SCHEDULE_ORG_ID, value: "d463f7b5-fe98-4414-a2d2-08fa1a783b7a" }
    # RTV-93 — repeatable register-completeness audit (dev). The API process registers the repeatable
    # job (ENABLED+HOURS); the worker process runs it for ORG_ID (deterministic, read-only — scans the
    # Register for structural gaps → findings inbox; a human acknowledges/resolves). Both workloads
    # reuse this env (worker.yaml re-renders backend.env). Idempotent: open gaps aren't re-raised,
    # fixed gaps auto-resolve, so a daily re-audit is cheap. ORG_ID = the dev verification org.
    - { name: COMPLETENESS_SCHEDULE_ENABLED, value: "true" }
    - { name: COMPLETENESS_SCHEDULE_HOURS, value: "24" }
    - { name: COMPLETENESS_SCHEDULE_ORG_ID, value: "d463f7b5-fe98-4414-a2d2-08fa1a783b7a" }

# Opens the least-privilege backend→crew:8080 egress rule (templates/networkpolicy.yaml).
crewA2A:
  enabled: true

# RTV-91 — turns on the Authentik discovery connector on dev: adds authentik-api-token to the
# retrieva-secrets ExternalSecret AND opens the backend→authentik:80 egress netpol. Prod stays off.
authentik:
  enabled: true

# RTV-92 — turns on the ERPNext AP connector on dev: opens the backend→erp:8080 egress netpol. The
# erpnext-api-key/secret live in the retrieva-secrets ES (Vault platform/retrieva-dev). Prod stays off.
erpnext:
  enabled: true

frontend:
  image:
    repository: harbor.10.0.0.200.nip.io/library/retrieva-frontend
    tag: eabd62c
  workload:
    replicas: 1
  env:
    - { name: NODE_ENV, value: "production" }
    - { name: PORT, value: "3000" }
    - { name: API_URL, value: "https://retrieva-dev.10.0.0.200.nip.io/api/v1" }
