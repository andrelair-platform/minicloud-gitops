# TLS cert (minicloud-ca ClusterIssuer) — name/secret/dnsName per env. Internal CA (no public DNS
# needed; Cloudflare terminates edge TLS for retrieva.online, cloudflared→ingress-nginx uses this).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tlsSecretName }}
spec:
  secretName: {{ .Values.ingress.tlsSecretName }}
  issuerRef:
    name: minicloud-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.ingress.host | quote }}
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
