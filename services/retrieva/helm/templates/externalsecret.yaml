# Shared retrieva-secrets (used by backend envFrom-refs + postgres/redis). Per-env Vault path via
# .Values.secretsVaultPath (dev=platform/retrieva-dev, prod=platform/retrieva); langfuse keys are
# always platform/langfuse/retrieva (shared project). Namespace comes from destination.namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: retrieva-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: retrieva-secrets
    creationPolicy: Owner
{{- if .Values.cnpg.enabled }}
    # CNPG CUTOVER (2026-10-17): rewrite the database-url host retrieva-postgres -> retrieva-cnpg-rw as
    # the secret renders, so the backend connects to the HA+PITR CNPG cluster (cnpg.yaml) instead of the
    # single alpine STS. Done here (a GitOps-reviewed, reversible transform) rather than by editing the
    # Vault database-url, because writing secret/platform/retrieva needs break-glass Vault access (root;
    # the ops token has none). mergePolicy:Merge → only database-url is transformed; other keys pass
    # through verbatim. index . "database-url" because the key is hyphenated. FOLLOW-UP (owner,
    # non-urgent): update the Vault database-url host + remove this template block (Vault = single source
    # of truth). The `retrieva` CNPG role password = the same Vault postgres-password -> drop-in.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        database-url: '{{ `{{ index . "database-url" | replace "retrieva-postgres" "retrieva-cnpg-rw" }}` }}'
{{- end }}
  data:
{{- $keys := list "jwt-access-secret" "jwt-refresh-secret" "encryption-key" "database-url" "redis-password" "redis-url" "qdrant-api-key" "litellm-api-key" }}
{{- if .Values.postgres.enabled }}{{- $keys = append $keys "postgres-password" }}{{- end }}
{{- /* resend-api-key only when email is enabled (prod). Its Vault path MUST hold the
       property or ESO fails the whole secret; dev stays unconfigured (#475). */}}
{{- if .Values.email.enabled }}{{- $keys = append $keys "resend-api-key" }}{{- end }}
{{- range $keys }}
    - secretKey: {{ . }}
      remoteRef: { key: {{ $.Values.secretsVaultPath }}, property: {{ . }} }
{{- end }}
    - secretKey: langfuse-public-key
      remoteRef: { key: platform/langfuse/retrieva, property: public-key }
    - secretKey: langfuse-secret-key
      remoteRef: { key: platform/langfuse/retrieva, property: secret-key }
