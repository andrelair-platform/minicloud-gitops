---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Governance enforcement (RTV-03e): the RAG backend may egress ONLY to the
# governed LiteLLM gateway + Qdrant (ai ns), its own datastores (Postgres/Redis,
# same ns) and DNS. Any direct call to an external LLM provider (ollama.com,
# api.groq.com, api.openai.com, …) is dropped at L3/L4 — EU-residency/PII/audit
# governance is enforced by the network, not just by config. See the LLM factory
# note: legacy getJudgeLLM/getDefaultLLM default to Ollama Cloud when the
# provider isn't one it knows (azure_openai falls through) — this policy makes
# that leak physically impossible.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress-governed
spec:
  # Governs the API (retrieva-backend) AND the dedicated worker (retrieva-worker, #437) — both
  # need the same egress (Redis/PG, ai-ns LLM/Qdrant/docling, langfuse, MinIO).
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [retrieva-backend, retrieva-worker] }
  policyTypes: [Egress]
  egress:
    # DNS resolution (CoreDNS in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Same-namespace datastores: Redis/Valkey (6379) + PostgreSQL (5432, RTV-46)
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 5432 }
    # The AI platform (ai ns): LiteLLM gateway (4000) + Qdrant (6333/6334)
    # + document conversion for ingestion (RTV-14): markitdown-proxy (8000) and
    # docling-serve (5001) — layout-aware parsing + OCR of scanned PDFs/images.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
      ports:
        - { protocol: TCP, port: 4000 }
        - { protocol: TCP, port: 6333 }
        - { protocol: TCP, port: 6334 }
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5001 }
    # Langfuse (langfuse ns): app-level LLMOps traces (Trace → retrieval span → generation)
    # sent from the backend via the Langfuse core SDK. Governed egress — traces stay on-cluster.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: langfuse
      ports:
        - { protocol: TCP, port: 3000 }
    # Langfuse media store (RTV-14 gap 3): the SDK uploads figure images directly to
    # the blob store via a presigned URL. Langfuse's media endpoint is the controller
    # MinIO at 10.0.0.1:9000 (LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT), so multimodal figure
    # inputs need this host egress; without it the image bytes fail ("fetch failed")
    # and only a broken media reference is logged. Scoped to the MinIO host + port.
    - to:
        - ipBlock: { cidr: 10.0.0.1/32 }
      ports:
        - { protocol: TCP, port: 9000 }
{{- if .Values.email.enabled }}
---
# Transactional/notification email egress (#475) — the ONLY approved EXTERNAL egress from
# the backend. api.resend.com is Cloudflare-fronted (rotating IPs), so a Cilium toFQDNs
# rule (L7 DNS proxy) pins egress to that hostname:443 without opening the internet. The
# governance NetworkPolicy above still drops every other external egress (LLM providers,
# etc.). Prod-only (email.enabled); dev has no email egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backend-egress-resend
spec:
  # The worker also sends notification email (monitoring digests) → same Resend egress (#437).
  endpointSelector:
    matchExpressions:
      - { key: app, operator: In, values: [retrieva-backend, retrieva-worker] }
  egress:
    # DNS visibility so Cilium can learn api.resend.com's rotating IPs.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.resend.com
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
{{- end }}
