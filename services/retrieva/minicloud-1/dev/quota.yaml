---
# Dev quota: single replica each (backend + frontend) + Mongo + Redis. Smaller
# than prod — dev is 1 replica (base default, no patch-replicas).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: retrieva-dev-quota
  namespace: retrieva-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1500Mi
    limits.cpu: "4"
    limits.memory: 4Gi
    count/pods: "12"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: retrieva-dev-limits
  namespace: retrieva-dev
spec:
  limits:
    - type: Container
      default: { cpu: 300m, memory: 384Mi }
      defaultRequest: { cpu: 50m, memory: 128Mi }
