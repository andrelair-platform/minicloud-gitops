---
# Dev backend: FREE-TIER AI via the gateway (generation → ollama-cloud, the
# retrieva-dev LiteLLM team is scoped to the free US models; embeddings stay on
# the EU mistral-embed alias — negligible cost). Cloud providers (Bedrock/Azure)
# are prod-only. Own Qdrant collection (retrieva-dev) + dev public host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieva-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - { name: QDRANT_COLLECTION_NAME, value: "retrieva-dev" }
            - { name: LLM_MODEL, value: "ollama-cloud" }
            - { name: AZURE_OPENAI_LLM_DEPLOYMENT, value: "ollama-cloud" }
            - { name: JUDGE_LLM_MODEL, value: "ollama-cloud" }
            - { name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT, value: "embeddings" }
            - { name: EMBEDDING_MODEL, value: "embeddings" }
            - { name: FRONTEND_URL, value: "https://retrieva-dev.10.0.0.200.nip.io" }
            - { name: ALLOWED_ORIGINS, value: "https://retrieva-dev.10.0.0.200.nip.io" }
