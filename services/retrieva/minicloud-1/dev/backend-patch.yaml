---
# Dev backend: 100% FREE-TIER AI via the gateway — generation → ollama-cloud,
# embeddings → nvidia-embed (NVIDIA NIM free, 2048-dim). The retrieva-dev LiteLLM
# team is scoped to these free US models. Cloud providers (Bedrock/Azure, EU) are
# prod-only. Own Qdrant collection (retrieva-dev, 2048-dim) + dev public host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieva-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - { name: QDRANT_COLLECTION_NAME, value: "retrieva-dev" }
            - { name: LLM_MODEL, value: "ollama-cloud" }
            - { name: AZURE_OPENAI_LLM_DEPLOYMENT, value: "ollama-cloud" }
            - { name: JUDGE_LLM_MODEL, value: "ollama-cloud" }
            - { name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT, value: "nvidia-embed" }
            - { name: EMBEDDING_MODEL, value: "nvidia-embed" }
            - { name: FRONTEND_URL, value: "https://retrieva-dev.10.0.0.200.nip.io" }
            - { name: ALLOWED_ORIGINS, value: "https://retrieva-dev.10.0.0.200.nip.io" }
            # Distinguishes this env in the SHARED 'retrieva' Langfuse project (native
            # `environment` attribute → UI Environment filter). base = production; dev
            # overrides to development. The image is identical dev/prod, so this MUST be
            # a per-overlay env var (NODE_ENV is 'production' in both).
            - { name: LANGFUSE_TRACING_ENVIRONMENT, value: "development" }
