---
# Dev reads its own Vault path (platform/retrieva-dev): separate JWT/encryption/
# Mongo/Redis secrets + a retrieva-dev LiteLLM key (free-tier team). The shared
# Qdrant api-key is reused (same instance, dev uses its own collection).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: retrieva-secrets
spec:
  data:
    - secretKey: jwt-access-secret
      remoteRef: { key: platform/retrieva-dev, property: jwt-access-secret }
    - secretKey: jwt-refresh-secret
      remoteRef: { key: platform/retrieva-dev, property: jwt-refresh-secret }
    - secretKey: encryption-key
      remoteRef: { key: platform/retrieva-dev, property: encryption-key }
    - secretKey: mongo-password
      remoteRef: { key: platform/retrieva-dev, property: mongo-password }
    - secretKey: mongodb-uri
      remoteRef: { key: platform/retrieva-dev, property: mongodb-uri }
    - secretKey: redis-password
      remoteRef: { key: platform/retrieva-dev, property: redis-password }
    - secretKey: redis-url
      remoteRef: { key: platform/retrieva-dev, property: redis-url }
    - secretKey: qdrant-api-key
      remoteRef: { key: platform/retrieva-dev, property: qdrant-api-key }
    - secretKey: litellm-api-key
      remoteRef: { key: platform/retrieva-dev, property: litellm-api-key }
    # Langfuse app-level tracing → the shared 'retrieva' project (same as prod).
    - secretKey: langfuse-public-key
      remoteRef: { key: platform/langfuse/retrieva, property: public-key }
    - secretKey: langfuse-secret-key
      remoteRef: { key: platform/langfuse/retrieva, property: secret-key }
