apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: retrieva-dev
resources:
  - ../../base
  - quota.yaml
  - certificate.yaml
  - ingress.yaml
# Dev uses the Harbor dev registry (branch=dev CI build). The frontend image is now
# env-agnostic — API_URL is injected at RUNTIME (frontend-env-patch.yaml), not baked.
# Cloud AI providers are prod-only; dev generation runs on the free tier (ollama-cloud)
# via the retrieva-dev LiteLLM team — see backend-patch.
images:
  - name: retrieva-backend
    newName: harbor.10.0.0.200.nip.io/library/retrieva-backend
    newTag: "3ccb395"
  - name: retrieva-frontend
    newName: harbor.10.0.0.200.nip.io/library/retrieva-frontend
    newTag: "3ccb395"
patches:
  - path: externalsecret-patch.yaml
  - path: backend-patch.yaml
  - path: frontend-env-patch.yaml
