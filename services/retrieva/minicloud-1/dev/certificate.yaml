---
# Internal cert (minicloud-ca) for the dev host. retrieva-dev.10.0.0.200.nip.io
# is a subdomain of 10.0.0.200.nip.io → already allowed by the Vault PKI role
# (allow_subdomains) — no PKI change needed. Dev is internal (Tailscale + CA),
# not exposed via the Cloudflare tunnel.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: retrieva-dev-tls
spec:
  secretName: retrieva-dev-tls
  issuerRef:
    name: minicloud-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - retrieva-dev.10.0.0.200.nip.io
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
