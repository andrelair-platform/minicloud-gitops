---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: retrieva-quota
  namespace: retrieva
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 6Gi
    count/pods: "16"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: retrieva-limits
  namespace: retrieva
spec:
  limits:
    - type: Container
      default: { cpu: 300m, memory: 384Mi }
      defaultRequest: { cpu: 50m, memory: 128Mi }
