apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: retrieva
resources:
- ../../base
- quota.yaml
- certificate.yaml # minicloud-ca internal cert (no public DNS needed)
- ingress.yaml # retrieva.online via the Cloudflare tunnel → ingress-nginx
# Public reachability of retrieva.online still needs two account-level manual
# steps (only the owner can do them): add the zone to the Cloudflare account,
# then switch the nameservers at NameCheap from DigitalOcean → Cloudflare. Once
# the zone is active: `cloudflared tunnel route dns minicloud retrieva.online`
# + a `- hostname: retrieva.online / service: https://10.0.0.200` block in the
# controller's ~/.cloudflared/config.yml. The k8s ingress + internal cert below
# are already live, so the app answers the moment DNS resolves to the tunnel.
images:
- name: retrieva-backend
  newName: ghcr.io/andrelair-platform/retrieva-backend
  newTag: f2b799b
- name: retrieva-frontend
  newName: ghcr.io/andrelair-platform/retrieva-frontend
  newTag: 3ccb395
patches:
- path: patch-replicas.yaml
- path: frontend-env-patch.yaml
