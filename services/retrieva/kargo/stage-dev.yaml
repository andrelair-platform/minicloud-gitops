apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: retrieva-kargo
spec:
  # Promotes the git-commit Freight to the DEV overlay (Harbor, bare SHA — same
  # immutable artifact as prod). retrieva-dev is now Kargo-fed by main builds; the
  # dev PR auto-merges (dev overlays aren't CODEOWNERS-gated).
  requestedFreight:
    - origin:
        kind: Warehouse
        name: retrieva
      sources:
        direct: true
  # After promoting to dev, run the multi-image smoke AnalysisRun (Variant C: backend
  # /health + frontend / via the dev Services). A Freight is "Verified in dev" only if it
  # passes → the prod Stage (sources.stages: [dev]) accepts only verified Freight.
  verification:
    analysisTemplates:
      - name: retrieva-dev-verify
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
        - name: sha
          value: ${{ commitFrom("https://github.com/andrelair-platform/retrieva.git").ID[0:7] }}
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-image
          config:
            # dev wrapper values already pin the Harbor repo; bump BOTH image tags to the promoted SHA.
            path: ./repo/services/retrieva/helm/values-dev.yaml
            updates:
              - key: backend.image.tag
                value: ${{ quote(vars.sha) }}
              - key: frontend.image.tag
                value: ${{ quote(vars.sha) }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(retrieva): promote ${{ vars.sha }} to dev'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(retrieva): promote ${{ vars.sha }} to dev'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
