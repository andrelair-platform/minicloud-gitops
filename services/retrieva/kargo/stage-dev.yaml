apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: retrieva-kargo
spec:
  # Promotes the git-commit Freight to the DEV overlay (Harbor, bare SHA — same
  # immutable artifact as prod). retrieva-dev is now Kargo-fed by main builds; the
  # dev PR auto-merges (dev overlays aren't CODEOWNERS-gated).
  requestedFreight:
    - origin:
        kind: Warehouse
        name: retrieva
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
        - name: sha
          value: ${{ commitFrom("https://github.com/andrelair-platform/retrieva.git").ID[0:7] }}
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: set-image
          config:
            path: ./repo/services/retrieva/minicloud-1/dev
            images:
              - image: retrieva-backend
                newName: harbor.10.0.0.200.nip.io/library/retrieva-backend
                tag: ${{ quote(vars.sha) }}
              - image: retrieva-frontend
                newName: harbor.10.0.0.200.nip.io/library/retrieva-frontend
                tag: ${{ quote(vars.sha) }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(retrieva): promote ${{ vars.sha }} to dev'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(retrieva): promote ${{ vars.sha }} to dev'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
