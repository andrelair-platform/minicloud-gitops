apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kargo-image-retrieva-frontend
  namespace: retrieva-kargo
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: kargo-image-retrieva-frontend
    creationPolicy: Owner
    template:
      metadata: { labels: { kargo.akuity.io/cred-type: image } }
      data:
        repoURL: ghcr.io/andrelair-platform/retrieva-frontend
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef: { key: platform/ghcr, property: username }
    - secretKey: token
      remoteRef: { key: platform/ghcr, property: token }
