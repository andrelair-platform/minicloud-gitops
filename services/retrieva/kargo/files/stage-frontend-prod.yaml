apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: frontend-prod
  namespace: retrieva-kargo
spec:
  # Prod: only frontend Freight already verified in frontend-dev is promotable. Bumps only
  # frontend.image.tag in values-prod.yaml (ghcr SHA). CODEOWNERS-gated; squash-merge.
  requestedFreight:
    - origin: { kind: Warehouse, name: retrieva-frontend }
      sources: { stages: [frontend-dev] }
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
        - name: img
          value: ghcr.io/andrelair-platform/retrieva-frontend
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-image
          config:
            path: ./repo/services/retrieva/helm/values-prod.yaml
            updates:
              - key: frontend.image.tag
                value: '${{ quote(imageFrom(vars.img).Tag) }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(retrieva): promote frontend ${{ imageFrom(vars.img).Tag }} to prod'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config: { path: ./repo, generateTargetBranch: true }
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(retrieva): promote frontend ${{ imageFrom(vars.img).Tag }} to PROD'
            description: 'Promotion opened by Kargo — retrieva FRONTEND @ ${{ imageFrom(vars.img).Tag }} to prod (retrieva.online). CODEOWNERS-gated; ArgoCD auto-syncs prod once merged.'
            labels: [kargo, env-prod]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
