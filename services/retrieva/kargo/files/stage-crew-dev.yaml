apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: crew-dev
  namespace: retrieva-kargo
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: retrieva-assessment-crew }
      sources: { direct: true }
  verification:
    analysisTemplates:
      - name: retrieva-crew-dev-verify
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
        - name: crewRepo
          value: https://github.com/andrelair-platform/retrieva-assessment-crew.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout: [{ branch: main, path: ./repo }]
        - uses: yaml-update
          as: set-image
          config:
            path: ./repo/services/retrieva-assessment-crew/helm/values-dev.yaml
            updates:
              - key: minicloud-app-deployment.image.tag
                value: '${{ quote(commitFrom(vars.crewRepo).ID[0:7]) }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(retrieva): promote crew ${{ commitFrom(vars.crewRepo).ID[0:7] }} to dev'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config: { path: ./repo, generateTargetBranch: true }
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(retrieva): promote crew ${{ commitFrom(vars.crewRepo).ID[0:7] }} to dev'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
