# Product-level integration gate. Component Stages establish artifact health; this verifies the
# assembled live-dev product surface and the backend/crew A2A wire contract before prod eligibility.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: retrieva-product-dev-verify
  namespace: retrieva-kargo
spec:
  metrics:
    - name: product-dev-integration
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 300
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app.kubernetes.io/part-of: retrieva
                  kargo.akuity.io/verify: product-dev-integration
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  seccompProfile: { type: RuntimeDefault }
                containers:
                  - name: smoke
                    image: docker.io/curlimages/curl:8.11.1
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: { drop: [ALL] }
                    resources:
                      requests: { cpu: 25m, memory: 32Mi }
                      limits: { cpu: 100m, memory: 64Mi }
                    command: [/bin/sh, -c]
                    args:
                      - |
                        set -eu
                        B=http://retrieva-backend.retrieva-dev.svc.cluster.local:3007
                        F=http://retrieva-frontend.retrieva-dev.svc.cluster.local:3000
                        C=http://retrieva-assessment-crew.retrieva-dev.svc.cluster.local:8080

                        wait_200() {
                          i=0
                          while [ "$i" -lt 40 ]; do
                            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$1" 2>/dev/null || true)
                            [ "$code" = 200 ] && { echo "$2: HTTP 200"; return 0; }
                            i=$((i+1)); sleep 3
                          done
                          echo "$2 did not become healthy"; return 1
                        }

                        wait_200 "$B/health" backend
                        wait_200 "$F/" frontend
                        wait_200 "$C/healthz" assessment-crew

                        card=$(curl -fsS --max-time 10 "$C/.well-known/agent-card.json")
                        echo "$card" | grep -q '"id":"assess-arrangement"'

                        # Deterministic A2A contract check: zero clauses invokes the crew's no-LLM
                        # short-circuit and must return a safe insufficient-evidence verdict.
                        response=$(curl -fsS --max-time 30 -H 'content-type: application/json' \
                          -d '{"jsonrpc":"2.0","id":"11111111-1111-4111-8111-111111111111","method":"message/send","params":{"message":{"role":"user","kind":"message","messageId":"22222222-2222-4222-8222-222222222222","parts":[{"kind":"data","data":{"runId":"33333333-3333-4333-8333-333333333333","node":"gap","arrangementId":"44444444-4444-4444-8444-444444444444","controlLibraryVersion":"dora-2026.1","controls":[{"ref":"DORA-28.8-EXIT-STRATEGY","doraArticleRef":"Article 28(8)","title":"Exit strategy","description":"Documented exit plan"}],"clauses":[],"evidenceRefs":[]}}]}}}' \
                          "$C/")
                        echo "$response" | grep -q '"jsonrpc":"2.0"'
                        echo "$response" | grep -q '"verdict":"insufficient_evidence"'
                        echo "$response" | grep -q '"controlLibraryVersion":"dora-2026.1"'
                        echo "Retrieva product integration gate passed"
