apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kargo PROD-promotion pipeline for retrieva (2 images, prod-only — see stage-prod.yaml
# + manifests/kargo/README.md). Deployed by apps/platform/kargo-retrieva.yaml into the
# dedicated retrieva-kargo namespace.
resources:
  - namespace.yaml
  - project.yaml
  - git-credentials.yaml
  - image-credentials-retrieva-backend.yaml
  - image-credentials-retrieva-frontend.yaml
  - warehouse.yaml
  - stage-prod.yaml
