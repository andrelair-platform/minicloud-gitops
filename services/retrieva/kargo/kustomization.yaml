apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kargo PROD-promotion pipeline for retrieva. Git-based Warehouse (Freight = a main
# commit → both images promoted at the same SHA). Deployed by apps/platform/kargo-retrieva.yaml.
resources:
  - namespace.yaml
  - project.yaml
  - git-credentials.yaml
  - warehouse.yaml
  - projectconfig.yaml       # auto-promote dev
  - analysis-dev-smoke.yaml  # dev verification (Variant C, 2 images)
  - netpol-dev.yaml          # cross-ns netpol in retrieva-dev
  - stage-dev.yaml
  - stage-prod.yaml
