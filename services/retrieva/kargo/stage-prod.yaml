apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: retrieva-kargo
spec:
  # Prod-only: promote a main commit directly. Both images pinned to that commit's SHA
  # (they're built + tagged with the same `git rev-parse --short`), so prod is always a
  # consistent, auditable set. retrieva dev stays on its own dev-branch track.
  requestedFreight:
    - origin: { kind: Warehouse, name: retrieva }
      sources: { stages: [dev] }
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
        - name: sha
          value: ${{ commitFrom("https://github.com/andrelair-platform/retrieva.git").ID[0:7] }}
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-image
          config:
            # prod wrapper values already pin the ghcr repo; bump BOTH image tags to the promoted SHA.
            path: ./repo/services/retrieva/helm/values-prod.yaml
            updates:
              - key: backend.image.tag
                value: ${{ quote(vars.sha) }}
              - key: frontend.image.tag
                value: ${{ quote(vars.sha) }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(retrieva): promote ${{ vars.sha }} to prod (backend+frontend)'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config: { path: ./repo, generateTargetBranch: true }
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(retrieva): promote ${{ vars.sha }} to PROD'
            description: 'Promotion opened by Kargo — retrieva backend+frontend @ ${{ vars.sha }} to prod (retrieva.online). CODEOWNERS-gated; ArgoCD auto-syncs prod once merged.'
            labels: [kargo, env-prod]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
