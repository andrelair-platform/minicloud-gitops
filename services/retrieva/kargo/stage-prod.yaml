apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: retrieva-kargo
spec:
  # Prod-only pipeline: promote the immutable ghcr main artifact directly. retrieva's
  # dev runs a separate dev-branch track (Harbor dev-<sha>-amd64), so there is no dev
  # Stage here — a full dev->prod gate needs the CI unified to one artifact (follow-up).
  requestedFreight:
    - origin: { kind: Warehouse, name: retrieva }
      sources: { direct: true }
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: set-image
          config:
            path: ./repo/services/retrieva/minicloud-1/prod
            images:
              - image: retrieva-backend
                newName: ghcr.io/andrelair-platform/retrieva-backend
                tag: '${{ imageFrom("ghcr.io/andrelair-platform/retrieva-backend").Tag }}'
              - image: retrieva-frontend
                newName: ghcr.io/andrelair-platform/retrieva-frontend
                tag: '${{ imageFrom("ghcr.io/andrelair-platform/retrieva-frontend").Tag }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(retrieva): promote backend+frontend to prod'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(retrieva): promote to PROD'
            description: 'Promotion opened by Kargo — retrieva backend+frontend to prod (retrieva.online). Requires CODEOWNERS approval; ArgoCD auto-syncs prod once merged.'
            labels: [kargo, env-prod]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
