# Auto-promotion: Kargo is the sole promoter of dev. After the monorepo split there are TWO
# single-image Warehouses (retrieva-backend + retrieva-frontend), each with its own dev Stage
# that auto-promotes + verifies independently. Prod stays manual (CODEOWNERS PR).
# NOTE: ProjectConfig is a singleton whose name MUST equal the Kargo Project name = the project
# namespace. retrieva's project ns is `retrieva-kargo` (not the bare `retrieva`), so both must be it.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: retrieva-kargo
  namespace: retrieva-kargo
spec:
  promotionPolicies:
    - stage: backend-dev
      autoPromotionEnabled: true
    - stage: frontend-dev
      autoPromotionEnabled: true
