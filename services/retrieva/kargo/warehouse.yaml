apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: retrieva
  namespace: retrieva-kargo
spec:
  # GIT subscription (not per-image): Freight = a single main commit of the retrieva
  # repo, so the backend + frontend are ALWAYS promoted at the SAME git SHA. This avoids
  # the image-NewestBuild mixed-freight bug (an unchanged/cached image can't be ranked
  # "newest" for its SHA). retrieva is a PUBLIC repo → no git credential needed to read.
  interval: 5m
  freightCreationPolicy: Automatic
  subscriptions:
    - git:
        repoURL: https://github.com/andrelair-platform/retrieva.git
        branch: main
        commitSelectionStrategy: NewestFromBranch
        # Phantom-commit guard: a git Warehouse creates Freight for EVERY main commit,
        # but the CI build skips docs-only commits (paths-ignore docs/** + *.md). Promoting
        # a docs-only commit → images at that SHA never built → ImagePullBackOff. Mirror the
        # CI's paths-ignore here so Freight is only produced for commits that actually build
        # images. (excludePaths is a SUPERSET of the CI filter — regex excludes all *.md at
        # any depth — the safe direction: never promote a commit that wasn't built.)
        excludePaths:
          - docs
          - "regex:.*\\.md$"
