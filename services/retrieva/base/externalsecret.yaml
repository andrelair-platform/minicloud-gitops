---
# Retrieva secrets from Vault. mongodb-uri/redis-url use short service names
# (mongodb/redis) → resolve within each env's own namespace (dev + prod portable).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: retrieva-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: retrieva-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-access-secret
      remoteRef: { key: platform/retrieva, property: jwt-access-secret }
    - secretKey: jwt-refresh-secret
      remoteRef: { key: platform/retrieva, property: jwt-refresh-secret }
    - secretKey: encryption-key
      remoteRef: { key: platform/retrieva, property: encryption-key }
    - secretKey: mongo-password
      remoteRef: { key: platform/retrieva, property: mongo-password }
    - secretKey: mongodb-uri
      remoteRef: { key: platform/retrieva, property: mongodb-uri }
    - secretKey: redis-password
      remoteRef: { key: platform/retrieva, property: redis-password }
    - secretKey: redis-url
      remoteRef: { key: platform/retrieva, property: redis-url }
    - secretKey: qdrant-api-key
      remoteRef: { key: platform/retrieva, property: qdrant-api-key }
    - secretKey: litellm-api-key
      remoteRef: { key: platform/retrieva, property: litellm-api-key }
    # Langfuse app-level tracing → the dedicated 'retrieva' project (same project for dev+prod;
    # keys live at platform/langfuse/retrieva, distinct from the per-env retrieva paths).
    - secretKey: langfuse-public-key
      remoteRef: { key: platform/langfuse/retrieva, property: public-key }
    - secretKey: langfuse-secret-key
      remoteRef: { key: platform/langfuse/retrieva, property: secret-key }
