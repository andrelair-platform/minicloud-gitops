---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Governance enforcement (RTV-03e): the RAG backend may egress ONLY to the
# governed LiteLLM gateway + Qdrant (ai ns), its own datastores (Mongo/Redis,
# same ns) and DNS. Any direct call to an external LLM provider (ollama.com,
# api.groq.com, api.openai.com, …) is dropped at L3/L4 — EU-residency/PII/audit
# governance is enforced by the network, not just by config. See the LLM factory
# note: legacy getJudgeLLM/getDefaultLLM default to Ollama Cloud when the
# provider isn't one it knows (azure_openai falls through) — this policy makes
# that leak physically impossible.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress-governed
spec:
  podSelector:
    matchLabels:
      app: retrieva-backend
  policyTypes: [Egress]
  egress:
    # DNS resolution (CoreDNS in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Same-namespace datastores: MongoDB (27017) + Redis/Valkey (6379)
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 27017 }
        - { protocol: TCP, port: 6379 }
    # The AI platform (ai ns): LiteLLM gateway (4000) + Qdrant (6333/6334)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
      ports:
        - { protocol: TCP, port: 4000 }
        - { protocol: TCP, port: 6333 }
        - { protocol: TCP, port: 6334 }
    # Langfuse (langfuse ns): app-level LLMOps traces (Trace → retrieval span → generation)
    # sent from the backend via the Langfuse core SDK. Governed egress — traces stay on-cluster.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: langfuse
      ports:
        - { protocol: TCP, port: 3000 }
