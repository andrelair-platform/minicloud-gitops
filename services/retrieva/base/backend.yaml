---
# Retrieva backend (Express, :3007). "Azure OpenAI" env → LiteLLM gateway
# (Azure-passthrough) with EU-scoped key + intent aliases (golden-path).
# Image (retrieva-backend) + namespace set by the overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieva-backend
spec:
  replicas: 1
  # Tight namespace quota (limits.memory 6Gi): a surge pod (+1Gi) doesn't fit
  # alongside the running set. Roll by removing an old pod first, then creating
  # the new one — no surge headroom needed.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: retrieva-backend }
  template:
    metadata:
      labels: { app: retrieva-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001        # image user expressjs (uid 1001)
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: retrieva-backend
          ports:
            - { containerPort: 3007, name: http }
          env:
            - { name: PORT, value: "3007" }
            - { name: NODE_ENV, value: "production" }
            - { name: LOG_LEVEL, value: "info" }
            # Skip pino-roll file transports (not in the prod image; k8s captures
            # stdout via the container runtime — 12-factor logging).
            - { name: DOCKER_ENV, value: "true" }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: mongodb-uri } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: redis-url } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: redis-password } }
            - { name: QDRANT_URL, value: "http://qdrant.ai.svc.cluster.local:6333" }
            # Document conversion for ingestion (RTV-14 Phase 1): layout-aware
            # parsing + OCR. markitdown-proxy routes images→Docling OCR and
            # PDF/Office→MarkItDown; docling-serve is the direct OCR fallback for
            # scanned PDFs. INGEST_USE_DOCLING=false reverts to the local parsers.
            - { name: INGEST_USE_DOCLING, value: "true" }
            - { name: MARKITDOWN_URL, value: "http://markitdown-proxy.ai.svc.cluster.local:8000" }
            - { name: DOCLING_URL, value: "http://docling.ai.svc.cluster.local:5001" }
            # RTV-14 Phase 2: gated VLM figure captioning. Ingest-only, pre-filtered,
            # per-doc capped — never per chat/request. Model = azure-gpt-4.1-mini
            # (funded + EU, via the LiteLLM gateway; granted to both retrieva teams).
            # OFF in base/prod (opt-in after validation); the dev overlay turns it on.
            - { name: INGEST_VLM_CAPTION, value: "false" }
            - { name: VLM_CAPTION_MODEL, value: "azure-gpt-4.1-mini" }
            - name: QDRANT_API_KEY
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: qdrant-api-key } }
            - { name: QDRANT_COLLECTION_NAME, value: "retrieva" }
            - { name: LLM_PROVIDER, value: "azure_openai" }
            - { name: EMBEDDING_PROVIDER, value: "azure" }
            # Defense-in-depth: the legacy LLM factory (getJudgeLLM/getDefaultLLM)
            # falls back to Ollama Cloud (ollama.com) for providers it doesn't know
            # (azure_openai falls through its switch). Point that default at the
            # in-cluster LiteLLM gateway so a stray call stays governed/in-cluster
            # and fails fast — the backend-egress NetworkPolicy blocks the public
            # ollama.com regardless. Proper fix = route the legacy factory through
            # LiteLLM's OpenAI-compatible API (Retrieva code change, follow-up).
            - { name: OLLAMA_BASE_URL, value: "http://litellm.ai.svc.cluster.local:4000" }
            - { name: AZURE_OPENAI_ENDPOINT, value: "http://litellm.ai.svc.cluster.local:4000" }
            - name: AZURE_OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: litellm-api-key } }
            - { name: AZURE_OPENAI_LLM_DEPLOYMENT, value: "tier-premium" }
            - { name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT, value: "embeddings" }
            - { name: AZURE_OPENAI_API_VERSION, value: "2024-02-15-preview" }
            - { name: LLM_MODEL, value: "tier-premium" }
            - { name: EMBEDDING_MODEL, value: "embeddings" }
            - { name: JUDGE_LLM_MODEL, value: "tier-standard" }
            # App-level LLMOps tracing → the dedicated 'retrieva' Langfuse project. In-cluster svc
            # URL (matches the backend-egress-governed netpol allowing langfuse ns:3000; no TLS/hairpin).
            - { name: LANGFUSE_BASE_URL, value: "http://langfuse-web.langfuse.svc.cluster.local:3000" }
            # One shared 'retrieva' Langfuse project for dev+prod; the native `environment`
            # attribute keeps them distinguishable in the UI. base defaults to production;
            # the dev overlay patches this to "development" (image is identical dev/prod).
            - { name: LANGFUSE_TRACING_ENVIRONMENT, value: "production" }
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: langfuse-public-key } }
            - name: LANGFUSE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: langfuse-secret-key } }
            - name: JWT_ACCESS_SECRET
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: jwt-access-secret } }
            - name: JWT_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: jwt-refresh-secret } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: encryption-key } }
            - { name: FRONTEND_URL, value: "https://retrieva.online" }
            - { name: ALLOWED_ORIGINS, value: "https://retrieva.online" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /health, port: 3007 }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 3007 }
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: retrieva-backend
spec:
  selector: { app: retrieva-backend }
  ports:
    - { port: 3007, targetPort: 3007, name: http }
