apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Retrieva base — app (backend + frontend) + stateful deps (MongoDB, Redis) +
# ESO secret + network policies. No namespace, no image tags (overlays set them).
resources:
  - externalsecret.yaml
  - mongodb.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - networkpolicy.yaml
