# retrieva-crew-secrets — the crew's runtime creds. REUSES existing Vault paths (no new secret):
# litellm-api-key from .Values.secretsVaultPath (platform/retrieva-dev | platform/retrieva, same key the
# backend uses) and the Langfuse keys from the shared platform/langfuse/retrieva. Namespace from the
# ArgoCD destination. The crew holds NO DB creds.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: retrieva-crew-secrets
  labels:
    app: retrieva-assessment-crew
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: retrieva-crew-secrets
    creationPolicy: Owner
  data:
    - secretKey: litellm-api-key
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: litellm-api-key }
    - secretKey: langfuse-public-key
      remoteRef: { key: platform/langfuse/retrieva, property: public-key }
    - secretKey: langfuse-secret-key
      remoteRef: { key: platform/langfuse/retrieva, property: secret-key }
