# Ingress: default-deny, then allow same-namespace (the retrieva supervisor reaches the crew's A2A port)
# + monitoring scrape. Egress: DORA governance — the crew may egress ONLY to the governed LiteLLM
# gateway + Qdrant (ai ns), Langfuse (langfuse ns) and DNS. Any direct external LLM call is dropped at
# L3/L4 — EU-residency/PII/audit governance enforced by the network, not just config (mirrors the
# backend-egress-governed policy). The crew is stateless + holds no DB creds.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crew-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crew-allow-same-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crew-allow-monitoring-scrape
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crew-egress-governed
spec:
  podSelector:
    matchLabels:
      app: retrieva-assessment-crew
  policyTypes: [Egress]
  egress:
    # DNS (CoreDNS in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # AI platform (ai ns): governed LiteLLM gateway (4000) + Qdrant (6333/6334, evidence — RTV-81b)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
      ports:
        - { protocol: TCP, port: 4000 }
        - { protocol: TCP, port: 6333 }
        - { protocol: TCP, port: 6334 }
    # Langfuse (langfuse ns): LLMOps traces
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: langfuse
      ports:
        - { protocol: TCP, port: 3000 }
