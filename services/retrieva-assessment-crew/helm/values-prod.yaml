# prod (ns retrieva) — ghcr SHA image, 2 replicas, ghcr-pull imagePullSecret, prod LLM via LiteLLM.
secretsVaultPath: platform/retrieva
prodExtras:
  enabled: true   # renders the ghcr-pull imagePullSecret ES
minicloud-app-deployment:
  image:
    repository: ghcr.io/andrelair-platform/retrieva-assessment-crew
    tag: b664731
  imagePullSecrets: [{ name: ghcr-pull }]
  workload:
    replicas: 2
  env:
    - { name: PORT, value: "8080" }
    - { name: HOST, value: "0.0.0.0" }
    - { name: A2A_PUBLIC_URL, value: "http://retrieva-assessment-crew.retrieva.svc.cluster.local:8080" }
    - { name: LITELLM_BASE_URL, value: "http://litellm.ai.svc.cluster.local:4000" }
    - { name: LITELLM_MODEL, value: "openai/azure-gpt-4.1-mini" }
    - { name: LITELLM_API_KEY, valueFrom: { secretKeyRef: { name: retrieva-crew-secrets, key: litellm-api-key } } }
    - { name: LANGFUSE_HOST, value: "http://langfuse-web.langfuse.svc.cluster.local:3000" }
    - { name: LANGFUSE_TRACING_ENVIRONMENT, value: "production" }
    - { name: LANGFUSE_PUBLIC_KEY, valueFrom: { secretKeyRef: { name: retrieva-crew-secrets, key: langfuse-public-key } } }
    - { name: LANGFUSE_SECRET_KEY, valueFrom: { secretKeyRef: { name: retrieva-crew-secrets, key: langfuse-secret-key } } }
