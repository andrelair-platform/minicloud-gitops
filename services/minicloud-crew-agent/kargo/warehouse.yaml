apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: minicloud-crew-agent
  namespace: minicloud-crew-agent
spec:
  interval: 5m
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/andrelair-platform/minicloud-crew-agent
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - ^[0-9a-f]{7,40}$
        discoveryLimit: 5
