# prod (ns ai) — ghcr SHA image + ghcr-pull, 2 replicas, PDB, public ingress + cert.
minicloud-app-deployment:
  image:
    repository: ghcr.io/andrelair-platform/minicloud-crew-agent
    tag: "0d4a1e7"
  imagePullSecrets: [{name: ghcr-pull}]
  workload:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    enabled: true
    className: nginx
    host: crew-agent.10.0.0.200.nip.io
    servicePort: 8081
    tls:
      enabled: true
      secretName: minicloud-crew-agent-tls
  externalSecret:
    enabled: false          # litellm-credentials already exists in shared ai ns
tls:
  enabled: true             # renders the minicloud-crew-agent-tls Certificate (wrapper template)
