# dev — Harbor image, 1 replica, ns minicloud-crew-agent-dev, no PDB, no ingress/cert.
minicloud-app-deployment:
  image:
    repository: ghcr.io/andrelair-platform/minicloud-crew-agent
    tag: da411b6
  imagePullSecrets: [{name: ghcr-pull}]   # Internal ghcr pkg (Harbor retirement)
  workload:
    replicas: 1
  podDisruptionBudget:
    enabled: false
createGhcrPullSecret: true   # renders the dev-only ghcr-pull ES (Vault platform/ghcr)
