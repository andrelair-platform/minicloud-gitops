apiVersion: v1
kind: ServiceAccount
metadata:
  name: minicloud-crew-agent
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minicloud-crew-agent
  labels:
    app: minicloud-crew-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minicloud-crew-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: minicloud-crew-agent
        backstage.io/kubernetes-id: minicloud-crew-agent
    spec:
      serviceAccountName: minicloud-crew-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minicloud-crew-agent
          image: harbor.10.0.0.200.nip.io/library/minicloud-crew-agent
          ports:
            - containerPort: 8081
          env:
            - name: LITELLM_BASE_URL
              value: "http://litellm.ai.svc.cluster.local:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: master-key
            - name: RAG_INGEST_URL
              value: "http://rag-ingest.ai.svc.cluster.local:8001"
            - name: CREW_SMALL_MODEL
              value: "mistral-small"
            - name: CREW_LARGE_MODEL
              value: "mistral-large"
            - name: CREW_MAX_ITER
              value: "8"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          # readOnlyRootFilesystem:true blocks CrewAI from creating its knowledge
          # store under ~/.local (ChromaDB db_storage_path) -> OSError EROFS crashloop.
          # Give it writable emptyDirs for the HOME dot-dirs and /tmp.
          volumeMounts:
            - name: home-local
              mountPath: /home/agent/.local
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home-local
          emptyDir: {}
        - name: tmp
          emptyDir: {}
