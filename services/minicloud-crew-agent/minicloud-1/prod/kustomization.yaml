apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
- ../../base
- certificate.yaml
- ingress.yaml
# Prod pulls from ghcr.io (Internal, off the controller disk) via the shared
# ai-ns ghcr-pull imagePullSecret. dev stays on Harbor.
images:
- name: harbor.10.0.0.200.nip.io/library/minicloud-crew-agent
  newName: ghcr.io/andrelair-platform/minicloud-crew-agent
  newTag: 33907ef
patches:
- path: patch-replicas.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: minicloud-crew-agent
- path: patch-ghcr-pull.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: minicloud-crew-agent
