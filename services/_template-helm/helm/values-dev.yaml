# dev — Harbor image (Kargo bumps tag), 1 replica, dev host, ns SERVICE_NAME-dev
minicloud-app-deployment:
  image:
    repository: harbor.10.0.0.200.nip.io/library/SERVICE_NAME
    tag: dev-REPLACE_ME    # Kargo bumps
  workload:
    replicas: 1
  ingress:
    # Env is a subdomain PREFIX, prod = the clean name (see docs/dns-naming-and-externaldns.md).
    host: SERVICE_NAME.dev.10.0.0.200.nip.io
  certificate:
    dnsNames: [SERVICE_NAME.dev.10.0.0.200.nip.io]
  # Public org app whose dev env is also externally reachable? use the org namespace
  # + the ExternalDNS opt-in (see the PUBLIC ORG APP block in values-prod.yaml):
  #   ingress:
  #     host: SERVICE_NAME.dev.ktayl.devandre.sbs
  #     annotations:
  #       external-dns.alpha.kubernetes.io/target: "bf5117ec-5986-47f0-a3ce-b96ab8854d21.cfargotunnel.com"
