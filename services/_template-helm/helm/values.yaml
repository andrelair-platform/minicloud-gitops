# SERVICE_NAME wrapper chart — common values.
# (1) `minicloud-app-deployment:` configures the library subchart (the workload);
# (2) top-level keys drive THIS chart's own templates/ (service-specific extras).
minicloud-app-deployment:
  nameOverride: SERVICE_NAME
  serviceAccount:
    create: true
    name: SERVICE_NAME
    automountServiceAccountToken: false
  image:
    repository: harbor.10.0.0.200.nip.io/library/SERVICE_NAME   # dev; values-prod overrides to ghcr
  ports:
    - { name: http, containerPort: 8080, protocol: TCP }
  service:
    ports:
      - { name: http, port: 80, targetPort: http }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  readinessProbe:
    httpGet: { path: /healthz, port: http }
    initialDelaySeconds: 5
    periodSeconds: 5
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    initialDelaySeconds: 10
    periodSeconds: 10
  # A simple single-host service can use the library Ingress + Certificate directly:
  ingress:
    enabled: true
    className: nginx
    servicePort: 80
    tls: { enabled: true }        # host + cert dnsNames set per env
  certificate:
    enabled: true
  serviceMonitor:
    enabled: true

# ---- wrapper-local (drives templates/) ----
# Add flags/values for this chart's own templates here, e.g.:
# prodExtras:
#   enabled: false   # gate prod-only extras (dedicated DB, ghcr-pull ES, …)
