apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: SERVICE_NAME-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # GAP wrapper chart (prod): ONE Helm source. Git-gated automated prod (CODEOWNERS on apps/ +
  # services/*/helm). Kargo promotes by editing minicloud-app-deployment.image.tag in values-prod.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/SERVICE_NAME/helm
    helm:
      releaseName: SERVICE_NAME       # MANDATORY
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: SERVICE_NAME-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # If the chart renders an ExternalSecret, add the ESO ignoreDifferences block (see gitops.md).
