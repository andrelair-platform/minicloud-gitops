apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: SERVICE_NAME-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # GAP wrapper chart: ONE Helm source. ArgoCD runs `helm dependency build` (ghcr-oci-repo cred) to
  # fetch the library dep pinned in Chart.lock. values.yaml is the chart default; values-dev overlays.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/SERVICE_NAME/helm
    helm:
      releaseName: SERVICE_NAME       # MANDATORY — library objects use the release name for fullname
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: SERVICE_NAME-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # If the chart renders an ExternalSecret, add the ESO ignoreDifferences block (see gitops.md).
