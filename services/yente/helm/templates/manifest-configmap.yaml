# yente manifest — scopes the engine to the OFFICIAL FREE sanctions lists only (OFAC/EU/UN/UK OFSI),
# NOT the CC-BY-NC consolidated set (ADR-001 §8 licence decision). The `default` collection groups them so
# POST /match/default screens against all four at once. Uses `entities_url` (the direct FtM entities file,
# which /datasets/latest/<name>/entities.ftm.json redirects to the latest artifact) — a single-dataset
# `url: .../index.json` mis-parsed as a catalog ("Cannot identify resource with FtM entities", version=None).
# Fetched from data.opensanctions.org (the controlled egress). Re-rendered if .Values.lists changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yente-manifest
  labels: { app: yente }
data:
  manifest.yml: |
    catalogs: []
    datasets:
      - name: default
        title: "Sanctions screening — official free lists"
        datasets:
{{- range .Values.lists }}
          - {{ .name }}
{{- end }}
{{- range .Values.lists }}
      - name: {{ .name }}
        title: {{ .title | quote }}
        entities_url: "https://data.opensanctions.org/datasets/latest/{{ .name }}/entities.ftm.json"
{{- end }}
