apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: ktayl-underwriting
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: ktayl-underwriting
      sources:
        direct: true
  # After promoting to dev, run the smoke AnalysisRun. A Freight is "Verified in dev" only if
  # it passes → the prod Stage (sources.stages: [dev]) accepts only verified Freight = the
  # dev→prod gate, owned by Kargo (Option 2). Variant B smoke (via ingress-nginx).
  verification:
    analysisTemplates:
      - name: ktayl-underwriting-dev-verify
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
        # The source (image-producing) repo. Freight = a commit here; both images are tagged with its
        # short SHA (CI: `git rev-parse --short HEAD` = 7 hex = commitFrom(...).ID[0:7]).
        - name: srcRepo
          value: https://github.com/andrelair-platform/ktayl-underwriting.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-image
          config:
            path: ./repo/services/ktayl-underwriting/helm/values-dev.yaml
            # Pin BOTH images to the SAME source commit → a consistent backend+frontend pair.
            updates:
              - key: minicloud-app-deployment.image.tag
                value: '${{ quote(commitFrom(vars.srcRepo).ID[0:7]) }}'
              - key: frontend.image.tag
                value: '${{ quote(commitFrom(vars.srcRepo).ID[0:7]) }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(ktayl-underwriting): promote ${{ commitFrom(vars.srcRepo).ID[0:7] }} to dev (backend+frontend)'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(ktayl-underwriting): promote to dev — ${{ commitFrom(vars.srcRepo).ID[0:7] }}'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
