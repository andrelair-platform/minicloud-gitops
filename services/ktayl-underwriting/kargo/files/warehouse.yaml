apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: ktayl-underwriting
  namespace: ktayl-underwriting
spec:
  # GIT-Warehouse model (MANDATORY for a MULTI-image service — gitops.md). ktayl-underwriting is a
  # monorepo that builds TWO images (backend + frontend) from the SAME commit. Two NewestBuild image
  # subscriptions would produce MIXED Freight when one image is a byte-identical cached rebuild (no
  # newer timestamp → NewestBuild can't rank it) → prod could get a mismatched backend/frontend pair.
  # The git model keys Freight on the COMMIT, so both stages pin BOTH images to commitFrom(...).ID[0:7]
  # → always a consistent set. The source repo is PUBLIC → no git credential needed.
  #
  # Phantom-commit guard (FIXED 2026-10-04): the git Warehouse creates Freight for EVERY main commit,
  # but a commit whose CI build was SKIPPED has no image → promoting it = ImagePullBackOff. CI is
  # skipped two ways: (a) paths-ignore, AND (b) a `[skip ci]` message (regardless of path). The earlier
  # claim "every commit has images" was wrong — a docs/catalog commit with `[skip ci]` (e.g. 477758d,
  # catalog-info.yaml) phantom-promoted to dev and wedged it. excludePaths below mirrors the paths that
  # are routinely committed with `[skip ci]` (docs / *.md / catalog-info.yaml / bmad) so they never
  # create Freight. (A `[skip ci]` on a non-excluded CODE path would still phantom → don't do that;
  # add its path here if a new skip pattern appears. Keep excludePaths a SUPERSET of the CI skips.)
  interval: 5m
  freightCreationPolicy: Automatic
  subscriptions:
    - git:
        repoURL: https://github.com/andrelair-platform/ktayl-underwriting.git
        branch: main
        commitSelectionStrategy: NewestFromBranch
        excludePaths:
          - docs
          - bmad
          - catalog-info.yaml
          - "regex:.*\\.md$"
