# ktayl-underwriting wrapper chart — common values.
# (1) `minicloud-app-deployment:` = the library subchart (FastAPI workload + Ingress);
# (2) top-level keys drive THIS chart's templates/ (CNPG Postgres, DB netpols, TLS cert, migration Job).
#
# DATABASE_URL construction (the key decision): the app (app/config.py) reads a single DATABASE_URL and
# SQLAlchemy needs the `postgresql+psycopg://` driver scheme (psycopg3). CNPG only publishes a bare
# `postgresql://` `uri` in its <cluster>-app secret, so we DON'T use it. Instead we inject the five
# individual CNPG secret keys as env vars and compose DATABASE_URL with Kubernetes' native dependent
# env-var expansion `$(VAR)` — no extra secret, no Job-writes-secret coupling, fully declarative. The
# SAME env block is reused by the Alembic PreSync migration Job (templates/migration-job.yaml).
minicloud-app-deployment:
  # New service in a fresh namespace → standard app.kubernetes.io/* selector (no migration override).
  serviceAccount:
    create: true
    name: ktayl-underwriting
    automountServiceAccountToken: false
  # Match the image's non-root user (Dockerfile creates uid 10001). readOnlyRootFilesystem stays on
  # (library default) — the FastAPI app writes nothing to disk (PYTHONDONTWRITEBYTECODE).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  image:
    repository: harbor.10.0.0.200.nip.io/library/ktayl-underwriting
    # tag set per env (values-{dev,prod}.yaml)
  ports:
    - { name: http, containerPort: 8000, protocol: TCP }
  service:
    ports:
      - { name: http, port: 80, targetPort: http }
  # DATABASE_URL composed from the CNPG-generated <cluster>-app secret via $(VAR) expansion.
  env:
    - name: PGHOST
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: host } }
    - name: PGPORT
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: port } }
    - name: PGUSER
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: username } }
    - name: PGPASSWORD
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: password } }
    - name: PGDATABASE
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: dbname } }
    - name: DATABASE_URL
      value: "postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)"
    # --- bind (ADR-006): live policy-service handoff + bound-risk event + OIDC client-credentials ---
    # URLs point at the DEV targets (ns ktayl / messaging / authentik). When a prod app is wired, a
    # values-prod env override must repoint POLICY_SERVICE_URL → ktayl-prod. OIDC internal HTTP svc so
    # no CA to bake; token carries scope policy:write (Authentik provider ktayl-underwriting).
    - name: POLICY_SERVICE_URL
      value: "http://ktayl-policy-service.ktayl.svc:80"
    - name: NATS_URL
      value: "nats://nats.messaging.svc:4222"
    - name: OIDC_TOKEN_URL
      value: "http://authentik-server.authentik.svc:80/application/o/token/"
    - name: OIDC_SCOPE
      value: "policy:write"
    - name: OIDC_CLIENT_ID
      valueFrom: { secretKeyRef: { name: ktayl-underwriting-oidc, key: OIDC_CLIENT_ID } }
    - name: OIDC_CLIENT_SECRET
      valueFrom: { secretKeyRef: { name: ktayl-underwriting-oidc, key: OIDC_CLIENT_SECRET } }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  # startupProbe gates liveness/readiness until the app actually serves. The app does its DB-wait +
  # `alembic upgrade head` + seed in the FastAPI lifespan BEFORE uvicorn accepts requests, so on a
  # first install (CNPG still bootstrapping) /healthz is unavailable for a while — without this the
  # liveness probe kills the pod mid-startup (observed 4 restarts on first deploy). Budget must exceed
  # the app's DB-wait (wait_for_db = 60 × 3s = 180s) + migration: 60 × 5s = 300s.
  startupProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 5
    failureThreshold: 60
  readinessProbe:
    httpGet: { path: /healthz, port: http }
    initialDelaySeconds: 5
    periodSeconds: 5
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    initialDelaySeconds: 10
    periodSeconds: 10
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels: { app.kubernetes.io/name: ktayl-underwriting }
            topologyKey: kubernetes.io/hostname
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    servicePort: 80
    tls:
      enabled: true
      secretName: ktayl-underwriting-tls
    # host set per env
  certificate:
    enabled: false   # cert is a wrapper template (name kept = ktayl-underwriting-tls, ECDSA)

# ---- frontend (Next.js underwriter workbench) — the aliased library subchart ----
# A BFF: the browser talks same-origin to this Next.js app; it reaches the backend SERVER-SIDE via
# API_URL = the in-cluster backend Service (so the underwriting API is never exposed to the browser).
# API_URL is read at RUNTIME (env-agnostic image). readOnlyRootFilesystem MUST be false — Next.js
# writes its .next cache to disk at runtime (same as retrieva's frontend).
frontend:
  serviceAccount:
    create: true
    name: ktayl-underwriting-frontend
    automountServiceAccountToken: false
  nameOverride: frontend
  fullnameOverride: ktayl-underwriting-frontend
  selectorLabels: { app: ktayl-underwriting-frontend }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001          # nextjs uid in the frontend Dockerfile
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    readOnlyRootFilesystem: false
  image:
    repository: harbor.10.0.0.200.nip.io/library/ktayl-underwriting-frontend
    # tag set per env (values-{dev,prod}.yaml)
  ports:
    - { name: http, containerPort: 3000, protocol: TCP }
  service:
    ports:
      - { name: http, port: 3000, targetPort: http }
  env:
    - name: NODE_ENV
      value: "production"
    # Server-side BFF target: the backend Service in this namespace (never the browser). Runtime env.
    - name: API_URL
      value: "http://ktayl-underwriting.underwriting.svc:80"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  startupProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 5
    failureThreshold: 30
  readinessProbe:
    httpGet: { path: /healthz, port: http }
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    initialDelaySeconds: 10
    periodSeconds: 15
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels: { app: ktayl-underwriting-frontend }
            topologyKey: kubernetes.io/hostname
  ingress:
    enabled: true
    className: nginx
    servicePort: 3000
    tls:
      enabled: true
      secretName: ktayl-underwriting-frontend-tls
    # host set per env
  certificate:
    enabled: false   # cert is a wrapper template (frontendTlsCert)

# ---- wrapper-local (drives templates/) ----
tlsCert:
  dnsName: ""        # per env (backend host)
frontendTlsCert:
  dnsName: ""        # per env (frontend / workbench host)
# CNPG Postgres + its DB netpols. On in dev (dev owns its own DB); a later prod story enables it there too.
# Schema migration is NOT a separate Job — the app self-applies it on startup (alembic upgrade head in
# the FastAPI lifespan before seed_v1), matching ktayl-policy-service. This avoids the ArgoCD ordering
# deadlock a PreSync Job would create against the CNPG cluster provisioned in the same sync.
postgres:
  enabled: true
  instances: 1
  storageSize: 2Gi
# OIDC client-credentials ExternalSecret (bind handoff, ADR-006). Vault path must be populated first.
oidc:
  enabled: true
