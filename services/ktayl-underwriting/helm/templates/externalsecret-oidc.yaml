# OIDC client-credentials for the bind handoff (ADR-006): underwriting obtains a `policy:write`
# token from Authentik (provider `ktayl-underwriting`) to call the live policy-service. Creds live in
# Vault `secret/platform/ktayl-underwriting` (written out-of-band with root; ESO delivers them here).
# Non-secret bind config (PAS/NATS/token URLs, scope) is literal env in values.yaml.
{{- if .Values.oidc.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-underwriting-oidc
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: ktayl-underwriting-oidc, creationPolicy: Owner }
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef: { key: secret/platform/ktayl-underwriting, property: oidc-client-id }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: secret/platform/ktayl-underwriting, property: oidc-client-secret }
{{- end }}
