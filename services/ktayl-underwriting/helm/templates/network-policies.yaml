# Ingress default-deny + explicit allows. EGRESS is intentionally UNRESTRICTED: under Cilium a standard
# NetworkPolicy `ipBlock` CIDR does NOT match the kube-apiserver identity, so a default-deny-egress pod
# (CNPG initdb / instance-manager) hangs reaching 10.43.0.1:443 (known gotcha — same as data-platform +
# authentik CNPG namespaces). Hardening follow-up: a CiliumNetworkPolicy egress
# `toEntities: [kube-apiserver, world]` + DNS + the DB. Ingress-only keeps CNPG healthy for slice 1.
{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/name: ktayl-underwriting
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# intra-namespace ingress (CNPG replication, app→db, migration Job→db)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  labels:
    app.kubernetes.io/name: ktayl-underwriting
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
---
# CNPG operator → instance status endpoint (:8000) + Postgres (:5432).
# Without :8000 the cluster never reports healthy (the CNPG onboarding gotcha).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  labels:
    app.kubernetes.io/name: ktayl-underwriting
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: underwriting-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
---
# monitoring scrape (CNPG podmonitor :9187)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  labels:
    app.kubernetes.io/name: ktayl-underwriting
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: 9187 }
{{- end }}
---
# ingress-nginx → the FastAPI app (:8000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-app
  labels:
    app.kubernetes.io/name: ktayl-underwriting
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ktayl-underwriting }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { protocol: TCP, port: 8000 }
