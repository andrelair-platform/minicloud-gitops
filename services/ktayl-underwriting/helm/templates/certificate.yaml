# TLS Certificate (single-owner). Name kept = ktayl-underwriting-tls (in-place flip). dnsName per env.
# privateKey ECDSA/256 is MANDATORY — Vault PKI is EC-only and a Gatekeeper policy now DENIES RSA certs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ktayl-underwriting-tls
  labels:
    app.kubernetes.io/name: ktayl-underwriting
spec:
  secretName: ktayl-underwriting-tls
  issuerRef:
    name: minicloud-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.tlsCert.dnsName | quote }}
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
