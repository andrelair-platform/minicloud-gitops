# prod — ghcr SHA image, 2 replicas, prod host (ns underwriting-prod). NOT wired to an ArgoCD app yet
# (a later story creates ktayl-underwriting-prod + Kargo). Kept here so the chart is env-complete.
#
# ⚠️ PROD-ONBOARDING GATE (QA B1/B2 — MANDATORY before the prod app goes live): the app enforces
# per-endpoint JWT scope authz + records the token actor ONLY when `AUTHENTIK_JWKS_URL` is set (dev runs
# open, like policy-service). For prod you MUST: (1) add Authentik ScopeMappings `underwriting:read` +
# `underwriting:write` and bind them to a provider; (2) set env `AUTHENTIK_JWKS_URL` =
# http://authentik-server.authentik.svc/application/o/ktayl-underwriting/jwks/ AND repoint
# POLICY_SERVICE_URL→ktayl-prod / NATS as prod — which means giving THIS env its own full env list here
# (Helm replaces the list, so copy values.yaml's env block + override), since the common env in values.yaml
# is dev-targeted; (3) add Authentik **forward-auth** annotations on the prod ingress. Until all three are
# in place, do not promote to prod — an unauthenticated policy-binding API is a hard blocker for a
# regulated domain (ACPR/Solvency II auditability).
# prodExtras gates the prod-only ghcr-pull ExternalSecret (templates/externalsecret-ghcr.yaml).
prodExtras:
  enabled: true
# OIDC client-credentials (bind handoff) — enabled in prod too (reuses the ktayl-underwriting provider).
oidc:
  enabled: true
minicloud-app-deployment:
  image:
    repository: ghcr.io/andrelair-platform/ktayl-underwriting
    tag: "c86d277"     # Kargo bumps to the promoted SHA (both images pinned to the same commit)
  imagePullSecrets: [{ name: ghcr-pull }]
  workload:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # FULL env list (Helm REPLACES lists) — copied from values.yaml with 2 prod overrides:
  # POLICY_SERVICE_URL → ktayl-prod, and AUTHENTIK_JWKS_URL set so the app enforces per-endpoint JWT
  # scope authz (underwriting:read/write) + records the token actor. This is the prod-onboarding gate.
  env:
    - name: PGHOST
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: host } }
    - name: PGPORT
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: port } }
    - name: PGUSER
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: username } }
    - name: PGPASSWORD
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: password } }
    - name: PGDATABASE
      valueFrom: { secretKeyRef: { name: underwriting-postgres-app, key: dbname } }
    - name: DATABASE_URL
      value: "postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)"
    - name: POLICY_SERVICE_URL
      value: "http://ktayl-policy-service.ktayl-prod.svc:80"   # PROD override (dev = ns ktayl)
    - name: NATS_URL
      value: "nats://nats.messaging.svc:4222"
    - name: OIDC_TOKEN_URL
      value: "http://authentik-server.authentik.svc:80/application/o/token/"
    - name: OIDC_SCOPE
      value: "policy:write"
    - name: OIDC_CLIENT_ID
      valueFrom: { secretKeyRef: { name: ktayl-underwriting-oidc, key: OIDC_CLIENT_ID } }
    - name: OIDC_CLIENT_SECRET
      valueFrom: { secretKeyRef: { name: ktayl-underwriting-oidc, key: OIDC_CLIENT_SECRET } }
    # PROD AUTH GATE: validate inbound bearer tokens + enforce underwriting:read/write per endpoint.
    - name: AUTHENTIK_JWKS_URL
      value: "http://authentik-server.authentik.svc/application/o/ktayl-underwriting/jwks/"
  ingress:
    host: underwriting-prod.10.0.0.200.nip.io
    # Backend API: protected by app-level JWKS bearer validation (AUTHENTIK_JWKS_URL above), NOT
    # forward-auth — the BFF calls it with a bearer token, and forward-auth expects a browser session.
# Frontend (workbench) — ghcr image (Internal → needs ghcr-pull), 2 replicas. Kargo pins the tag to the
# same source commit as the backend. API_URL is inherited from values.yaml (the in-cluster backend svc).
frontend:
  image:
    repository: ghcr.io/andrelair-platform/ktayl-underwriting-frontend
    tag: "c86d277"     # Kargo bumps to the promoted SHA
  imagePullSecrets: [{ name: ghcr-pull }]
  # FULL env list (Helm REPLACES lists). Prod overrides: API_URL → the PROD backend svc, + the OIDC
  # client-credentials the BFF uses to mint a scoped bearer (underwriting:read/write) for the JWKS-
  # protected backend (frontend/src/lib/auth-token.ts). Same ktayl-underwriting OIDC client as the backend.
  env:
    - name: NODE_ENV
      value: "production"
    - name: API_URL
      value: "http://ktayl-underwriting.underwriting-prod.svc:80"   # PROD backend (dev = ns underwriting)
    - name: OIDC_TOKEN_URL
      value: "http://authentik-server.authentik.svc:80/application/o/token/"
    - name: OIDC_SCOPE
      value: "underwriting:read underwriting:write"
    - name: OIDC_CLIENT_ID
      valueFrom: { secretKeyRef: { name: ktayl-underwriting-oidc, key: OIDC_CLIENT_ID } }
    - name: OIDC_CLIENT_SECRET
      valueFrom: { secretKeyRef: { name: ktayl-underwriting-oidc, key: OIDC_CLIENT_SECRET } }
  workload:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    host: underwriting-app-prod.10.0.0.200.nip.io
    # Workbench (human browser entry) → Authentik forward-auth (embedded outpost). Requires an Authentik
    # Proxy Provider + Application for this host assigned to the embedded outpost (wired out-of-band).
    annotations:
      nginx.ingress.kubernetes.io/server-snippet: |
        location /outpost.goauthentik.io {
            proxy_pass              http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io;
            proxy_set_header        Host $host;
            proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
            add_header              Set-Cookie $auth_cookie;
            auth_request_set        $auth_cookie $upstream_http_set_cookie;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
        }
        location @goauthentik_proxy_signin {
            internal;
            add_header Set-Cookie $auth_cookie;
            return 302 /outpost.goauthentik.io/start?rd=$request_uri;
        }
      nginx.ingress.kubernetes.io/configuration-snippet: |
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page       401 = @goauthentik_proxy_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie $auth_cookie;
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_groups   $upstream_http_x_authentik_groups;
        auth_request_set $authentik_email    $upstream_http_x_authentik_email;
        proxy_set_header X-authentik-username $authentik_username;
        proxy_set_header X-authentik-groups   $authentik_groups;
        proxy_set_header X-authentik-email    $authentik_email;
tlsCert:
  dnsName: underwriting-prod.10.0.0.200.nip.io
frontendTlsCert:
  dnsName: underwriting-app-prod.10.0.0.200.nip.io
postgres:
  enabled: true
  instances: 2
  storageSize: 5Gi
  backup:
    enabled: true            # PROD gets backup (dev does not) → bucket cnpg-underwriting-prod (from base)
# No migration Job — the app self-migrates on startup (see values.yaml).
