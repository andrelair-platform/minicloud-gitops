apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: SERVICE_NAME-prod
resources:
  - ../../base
  - ingress.yaml
  - certificate.yaml
  - quota.yaml
# Promoted manually: PR bumping newTag after dev is validated (2-env default).
# ArgoCD Application for prod should have syncPolicy.automated disabled.
images:
  - name: harbor.10.0.0.200.nip.io/library/SERVICE_NAME
    newTag: "latest"
patches:
  - path: patch-resources.yaml
