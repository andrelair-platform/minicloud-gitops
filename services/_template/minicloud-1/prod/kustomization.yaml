apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: SERVICE_NAME-prod
resources:
  - ../../base
  - ingress.yaml
  - certificate.yaml
  - quota.yaml
# Promoted via PR: bump newTag to an immutable SHA tag (never :latest) after dev
# is validated. ArgoCD then auto-syncs prod — the gate is the CODEOWNERS-reviewed
# PR + the Rollout analysis, NOT a manual Sync click (git-gated automated prod).
# The prod ArgoCD Application uses syncPolicy.automated {prune, selfHeal}.
images:
  - name: harbor.10.0.0.200.nip.io/library/SERVICE_NAME
    newTag: "SET_TO_A_SHA_ON_PROMOTION"
patches:
  - path: patch-resources.yaml
