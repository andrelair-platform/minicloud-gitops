---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: SERVICE_NAME-dev
spec:
  hard:
    requests.cpu: "200m"
    requests.memory: 256Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    count/pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limits
  namespace: SERVICE_NAME-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
