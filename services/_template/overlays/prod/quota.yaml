---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-quota
  namespace: SERVICE_NAME-prod
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 4Gi
    count/pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: prod-limits
  namespace: SERVICE_NAME-prod
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 4Gi
