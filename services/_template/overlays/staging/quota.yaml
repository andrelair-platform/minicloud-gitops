---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: SERVICE_NAME-staging
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 2Gi
    count/pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limits
  namespace: SERVICE_NAME-staging
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 2Gi
