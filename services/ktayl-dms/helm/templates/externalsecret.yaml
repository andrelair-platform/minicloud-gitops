---
# Paperless secrets from Vault (break-glass SEED — owner, needs root):
#   vault kv put secret/platform/paperless \
#     secret-key='<50-char random>' \
#     admin-password='<break-glass admin pw>' \
#     socialaccount-providers='{"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Authentik",
#       "client_id":"<from the Authentik provider>","secret":"<from the Authentik provider>",
#       "settings":{"server_url":"https://auth.devandre.sbs/application/o/paperless/.well-known/openid-configuration"}}]}}'
# (DB creds come from the CNPG `paperless-cnpg-app` secret, not here.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: paperless-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: paperless-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef: { key: platform/paperless, property: secret-key }
    - secretKey: admin-password
      remoteRef: { key: platform/paperless, property: admin-password }
    - secretKey: socialaccount-providers
      remoteRef: { key: platform/paperless, property: socialaccount-providers }
