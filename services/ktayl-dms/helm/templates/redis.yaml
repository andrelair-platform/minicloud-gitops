---
# Tiny Redis broker for Paperless's task queue (ephemeral — the queue is rebuildable; no PVC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-redis
  labels: { app: paperless-redis }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: paperless-redis }
  template:
    metadata:
      labels: { app: paperless-redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no"]   # ephemeral broker, no persistence
          ports:
            - containerPort: 6379
          resources: {{ .Values.redis.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-redis
  labels: { app: paperless-redis }
spec:
  selector: { app: paperless-redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
