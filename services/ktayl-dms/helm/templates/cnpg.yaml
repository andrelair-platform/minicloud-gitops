---
# Dedicated CNPG Postgres for Paperless (datastore-selection.md — CNPG is the standard). dev = 1
# instance, RF=1, no offsite backup. CNPG publishes the `paperless-cnpg-app` secret (username/password/
# dbname) + the `paperless-cnpg-rw` service the app reads. Egress is UNRESTRICTED in this ns (see
# network-policies.yaml) so initdb can reach the kube-apiserver — a default-deny-egress would hang it
# under Cilium (the ipBlock-doesn't-match-apiserver gotcha).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-cnpg
spec:
  instances: {{ .Values.cnpg.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4   # platform standard (PG 17), same as every other CNPG cluster

  storage:
    size: {{ .Values.cnpg.storageSize }}
    storageClass: longhorn
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.db }}
      owner: {{ .Values.cnpg.owner }}
  affinity:
    podAntiAffinityType: preferred
{{- if and .Values.cnpg.vaultRole .Values.cnpg.vaultRole.enabled }}
  # DB credential sourced from Vault (db-credentials.md): CNPG manages the `{{ .Values.cnpg.owner }}` role
  # password from the ESO-rendered `paperless-cnpg-role` secret — seeded = the current `-app` value →
  # no-op at adoption, Vault becomes source of truth.
  managed:
    roles:
      - name: {{ .Values.cnpg.owner }}
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: paperless-cnpg-role
{{- end }}
{{- if and .Values.cnpg.vaultRole .Values.cnpg.vaultRole.enabled }}
---
# Vault-sourced password for the `{{ .Values.cnpg.owner }}` CNPG role (db-credentials.md). Seeded = the
# current -app value → adoption is a no-op; future rotations go through Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: paperless-cnpg-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: paperless-cnpg-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.cnpg.owner | quote }}
        password: "{{ `{{ .pgpass }}` }}"
  data:
    - secretKey: pgpass
      remoteRef:
        key: {{ .Values.cnpg.vaultRole.vaultPath }}
        property: postgres-password
{{- end }}
