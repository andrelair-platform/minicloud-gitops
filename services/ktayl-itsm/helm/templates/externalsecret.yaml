---
# GLPI DB credentials from Vault. SEED (owner, read -s):
#   vault kv put secret/platform/ktayl-itsm mariadb-root-password=<...> db-password=<...>
# db-password is shared: MariaDB's glpi-user password AND GLPI's GLPI_DB_PASSWORD.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-itsm-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-itsm-db
    creationPolicy: Owner
  data:
    - secretKey: mariadb-root-password
      remoteRef:
        key: platform/ktayl-itsm
        property: mariadb-root-password
    - secretKey: db-password
      remoteRef:
        key: platform/ktayl-itsm
        property: db-password
