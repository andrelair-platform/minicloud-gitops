---
apiVersion: v1
kind: Service
metadata:
  name: glpi-mariadb
  labels: { app: glpi-mariadb }
spec:
  clusterIP: None
  selector: { app: glpi-mariadb }
  ports:
    - { name: mysql, port: 3306, targetPort: 3306 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: glpi-mariadb
spec:
  serviceName: glpi-mariadb
  replicas: 1
  selector:
    matchLabels: { app: glpi-mariadb }
  template:
    metadata:
      labels: { app: glpi-mariadb }
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          ports:
            - containerPort: 3306
          env:
            - { name: MARIADB_DATABASE, value: {{ .Values.db.name | quote }} }
            - { name: MARIADB_USER, value: {{ .Values.db.user | quote }} }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: ktayl-itsm-db, key: mariadb-root-password } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: ktayl-itsm-db, key: db-password } }
          args: ["--transaction-isolation=READ-COMMITTED", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          resources: {{ .Values.mariadb.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: run-mysqld, mountPath: /run/mysqld }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run-mysqld, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ .Values.mariadb.storage }}
