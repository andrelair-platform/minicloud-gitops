---
# S002: internal host (Tailscale) + public host (itsm.devandre.sbs via the Cloudflare tunnel).
# GLPI gates itself via NATIVE OIDC to Authentik (the glpi-singlesignon plugin) — NOT forward-auth —
# so the public ingress carries no forward-auth annotations; GLPI's own login page is the gate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: glpi-tls
spec:
  secretName: glpi-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: minicloud-ca
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.host }}
{{- if .Values.publicHost }}
    - {{ .Values.publicHost }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glpi
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.host }}
{{- if .Values.publicHost }}
        - {{ .Values.publicHost }}
{{- end }}
      secretName: glpi-tls
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glpi
                port:
                  number: 80
{{- if .Values.publicHost }}
    - host: {{ .Values.publicHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glpi
                port:
                  number: 80
{{- end }}
