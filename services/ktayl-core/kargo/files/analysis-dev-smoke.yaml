# Kargo dev-Stage verification (smoke VARIANT B — always-on + no SSO on the probe path). ktayl-core's
# /actuator/health/readiness is permitted unauthenticated (SecurityConfig), so the smoke reaches it the
# real way: through ingress-nginx. --connect-to keeps SNI+Host = the real dev host (right server block)
# while dialing the in-cluster nginx service; -k trusts the minicloud CA. No extra NetworkPolicy needed.
# argo-rollouts (cluster-scoped) reconciles the AnalysisRun; the job runs in this Kargo project namespace.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ktayl-core-dev-verify
  namespace: ktayl-core-kargo
spec:
  metrics:
    - name: dev-smoke
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 3
            activeDeadlineSeconds: 120
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app.kubernetes.io/part-of: ktayl-core
                  kargo.akuity.io/verify: dev-smoke
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke
                    image: docker.io/curlimages/curl:8.11.1
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: [ALL]
                    resources:
                      requests: {cpu: 25m, memory: 32Mi}
                      limits: {cpu: 100m, memory: 64Mi}
                    command: [/bin/sh, -c]
                    args:
                      - |
                        set -eu
                        H=ktayl-core.10.0.0.200.nip.io
                        NGINX=nginx-ingress-ingress-nginx-controller.ingress-nginx.svc.cluster.local
                        echo "smoke: GET https://$H/actuator/health/readiness via ingress-nginx"
                        code=$(curl -sSk -o /dev/null -w '%{http_code}' --max-time 20 \
                          --retry 8 --retry-delay 5 --retry-all-errors \
                          --connect-to "$H:443:$NGINX:443" "https://$H/actuator/health/readiness")
                        echo "readiness http_code=$code"
                        test "$code" = 200
                        echo "dev smoke passed"
