# prod — ghcr SHA image, 2 replicas, ns ktayl-core-prod. Billing's NATS ingest consumer is ACTIVE here
# (prod = the single authoritative consumer; dev stays blank). DB creds from the prod-ns CNPG `-app`
# secret. CNPG has R2 PITR backup (prod DBs must be backed up — datastore-selection.md).
minicloud-app-deployment:
  selectorLabels:
    app: ktayl-core
  image:
    repository: ghcr.io/andrelair-platform/ktayl-core
    tag: 2225e1b
  workload:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    host: ktayl-core-prod.10.0.0.200.nip.io
  env:
    - name: DATABASE_URL
      value: "jdbc:postgresql://ktayl-core-cnpg-rw.ktayl-core-prod.svc:5432/ktayl_core"
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef: { name: ktayl-core-cnpg-app, key: username }
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef: { name: ktayl-core-cnpg-app, key: password }
    - name: BILLING_NATS_URL
      value: "nats://nats.messaging.svc:4222"   # prod = the authoritative ingest consumer (NATS svc `nats` in ns `messaging`)
    # Stripe (BILL-013) — from the ktayl-core-stripe ESO secret (Vault secret/platform/ktayl-core). `optional`
    # so the pod stays up (payment → 503) until the Vault secret exists; a rollout then picks the keys up.
    - name: BILLING_STRIPE_SECRET_KEY
      valueFrom:
        secretKeyRef: { name: ktayl-core-stripe, key: secret-key, optional: true }
    - name: BILLING_STRIPE_WEBHOOK_SECRET
      valueFrom:
        secretKeyRef: { name: ktayl-core-stripe, key: webhook-secret, optional: true }
tlsCert:
  dnsName: ktayl-core-prod.10.0.0.200.nip.io
# Stripe payment (BILL-013) — prod is where the live test-mode PSP + the public webhook route run.
stripe:
  enabled: true
  vaultPath: platform/ktayl-core
cnpg:
  instances: 2
  storageSize: 5Gi
  backup:
    enabled: true
    retentionPolicy: "14d"
    bucket: minicloud-cnpg-offsite/ktayl-core
    endpointURL: https://4d3a131c84ca31b951cba16a5b7db0c1.r2.cloudflarestorage.com
    vaultPath: platform/cloudflare
    schedule: "0 0 4 * * *"   # daily 04:00 UTC
