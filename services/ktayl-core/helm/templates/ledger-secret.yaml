{{- if .Values.ledger.enabled }}
# ERPNext API creds for BILL-014 GL posting. ESO renders a k8s secret from Vault (secret/platform/erpnext)
# that the Deployment reads as LEDGER_ERPNEXT_API_KEY/SECRET. Prod-only (ledger.enabled); the env refs are
# `optional` so the pod stays up (the outbox just accumulates) until the Vault keys exist.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-core-ledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-core-ledger
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef: { key: {{ .Values.ledger.vaultPath }}, property: erpnext-api-key }
    - secretKey: api-secret
      remoteRef: { key: {{ .Values.ledger.vaultPath }}, property: erpnext-api-secret }
{{- end }}
