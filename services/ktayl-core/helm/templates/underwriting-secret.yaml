{{- if .Values.underwritingOauth.enabled }}
# SUB-02 prod handoff — the OAuth2 client-credentials creds ktayl-core uses to authenticate its
# submission->underwriting handoff (underwriting's API auth is ON in prod). ESO renders a k8s secret from
# Vault (secret/platform/ktayl-core-underwriting, provisioned via the Authentik `ktayl-core-uw-m2m` M2M
# client) that the Deployment reads as UNDERWRITING_OAUTH_CLIENT_ID/SECRET env. Prod-only
# (underwritingOauth.enabled); the env refs are `optional` so the pod stays up (handoff -> 502, submission
# stays ROUTED + retryable) until the Vault secret syncs. The non-secret token-uri + scope are plain env in
# values-prod (the token endpoint is the Authentik INGRESS host — reused egress allowance, no netpol change).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-core-underwriting
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-core-underwriting
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef: { key: {{ .Values.underwritingOauth.vaultPath }}, property: oidc-client-id }
    - secretKey: client-secret
      remoteRef: { key: {{ .Values.underwritingOauth.vaultPath }}, property: oidc-client-secret }
{{- end }}
