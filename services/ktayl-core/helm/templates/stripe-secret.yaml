{{- if .Values.stripe.enabled }}
# Stripe test-mode keys for Billing payment (ADR-002, BILL-013). ESO renders a k8s secret from Vault
# (secret/platform/ktayl-core) that the Deployment reads as BILLING_STRIPE_* env. Prod-only (stripe.enabled);
# the env refs are `optional` so the pod stays up (payment dormant → 503) until the Vault secret exists.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-core-stripe
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-core-stripe
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret-key
      remoteRef: { key: {{ .Values.stripe.vaultPath }}, property: stripe-secret-key }
    - secretKey: webhook-secret
      remoteRef: { key: {{ .Values.stripe.vaultPath }}, property: stripe-webhook-secret }
{{- end }}
