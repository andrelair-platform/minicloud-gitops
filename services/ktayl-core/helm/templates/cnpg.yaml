# Dedicated CNPG Postgres for ktayl-core (the modular monolith's primary store). The bootstrap creates
# the `ktayl_core` database owned by the `ktayl_core` role; CNPG auto-generates the `ktayl-core-cnpg-app`
# secret (username/password) that the Deployment reads (values-{dev,prod}.yaml) — no Vault on dev. The
# billing + complaints SCHEMAS are created by Flyway on boot, not here (schema-per-module, ADR-006).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ktayl-core-cnpg
  labels:
    app.kubernetes.io/name: ktayl-core
spec:
  instances: {{ .Values.cnpg.instances }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: {{ .Values.cnpg.storageSize }}
    storageClass: longhorn
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  monitoring:
    enablePodMonitor: true
{{- if and .Values.cnpg.vaultRole .Values.cnpg.vaultRole.enabled }}
  # DB credential sourced from Vault (db-credentials.md discipline). CNPG manages the `ktayl_core` role's
  # password from the ESO-rendered `ktayl-core-cnpg-role` secret — seeded with the SAME value as the
  # operator-generated `-app` secret at adoption → CNPG re-applies the identical password (no change,
  # no downtime), and Vault becomes the source of truth. Prod-only (dev keeps the operator-generated app pw).
  managed:
    roles:
      - name: ktayl_core
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: ktayl-core-cnpg-role
{{- end }}
  bootstrap:
    initdb:
      database: ktayl_core
      owner: ktayl_core
{{- if .Values.cnpg.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.cnpg.backup.retentionPolicy | default "14d" | quote }}
    barmanObjectStore:
      destinationPath: s3://{{ .Values.cnpg.backup.bucket }}
      endpointURL: {{ .Values.cnpg.backup.endpointURL }}
      s3Credentials:
        accessKeyId:
          name: ktayl-core-cnpg-r2
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: ktayl-core-cnpg-r2
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
{{- end }}
---
# CNPG pods are isolated once a netpol selects them → this allows the operator (cnpg-system) to reach
# instance status (:8000) + Postgres (:5432), same-namespace streaming replication + the app → DB
# (:5432). Self-sufficient in any namespace (dev + prod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: ktayl-core-cnpg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
    # Data Platform analytics puller (ADR-008): the S3-lake producer reads policy.policy read-only via the
    # dedicated analytics_ro role → lands it to the lake. Scoped to the data-platform namespace, :5432.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data-platform
      ports:
        - { protocol: TCP, port: 5432 }
{{- if .Values.cnpg.backup.enabled }}
---
# R2 credentials for the barmanObjectStore backup (Vault platform/cloudflare). Prod-only (backup.enabled).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-core-cnpg-r2
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-core-cnpg-r2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: {{ .Values.cnpg.backup.vaultPath }}, property: r2-access-key-id }
    - secretKey: SECRET_ACCESS_KEY
      remoteRef: { key: {{ .Values.cnpg.backup.vaultPath }}, property: r2-secret-access-key }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ktayl-core-cnpg-daily
spec:
  schedule: {{ .Values.cnpg.backup.schedule | default "0 0 4 * * *" | quote }}
  backupOwnerReference: self
  cluster:
    name: ktayl-core-cnpg
{{- end }}
{{- if and .Values.cnpg.vaultRole .Values.cnpg.vaultRole.enabled }}
---
# Vault-sourced password for the `ktayl_core` CNPG role (db-credentials.md). basic-auth secret consumed by
# the Cluster's managed.roles[].passwordSecret above. `postgres-password` was seeded = the current -app
# value, so adoption is a no-op; future rotations go through Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-core-cnpg-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-core-cnpg-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "ktayl_core"
        password: "{{ `{{ .pgpass }}` }}"
  data:
    - secretKey: pgpass
      remoteRef:
        key: {{ .Values.cnpg.vaultRole.vaultPath }}
        property: postgres-password
{{- end }}
