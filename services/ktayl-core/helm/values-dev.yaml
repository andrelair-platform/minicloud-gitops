# dev — Harbor image, ns ktayl-core. The FULL env list lives here (Helm replaces list values per
# overlay). DB creds come from the CNPG-generated `ktayl-core-cnpg-app` secret (no Vault on dev);
# DATABASE_URL is built from the deterministic -rw service host. BILLING_NATS_URL is BLANK → the ingest
# consumer is disabled (exactly one env consumes the shared UNDERWRITING_EVENTS stream). AUTHENTIK_ISSUER
# / OTEL endpoint / LOG_STRUCTURED_FORMAT / COMPLAINTS_ACK_WINDOW use the application.yml defaults.
minicloud-app-deployment:
  image:
    repository: ghcr.io/andrelair-platform/ktayl-core
    # 4bbc7cd = the real built image (SUB-01 + S1 + S2/S4). Kargo auto-promoted the docs-only commit
    # bcbc574 (OpenAPI PR #66, CI skipped the image build) during the control-plane-wedge incident
    # (2026-11-17) → :bcbc574 was never pushed → ImagePullBackOff. Reverted to the last real image.
    # Follow-up: fix the git-Warehouse so a docs-only commit can't produce freight + delete that freight.
    tag: 82d03d8
  podLabels:
    app: ktayl-core
  workload:
    replicas: 1
  ingress:
    host: ktayl-core.10.0.0.200.nip.io
  env:
    - name: DATABASE_URL
      value: "jdbc:postgresql://ktayl-core-cnpg-rw.ktayl-core.svc:5432/ktayl_core"
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef: { name: ktayl-core-cnpg-app, key: username }
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef: { name: ktayl-core-cnpg-app, key: password }
    - name: BILLING_NATS_URL
      value: ""
    # Multi-issuer allowlist (ADR-016) — override the application.yml default to ADD the dms-classifier
    # M2M issuer alongside the existing ktayl-core (SSO) + ktayl-underwriting (bind) issuers, so the DMS
    # classifier's client-credentials token is accepted on the policy-lookup GET (task #14).
    # EXACT-MATCH gotcha (verified live 2026-11-16/17): Authentik stamps `iss` from the request Host header,
    # which drops the default :80 → an in-cluster M2M token's iss is `…authentik.svc/application/o/<app>/`
    # (NO :80). ktayl-core's TrustedIssuerValidator does an exact string match, so EVERY internal-host entry
    # MUST be the no-:80 form. (The ktayl-underwriting :80 was fixed 2026-11-17 — it had silently broken
    # underwriting binding on prod, caught by the live prod bind-gate test.)
    - name: AUTHENTIK_TRUSTED_ISSUERS
      value: "https://auth.devandre.sbs/application/o/ktayl-core/,http://authentik-server.authentik.svc/application/o/ktayl-underwriting/,http://authentik-server.authentik.svc/application/o/dms-classifier/"
tlsCert:
  dnsName: ktayl-core.10.0.0.200.nip.io
