# dev — Harbor image, ns ktayl-core. The FULL env list lives here (Helm replaces list values per
# overlay). DB creds come from the CNPG-generated `ktayl-core-cnpg-app` secret (no Vault on dev);
# DATABASE_URL is built from the deterministic -rw service host. BILLING_NATS_URL is BLANK → the ingest
# consumer is disabled (exactly one env consumes the shared UNDERWRITING_EVENTS stream). AUTHENTIK_ISSUER
# / OTEL endpoint / LOG_STRUCTURED_FORMAT / COMPLAINTS_ACK_WINDOW use the application.yml defaults.
minicloud-app-deployment:
  image:
    repository: ghcr.io/andrelair-platform/ktayl-core
    tag: 439bc41
  podLabels:
    app: ktayl-core
  workload:
    replicas: 1
  ingress:
    host: ktayl-core.10.0.0.200.nip.io
  env:
    - name: DATABASE_URL
      value: "jdbc:postgresql://ktayl-core-cnpg-rw.ktayl-core.svc:5432/ktayl_core"
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef: { name: ktayl-core-cnpg-app, key: username }
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef: { name: ktayl-core-cnpg-app, key: password }
    - name: BILLING_NATS_URL
      value: ""
    # Multi-issuer allowlist (ADR-016) — override the application.yml default to ADD the dms-classifier
    # M2M issuer alongside the existing ktayl-core (SSO) + ktayl-underwriting (bind) issuers, so the DMS
    # classifier's client-credentials token is accepted on the policy-lookup GET (task #14). Harmless
    # ahead of the Authentik `dms-classifier` provider existing — it's just an extra allowed issuer.
    - name: AUTHENTIK_TRUSTED_ISSUERS
      value: "https://auth.devandre.sbs/application/o/ktayl-core/,http://authentik-server.authentik.svc:80/application/o/ktayl-underwriting/,http://authentik-server.authentik.svc:80/application/o/dms-classifier/"
tlsCert:
  dnsName: ktayl-core.10.0.0.200.nip.io
