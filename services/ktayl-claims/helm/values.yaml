# ktayl-claims wrapper chart — common values.
# (1) `minicloud-app-deployment:` = the library subchart (Spring Boot ACL workload + Ingress);
# (2) top-level keys drive THIS chart's templates/ (TLS cert). STATELESS v1 — no DB, no ESO.
minicloud-app-deployment:
  serviceAccount:
    create: true
    name: ktayl-claims
    automountServiceAccountToken: false
  # Match the image's non-root user (Dockerfile creates uid 10001). Spring writes nothing to disk.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  image:
    repository: harbor.10.0.0.200.nip.io/library/ktayl-claims
    # tag set per env (values-{dev,prod}.yaml)
  # Tomcat creates its work/temp dir under /tmp on startup; readOnlyRootFilesystem:true (library
  # default) makes /tmp read-only → "Unable to create tempDir … Read-only file system" crash. Give it
  # a writable emptyDir /tmp (the secure fix — keeps the root FS read-only). [[readOnlyRootFilesystem]]
  writableDirs:
    - { name: tmp, mountPath: /tmp }
  ports:
    - { name: http, containerPort: 8080, protocol: TCP }
  service:
    ports:
      - { name: http, port: 80, targetPort: http }
  resources:
    requests: { cpu: 100m, memory: 384Mi }   # JVM footprint
    limits:   { cpu: "1", memory: 768Mi }
  # Spring Boot Actuator k8s probes (application.yml enables health.probes). The JVM + Spring context
  # take a while to start, so startupProbe gates liveness/readiness until the context is up.
  startupProbe:
    httpGet: { path: /actuator/health/liveness, port: http }
    periodSeconds: 5
    failureThreshold: 40
  readinessProbe:
    httpGet: { path: /actuator/health/readiness, port: http }
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet: { path: /actuator/health/liveness, port: http }
    initialDelaySeconds: 10
    periodSeconds: 15
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels: { app.kubernetes.io/name: minicloud-app-deployment, app.kubernetes.io/instance: ktayl-claims }
            topologyKey: kubernetes.io/hostname
  ingress:
    enabled: true
    className: nginx
    servicePort: 80
    tls:
      enabled: true
      secretName: ktayl-claims-tls
    # host set per env
  certificate:
    enabled: false   # cert is a wrapper template (ktayl-claims-tls, ECDSA)

# Frontend (Angular adjuster workbench, ADR-009) — the aliased 2nd library workload. nginx serves the
# SPA + reverse-proxies /api → the backend ACL Service in THIS namespace (BFF shim; API_URL is the
# in-cluster svc, never the browser). Its own ingress/host/cert; uses the library certificate directly.
frontend:
  serviceAccount:
    create: true
    name: ktayl-claims-frontend
    automountServiceAccountToken: false
  nameOverride: frontend
  fullnameOverride: ktayl-claims-frontend
  selectorLabels: { app: ktayl-claims-frontend }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101           # nginx-unprivileged uid
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    readOnlyRootFilesystem: false   # nginx writes its temp/pid dirs
  image:
    repository: harbor.10.0.0.200.nip.io/library/ktayl-claims-frontend
    # tag set per env (values-{dev,prod}.yaml)
  ports:
    - { name: http, containerPort: 8080, protocol: TCP }
  service:
    ports:
      - { name: http, port: 8080, targetPort: http }
  env:
    # BFF target: the backend ACL Service in this namespace (same name dev+prod → env-agnostic).
    - { name: API_URL, value: "http://ktayl-claims" }
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  startupProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 5
    failureThreshold: 30
  readinessProbe:
    httpGet: { path: /healthz, port: http }
    initialDelaySeconds: 3
    periodSeconds: 10
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    initialDelaySeconds: 5
    periodSeconds: 15
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels: { app: ktayl-claims-frontend }
            topologyKey: kubernetes.io/hostname
  ingress:
    enabled: true
    className: nginx
    servicePort: 8080
    tls:
      enabled: true
      secretName: ktayl-claims-frontend-tls
    # host set per env
  certificate:
    enabled: false   # cert is a wrapper template (ktayl-claims-frontend-tls, ECDSA)

# ---- wrapper-local (drives templates/) ----
tlsCert:
  dnsName: ""        # per env (backend host)
frontendTlsCert:
  dnsName: ""        # per env (frontend/workbench host)
# Slice C — Debezium Server (MySQL binlog → NATS JetStream). Off by default; dev enables it.
# The CDC lane is PER-ENV (serverId/topicPrefix/streamName/streamSubjects) so dev and prod each tail the
# shared legacy binlog as a distinct replica and publish to distinct subjects/streams — no cross-env bleed
# (the app's cdc.stream/subject/durable env must match the same env's values). Defaults = the dev lane.
debezium:
  enabled: false
  image: quay.io/debezium/server:3.0.0.Final
  mysqlHost: "10.0.0.1"   # the off-cluster legacy MySQL (controller, LAN)
  serverId: "184099"      # MySQL replica id — MUST be unique per env tailing the same binlog
  topicPrefix: claims-cdc # → subjects claims-cdc.globalcore.<table>
  streamName: CLAIMS_CDC
  streamSubjects: "claims-cdc.>"
# Slice D (ADR-008) — CNPG Postgres for the CQRS read-model. Off by default; dev enables it. A derived
# projection (rebuildable from the CDC stream), so a single small instance is fine.
postgres:
  enabled: false
  instances: 1
  storageSize: 1Gi
  # CNPG Barman backup — PROD-ONLY (org rule: dev envs are not backed up). Disabled in base + dev;
  # values-prod.yaml sets enabled:true + bucket. Credential: shared platform/cloudflare key (rotate 90–180d).
  backup:
    enabled: false            # dev: no backup (prod-only rule). values-prod overrides to true.
    endpointURL: https://4d3a131c84ca31b951cba16a5b7db0c1.r2.cloudflarestorage.com
    retentionPolicy: 14d
    schedule: "0 0 4 * * *"   # CNPG 6-field cron = 04:00:00 UTC daily
    vaultPath: platform/cloudflare
    bucket: ""                # set in values-prod (cnpg-claims-prod); dev has no bucket
