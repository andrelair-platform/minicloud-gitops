# Slice D (ADR-008) — dedicated CNPG Postgres for the claims CQRS read-model. Small footprint
# (dev=1 instance). CNPG creates the `claims-postgres-app` secret (host/port/username/password/dbname)
# consumed by the ACL's datasource env. This is a DERIVED projection (rebuildable by replaying the CDC
# stream), so it's disposable — bump instances only if read availability matters. Core Postgres (no
# pgvector) → no AVX512 SIGILL concern.
{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: claims-postgres
  labels:
    app.kubernetes.io/name: ktayl-claims
spec:
  instances: {{ .Values.postgres.instances }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: {{ .Values.postgres.storageSize }}
    storageClass: longhorn
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 512Mi }
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: claims
      owner: claims
{{- if .Values.postgres.backup.enabled }}
  # Continuous WAL archiving + base backups to a DEDICATED per-cluster R2 bucket. The read-model is a
  # derived CQRS projection (rebuildable by CDC replay) → this backup is the FAST recovery path (replay
  # is the fallback). Credential: shared platform/cloudflare key (owner call); bucket is per-env.
  backup:
    retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: s3://{{ .Values.postgres.backup.bucket }}
      endpointURL: {{ .Values.postgres.backup.endpointURL }}
      s3Credentials:
        accessKeyId:
          name: cnpg-claims-r2
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-claims-r2
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
{{- end }}
{{- end }}
{{- if and .Values.postgres.enabled .Values.postgres.backup.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cnpg-claims-r2
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cnpg-claims-r2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: {{ .Values.postgres.backup.vaultPath }}, property: r2-access-key-id }
    - secretKey: SECRET_ACCESS_KEY
      remoteRef: { key: {{ .Values.postgres.backup.vaultPath }}, property: r2-secret-access-key }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: claims-postgres-daily
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: claims-postgres
{{- end }}
