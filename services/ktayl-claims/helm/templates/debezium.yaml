{{- if .Values.debezium.enabled }}
# Slice C — Debezium Server (standalone) tails the legacy MySQL binlog → NATS JetStream.
# Runs ON the cluster (reaches the off-cluster legacy MySQL at 10.0.0.1:3306 via LAN egress, and
# NATS at nats.messaging.svc:4222 in-cluster). File-based offset + schema-history on a small PVC.
# CDC subject: claims-cdc.globalcore.<table> → captured by the JetStream stream created below.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-debezium-config
  labels:
    app.kubernetes.io/name: claims-debezium
data:
  application.properties: |
    # --- source: MySQL binlog (the legacy GlobalCore DB, off-cluster) ---
    debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
    debezium.source.database.hostname={{ .Values.debezium.mysqlHost }}
    debezium.source.database.port=3306
    debezium.source.database.user=debezium
    debezium.source.database.password=debezium
    debezium.source.database.server.id=184099
    debezium.source.topic.prefix=claims-cdc
    debezium.source.database.include.list=globalcore
    debezium.source.table.include.list=globalcore.gc_claim,globalcore.gc_policy,globalcore.gc_policy_peril
    debezium.source.snapshot.mode=initial
    # file-based offset + schema history on the PVC (standalone Server, no Kafka)
    debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
    debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
    debezium.source.offset.flush.interval.ms=5000
    debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
    debezium.source.schema.history.internal.file.filename=/debezium/data/schema_history.dat
    # --- sink: NATS JetStream ---
    debezium.sink.type=nats-jetstream
    debezium.sink.nats-jetstream.url=nats://nats.messaging.svc:4222
    # value-only JSON (no schema envelope) keeps consumers simple; keys carry the PK
    debezium.format.value=json
    debezium.format.key=json
    debezium.transforms=unwrap
    debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
    debezium.transforms.unwrap.delete.handling.mode=rewrite
    quarkus.log.console.json=false
    quarkus.log.level=INFO
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claims-debezium-data
  labels:
    app.kubernetes.io/name: claims-debezium
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# Create the JetStream stream that captures the CDC subjects (the nats-jetstream sink publishes to
# claims-cdc.* but does NOT create the stream). Idempotent: `nats stream add` with --config, or update.
apiVersion: batch/v1
kind: Job
metadata:
  name: claims-cdc-stream-init
  labels:
    app.kubernetes.io/name: claims-debezium
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claims-debezium
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: stream-init
          image: natsio/nats-box:0.14.5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              S=nats://nats.messaging.svc:4222
              # idempotent: add if absent, else update the subjects
              nats -s "$S" stream add CLAIMS_CDC \
                --subjects 'claims-cdc.>' --storage file --replicas 1 \
                --retention limits --discard old --max-age 168h \
                --max-msgs=-1 --max-bytes=-1 --max-msg-size=-1 --dupe-window 2m \
                --no-allow-rollup --deny-delete --deny-purge 2>/dev/null \
              || nats -s "$S" stream update CLAIMS_CDC --subjects 'claims-cdc.>'
              echo "CLAIMS_CDC stream ready"; nats -s "$S" stream info CLAIMS_CDC || true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-debezium
  labels:
    app.kubernetes.io/name: claims-debezium
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO PVC (offsets/history) → never two writers
  selector:
    matchLabels:
      app.kubernetes.io/name: claims-debezium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claims-debezium
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 185               # the debezium/server (UBI) user
        fsGroup: 185                 # so the mounted PVC is writable
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: {{ .Values.debezium.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Debezium writes offsets/history + quarkus tmp
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /debezium/conf/application.properties, subPath: application.properties }
            - { name: data, mountPath: /debezium/data }
      volumes:
        - name: config
          configMap: { name: claims-debezium-config }
        - name: data
          persistentVolumeClaim: { claimName: claims-debezium-data }
{{- end }}
