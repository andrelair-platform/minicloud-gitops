{{- if .Values.debezium.enabled }}
# Slice C — Debezium Server (standalone) tails the legacy MySQL binlog → NATS JetStream.
# Runs ON the cluster (reaches the off-cluster legacy MySQL at 10.0.0.1:3306 via LAN egress, and
# NATS at nats.messaging.svc:4222 in-cluster). File-based offset + schema-history on a small PVC.
# CDC subject: claims-cdc.globalcore.<table> → captured by the JetStream stream created below.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-debezium-config
  labels:
    app.kubernetes.io/name: claims-debezium
data:
  application.properties: |
    # --- source: MySQL binlog (the legacy GlobalCore DB, off-cluster) ---
    debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
    debezium.source.database.hostname={{ .Values.debezium.mysqlHost }}
    debezium.source.database.port=3306
    debezium.source.database.user=debezium
    debezium.source.database.password=debezium
    # server.id + topic.prefix are PER-ENV so dev and prod each tail the shared legacy binlog
    # independently (distinct replica ids) and publish to distinct subjects/streams (no cross-env bleed).
    debezium.source.database.server.id={{ .Values.debezium.serverId }}
    debezium.source.topic.prefix={{ .Values.debezium.topicPrefix }}
    debezium.source.database.include.list=globalcore
    debezium.source.table.include.list=globalcore.gc_claim,globalcore.gc_policy,globalcore.gc_policy_peril
    debezium.source.snapshot.mode=initial
    # Do NOT publish DDL/schema-change events to the bus. Debezium emits those to the BARE topic
    # `claims-cdc` (topic.prefix, no table suffix), which the stream's `claims-cdc.>` filter does NOT
    # match (a wildcard `>` needs ≥1 token after the dot) → JetStream returns 503 No Responders and the
    # snapshot aborts. The read-model consumes row changes only; Debezium keeps its OWN schema history
    # on the PVC (schema.history.internal below) regardless of this flag.
    debezium.source.include.schema.changes=false
    # file-based offset + schema history on the PVC (standalone Server, no Kafka)
    debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
    debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
    debezium.source.offset.flush.interval.ms=5000
    debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
    debezium.source.schema.history.internal.file.filename=/debezium/data/schema_history.dat
    # --- sink: NATS JetStream ---
    debezium.sink.type=nats-jetstream
    debezium.sink.nats-jetstream.url=nats://nats.messaging.svc:4222
    # value-only JSON (no schema envelope) keeps consumers simple; keys carry the PK
    debezium.format.value=json
    debezium.format.key=json
    debezium.transforms=unwrap
    debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
    debezium.transforms.unwrap.delete.handling.mode=rewrite
    quarkus.log.console.json=false
    quarkus.log.level=INFO
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claims-debezium-data
  labels:
    app.kubernetes.io/name: claims-debezium
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# Create the JetStream stream that captures the CDC subjects (the nats-jetstream sink publishes to
# claims-cdc.* but does NOT create the stream). Idempotent (create-if-absent).
# Deliberately a PLAIN Job (no hook, no Replace=true) — both wedged the sync before:
#   - a PreSync HOOK that fails blocks the whole app's sync operation indefinitely (hook-finalizer);
#   - Replace=true makes ArgoCD `kubectl replace` the Job, which FAILS on an existing Job
#     ("spec.selector: Required value" — Jobs get an auto-generated selector) → the op retries forever
#     and blocks sibling resources (the ConfigMap) from applying.
# The Job body is STABLE, so a plain `apply` on the completed Job is a clean no-op each sync. If the
# body ever must change (immutable Job fields), delete the Job once by hand and let sync recreate it.
# A -1 sync-wave keeps it ahead of the Deployment; a completed Job is Healthy so it never stalls a wave.
apiVersion: batch/v1
kind: Job
metadata:
  name: claims-cdc-stream-init
  labels:
    app.kubernetes.io/name: claims-debezium
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claims-debezium
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: stream-init
          image: docker.io/natsio/nats-box:0.14.5   # fully-qualified: Gatekeeper denies a bare image name
          workingDir: /tmp                            # writable cwd (readOnly rootfs → nats CLI `stat .` fails otherwise)
          env:
            - { name: HOME, value: /tmp }             # nats CLI writes its context/config under $HOME
            - { name: XDG_CONFIG_HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              S=nats://nats.messaging.svc:4222
              ST={{ .Values.debezium.streamName }}
              SUBJ="{{ .Values.debezium.streamSubjects }}"
              # Idempotent: create the (per-env) stream if absent (--defaults + our subjects). --no-context
              # avoids touching a context file; HOME=/tmp (emptyDir) gives the CLI a writable home.
              if nats --no-context -s "$S" stream info "$ST" >/dev/null 2>&1; then
                echo "$ST already exists"
              else
                nats --no-context -s "$S" stream add "$ST" --subjects "$SUBJ" --defaults
              fi
              nats --no-context -s "$S" stream info "$ST"
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-debezium
  labels:
    app.kubernetes.io/name: claims-debezium
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO PVC (offsets/history) → never two writers
  selector:
    matchLabels:
      app.kubernetes.io/name: claims-debezium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claims-debezium
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 185               # the debezium/server (UBI) user
        fsGroup: 185                 # so the mounted PVC is writable
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: {{ .Values.debezium.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Debezium writes offsets/history + quarkus tmp
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /debezium/config/application.properties, subPath: application.properties }
            - { name: data, mountPath: /debezium/data }
      volumes:
        - name: config
          configMap: { name: claims-debezium-config }
        - name: data
          persistentVolumeClaim: { claimName: claims-debezium-data }
{{- end }}
