# dev — Harbor image, ns claims. Single replica. Slice B: the ACL now talks to the LIVE GlobalCore
# legacy (SOAP) instead of the in-memory stub.
#
# ATOMIC image+config: the `soap` profile activates SoapGlobalCoreAdapter, which only exists in the
# a578654+ image — so the tag and the SPRING_PROFILES_ACTIVE=soap env MUST change together (an older
# image under the soap profile would have no GlobalCorePort bean → fail to start). This is the one
# deliberate hand-set tag (coupled to a required env); Kargo converges on the same newest SHA.
# Tag QUOTED (a 7-hex all-decimal SHA parses as a YAML number → InvalidImageName).
minicloud-app-deployment:
  image:
    repository: harbor.10.0.0.200.nip.io/library/ktayl-claims
    tag: fcb5416
  workload:
    replicas: 1
  env:
    # Slice D: `readmodel` activates the CQRS query side (JpaClaimReadModel + CdcProjector). soap+readmodel.
    - { name: SPRING_PROFILES_ACTIVE, value: "soap,readmodel" } # SoapGlobalCoreAdapter (writes) + read-model
    - { name: GLOBALCORE_SOAP_URL, value: "http://10.0.0.1:8080/ws" }  # the off-cluster legacy (ADR-002)
    # Datasource composed from the CNPG `claims-postgres-app` secret via k8s dependent-env $(VAR) expansion
    # (the referenced vars are declared earlier in this list). No extra secret, fully declarative.
    - name: PGHOST
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: host } }
    - name: PGPORT
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: port } }
    - name: PGUSER
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: username } }
    - name: PGPASSWORD
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: password } }
    - name: PGDATABASE
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: dbname } }
    - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://$(PGHOST):$(PGPORT)/$(PGDATABASE)" }
    - { name: SPRING_DATASOURCE_USERNAME, value: "$(PGUSER)" }
    - { name: SPRING_DATASOURCE_PASSWORD, value: "$(PGPASSWORD)" }
    - { name: NATS_URL, value: "nats://nats.messaging.svc:4222" }   # CDC projector source
  ingress:
    host: claims.10.0.0.200.nip.io
tlsCert:
  dnsName: claims.10.0.0.200.nip.io
# Slice C — CDC on: Debezium tails the legacy MySQL binlog → NATS JetStream (subject claims-cdc.*).
debezium:
  enabled: true
# Slice D — CQRS read-model DB on. The CNPG cluster + netpols come up first; the app is flipped to the
# `readmodel` profile (+ datasource env) in a follow-up once the DB + the Slice-D image are live.
postgres:
  enabled: true
