# prod — ghcr SHA image, ns claims-prod. Wired to the ktayl-claims-prod ArgoCD app.
#
# Same simulated legacy as dev (GlobalCore is a single instance on the controller — an accepted,
# documented env boundary; there is no separate prod legacy). Isolation is at the CDC lane: prod runs
# its OWN Debezium (distinct server.id) → its OWN stream CLAIMS_CDC_PROD (subjects claims-cdc-prod.*) →
# its OWN CNPG read-model, so dev and prod read-models never cross-feed. The app is 2 replicas (safe:
# the CDC projector self-elects on the singleton durable — one binds, the rest stand by).
minicloud-app-deployment:
  image:
    repository: ghcr.io/andrelair-platform/ktayl-claims
    # Seeded to the current dev-VERIFIED freight for the initial prod bring-up (== what Kargo's prod
    # stage would promote). Kargo (git-Warehouse) owns all FUTURE prod bumps via the CODEOWNERS PR.
    tag: "b567ab0"
  # ghcr package is PUBLIC → k3s pulls anonymously; no imagePullSecret needed.
  workload:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  writableDirs:
    - { name: tmp, mountPath: /tmp }
  env:
    - { name: SPRING_PROFILES_ACTIVE, value: "soap,readmodel" }
    - { name: GLOBALCORE_SOAP_URL, value: "http://10.0.0.1:8080/ws" }   # the shared off-cluster legacy
    # Datasource from the prod CNPG (claims-postgres-app secret in claims-prod), via $(VAR) expansion.
    - name: PGHOST
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: host } }
    - name: PGPORT
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: port } }
    - name: PGUSER
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: username } }
    - name: PGPASSWORD
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: password } }
    - name: PGDATABASE
      valueFrom: { secretKeyRef: { name: claims-postgres-app, key: dbname } }
    - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://$(PGHOST):$(PGPORT)/$(PGDATABASE)" }
    - { name: SPRING_DATASOURCE_USERNAME, value: "$(PGUSER)" }
    - { name: SPRING_DATASOURCE_PASSWORD, value: "$(PGPASSWORD)" }
    - { name: NATS_URL, value: "nats://nats.messaging.svc:4222" }
    # prod CDC lane — MUST match the prod debezium block below.
    - { name: CDC_STREAM, value: "CLAIMS_CDC_PROD" }
    - { name: CDC_SUBJECT, value: "claims-cdc-prod.globalcore.gc_claim" }
    - { name: CDC_DURABLE, value: "claims-projector-prod" }
  ingress:
    host: claims-prod.10.0.0.200.nip.io
# Frontend (Angular workbench) — ghcr image, 2 replicas, prod host. Kargo pins the tag (prod stage).
frontend:
  image:
    repository: ghcr.io/andrelair-platform/ktayl-claims-frontend
    tag: "5243b5c"   # seeded; Kargo (git-Warehouse prod stage) owns future bumps via the CODEOWNERS PR
  workload:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Two hosts on ONE ingress, both behind Authentik forward-auth (embedded outpost, provider
  # `claims-workbench`, forward_single, external_host https://claims.devandre.sbs):
  #   - claims.devandre.sbs                → the PUBLIC prod domain (Cloudflare tunnel → 10.0.0.200)
  #   - claims-app-prod.10.0.0.200.nip.io  → the Tailscale-internal host (kept as fallback)
  # The SSO gate covers the SPA AND its /api BFF path, so the ACL API is never reachable
  # un-authenticated from either host. Pattern copied verbatim from manifests/n8n/05-ingress.yaml.
  ingress:
    hosts:
      - claims-app-prod.10.0.0.200.nip.io
      - claims.devandre.sbs
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page       401 = @goauthentik_proxy_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie $auth_cookie;
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_groups   $upstream_http_x_authentik_groups;
        auth_request_set $authentik_email    $upstream_http_x_authentik_email;
        proxy_set_header X-authentik-username $authentik_username;
        proxy_set_header X-authentik-groups   $authentik_groups;
        proxy_set_header X-authentik-email    $authentik_email;
      nginx.ingress.kubernetes.io/server-snippet: |
        location /outpost.goauthentik.io {
            proxy_pass              http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io;
            proxy_set_header        Host $host;
            proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
            add_header              Set-Cookie $auth_cookie;
            auth_request_set        $auth_cookie $upstream_http_set_cookie;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
        }
        location @goauthentik_proxy_signin {
            internal;
            add_header Set-Cookie $auth_cookie;
            return 302 /outpost.goauthentik.io/start?rd=$request_uri;
        }
tlsCert:
  dnsName: claims-prod.10.0.0.200.nip.io
frontendTlsCert:
  dnsNames:
    - claims-app-prod.10.0.0.200.nip.io
    - claims.devandre.sbs
# prod read-model DB (derived/rebuildable projection → single instance is fine).
postgres:
  enabled: true
  instances: 1
  storageSize: 1Gi
  backup:
    bucket: cnpg-claims-prod
# prod CDC lane — distinct replica id + stream so it never collides with dev's.
debezium:
  enabled: true
  serverId: "184100"
  topicPrefix: claims-cdc-prod
  streamName: CLAIMS_CDC_PROD
  streamSubjects: "claims-cdc-prod.>"
