apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: ktayl-iam-kargo
spec:
  # Prod promotes ONLY Freight already verified in dev (sources.stages:[dev]) — the multi-stage gate.
  # Pins BOTH image.tags in values-prod.yaml (repository is already ghcr there). The prod PR is NOT
  # automerge-labelled → it lands on the CODEOWNERS gate.
  requestedFreight:
    - origin:
        kind: Warehouse
        name: ktayl-iam
      sources:
        stages: [dev]
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-images
          config:
            path: ./repo/services/ktayl-iam/helm/values-prod.yaml
            updates:
              - key: backend.image.tag
                value: '${{ quote(commitFrom("https://github.com/andrelair-platform/ktayl-iam.git").ID[0:7]) }}'
              - key: frontend.image.tag
                value: '${{ quote(commitFrom("https://github.com/andrelair-platform/ktayl-iam.git").ID[0:7]) }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(ktayl-iam): promote ${{ commitFrom("https://github.com/andrelair-platform/ktayl-iam.git").ID[0:7] }} to PROD'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(ktayl-iam): promote ${{ commitFrom("https://github.com/andrelair-platform/ktayl-iam.git").ID[0:7] }} to PROD'
            labels: [kargo, env-prod]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
