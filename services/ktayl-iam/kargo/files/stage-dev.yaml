apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: ktayl-iam-kargo
spec:
  # One dev Stage for the whole monorepo: promotes the Freight (= a commit) by pinning BOTH image.tags
  # in values-dev.yaml to the commit's short SHA. dev auto-promotes (ProjectConfig) + is verified; a
  # Freight is verifiedIn:dev only if the smoke passes → the prod Stage accepts only verified Freight.
  requestedFreight:
    - origin:
        kind: Warehouse
        name: ktayl-iam
      sources:
        direct: true
  verification:
    analysisTemplates:
      - name: ktayl-iam-dev-verify
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-images
          config:
            path: ./repo/services/ktayl-iam/helm/values-dev.yaml
            updates:
              - key: backend.image.tag
                value: '${{ quote(commitFrom("https://github.com/andrelair-platform/ktayl-iam.git").ID[0:7]) }}'
              - key: frontend.image.tag
                value: '${{ quote(commitFrom("https://github.com/andrelair-platform/ktayl-iam.git").ID[0:7]) }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(ktayl-iam): promote ${{ commitFrom("https://github.com/andrelair-platform/ktayl-iam.git").ID[0:7] }} to dev'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(ktayl-iam): promote ${{ commitFrom("https://github.com/andrelair-platform/ktayl-iam.git").ID[0:7] }} to dev'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
