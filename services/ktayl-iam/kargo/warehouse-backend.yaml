apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: ktayl-iam-backend
  namespace: ktayl-iam-kargo
spec:
  interval: 5m
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/andrelair-platform/ktayl-iam-backend
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes: [ '^[0-9a-f]{7,40}$' ]
        discoveryLimit: 5
