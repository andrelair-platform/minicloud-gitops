# ktayl-iam — PROD overlay (ns ktayl-iam-prod). Images from ghcr (immutable SHA). Kargo bumps tags.
backend:
  image:
    repository: ghcr.io/andrelair-platform/ktayl-iam-backend
    tag: 9fd06f1
  # prod pulls the Internal ghcr package → needs the shared ghcr-pull secret
  imagePullSecrets: [{ name: ghcr-pull }]
  env:
    - { name: PORT, value: "3000" }
    - { name: NODE_ENV, value: "production" }
    - { name: FRONTEND_URL, value: "https://iam.10.0.0.200.nip.io" }
    - { name: DATABASE_HOST, value: "ktayl-iam-postgres" }
    - { name: DATABASE_PORT, value: "5432" }
    - { name: DATABASE_USER, value: "ktayl_iam" }
    - { name: DATABASE_NAME, value: "ktayl_iam" }
    - { name: AUTHENTIK_ISSUER, value: "https://auth.devandre.sbs/application/o/ktayl-iam/" }
    - { name: AUTHENTIK_AUTH_URL, value: "https://auth.devandre.sbs/application/o/authorize/" }
    - { name: AUTHENTIK_TOKEN_URL, value: "https://auth.devandre.sbs/application/o/token/" }
    - { name: AUTHENTIK_USERINFO_URL, value: "https://auth.devandre.sbs/application/o/userinfo/" }
    - { name: AUTHENTIK_CALLBACK_URL, value: "https://iam.10.0.0.200.nip.io/api/auth/callback" }
    - { name: AUTHENTIK_SCOPE, value: "profile email groups" }
    - { name: ADMIN_GROUP, value: "Platform Admins" }
    # S015/S016/S017 — HR J/M/L lifecycle (Joiner provisioning + Leaver revocation). INERT until
    # HR_NATS_URL is set (the consumer no-ops on a blank URL), so staging these changes nothing now.
    # GO-LIVE = uncomment HR_NATS_URL below AND remove it from values-dev.yaml in the SAME change, so
    # exactly ONE environment owns the single HR_LIFECYCLE durable (two same-durable consumers would
    # split/compete the events). See the PR go-live runbook.
    - { name: HR_LIFECYCLE_STREAM, value: "HR_LIFECYCLE" }
    - { name: WORKPLACE_GROUP, value: "Workplace Users" }
    - { name: STALWART_JMAP_URL, value: "http://stalwart.mail.svc:8080/jmap" }
    - { name: STALWART_ADMIN_USER, value: "admin" }
    - { name: MAIL_DOMAIN, value: "devandre.sbs" }
    # GO-LIVE SWITCH — uncomment to make PROD the authoritative HR consumer (+ remove from dev):
    # - { name: HR_NATS_URL, value: "nats://nats.messaging.svc:4222" }
    # HR_LIFECYCLE_SIGNING_KEY + STALWART_ADMIN_SECRET arrive via ktayl-iam-secret (shared ESO template).
  envFrom:
    - secretRef: { name: ktayl-iam-secret }

frontend:
  image:
    repository: ghcr.io/andrelair-platform/ktayl-iam-frontend
    tag: 9fd06f1
  imagePullSecrets: [{ name: ghcr-pull }]

postgres:
  enabled: true
  requestMemory: 256Mi
  limitMemory: 512Mi
  storage: 5Gi
appSecret:
  enabled: true
secretsVaultPath: platform/ktayl-iam-prod
ingress:
  host: iam.10.0.0.200.nip.io

ghcrPull:
  enabled: true
