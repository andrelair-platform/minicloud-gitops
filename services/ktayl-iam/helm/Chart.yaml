apiVersion: v2
name: ktayl-iam
description: >-
  ktayl-iam Access Governance Platform wrapper chart (GAP golden path). Dual-workload: the
  minicloud-app-deployment library chart is used TWICE via aliased dependencies (backend + frontend).
  The dedicated Postgres, the app ExternalSecret (DB + Authentik client secret + API token), the
  path-routing Ingress (/api → backend, / → frontend), Certificate and NetworkPolicy live in this
  chart's own templates/. One Helm render, one ArgoCD source.
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: minicloud-app-deployment
    alias: backend
    version: 0.4.0
    repository: oci://ghcr.io/andrelair-platform
  - name: minicloud-app-deployment
    alias: frontend
    version: 0.4.0
    repository: oci://ghcr.io/andrelair-platform
