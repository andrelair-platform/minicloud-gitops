# The app secret (envFrom on the backend): the SECRET config only — DB password, session secret,
# and the Authentik client id/secret + the least-privilege Authentik API token (for the sync engine,
# S005). Non-secret config (hosts, DB user/name, OIDC URLs) is literal env in values-{dev,prod}.yaml.
# Populate the Vault path first: {{ .Values.secretsVaultPath }}.
{{- if .Values.appSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-iam-secret
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: ktayl-iam-secret, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: postgres-password }
    - secretKey: SESSION_SECRET
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: session-secret }
    - secretKey: AUTHENTIK_CLIENT_ID
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: authentik-client-id }
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: authentik-client-secret }
    - secretKey: AUTHENTIK_API_TOKEN
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: authentik-api-token }
    # S016 — the SEPARATE elevated token (scoped to reset_user_password only) the Joiner uses to set a
    # new employee's initial Authentik password; isolated from the least-privilege sync token above (T4).
    - secretKey: AUTHENTIK_CREDENTIAL_TOKEN
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: authentik-credential-token }
    # S016 — shared DEFAULT initial password for new employees (used for BOTH the Authentik login and
    # the Stalwart mailbox). One credential; employees rotate it later.
    - secretKey: DEFAULT_MAILBOX_PASSWORD
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: default-mailbox-password }
    # S003 — ERPNext HR (manager source of truth) service creds (read-only HR User)
    - secretKey: ERPNEXT_API_KEY
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: erpnext-api-key }
    - secretKey: ERPNEXT_API_SECRET
      remoteRef: { key: {{ .Values.secretsVaultPath }}, property: erpnext-api-secret }
    # S015/S016 — HR Joiner lifecycle: the shared HMAC signing key (same value the ERPNext producer
    # signs events with) + the Stalwart admin secret for mailbox provisioning. Sourced from their OWN
    # Vault paths (single source of truth), not platform/ktayl-iam.
    - secretKey: HR_LIFECYCLE_SIGNING_KEY
      remoteRef: { key: platform/hr-lifecycle, property: signing-key }
    - secretKey: STALWART_ADMIN_SECRET
      remoteRef: { key: platform/mail, property: stalwart-admin-secret }
{{- end }}
