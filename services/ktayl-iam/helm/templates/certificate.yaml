# TLS Certificate (single-owner, both envs). Name kept = ktayl-iam-tls; dnsName per env.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ktayl-iam-tls
  labels:
    app: ktayl-iam
spec:
  secretName: {{ .Values.ingress.tlsSecretName }}
  issuerRef:
    name: minicloud-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.ingress.host | quote }}
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
