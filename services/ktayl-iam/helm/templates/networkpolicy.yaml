# Ingress restriction: reach the app only via ingress-nginx; allow same-namespace (backend↔postgres).
# NOTE (SEC-5, prod security-gate follow-up): tighten EGRESS to default-deny + explicit allows
# (DNS · Authentik · Postgres · ERPNext) once the OIDC/API egress paths are confirmed. Left open
# here so the first deploy + OIDC handshake (to auth.devandre.sbs) isn't blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ktayl-iam-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ktayl-iam-allow-same-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ktayl-iam-allow-ingress-nginx
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
