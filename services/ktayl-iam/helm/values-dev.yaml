# ktayl-iam — DEV overlay (ns ktayl-iam). Kargo updates backend/frontend .image.tag.
backend:
  image:
    tag: 9fd06f1
  env:
    - { name: PORT, value: "3000" }
    - { name: NODE_ENV, value: "production" }
    - { name: FRONTEND_URL, value: "https://iam-dev.10.0.0.200.nip.io" }
    - { name: DATABASE_HOST, value: "ktayl-iam-postgres" }
    - { name: DATABASE_PORT, value: "5432" }
    - { name: DATABASE_USER, value: "ktayl_iam" }
    - { name: DATABASE_NAME, value: "ktayl_iam" }
    - { name: AUTHENTIK_ISSUER, value: "https://auth.devandre.sbs/application/o/ktayl-iam-dev/" }
    - { name: AUTHENTIK_AUTH_URL, value: "https://auth.devandre.sbs/application/o/authorize/" }
    - { name: AUTHENTIK_TOKEN_URL, value: "https://auth.devandre.sbs/application/o/token/" }
    - { name: AUTHENTIK_USERINFO_URL, value: "https://auth.devandre.sbs/application/o/userinfo/" }
    - { name: AUTHENTIK_CALLBACK_URL, value: "https://iam-dev.10.0.0.200.nip.io/api/auth/callback" }
    - { name: AUTHENTIK_SCOPE, value: "profile email groups" }
    - { name: ADMIN_GROUP, value: "Platform Admins" }
    # S003 directory + manager resolution
    - { name: AUTHENTIK_API_URL, value: "https://auth.devandre.sbs/api/v3" }
    - { name: FALLBACK_APPROVER, value: "100001" }
    - { name: ERPNEXT_URL, value: "https://erp.devandre.sbs" }
    # ERPNEXT_API_KEY/SECRET come from the ktayl-iam-secret (Vault) → live manager lookup (AC-2).
    # S004/S005/S007 workflow + sync (dev):
    # - ALLOW_APPROVER_OVERRIDE lets the single admin console demo four-eyes (both legs); the server
    #   still rejects self-approval + any non-assigned approver. Prod leaves it false (real sessions).
    - { name: ALLOW_APPROVER_OVERRIDE, value: "true" }
    # - the governance groups the platform EXCLUSIVELY owns → reconcile may remove hand-adds there;
    #   every other group is add-only + alert (so it can never nuke e.g. Platform Admins).
    - { name: RECONCILE_EXCLUSIVE_GROUPS, value: "ktayl-engineering,ktayl-observability-admin,ktayl-observability-viewer,ktayl-argocd-admin,ktayl-argocd-readonly" }
    # S015/S016 — HR Joiner lifecycle (DEV only; prod leaves HR_NATS_URL blank so a single durable
    # consumer processes events — two same-durable consumers across envs would split/compete).
    - { name: HR_NATS_URL, value: "nats://nats.messaging.svc:4222" }
    - { name: HR_LIFECYCLE_STREAM, value: "HR_LIFECYCLE" }
    - { name: WORKPLACE_GROUP, value: "Workplace Users" }
    - { name: STALWART_JMAP_URL, value: "http://stalwart.mail.svc:8080/jmap" }
    - { name: STALWART_ADMIN_USER, value: "admin" }
    - { name: MAIL_DOMAIN, value: "devandre.sbs" }
    # HR_LIFECYCLE_SIGNING_KEY + STALWART_ADMIN_SECRET come from ktayl-iam-secret (Vault, envFrom below)
  # secrets (DATABASE_PASSWORD · SESSION_SECRET · AUTHENTIK_CLIENT_ID/SECRET · AUTHENTIK_API_TOKEN
  #          · HR_LIFECYCLE_SIGNING_KEY · STALWART_ADMIN_SECRET)
  envFrom:
    - secretRef: { name: ktayl-iam-secret }

frontend:
  image:
    tag: 9fd06f1

postgres:
  enabled: true
appSecret:
  enabled: true
secretsVaultPath: platform/ktayl-iam
ingress:
  host: iam-dev.10.0.0.200.nip.io
