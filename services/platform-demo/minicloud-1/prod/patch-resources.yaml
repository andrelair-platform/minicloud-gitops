  # replicas removed — the KEDA HTTP add-on (HTTPScaledObject platform-demo) owns it,
  # scaling 0->1 on request via the interceptor and back to 0 after scaledownPeriod.
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
