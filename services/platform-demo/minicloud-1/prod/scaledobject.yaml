apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: platform-demo-cron-scaler
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: platform-demo
  # Demo/reference service — scale to zero when idle. KEDA owns replicas; the
  # platform-demo (prod) ArgoCD app already ignoreDifferences .spec.replicas.
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 60
  triggers:
    - type: cron
      metadata:
        timezone: Europe/Paris
        start: "0 8 * * 1-5"
        end: "0 19 * * 1-5"
        desiredReplicas: "2"
