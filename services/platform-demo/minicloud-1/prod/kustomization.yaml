apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-demo-prod
resources:
- ../../base
- ingress.yaml
- certificate.yaml
- configmap.yaml
- httpscaledobject.yaml
- interceptor-service.yaml
# Prod pulls from ghcr.io (public, free, off the controller disk) — hybrid registry:
# dev uses Harbor; prod uses ghcr. Promote by bumping newTag to an immutable
# SHA via a CODEOWNERS-gated PR; ArgoCD then auto-syncs (git-gated automated prod).
images:
- name: harbor.10.0.0.200.nip.io/library/platform-demo   # matches base image name
  newName: ghcr.io/andrelair-platform/platform-demo
  newTag: "3d81dfb"
patches:
- path: patch-resources.yaml
  target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
    name: platform-demo
