apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: http-regression-gate
spec:
  metrics:
    # Gate 1: success rate ≥ 95% over a 2m window.
    # `or vector(1)` returns 1.0 (100%) when KEDA has scaled to 0 replicas and
    # there is no traffic data yet — the readinessProbe already validated the pod.
    # initialDelay: 60s gives the canary-load CI job time to generate real traffic
    # before the first check fires. With k6 starting ~30s into the rollout and
    # the 30s pause step, this guarantees ≥2 Prometheus recording intervals of
    # real data are available when the first metric check executes.
    - name: success-rate
      count: 5
      interval: 30s
      initialDelay: 60s
      successCondition: result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: http://kps-prometheus.monitoring.svc:9090
          query: |
            (
              sum(rate(http_requests_total{service="platform-demo",code!~"5.."}[2m]))
              /
              sum(rate(http_requests_total{service="platform-demo"}[2m]))
            ) or vector(1)

    # Gate 2: p95 latency ≤ 500ms.
    # `or vector(0)` returns 0s when no traffic — satisfies the ≤ 0.5 threshold.
    - name: p95-latency
      count: 5
      interval: 30s
      initialDelay: 60s
      successCondition: result[0] <= 0.5
      failureLimit: 3
      provider:
        prometheus:
          address: http://kps-prometheus.monitoring.svc:9090
          query: |
            histogram_quantile(
              0.95,
              job:http_request_duration_seconds_bucket:rate5m{service="platform-demo"}
            ) or vector(0)
