apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: platform-demo-cron-scaler
spec:
  scaleTargetRef:
    # platform-demo was converted from Deployment → Rollout (Phase 73).
    # KEDA must target the Rollout kind directly — targeting apps/v1 Deployment
    # causes "scaleTargetRef not found" and silently disables scale-to-zero.
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: platform-demo
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 60
  triggers:
    - type: cron
      metadata:
        timezone: Europe/Paris
        start: "0 8 * * 1-5"
        end: "0 19 * * 1-5"
        desiredReplicas: "1"
