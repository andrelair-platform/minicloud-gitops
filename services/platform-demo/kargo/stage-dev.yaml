apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: platform-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: platform-demo
      sources:
        direct: true
  # After promoting to dev, run the smoke AnalysisRun. Only if it passes is the Freight
  # marked "Verified in dev" — the precondition the prod Stage requires (sources.stages:
  # [dev]). This is the dev→prod gate, now owned by Kargo (Option 2), not the CI.
  verification:
    analysisTemplates:
      - name: platform-demo-dev-verify
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: set-image
          config:
            path: ./repo/services/platform-demo/minicloud-1/dev
            images:
              - image: harbor.10.0.0.200.nip.io/library/platform-demo
                tag: '${{ imageFrom("ghcr.io/andrelair-platform/platform-demo").Tag }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(platform-demo): promote image ${{ imageFrom("ghcr.io/andrelair-platform/platform-demo").Tag }} to dev'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(platform-demo): promote to dev — ${{ imageFrom("ghcr.io/andrelair-platform/platform-demo").Tag }}'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
