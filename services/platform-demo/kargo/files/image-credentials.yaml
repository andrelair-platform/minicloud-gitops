apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kargo-image-credentials
  namespace: platform-demo
spec:
  # The Warehouse needs to LIST tags on ghcr — anonymous listing is unauthorized
  # even for the demo package, so give Kargo the org read:packages token.
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-image-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        repoURL: ghcr.io/andrelair-platform/platform-demo
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef: { key: platform/ghcr, property: username }
    - secretKey: token
      remoteRef: { key: platform/ghcr, property: token }
