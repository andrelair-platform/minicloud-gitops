apiVersion: v2
name: kargo-platform-demo
description: >-
  Kargo promotion pipeline for platform-demo (Project + Warehouse + dev/prod Stages +
  credentials + dev-verify AnalysisTemplate + ProjectConfig). The raw Kargo CRs live under
  files/ and are emitted verbatim by templates/manifests.yaml via .Files.Get, which does NOT
  run them through the Helm engine — so Kargo/ESO ${{ }} + {{ }} expressions pass through
  untouched (no escaping). This is a pure packaging shim that replaces the former kustomize
  resources: list, giving one ArgoCD Helm source and zero kustomization.yaml.
type: application
version: 0.1.0
