# dev — Harbor image, ns platform-demo-dev.
minicloud-app-deployment:
  image:
    repository: ghcr.io/andrelair-platform/platform-demo
    tag: 247d821
  imagePullSecrets: [{name: ghcr-pull}]   # Internal ghcr pkg (Harbor retirement)
  scaledObject:
    http:
      hosts:
        - platform-demo-dev.10.0.0.200.nip.io
        - dev.demo.devandre.sbs
  ingress:
    hosts:
      - platform-demo-dev.10.0.0.200.nip.io
      - dev.demo.devandre.sbs
    tls:
      secretName: platform-demo-dev-tls
tlsCert:
  name: platform-demo-dev-tls
  secretName: platform-demo-dev-tls
  dnsName: platform-demo-dev.10.0.0.200.nip.io
appConfig:
  APP_ENV: development
  LOG_LEVEL: debug
createGhcrPullSecret: true   # renders the dev-only ghcr-pull ES (Vault platform/ghcr)
