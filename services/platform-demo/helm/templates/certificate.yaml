# TLS Certificate as a wrapper template with the ORIGINAL per-env object name (prod: platform-demo-tls,
# dev: platform-demo-dev-tls) so it ADOPTS the existing secret in place — the library cert (object
# named <fullname>=platform-demo) conflicts with the secret's cert-manager owner annotation
# (IncorrectCertificate). name/secret/dnsName come from wrapper-local values (per env).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tlsCert.name }}
  labels:
    app: platform-demo
spec:
  secretName: {{ .Values.tlsCert.secretName }}
  issuerRef:
    name: minicloud-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.tlsCert.dnsName | quote }}
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
