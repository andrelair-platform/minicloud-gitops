# SSO Ingress (authentik forward-auth). Backend is the keda-http-interceptor ExternalName Service
# that the library subchart renders (KEDA HTTP add-on) — the interceptor holds the request, scales
# the Rollout 0->1, and forwards to the app Service. Hosts/tlsSecret are set per env in values.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-demo
  labels:
    app: platform-demo
  annotations:
{{ toYaml .Values.ssoIngress.annotations | indent 4 }}
spec:
  ingressClassName: {{ .Values.ssoIngress.className }}
  tls:
    - hosts:
{{- range .Values.ssoIngress.hosts }}
        - {{ . | quote }}
{{- end }}
      secretName: {{ .Values.ssoIngress.tlsSecret }}
  rules:
{{- range .Values.ssoIngress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keda-http-interceptor
                port:
                  number: 8080
{{- end }}
