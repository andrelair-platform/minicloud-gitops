# prod overlay — ghcr SHA image, 2 replicas, public ingress+TLS, PDB
image:
  repository: ghcr.io/andrelair-platform/platform-demo
  tag: "0000000"           # Kargo bumps this to the promoted SHA
workload:
  replicas: 2
ingress:
  enabled: true
  className: nginx
  host: demo.devandre.sbs
  servicePort: 8080
  tls:
    enabled: true
certificate:
  enabled: true
  dnsNames: [demo.devandre.sbs]
podDisruptionBudget:
  enabled: true
  minAvailable: 1
