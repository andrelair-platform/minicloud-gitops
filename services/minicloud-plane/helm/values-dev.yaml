# dev — Harbor image, ns minicloud-plane-dev. A cron KEDA ScaledObject scales the blueGreen Rollout
# 0->1 during working hours (min 0 / max 1). KEDA owns replicas → the dev Application
# ignoreDifferences the Rollout .spec.replicas.
#
# NO promotion-analysis gates on dev (both nulled below). The blue/green pre-/post-promotion
# AnalysisRuns probe the preview/active Service, but KEDA scales the Rollout to ZERO outside
# working hours (and while idle) → no pod to probe → the AnalysisRun fails ("no route to host")
# → the Rollout aborts → Degraded. The gate is incompatible with scale-to-zero and adds no value
# in dev, so dev keeps blueGreen + autoPromotion but runs no analysis. PROD KEEPS BOTH GATES
# (always-on, 2 replicas) — see values-prod.yaml.
minicloud-app-deployment:
  image:
    repository: harbor.10.0.0.200.nip.io/library/minicloud-plane
    tag: bdffa92
  workload:
    replicas: 1
    rollout:
      blueGreen:
        prePromotionAnalysis: null
        postPromotionAnalysis: null
  scaledObject:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 1
    triggers:
      - type: cron
        metadata:
          timezone: Europe/Paris
          start: "0 8 * * 1-5"
          end: "0 19 * * 1-5"
          desiredReplicas: "1"
