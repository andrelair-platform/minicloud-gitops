# minicloud-plane wrapper chart — common values.
# (1) `minicloud-app-deployment:` configures the library subchart (blueGreen Rollout workload);
# (2) top-level keys drive THIS chart's templates/ (AnalysisTemplates + app ES are always on;
#     the SSO Ingress / cert / ghcr-pull ES are prod-only gates).
minicloud-app-deployment:
  nameOverride: minicloud-plane
  serviceAccount:
    create: true
    name: minicloud-plane
    automountServiceAccountToken: false
  # Live Rollout selects {app: minicloud-plane} (immutable) → match for in-place flip; label also
  # lands on the pod (ServiceMonitor/PDB/netpol match).
  selectorLabels:
    app: minicloud-plane
  image:
    repository: harbor.10.0.0.200.nip.io/library/minicloud-plane
  workload:
    kind: Rollout
    rollout:
      strategy: blueGreen
      blueGreen:
        previewService: true
        autoPromotionEnabled: true
        autoPromotionSeconds: 30
        scaleDownDelaySeconds: 30
        # templates are shared; the preview-url arg differs per namespace (set in values-{dev,prod}).
        prePromotionAnalysis:
          templates:
            - templateName: preview-health-gate
        postPromotionAnalysis:
          templates:
            - templateName: http-regression-gate
  ports:
    - { name: http, containerPort: 8080, protocol: TCP }
  service:
    ports:
      - { name: http, port: 8080, targetPort: http }
  env:
    - { name: NATS_URL, value: "nats://nats.messaging.svc.cluster.local:4222" }
    - { name: PORT, value: "8080" }
  envFrom:
    - secretRef: { name: minicloud-plane-secrets }
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  writableDirs:
    - { name: tmp, mountPath: /tmp }
  readinessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 10
    periodSeconds: 30
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels: { app: minicloud-plane }
            topologyKey: kubernetes.io/hostname
  serviceMonitor:
    enabled: true
    path: /metrics
    port: http
    interval: 30s
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Library multi-host Ingress (0.3.0+): SSO forward-auth + dual host, all values (prod-only —
  # enabled in values-prod). Backend defaults to the app Service. Annotations live here (rendered
  # only when enabled); hosts + tls.secretName are set in values-prod.
  ingress:
    enabled: false
    className: nginx
    servicePort: 8080
    tls:
      enabled: false
    annotations:
      nginx.ingress.kubernetes.io/server-snippet: |
        location /outpost.goauthentik.io {
            proxy_pass              http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io;
            proxy_set_header        Host $host;
            proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
            add_header              Set-Cookie $auth_cookie;
            auth_request_set        $auth_cookie $upstream_http_set_cookie;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
        }
        location @goauthentik_proxy_signin {
            internal;
            add_header Set-Cookie $auth_cookie;
            return 302 /outpost.goauthentik.io/start?rd=$request_uri;
        }
      nginx.ingress.kubernetes.io/configuration-snippet: |
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page       401 = @goauthentik_proxy_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie $auth_cookie;
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_groups   $upstream_http_x_authentik_groups;
        auth_request_set $authentik_email    $upstream_http_x_authentik_email;
        proxy_set_header X-authentik-username $authentik_username;
        proxy_set_header X-authentik-groups   $authentik_groups;
        proxy_set_header X-authentik-email    $authentik_email;
  certificate:
    enabled: false   # prod cert is a wrapper template (name kept for in-place)

# ---- wrapper-local (drives templates/) ----
tls:
  enabled: false     # prod: true (minicloud-plane-tls Certificate — wrapper template)
ghcrPull:
  enabled: false     # prod: true (ghcr-pull imagePullSecret ES — wrapper template)
