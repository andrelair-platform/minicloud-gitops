# minicloud-plane wrapper chart — common values.
# (1) `minicloud-app-deployment:` configures the library subchart (blueGreen Rollout workload);
# (2) top-level keys drive THIS chart's templates/ (AnalysisTemplates + app ES are always on;
#     the SSO Ingress / cert / ghcr-pull ES are prod-only gates).
minicloud-app-deployment:
  nameOverride: minicloud-plane
  serviceAccount:
    create: true
    name: minicloud-plane
    automountServiceAccountToken: false
  # Live Rollout selects {app: minicloud-plane} (immutable) → match for in-place flip; label also
  # lands on the pod (ServiceMonitor/PDB/netpol match).
  selectorLabels:
    app: minicloud-plane
  image:
    repository: harbor.10.0.0.200.nip.io/library/minicloud-plane
  workload:
    kind: Rollout
    rollout:
      strategy: blueGreen
      blueGreen:
        previewService: true
        autoPromotionEnabled: true
        autoPromotionSeconds: 30
        scaleDownDelaySeconds: 30
        # templates are shared; the preview-url arg differs per namespace (set in values-{dev,prod}).
        prePromotionAnalysis:
          templates:
            - templateName: preview-health-gate
        postPromotionAnalysis:
          templates:
            - templateName: http-regression-gate
  ports:
    - { name: http, containerPort: 8080, protocol: TCP }
  service:
    ports:
      - { name: http, port: 8080, targetPort: http }
  env:
    - { name: NATS_URL, value: "nats://nats.messaging.svc.cluster.local:4222" }
    - { name: PORT, value: "8080" }
  envFrom:
    - secretRef: { name: minicloud-plane-secrets }
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  writableDirs:
    - { name: tmp, mountPath: /tmp }
  readinessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 10
    periodSeconds: 30
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels: { app: minicloud-plane }
            topologyKey: kubernetes.io/hostname
  serviceMonitor:
    enabled: true
    path: /metrics
    port: http
    interval: 30s
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    enabled: false   # SSO Ingress (dual host) is a wrapper template (prod-only)
  certificate:
    enabled: false   # prod cert is a wrapper template (name kept for in-place)

# ---- wrapper-local (drives templates/) ----
ssoIngress:
  enabled: false     # prod: true
tls:
  enabled: false     # prod: true (minicloud-plane-tls Certificate)
ghcrPull:
  enabled: false     # prod: true (ghcr-pull imagePullSecret ES)
