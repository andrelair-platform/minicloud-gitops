# prod — ghcr SHA image, 2 static replicas (no autoscaler; Git owns replicas), ns
# minicloud-plane-prod. Enables the wrapper prod extras: SSO Ingress + cert + ghcr-pull ES.
minicloud-app-deployment:
  image:
    repository: ghcr.io/andrelair-platform/minicloud-plane
    tag: "ff347ee"      # Kargo bumps to promoted SHA
  imagePullSecrets: [{name: ghcr-pull}]
  workload:
    replicas: 2
    rollout:
      blueGreen:
        prePromotionAnalysis:
          args:
            - name: preview-url
              value: http://minicloud-plane-preview.minicloud-plane-prod.svc.cluster.local:8080/health
  ingress:
    enabled: true
    hosts:
      - minicloud-plane.10.0.0.200.nip.io
      - plane-integration.devandre.sbs
    tls:
      enabled: true
      secretName: minicloud-plane-tls
tls:
  enabled: true        # minicloud-plane-tls Certificate (wrapper template)
ghcrPull:
  enabled: true        # ghcr-pull imagePullSecret ES (wrapper template)
