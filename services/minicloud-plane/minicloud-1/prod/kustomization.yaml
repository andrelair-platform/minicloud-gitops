apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minicloud-plane-prod
resources:
- ../../base
- ingress.yaml
- certificate.yaml
images:
- name: harbor.10.0.0.200.nip.io/library/minicloud-plane
  newTag: bc1293a
patches:
- path: patch-replicas.yaml
  target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
    name: minicloud-plane
# Point the pre-promotion health gate at the prod namespace's preview service FQDN
# (base defaults to the dev namespace).
- target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
    name: minicloud-plane
  patch: |-
    - op: replace
      path: /spec/strategy/blueGreen/prePromotionAnalysis/args/0/value
      value: http://minicloud-plane-preview.minicloud-plane-prod.svc.cluster.local:8080/health
