apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minicloud-plane-prod
resources:
- ../../base
- ingress.yaml
- certificate.yaml
- externalsecret-ghcr.yaml
# Prod pulls from ghcr.io (Internal, off the controller disk) via the ghcr-pull
# imagePullSecret (ESO-rendered from Vault secret/platform/ghcr). dev stays on Harbor.
images:
- name: harbor.10.0.0.200.nip.io/library/minicloud-plane
  newName: ghcr.io/andrelair-platform/minicloud-plane
  newTag: ff347ee
patches:
- path: patch-replicas.yaml
  target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
    name: minicloud-plane
- path: patch-ghcr-pull.yaml
  target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
    name: minicloud-plane
# Point the pre-promotion health gate at the prod namespace's preview service FQDN
# (base defaults to the dev namespace).
- target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
    name: minicloud-plane
  patch: |-
    - op: replace
      path: /spec/strategy/blueGreen/prePromotionAnalysis/args/0/value
      value: http://minicloud-plane-preview.minicloud-plane-prod.svc.cluster.local:8080/health
