apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: minicloud-plane
  namespace: minicloud-plane
spec:
  interval: 5m
  freightCreationPolicy: Automatic
  subscriptions:
    - image:
        repoURL: ghcr.io/andrelair-platform/minicloud-plane
        imageSelectionStrategy: NewestBuild
        allowTags: ^[0-9a-f]{7,40}$
        discoveryLimit: 5
