apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: minicloud-plane
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: minicloud-plane
      sources:
        direct: true
  # After promoting to dev, run the scale-aware smoke AnalysisRun (Variant D: pause the
  # KEDA cron scaler, wake dev, smoke, resume). A Freight is "Verified in dev" only if it
  # passes → the prod Stage (sources.stages: [dev]) accepts only verified Freight.
  verification:
    analysisTemplates:
      - name: minicloud-plane-dev-verify
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: set-image
          config:
            path: ./repo/services/minicloud-plane/minicloud-1/dev
            images:
              - image: harbor.10.0.0.200.nip.io/library/minicloud-plane
                tag: '${{ quote(imageFrom("ghcr.io/andrelair-platform/minicloud-plane").Tag) }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(minicloud-plane): promote image ${{ imageFrom("ghcr.io/andrelair-platform/minicloud-plane").Tag }} to dev'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(minicloud-plane): promote to dev — ${{ imageFrom("ghcr.io/andrelair-platform/minicloud-plane").Tag }}'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
