apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kargo-image-credentials
  namespace: minicloud-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-image-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        repoURL: ghcr.io/andrelair-platform/minicloud-plane
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef: { key: platform/ghcr, property: username }
    - secretKey: token
      remoteRef: { key: platform/ghcr, property: token }
