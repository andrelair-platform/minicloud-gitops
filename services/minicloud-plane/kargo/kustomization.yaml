apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kargo promotion pipeline for minicloud-plane (see manifests/kargo/README.md).
resources:
  - namespace.yaml
  - project.yaml
  - git-credentials.yaml
  - image-credentials.yaml
  - warehouse.yaml
  - projectconfig.yaml       # auto-promote dev (Kargo = sole promoter)
  - analysis-dev-smoke.yaml  # dev-Stage verification (Variant D: cron scale-aware)
  - rbac-dev.yaml            # SA RBAC (pause/resume KEDA) + netpol in the dev ns
  - stage-dev.yaml
  - stage-prod.yaml
