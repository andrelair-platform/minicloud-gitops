apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: minicloud-plane
spec:
  # 1 replica in base; dev/staging overlays override via patch-resources.yaml
  replicas: 1
  selector:
    matchLabels:
      app: minicloud-plane
  template:
    metadata:
      labels:
        app: minicloud-plane
        backstage.io/kubernetes-id: minicloud-plane
    spec:
      serviceAccountName: minicloud-plane
      containers:
        - name: minicloud-plane
          image: harbor.10.0.0.200.nip.io/library/minicloud-plane
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: minicloud-plane-secrets
          env:
            - name: NATS_URL
              value: nats://nats.messaging.svc.cluster.local:4222
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # MED-02
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp            # MED-02: writable /tmp so the root FS can be read-only
          emptyDir: {}
  strategy:
    # BlueGreen: the controller spins up the new pod behind minicloud-plane-preview,
    # runs prePromotionAnalysis (3× HTTP health checks), then atomically switches
    # minicloud-plane to the new RS. Old RS stays for scaleDownDelaySeconds in case
    # immediate rollback is needed. postPromotionAnalysis confirms Prometheus RED
    # signals after traffic has migrated.
    blueGreen:
      activeService: minicloud-plane
      previewService: minicloud-plane-preview
      autoPromotionEnabled: true
      autoPromotionSeconds: 30
      scaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
          - templateName: preview-health-gate
        args:
          # base overlay serves the dev namespace; the prod overlay patches this value.
          - name: preview-url
            value: http://minicloud-plane-preview.minicloud-plane-dev.svc.cluster.local:8080/health
      postPromotionAnalysis:
        templates:
          - templateName: http-regression-gate
