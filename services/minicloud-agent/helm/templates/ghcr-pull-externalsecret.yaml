# dev-only imagePullSecret for the Internal ghcr package (creds from Vault platform/ghcr).
# Gated by .Values.createGhcrPullSecret (set true ONLY in values-dev.yaml) so it does NOT render in
# prod, whose namespace already has a shared ghcr-pull ES. Harbor retirement (2026-11-16).
{{- if .Values.createGhcrPullSecret }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {{ `{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` }}
  data:
    - secretKey: username
      remoteRef:
        key: platform/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: platform/ghcr
        property: token
{{- end }}
