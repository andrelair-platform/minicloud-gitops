apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: minicloud-agent
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: minicloud-agent
      sources:
        direct: true
  # After promoting to dev, run the smoke AnalysisRun. A Freight is "Verified in dev"
  # only if it passes → the prod Stage (sources.stages: [dev]) accepts only verified
  # Freight = the dev→prod gate (Option 2). Variant C smoke (dev Service cross-ns).
  verification:
    analysisTemplates:
      - name: minicloud-agent-dev-verify
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: set-image
          config:
            path: ./repo/services/minicloud-agent/minicloud-1/dev
            images:
              - image: harbor.10.0.0.200.nip.io/library/minicloud-agent
                tag: '${{ imageFrom("ghcr.io/andrelair-platform/minicloud-agent").Tag }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(minicloud-agent): promote image ${{ imageFrom("ghcr.io/andrelair-platform/minicloud-agent").Tag }} to dev'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(minicloud-agent): promote to dev — ${{ imageFrom("ghcr.io/andrelair-platform/minicloud-agent").Tag }}'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
