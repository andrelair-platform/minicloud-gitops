# Auto-promotion: Kargo is the sole promoter of dev. New Freight is auto-promoted into the dev
# Stage (no manual click, no CI bump-gitops). Prod stays manual (CODEOWNERS PR).
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: minicloud-agent
  namespace: minicloud-agent
spec:
  promotionPolicies:
    - stage: dev
      autoPromotionEnabled: true
