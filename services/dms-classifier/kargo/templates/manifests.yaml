{{- /*
  Emit every raw Kargo CR under files/ verbatim.

  .Files.Get returns file contents WITHOUT running them through the template engine, so the Kargo
  promotion expressions (${{ commitFrom(...).ID[0:7] }}, ${{ outputs... }}) and the ESO output
  templates ({{ .username }}) pass through untouched — no backtick-escaping needed. Pure packaging shim
  so ArgoCD renders these CRs as a Helm source instead of kustomize (matches platform-demo/retrieva).
*/ -}}
{{- range $path, $_ := .Files.Glob "files/*.yaml" }}
---
{{ $.Files.Get $path }}
{{- end }}
