apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: dms-classifier
spec:
  # Promotes the newest ktayl-dms commit (that built a classifier image) to the DEV overlay by setting
  # minicloud-app-deployment.image.tag = the 7-char commit SHA (== the CI image tag). No verification
  # block: there is no prod Stage to gate, so a dev-verify AnalysisRun would buy nothing here (and a
  # NATS worker has no HTTP endpoint to smoke through the KEDA interceptor anyway).
  requestedFreight:
    - origin:
        kind: Warehouse
        name: dms-classifier
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
        - name: srcRepo
          value: https://github.com/andrelair-platform/ktayl-dms.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-image
          config:
            path: ./repo/services/dms-classifier/helm/values-dev.yaml
            updates:
              - key: minicloud-app-deployment.image.tag
                value: '${{ quote(commitFrom(vars.srcRepo).ID[0:7]) }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(dms-classifier): promote ${{ commitFrom(vars.srcRepo).ID[0:7] }} to dev'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(dms-classifier): promote to dev — ${{ commitFrom(vars.srcRepo).ID[0:7] }}'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
