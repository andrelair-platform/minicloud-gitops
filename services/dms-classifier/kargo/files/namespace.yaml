apiVersion: v1
kind: Namespace
metadata:
  name: dms-classifier
  labels:
    # Lets the Kargo Project controller adopt this namespace as its project. The app itself runs in
    # ns `ktayl-dms`; this ns holds only the Kargo CRs (the ApplicationSet deploys services/<svc>/kargo
    # to ns=<svc>, so the Kargo project ns = dms-classifier, distinct from the app ns).
    kargo.akuity.io/project: "true"
