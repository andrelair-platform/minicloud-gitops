# dms-classifier wrapper chart — common values (spec-dms-classifier). Internal worker (no ingress/SSO).
# Pulls the PRIVATE ghcr package via ghcr-pull; calls NATS/Paperless/indra/Presidio/LiteLLM/lookups.
minicloud-app-deployment:
  serviceAccount:
    create: true
    name: dms-classifier
    automountServiceAccountToken: false
  imagePullSecrets:
    - ghcr-pull                      # dms-classifier ghcr package is Internal/private
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000                  # the image runs as appuser 1000
    seccompProfile: { type: RuntimeDefault }
  # keep the hardened default securityContext (RO rootfs, drop ALL, no-priv-esc) + a writable /tmp.
  writableDirs:
    - { name: tmp, mountPath: /tmp }
  podLabels:
    app: dms-classifier
  image:
    repository: ghcr.io/andrelair-platform/dms-classifier
  ports:
    - { name: http, containerPort: 8000, protocol: TCP }
  service:
    ports:
      - { name: http, port: 8000, targetPort: http }
  startupProbe:
    httpGet: { path: /health, port: http }
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 5
  readinessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 5
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  env:
    - { name: NATS_URL, value: "nats://nats.messaging.svc:4222" }
    - { name: NATS_STREAM, value: "DMS_DOC" }
    - { name: NATS_SUBJECT, value: "dms.doc.consumed" }
    - { name: NATS_DURABLE, value: "dms-classifier" }
    - { name: PAPERLESS_URL, value: "http://paperless:80" }
    - { name: PAPERLESS_ADMIN_USER, value: "admin" }
    - name: PAPERLESS_ADMIN_PASSWORD
      valueFrom: { secretKeyRef: { name: paperless-secrets, key: admin-password } }
    - { name: INDRA_OCR_URL, value: "http://dms-indra-ocr:8000" }
    - { name: PRESIDIO_ANALYZER_URL, value: "http://presidio-analyzer.ai.svc.cluster.local:3000" }
    - { name: PRESIDIO_ANONYMIZER_URL, value: "http://presidio-anonymizer.ai.svc.cluster.local:3000" }
    - { name: LITELLM_BASE_URL, value: "http://litellm.ai.svc.cluster.local:4000" }
    - name: LITELLM_API_KEY
      valueFrom: { secretKeyRef: { name: dms-classifier-litellm, key: master-key } }
    - { name: CLASSIFIER_MODEL, value: "tier-economy" }
    # Systems of record (validate the candidate). DEV targets confirmed live at QA time (2026-11-16):
    #   claims dev = svc ktayl-claims in ns `claims`, port 80 (container 8080); real claims exist.
    #   core  dev = svc ktayl-core  in ns `ktayl-core`, port 80; GET-by-policy requires M2M auth (401) —
    #     policy validation stays HITL (needs-review) until LOOKUP_BEARER is wired (precursor story).
    # NOTE: dev-only service today; when a prod DMS is built, override these per-env (claims-prod / ktayl-core-prod).
    - { name: CLAIMS_LOOKUP_URL, value: "http://ktayl-claims.claims.svc/api/claims" }
    - { name: POLICY_LOOKUP_URL, value: "http://ktayl-core.ktayl-core.svc/api/billing/policies" }
    - { name: CONFIDENCE_THRESHOLD, value: "0.7" }
    - { name: ENVIRONMENT, value: "development" }
    # M2M auth (SEC-03, task #14) — a client-credentials token minted from Authentik, sent on the SoR
    # lookups; ktayl-core validates it (ADR-016 trusted-issuer allowlist). CLIENT_ID/SECRET are OPTIONAL
    # secretKeyRefs (the dms-classifier-oidc ESO target): absent ⇒ empty env ⇒ the classifier falls back
    # to unauthenticated (dev) with ZERO restart churn once the secret appears. Token URL/scope are literals.
    - { name: OIDC_TOKEN_URL, value: "http://authentik-server.authentik.svc:80/application/o/token/" }
    - { name: OIDC_SCOPE, value: "" }
    - name: OIDC_CLIENT_ID
      valueFrom: { secretKeyRef: { name: dms-classifier-oidc, key: OIDC_CLIENT_ID, optional: true } }
    - name: OIDC_CLIENT_SECRET
      valueFrom: { secretKeyRef: { name: dms-classifier-oidc, key: OIDC_CLIENT_SECRET, optional: true } }
    # Langfuse (LLMOps) — keys wired as a follow-up (dedicated project); tracing no-ops until then.
  # The library creates the LiteLLM key secret from Vault (the ghcr-pull ES is a wrapper template).
  externalSecret:
    enabled: true
    target: dms-classifier-litellm
    data:
      - secretKey: master-key
        remoteRef: { key: platform/litellm, property: master-key }
  ingress:
    enabled: false
  certificate:
    enabled: false

# --- wrapper-local extras (service-specific templates/) ---

# M2M OIDC ExternalSecret (SEC-03, task #14). Gate ON once Vault secret/platform/dms-classifier is
# populated (oidc-client-id / oidc-client-secret) by the Authentik-provisioning step. OFF ⇒ the
# optional secretKeyRef env above resolves empty ⇒ unauthenticated dev lookups (no pod churn).
oidc:
  enabled: true

# KEDA scale-to-zero on the JetStream consumer lag (task #13). minReplicaCount 0 = the worker sleeps
# until a doc lands. Because KEDA then owns .spec.replicas, the dev ArgoCD app ignoreDifferences it.
keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 120
  natsMonitoringEndpoint: "nats-headless.messaging:8222"
  stream: "DMS_DOC"
  consumer: "dms-classifier"
  lagThreshold: "1"

# Ingress default-deny for the worker (task #13). Egress stays open (Cilium platform convention).
networkPolicy:
  enabled: true

# Archive-only document retention CronJob (task #22; policy = ktayl-dms/docs/retention-policy.md). Runs the
# classifier image with `python -m app.retention`. OFF by default — the owner enables it after reviewing the
# retention policy + a dry-run. dryRun: true = REPORT ONLY (no uploads); there is NO delete path at all.
retention:
  enabled: false
  schedule: "30 2 * * *"      # daily 02:30
  dryRun: true                # report what would be archived; flip to false to actually upload to R2
  r2Bucket: "dms-archive"
  archivePrefix: "dms-archive"
  activeDeadlineSeconds: 1800
