# R2 (Cloudflare, S3-compatible) credentials for the archive-only retention CronJob (#24 Phase 3).
# From Vault secret/platform/cloudflare (r2-s3-endpoint / r2-access-key-id / r2-secret-access-key — the
# same offsite object store used by the CNPG barman backups). Gated with the CronJob; the env refs are
# `optional` so a dry-run (no secret) still runs.
{{- if .Values.retention.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dms-retention-r2
  labels:
    app.kubernetes.io/name: dms-retention
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: dms-retention-r2, creationPolicy: Owner }
  data:
    - secretKey: R2_ENDPOINT
      remoteRef: { key: secret/platform/cloudflare, property: r2-s3-endpoint }
    - secretKey: R2_ACCESS_KEY
      remoteRef: { key: secret/platform/cloudflare, property: r2-access-key-id }
    - secretKey: R2_SECRET_KEY
      remoteRef: { key: secret/platform/cloudflare, property: r2-secret-access-key }
{{- end }}
