# Ingress hardening for the classifier worker (task #13). The classifier is a NATS worker with NO
# inbound API consumers — only its own health probes (:8000). So default-deny ingress + allow probes.
#
# EGRESS is intentionally UNRESTRICTED (the platform convention — see ktayl-underwriting's netpol): under
# Cilium a standard NetworkPolicy `ipBlock` CIDR does NOT match the kube-apiserver identity, and a
# default-deny-egress pod then hangs on control-plane/DNS edge cases. The classifier's egress set
# (NATS/Paperless/indra/Presidio/LiteLLM/Langfuse/Authentik/claims/core) is broad and internal; gating it
# with a CiliumNetworkPolicy toEntities is a hardening follow-up, not done here to avoid breaking the live
# worker. Ingress-deny is the security-relevant control for a worker.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dms-classifier-default-deny-ingress
  labels:
    app.kubernetes.io/name: dms-classifier
spec:
  podSelector:
    matchLabels: { app: dms-classifier }
  policyTypes: [Ingress]
---
# Allow health/startup/liveness probes (kubelet/host-sourced) + any in-cluster metrics scrape on :8000.
# Probes arrive from the node; most CNIs source them from the host network, which a namespaceSelector
# can't match — so allow :8000 cluster-wide (the port only exposes /health, no business data).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dms-classifier-allow-health
  labels:
    app.kubernetes.io/name: dms-classifier
spec:
  podSelector:
    matchLabels: { app: dms-classifier }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8000 }
{{- end }}
