# M2M client-credentials for the system-of-record lookups (SEC-03, task #14). The classifier obtains an
# access token from Authentik (provider `dms-classifier`) and sends it on the claims/policy lookups;
# ktayl-core validates it against the shared Authentik JWKS + its trusted-issuer allowlist (ADR-016 —
# the classifier's issuer http://authentik-server.authentik.svc:80/application/o/dms-classifier/ must be
# added to ktayl-core's AUTHENTIK_TRUSTED_ISSUERS). Creds live in Vault secret/platform/dms-classifier
# (written out-of-band with root; ESO delivers them here). Non-secret OIDC config (token URL, scope) is
# literal env in values.yaml; OIDC_CLIENT_ID/SECRET env are OPTIONAL secretKeyRefs so the pod runs (and
# falls back to unauthenticated dev lookups) until this secret is populated.
{{- if .Values.oidc.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dms-classifier-oidc
  labels:
    app.kubernetes.io/name: dms-classifier
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: dms-classifier-oidc, creationPolicy: Owner }
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef: { key: secret/platform/dms-classifier, property: oidc-client-id }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: secret/platform/dms-classifier, property: oidc-client-secret }
{{- end }}
