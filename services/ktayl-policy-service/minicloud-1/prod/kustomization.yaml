apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ktayl-prod
resources:
  - ../../base
  - ingress.yaml
  - certificate.yaml
  - externalsecret-ghcr.yaml
  - externalsecret-app.yaml   # ktayl-policy-service-secret (DSN + shared infra URLs)
  - postgres.yaml             # dedicated prod Postgres + its ESO password
# Prod pulls from ghcr.io (durable, immutable SHA) — hybrid registry: dev uses Harbor,
# prod uses ghcr. Tag promoted from dev via a CODEOWNERS-gated PR (opened by Kargo).
images:
  - name: harbor.10.0.0.200.nip.io/library/ktayl-policy-service   # base image name (kustomize key)
    newName: ghcr.io/andrelair-platform/ktayl-policy-service
    newTag: 23c2c4e
patches:
  - path: patch-ghcr-pull.yaml
  - target:
      kind: Deployment
      name: ktayl-policy-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
