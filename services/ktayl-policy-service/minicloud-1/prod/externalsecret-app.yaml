# The app's runtime config secret (envFrom in the Deployment). Prod values from
# Vault secret/platform/ktayl-prod: DSN -> the prod Postgres above; Authentik/NATS are
# shared platform services; MinIO is unused (empty, as in dev).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-policy-service-secret
  namespace: ktayl-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-policy-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DSN
      remoteRef: { key: platform/ktayl-prod, property: DSN }
    - secretKey: AUTHENTIK_JWKS_URL
      remoteRef: { key: platform/ktayl-prod, property: AUTHENTIK_JWKS_URL }
    - secretKey: NATS_URL
      remoteRef: { key: platform/ktayl-prod, property: NATS_URL }
    - secretKey: MINIO_ENDPOINT
      remoteRef: { key: platform/ktayl-prod, property: MINIO_ENDPOINT }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: platform/ktayl-prod, property: MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: platform/ktayl-prod, property: MINIO_SECRET_KEY }
