apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ktayl-staging
resources:
  - ../../base
  - ingress.yaml
  - certificate.yaml
# Tag promoted manually: after dev is validated, open a PR bumping newTag here.
images:
  - name: harbor.10.0.0.200.nip.io/library/ktayl-policy-service
    newTag: latest
patches:
  - target:
      kind: Deployment
      name: ktayl-policy-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
