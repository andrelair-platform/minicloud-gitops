apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ktayl-policy-service-tls
  namespace: ktayl-staging
spec:
  secretName: ktayl-policy-service-tls
  issuerRef:
    name: minicloud-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - ktayl-policy-staging.10.0.0.200.nip.io
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
