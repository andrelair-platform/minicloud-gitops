# ktayl-policy-service — common values (Helm golden-path pilot). Workload only;
# satellite infra (prod Postgres, app/ghcr ESO secrets) stays as adjacent manifests.
serviceAccount:
  create: true
  name: ktayl-policy-service
  automountServiceAccountToken: false

# NetworkPolicy compatibility: the ktayl ns netpols (allow-egress-postgres/nats/minio/jwks)
# select `app: ktayl-policy-service`. dev keeps the chart's standard app.kubernetes.io/* selector
# and adds this label via `podLabels` (values-dev.yaml). prod instead OVERRIDES the selector to
# `app: ktayl-policy-service` (values-prod.yaml) for an in-place, no-delete migration — that same
# label then lands on the pod automatically, so prod needs no podLabels (which would duplicate it).
image:
  repository: harbor.10.0.0.200.nip.io/library/ktayl-policy-service
ports:
  - name: http
    containerPort: 8080
    protocol: TCP
service:
  ports:
    - name: http
      port: 80
      targetPort: http
env:
  - name: PORT
    value: "8080"
envFrom:
  - secretRef: { name: ktayl-policy-service-secret }
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }
readinessProbe:
  httpGet: { path: /healthz, port: http }
  initialDelaySeconds: 5
  periodSeconds: 5
livenessProbe:
  httpGet: { path: /healthz, port: http }
  initialDelaySeconds: 10
  periodSeconds: 10
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ktayl-policy-service }
          topologyKey: kubernetes.io/hostname
ingress:
  enabled: true
  className: nginx
  servicePort: 80
  tls:
    enabled: true
    secretName: ktayl-policy-service-tls
certificate:
  # Chart does NOT own the Certificate: cert lifecycle is a per-service satellite
  # concern (existing ktayl-policy-service-tls secret + its own Certificate manifest).
  # The chart rendering a second Certificate for the same secret causes re-issue churn.
  enabled: false
