# ktayl-policy-service — common values (Helm golden-path pilot). Workload only;
# satellite infra (prod Postgres, app/ghcr ESO secrets) stays as adjacent manifests.
serviceAccount:
  create: true
  name: ktayl-policy-service
  automountServiceAccountToken: false

# Compatibility label: the ktayl ns NetworkPolicies (allow-egress-postgres/nats/minio/jwks)
# select `app: ktayl-policy-service`. The chart uses app.kubernetes.io/* labels, so without
# this the pod would not match those egress allows and its DB connect would be denied (exit 2).
podLabels:
  app: ktayl-policy-service
image:
  repository: harbor.10.0.0.200.nip.io/library/ktayl-policy-service
ports:
  - name: http
    containerPort: 8080
    protocol: TCP
service:
  ports:
    - name: http
      port: 80
      targetPort: http
env:
  - name: PORT
    value: "8080"
envFrom:
  - secretRef: { name: ktayl-policy-service-secret }
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }
readinessProbe:
  httpGet: { path: /healthz, port: http }
  initialDelaySeconds: 5
  periodSeconds: 5
livenessProbe:
  httpGet: { path: /healthz, port: http }
  initialDelaySeconds: 10
  periodSeconds: 10
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ktayl-policy-service }
          topologyKey: kubernetes.io/hostname
ingress:
  enabled: true
  className: nginx
  servicePort: 80
  tls:
    enabled: true
    secretName: ktayl-policy-service-tls
certificate:
  enabled: true
  issuerRef:
    name: minicloud-ca   # actual ClusterIssuer on this cluster (chart default was wrong)
    kind: ClusterIssuer
