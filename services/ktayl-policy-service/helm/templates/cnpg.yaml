# Additive CNPG migration for ktayl-policy-service's DB (datastore-selection.md — prod ktayl-postgres
# is a single-instance alpine STS, no failover/PITR). Stands up a dedicated HA + PITR-backed CNPG
# cluster ALONGSIDE the existing STS (postgres.yaml stays under .Values.postgres.enabled) — no
# data-loss window. Cutover (LATER, checked): edit the app's Vault DSN (platform/ktayl-prod → property
# DSN) host from ktayl-postgres → ktayl-cnpg-rw; the managed `ktayl` role password = the same Vault
# postgres-password the STS/DSN already use → drop-in. Prod-only (gated on .Values.prodExtras.enabled,
# the same prod gate as the STS in postgres.yaml → CNPG renders only in prod, alongside it); 2 instances.
{{- if .Values.prodExtras.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ktayl-cnpg
  labels:
    app.kubernetes.io/name: ktayl-policy-service
spec:
  instances: {{ .Values.cnpg.instances }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: {{ .Values.cnpg.storageSize }}
    storageClass: longhorn
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  monitoring:
    enablePodMonitor: true
  managed:
    roles:
      - name: ktayl
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: ktayl-cnpg-role
  bootstrap:
    initdb:
      database: ktayl_policy
      owner: ktayl
{{- if .Values.cnpg.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.cnpg.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: s3://{{ .Values.cnpg.backup.bucket }}
      endpointURL: {{ .Values.cnpg.backup.endpointURL }}
      s3Credentials:
        accessKeyId:
          name: ktayl-cnpg-r2
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: ktayl-cnpg-r2
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
{{- end }}
---
# CNPG `ktayl` role password = the SAME Vault value the STS/DSN already use → drop-in at cutover.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-cnpg-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-cnpg-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "ktayl"
        password: "{{ `{{ .pgpass }}` }}"
  data:
    - secretKey: pgpass
      remoteRef:
        key: platform/ktayl-prod
        property: postgres-password
{{- if .Values.cnpg.backup.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-cnpg-r2
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-cnpg-r2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: {{ .Values.cnpg.backup.vaultPath }}, property: r2-access-key-id }
    - secretKey: SECRET_ACCESS_KEY
      remoteRef: { key: {{ .Values.cnpg.backup.vaultPath }}, property: r2-secret-access-key }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ktayl-cnpg-daily
spec:
  schedule: {{ .Values.cnpg.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: ktayl-cnpg
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: ktayl-cnpg
  policyTypes:
    - Ingress
  ingress:
    # Operator (cnpg-system) → instance status (:8000) + Postgres (:5432).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
    # Same-namespace → Postgres (:5432): REQUIRED for intra-cluster streaming replication
    # (cnpg-2 → cnpg-1-rw) AND the app → DB at cutover. Selecting the CNPG pods above ISOLATES them,
    # so a namespace WITHOUT an allow-same-namespace policy (ktayl-prod lacks one, unlike ktayl-iam-prod)
    # would block the replica join → cluster stuck at 1/2 (observed 2026-10-17). This makes the netpol
    # self-sufficient in any namespace.
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
---
# WAL keepalive (DR Game Day 2026-10-17) — a near-idle CNPG DB produces no WAL, so a base backup's
# CLOSING WAL segment never archives and the backup is NOT restorable ("WAL ends before end of online
# backup"). A heartbeat INSERT every 10min keeps WAL advancing so archive_timeout (5min) flushes the
# closing segment → backups stay restorable (validated by the scenario-08 restore drill, see the DR
# postmortem). pg_switch_wal needs superuser; a plain app-role INSERT does not → least-privilege fix.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ktayl-cnpg-wal-keepalive
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app: ktayl-cnpg-wal-keepalive
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: keepalive
              image: docker.io/library/postgres:17-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  psql -v ON_ERROR_STOP=1 -tAc "create table if not exists public._wal_keepalive(id bigserial primary key, ts timestamptz default now()); insert into public._wal_keepalive default values; delete from public._wal_keepalive where ts < now() - interval '2 days';"
              env:
                - name: PGHOST
                  value: ktayl-cnpg-rw
                - name: PGUSER
                  value: ktayl
                - name: PGDATABASE
                  value: ktayl_policy
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ktayl-cnpg-role
                      key: password
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ktayl-cnpg-wal-keepalive-egress
spec:
  podSelector:
    matchLabels:
      app: ktayl-cnpg-wal-keepalive
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: ktayl-cnpg
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }

{{- end }}
