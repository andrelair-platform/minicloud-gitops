# TLS Certificate (single-owner, both envs). Name kept = ktayl-policy-service-tls so the flip is an
# in-place update; dnsName differs per env (set in values-{dev,prod}.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ktayl-policy-service-tls
  labels:
    app: ktayl-policy-service
spec:
  secretName: ktayl-policy-service-tls
  issuerRef:
    name: minicloud-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.tlsCert.dnsName | quote }}
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
