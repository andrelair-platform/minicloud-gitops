{{- if .Values.prodExtras.enabled }}
# App-consistent logical backup of the ktayl-prod Postgres (audit P3 — closes the RTO/RPO gap:
# ktayl-prod was Velero-VOLUME-only = crash-consistent + untested, despite holding the insurance
# business data). Prod-gated (prodExtras) so it renders only in ktayl-prod, next to its DB. Same
# two-container pattern as the synapse reference: pg_dump -> emptyDir; k3s-backup image rclone-pushes
# to MinIO db-logical/ktayl and prunes to 7 days. Release ns = ktayl-prod (same-namespace DB access;
# ktayl-prod has no default-deny-egress -> MinIO 10.0.0.1 reachable). db-logical mirrors to R2 offsite.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-backup-minio-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-backup-minio-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: platform/minio, property: access_key_id }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: platform/minio, property: password }
    - secretKey: MINIO_ENDPOINT
      remoteRef: { key: platform/minio, property: endpoint }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ktayl-logical-backup
  annotations:
    checkov.io/skip1: CKV_K8S_22=postgres client requires writable rootfs (ephemeral job)
spec:
  schedule: "5 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: pgdump
              image: harbor.10.0.0.200.nip.io/library/postgresql:18.4.0-noavx512
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ktayl-postgres-secret
                      key: postgres-password
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  export PATH=/opt/bitnami/postgresql/bin:$PATH
                  TS=$(date +%Y%m%d-%H%M%S)
                  echo "pg_dump ktayl_policy@ktayl-postgres -> /work/ktayl-${TS}.sql.gz"
                  pg_dump -h ktayl-postgres -U ktayl -d ktayl_policy --no-owner --no-privileges \
                    | gzip -c > "/work/ktayl-${TS}.sql.gz"
                  ls -la /work
              volumeMounts:
                - { name: work, mountPath: /work }
              securityContext:
                runAsUser: 1001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
          containers:
            - name: push
              image: harbor.10.0.0.200.nip.io/library/k3s-backup:1.0
              env:
                - { name: HOME, value: /work }
                - { name: TMPDIR, value: /work }
                - { name: RCLONE_CONFIG, value: /work/rclone.conf }
                - name: MINIO_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: ktayl-backup-minio-creds, key: MINIO_ACCESS_KEY } }
                - name: MINIO_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: ktayl-backup-minio-creds, key: MINIO_SECRET_KEY } }
                - name: MINIO_ENDPOINT
                  valueFrom: { secretKeyRef: { name: ktayl-backup-minio-creds, key: MINIO_ENDPOINT } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  umask 077
                  cat > /work/rclone.conf <<CONF
                  [minio]
                  type = s3
                  provider = Minio
                  access_key_id = ${MINIO_ACCESS_KEY}
                  secret_access_key = ${MINIO_SECRET_KEY}
                  endpoint = ${MINIO_ENDPOINT}
                  region = us-east-1
                  CONF
                  rclone mkdir minio:db-logical 2>/dev/null || true
                  rclone copy /work minio:db-logical/ktayl/ --include '*.sql.gz' --s3-no-check-bucket
                  rclone delete minio:db-logical/ktayl/ --min-age 7d --s3-no-check-bucket || true
                  echo "on-site logical dumps:"; rclone ls minio:db-logical/ktayl/
              volumeMounts:
                - { name: work, mountPath: /work }
              securityContext:
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 300m, memory: 256Mi }
{{- end }}
