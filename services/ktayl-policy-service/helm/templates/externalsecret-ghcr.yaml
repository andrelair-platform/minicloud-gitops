# ghcr-pull dockerconfigjson imagePullSecret for the Internal ghcr.io prod image (prod-only).
# ESO output-template expressions are backtick-escaped so HELM emits them verbatim (they must
# reach ESO, not be evaluated at chart render time).
{{- if .Values.prodExtras.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  labels:
    app: ktayl-policy-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .token }}` }}","auth":"{{ `{{ printf "%s:%s" .username .token | b64enc }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: platform/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: platform/ghcr
        property: token
{{- end }}
