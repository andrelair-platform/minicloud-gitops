# The app's runtime config secret (envFrom in the Deployment). Prod values from
# Vault secret/platform/ktayl-prod: DSN -> the prod Postgres above; Authentik/NATS are
# shared platform services; MinIO is unused (empty, as in dev).
# prod-only: dev's secret lives outside gitops (manual, alongside the manual dev Postgres).
{{- if .Values.prodExtras.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-policy-service-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-policy-service-secret
    creationPolicy: Owner
    # CNPG CUTOVER (2026-10-17): rewrite the DSN host ktayl-postgres -> ktayl-cnpg-rw as the secret
    # renders, so the app connects to the HA+PITR CNPG cluster (cnpg.yaml) instead of the single
    # alpine STS. Done here (a GitOps-reviewed, reversible transform) rather than by editing the Vault
    # DSN, because writing secret/platform/ktayl-prod needs break-glass Vault access (root; the ops
    # token has none). mergePolicy:Merge → only DSN is transformed; the other keys pass through verbatim.
    # FOLLOW-UP (owner, non-urgent): update the Vault DSN host to ktayl-cnpg-rw, then delete this
    # template block so Vault is once again the single source of truth. The `ktayl` CNPG role password
    # = the same Vault postgres-password the DSN already carries -> drop-in, no credential change.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DSN: '{{ `{{ .DSN | replace "ktayl-postgres.ktayl-prod.svc.cluster.local" "ktayl-cnpg-rw.ktayl-prod.svc.cluster.local" }}` }}'
  data:
    - secretKey: DSN
      remoteRef: { key: platform/ktayl-prod, property: DSN }
    - secretKey: AUTHENTIK_JWKS_URL
      remoteRef: { key: platform/ktayl-prod, property: AUTHENTIK_JWKS_URL }
    - secretKey: NATS_URL
      remoteRef: { key: platform/ktayl-prod, property: NATS_URL }
    - secretKey: MINIO_ENDPOINT
      remoteRef: { key: platform/ktayl-prod, property: MINIO_ENDPOINT }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: platform/ktayl-prod, property: MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: platform/ktayl-prod, property: MINIO_SECRET_KEY }
{{- end }}
