# prod — ghcr SHA image, 2 replicas, prod host (ns ktayl-prod). Zero-downtime in-place flip via the
# selectorLabels override (matches the live Deployment selector). prodExtras renders the dedicated
# Postgres (kept verbatim → in-place, data preserved), app-secret ES, and ghcr-pull ES.
minicloud-app-deployment:
  # Match the live prod Deployment selector {app: ktayl-policy-service} → in-place rolling update,
  # no delete, no downtime. The label also lands on the pod (ktayl-prod egress netpols match).
  selectorLabels:
    app: ktayl-policy-service
  image:
    repository: ghcr.io/andrelair-platform/ktayl-policy-service
    tag: "23c2c4e"      # Kargo bumps to promoted SHA
  imagePullSecrets: [{name: ghcr-pull}]
  workload:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    host: ktayl-policy-prod.10.0.0.200.nip.io
tlsCert:
  dnsName: ktayl-policy-prod.10.0.0.200.nip.io
prodExtras:
  enabled: true
