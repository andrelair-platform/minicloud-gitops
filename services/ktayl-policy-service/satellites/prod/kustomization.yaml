# Prod satellite resources for ktayl-policy-service (single-owner, adjacent to the chart workload).
# The chart (minicloud-app-deployment) renders the workload + Service + Ingress + PDB; everything
# that is NOT the stateless workload stays here so it has one clear owner:
#   - postgres.yaml            dedicated prod Postgres (StatefulSet + headless Svc + password ESO).
#                              MUST NOT be pruned/recreated on the golden-path flip — copied verbatim
#                              from the retired kustomize overlay so its immutable selector +
#                              volumeClaimTemplate are identical → in-place update, data preserved.
#   - externalsecret-app.yaml  ktayl-policy-service-secret (DSN + shared infra URLs, envFrom).
#   - externalsecret-ghcr.yaml ghcr-pull imagePullSecret for the Internal ghcr prod image.
#   - certificate.yaml         ktayl-policy-service-tls (chart certificate.enabled=false).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ktayl-prod
resources:
  - postgres.yaml
  - externalsecret-app.yaml
  - externalsecret-ghcr.yaml
  - certificate.yaml
