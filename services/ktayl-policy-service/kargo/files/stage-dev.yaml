apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: ktayl-policy-service
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: ktayl-policy-service
      sources:
        direct: true
  # After promoting to dev, run the smoke AnalysisRun. A Freight is "Verified in dev" only if
  # it passes → the prod Stage (sources.stages: [dev]) accepts only verified Freight = the
  # dev→prod gate, owned by Kargo (Option 2). Variant B smoke (via ingress-nginx).
  verification:
    analysisTemplates:
      - name: ktayl-policy-service-dev-verify
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-image
          config:
            path: ./repo/services/ktayl-policy-service/helm/values-dev.yaml
            updates:
              # git-Warehouse: pin the tag to the Freight's commit short-SHA (== the CI image tag).
              - key: minicloud-app-deployment.image.tag
                value: '${{ quote(commitFrom("https://github.com/andrelair-platform/ktayl-policy-service.git").ID[0:7]) }}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(ktayl-policy-service): promote ${{ commitFrom("https://github.com/andrelair-platform/ktayl-policy-service.git").ID[0:7] }} to dev'
        - uses: git-push
          as: push
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            provider: github
            title: 'kargo(ktayl-policy-service): promote to dev — ${{ commitFrom("https://github.com/andrelair-platform/ktayl-policy-service.git").ID[0:7] }}'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: ${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}
          config:
            repoURL: ${{ vars.gitopsRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
