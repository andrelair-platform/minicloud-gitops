{{- if .Values.ingress.enabled }}
{{- /* multi-host: prefer the `hosts` list; fall back to the single `host` for back-compat */ -}}
{{- $hosts := .Values.ingress.hosts | default (list .Values.ingress.host) }}
{{- /* backend defaults to the app's own Service; override (e.g. the KEDA interceptor) via backendService */ -}}
{{- $backend := .Values.ingress.backendService | default (include "app.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}
  labels:
{{ include "app.labels" . | indent 4 }}
{{- with .Values.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
{{- range $hosts }}
        - {{ . | quote }}
{{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "app.fullname" .)) }}
{{- end }}
  rules:
{{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ $backend }}
                port:
                  number: {{ $.Values.ingress.servicePort }}
{{- end }}
{{- end }}
