name: Kargo dev auto-merge

# Kargo's `dev` Stage opens a PR (labelled `automerge`) that bumps a dev overlay
# image tag. This workflow auto-merges only after proving that the PR (a) came from
# the Kargo promotion path, (b) touches ONLY dev values, and (c) passes every required
# check on the exact commit being merged. Production/base/apps/Kargo changes can never
# ride an `automerge` label. The normal main-branch ruleset stays fully enforced —
# strict required checks (branches up-to-date), required signatures, CODEOWNERS.
#
# Two things make this reliable under the strict ruleset:
#
#  1. BEHIND → `gh pr update-branch` (a normal server-side merge of main INTO the PR
#     branch — no force-push, no bypass). That re-triggers the required checks on the
#     new head. Bounded by MAX_UPDATES.
#
#  2. MERGE via the authoritative REST endpoint, NOT `gh pr merge`. `gh pr merge`
#     refuses *client-side* whenever it sees a stale/conservative `mergeStateStatus:
#     BLOCKED` (printing the misleading "base branch policy prohibits the merge"),
#     even when the PR is genuinely mergeable. The REST `PUT /pulls/{n}/merge` endpoint
#     re-evaluates branch protection SERVER-SIDE and merges iff the rules actually pass
#     — it is NOT a bypass (our token has no ruleset bypass; a genuine rule failure
#     returns 405/409 and we fail-closed). `sha=<head>` makes it atomic (409 if the
#     head moved). Squash → GitHub creates one signed commit (satisfies required_signatures).
#
# Fail-closed: a merge conflict, any non-dev file, a failed/absent required check, a
# genuine 405 after exhausting the bounded rounds, or any unexpected error — all stop
# the run WITHOUT merging. Nothing uses --admin.
#
# Inert until a service's dev Stage auto-promotion is enabled. Prod promotion PRs are
# NOT labelled `automerge` and require the maintainer's normal PR merge after checks.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# Kargo opens the PR already-labelled, and our own update-branch triggers `synchronize`,
# so several runs fire near-simultaneously. Serialize per-PR so two runs never manipulate
# the same PR at once; don't cancel — later runs no-op on an already-merged PR.
concurrency:
  group: kargo-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
      R: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      # Bounds (fail-closed if exceeded):
      MAX_ROUNDS: "10"      # total merge-eval rounds (each ends in a backoff sleep)
      MAX_UPDATES: "6"      # how many times we re-sync to a fast-moving main
      CHECK_TRIES: "40"     # per-round check polls (×15s ≈ 10 min)
      ROUND_BACKOFF: "15"   # seconds between rounds (backoff; no tight loop)
    steps:
      - name: Validate origin — must be a Kargo promotion branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            kargo/promotion/*) echo "Origin OK — Kargo promotion branch: $HEAD_REF" ;;
            *) echo "::error::Refusing auto-merge — head '$HEAD_REF' is not a kargo/promotion/* branch."; exit 1 ;;
          esac

      - name: Guard — PR must touch ONLY dev overlays (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILES=$(gh pr view "$PR" --repo "$R" --json files -q '.files[].path')
          echo "Changed files:"; echo "$FILES"
          if [ -z "${FILES//[$'\t\r\n ']/}" ]; then
            echo "::error::Refusing auto-merge — could not determine changed files."; exit 1
          fi
          # Every changed path must be dev-only — a legacy dev overlay
          # (services/<svc>/minicloud-1/dev/**) OR the wrapper chart's dev values file
          # (services/<svc>/helm/values-dev.yaml). Prod values, common values.yaml,
          # Chart.yaml/lock, prod overlays, base, apps and Kargo config are all refused.
          BAD=$(echo "$FILES" | grep -vE '^services/[^/]+/minicloud-1/dev/|^services/[^/]+/helm/values-dev\.yaml$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Refusing auto-merge — PR touches non-dev paths:"; echo "$BAD"; exit 1
          fi
          echo "All changes are dev-only (overlay or wrapper values-dev.yaml)."

      - name: Update-branch when behind, then REST-merge the exact validated head
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -uo pipefail

          # Re-assert the dev-only invariant against the CURRENT head (defence in depth).
          assert_dev_only() {
            local files bad
            files=$(gh pr view "$PR" --repo "$R" --json files -q '.files[].path' 2>/dev/null || echo "")
            if [ -z "${files//[$'\t\r\n ']/}" ]; then echo "::error::empty file list on revalidate"; return 1; fi
            bad=$(echo "$files" | grep -vE '^services/[^/]+/minicloud-1/dev/|^services/[^/]+/helm/values-dev\.yaml$' || true)
            if [ -n "$bad" ]; then echo "::error::non-dev path appeared on revalidate:"; echo "$bad"; return 1; fi
            return 0
          }

          # "<pending> <bad>" over required checks, EXCLUDING our own `automerge` check.
          check_summary() {
            local checks
            checks=$(gh pr checks "$PR" --repo "$R" --json name,bucket 2>/dev/null || true)
            [ -z "$checks" ] && checks='[]'
            echo "$checks" | python3 -c "import sys,json; c=[x for x in json.load(sys.stdin) if x.get('name')!='automerge']; print(sum(1 for x in c if x.get('bucket')=='pending'), sum(1 for x in c if x.get('bucket') in ('fail','cancel')))"
          }

          updates=0
          for round in $(seq 1 "$MAX_ROUNDS"); do
            echo "──── round $round/$MAX_ROUNDS ────"
            STATE=$(gh pr view "$PR" --repo "$R" --json state -q '.state' 2>/dev/null || echo "")
            [ "$STATE" = "MERGED" ] && { echo "PR already merged — done."; exit 0; }
            [ "$STATE" = "CLOSED" ] && { echo "::error::PR is closed, not merging."; exit 1; }

            MSS=$(gh pr view "$PR" --repo "$R" --json mergeStateStatus -q '.mergeStateStatus' 2>/dev/null || echo "")
            echo "mergeStateStatus=$MSS (updates $updates/$MAX_UPDATES)"

            # Hard conflict → fail-closed, never try to resolve.
            if [ "$MSS" = "DIRTY" ]; then
              echo "::error::PR has a merge conflict with main — fail-closed."; exit 1
            fi

            # Behind main (strict mode) → bring it up to date (server-side, no force-push).
            if [ "$MSS" = "BEHIND" ]; then
              updates=$((updates+1))
              if [ "$updates" -gt "$MAX_UPDATES" ]; then
                echo "::error::main advanced past $MAX_UPDATES update attempts — fail-closed."; exit 1
              fi
              echo "Behind main → gh pr update-branch (attempt $updates)…"
              if ! OUT=$(gh pr update-branch "$PR" --repo "$R" 2>&1); then
                echo "$OUT"
                echo "$OUT" | grep -qiE "already up.to.date|up to date" && { sleep 5; continue; }
                echo "$OUT" | grep -qiE "conflict|merge conflict"       && { echo "::error::update-branch hit a conflict — fail-closed."; exit 1; }
                echo "update-branch transient error — backing off"; sleep "$ROUND_BACKOFF"; continue
              fi
              sleep 10; continue   # recompute + re-run checks on the new head
            fi

            # Not behind → wait (bounded) for required checks to finish on THIS head.
            ready=0
            for i in $(seq 1 "$CHECK_TRIES"); do
              MSS2=$(gh pr view "$PR" --repo "$R" --json mergeStateStatus -q '.mergeStateStatus' 2>/dev/null || echo "")
              [ "$MSS2" = "BEHIND" ] && { echo "Slipped behind while waiting → re-update."; break; }
              [ "$MSS2" = "DIRTY" ]  && { echo "::error::Became conflicted while waiting — fail-closed."; exit 1; }
              read -r PENDING BAD <<<"$(check_summary)"; PENDING=${PENDING:-0}; BAD=${BAD:-0}
              if [ "$BAD" != "0" ]; then echo "::error::Refusing auto-merge — $BAD required check(s) failed."; exit 1; fi
              if [ "$PENDING" != "0" ]; then echo "Waiting for $PENDING check(s)… ($i/$CHECK_TRIES)"; sleep 15; continue; fi
              ready=1; break
            done
            [ "$ready" = "1" ] || { echo "checks did not settle this round — backing off"; sleep "$ROUND_BACKOFF"; continue; }

            # Checks green → revalidate dev-only + pin the exact head, then merge via the
            # AUTHORITATIVE REST endpoint (server-side rule eval; NOT a bypass; 405/409 if
            # a rule genuinely fails or the head moved).
            assert_dev_only || exit 1
            HEAD_SHA=$(gh pr view "$PR" --repo "$R" --json headRefOid -q '.headRefOid' 2>/dev/null || echo "")
            [ -z "$HEAD_SHA" ] && { echo "::error::could not read head SHA — fail-closed."; exit 1; }
            echo "Merging exact head $HEAD_SHA (squash, REST)…"
            if RESP=$(gh api -X PUT "repos/$R/pulls/$PR/merge" -f merge_method=squash -f sha="$HEAD_SHA" 2>&1); then
              echo "$RESP" | grep -qi "successfully merged" && { echo "Merged."; exit 0; }
              echo "$RESP"; echo "::error::unexpected merge response — fail-closed."; exit 1
            fi
            echo "$RESP"
            # Classify the REST error:
            echo "$RESP" | grep -qiE "already merged|not open" && { echo "treating as merged"; exit 0; }
            # Head/base moved, or a transient 405 while GitHub settles → re-evaluate next round.
            if echo "$RESP" | grep -qiE "Head branch was modified|Base branch was modified|not mergeable|HTTP 40(5|9)|Required status|sha"; then
              echo "state moved / not-yet-mergeable → backing off and re-evaluating."; sleep "$ROUND_BACKOFF"; continue
            fi
            echo "::error::merge failed (unexpected, non-transient) — fail-closed."; exit 1
          done
          echo "::error::auto-merge did not complete within $MAX_ROUNDS rounds — fail-closed."; exit 1
