name: Build orphan images to ghcr

# Harbor retirement (docs/harbor-retirement.md): the two Harbor-only images that were retention-GC'd
# out of Harbor (so they couldn't be crane-copied) are rebuilt from source straight to ghcr — using
# the Actions GITHUB_TOKEN for ghcr write (no PAT). Same name:tag as before so the manifests repoint
# with a pure registry-prefix swap. Re-runnable.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { context: images/k3s-backup, image: k3s-backup, tag: "1.0" }
          - { context: images/k3s-backup, image: k3s-backup, tag: "2.0" }   # 2.0 = +age (current Dockerfile); 01-k3s-sqlite-backup uses it
          - { context: images/mlflow,     image: mlflow,     tag: "v2.16.0-psycopg2" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/andrelair-platform/${{ matrix.image }}:${{ matrix.tag }}
