name: Validate Kubernetes Manifests

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'manifests/**'

env:
  KUBECONFORM_VERSION: "0.6.7"
  K8S_VERSION: "1.36.0"

jobs:
  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Fast, schema-independent YAML syntax gate. kubeconform runs with
      # -ignore-missing-schemas, so it SKIPS unknown CRDs (PrometheusRule, Rollout,
      # …) — a pure indentation/parse error in one of those files slips through.
      # This step parses every YAML doc and fails on any syntax error, catching that
      # class before kubeconform. (A bad PrometheusRule indentation merged once this
      # way — see 22-node-resource-alerts.yaml history.)
      - name: YAML syntax check (services/ + manifests/)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, glob, yaml
          bad = 0
          # Helm chart templates (any */templates/** — wrapper charts services/*/helm/templates/**,
          # the Kargo packaging charts services/*/kargo/templates/** + manifests/kargo/templates/**,
          # the environments charts) are Go templates, NOT raw YAML — they legitimately contain
          # {{ ... }}, so exclude them from this raw-parse gate. They're validated by `helm template`
          # in the "Validate Helm charts render" step below. The chart's values*.yaml / Chart.yaml /
          # Chart.lock and the raw files/*.yaml CRs ARE plain YAML → stay checked here.
          def skip(f):
              return "/templates/" in f
          for f in sorted(glob.glob("services/**/*.yaml", recursive=True)
                          + glob.glob("manifests/**/*.yaml", recursive=True)):
              if skip(f):
                  continue
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as e:
                  bad += 1
                  print(f"::error file={f}::YAML syntax error: {e}")
          if bad:
              print(f"\n{bad} file(s) failed YAML syntax check")
              sys.exit(1)
          print("All YAML files parse cleanly.")
          PY

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.6.0"

      - name: Install kubeconform
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      # Validate any Kustomize overlay. Custom resources (Rollout, ScaledObject,
      # ExternalSecret, Certificate, ServiceMonitor, etc.) are skipped with
      # -ignore-missing-schemas — only core k8s objects are validated strictly.
      # All custom services are now wrapper Helm charts (services/<svc>/helm/,
      # validated by `helm template`), so there may be NO kustomize overlays left —
      # nullglob makes this a clean no-op in that case instead of failing on the
      # unexpanded glob, while still validating any overlay that reappears.
      - name: Validate service overlays
        run: |
          set -euo pipefail
          shopt -s nullglob
          overlays=(services/*/minicloud-1/*/)
          if [ ${#overlays[@]} -eq 0 ]; then
            echo "No kustomize overlays (all services on wrapper Helm charts) — skipping."
            exit 0
          fi
          FAILED=0
          for overlay in "${overlays[@]}"; do
            echo "── $overlay"
            if ! kustomize build "$overlay" \
              | kubeconform \
                  -strict \
                  -kubernetes-version "$K8S_VERSION" \
                  -ignore-missing-schemas \
                  -summary \
                  -; then
              echo "FAIL: $overlay"
              FAILED=1
            fi
          done
          exit $FAILED

      # Validate raw manifests/ YAML files. Excluded: kustomization.yaml (none left),
      # gatekeeper-policies (schemas, not instances), and Helm chart internals
      # (Chart.yaml + */templates/** — the latter are Go templates, validated by the
      # "Validate Helm charts render" step; the chart's files/*.yaml raw CRs ARE validated here).
      # xargs passes file paths as arguments (not stdin) so kubeconform reads file contents.
      - name: Validate manifests/
        run: |
          set -euo pipefail
          find manifests/ -name "*.yaml" \
            ! -name "kustomization.yaml" \
            ! -name "Chart.yaml" \
            ! -path "*/templates/*" \
            ! -path "*/gatekeeper-policies/*" \
            | sort \
            | xargs -r kubeconform \
                -strict \
                -kubernetes-version "$K8S_VERSION" \
                -ignore-missing-schemas \
                -summary

      # Validate the dependency-free Helm charts that replaced the former kustomize dirs:
      # the Kargo pipelines (services/*/kargo + manifests/kargo) and the environment
      # bootstraps (environments/overlays/*/*). They vendor no library dependency, so a plain
      # `helm template` renders them; pipe to kubeconform (same rules as the overlays). This is
      # the render-validation the kustomize dirs used to get, now on the Helm equivalents.
      - name: Validate Helm charts render (kargo + environments)
        run: |
          set -euo pipefail
          shopt -s nullglob
          charts=(services/*/kargo manifests/kargo environments/overlays/*/*)
          FAILED=0
          for c in "${charts[@]}"; do
            [ -f "$c/Chart.yaml" ] || continue
            echo "── $c"
            if ! helm template "$(basename "$c")" "$c" \
              | kubeconform \
                  -strict \
                  -kubernetes-version "$K8S_VERSION" \
                  -ignore-missing-schemas \
                  -summary \
                  -; then
              echo "FAIL: $c"
              FAILED=1
            fi
          done
          exit $FAILED
