name: BMAD Sync

# Per-product BMAD for the IS-Foundations products whose home repo is minicloud-gitops
# (GitOps — Platform Engineering #3, Data Platform #5, and platform-wide work). Stories live under
# bmad/stories/ and sync to GitHub Issues via the org-shared reusable workflow; each story's
# frontmatter (repo:/project:/priority:/milestone:) routes the created issue to the right repo +
# product board. Replaces the legacy gitops-local S*.md/platform-backlog sync (which globbed S*.md
# only and hard-targeted platform-backlog #1). See andrelair rules bmad.md (Per-product BMAD).

on:
  push:
    branches: [main]
    paths:
      - 'bmad/stories/**'
  workflow_dispatch:

jobs:
  bmad-sync:
    uses: andrelair-platform/.github/.github/workflows/bmad-sync.yml@main
    secrets: inherit
