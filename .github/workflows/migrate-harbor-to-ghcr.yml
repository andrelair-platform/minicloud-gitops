name: Migrate Harbor images to ghcr

# One-time (re-runnable) migration for the Harbor retirement (docs/harbor-retirement.md):
# crane-copy each currently-running Harbor image to ghcr at the SAME tag (digests preserved), so no
# running workload strands when Harbor is decommissioned. Uses the Actions GITHUB_TOKEN for ghcr write
# (no PAT needed) + Tailscale + Harbor creds to read Harbor. Then manifests/values are repointed
# harbor.10.0.0.200.nip.io/library/<x>  ->  ghcr.io/andrelair-platform/<x> (separate PRs).

on:
  workflow_dispatch:
    inputs:
      images:
        description: "space-separated <name>:<tag> under library/ to copy Harbor->ghcr"
        required: false
        default: >-
          postgresql:18.4.0-noavx512
          minio:RELEASE.2025-09-07T16-13-09Z
          litellm-custom:1.90.3-prisma-v5
          mlflow:v2.16.0-psycopg2
          markitdown-proxy:5e88986-amd64
          rag-ingest:dev-6d249b5-amd64
          onlyoffice:97a1b16-amd64
          backstage:2182922-amd64
          ktayl-itsm:32ef4ce-amd64
          indra-ocr:7e709e6
          ktayl-core:e42bf7d
          ktayl-claims:019f4c7
          ktayl-claims-frontend:019f4c7
          ktayl-iam-backend:9549b8d
          ktayl-iam-frontend:9549b8d
          ktayl-underwriting:3a0833e
          ktayl-underwriting-frontend:3a0833e
          minicloud-agent:dea3fd0
          minicloud-crew-agent:668ea0e
          retrieva-frontend:47ff393
          retrieva-assessment-crew:89b174a

permissions:
  contents: read
  packages: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - uses: imjasonh/setup-crane@v0.4

      - name: crane copy Harbor -> ghcr (same tag, digest preserved)
        env:
          HARBOR_USER:     ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          GH_ACTOR:        ${{ github.actor }}
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          IMAGES:          ${{ github.event.inputs.images }}
        run: |
          set -euo pipefail
          crane auth login harbor.10.0.0.200.nip.io -u "$HARBOR_USER" -p "$HARBOR_PASSWORD"
          crane auth login ghcr.io -u "$GH_ACTOR" -p "$GH_TOKEN"
          fail=0
          for img in $IMAGES; do
            src="harbor.10.0.0.200.nip.io/library/${img}"
            dst="ghcr.io/andrelair-platform/${img}"
            echo "::group::copy ${img}"
            if crane copy "$src" "$dst"; then
              echo "✅ ${img}"
            else
              echo "❌ ${img}"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
