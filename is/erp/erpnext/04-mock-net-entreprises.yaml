---
# Mock Net-Entreprises DSN depot — pure Python stdlib, no pip install.
# Simulates the qualification API: accepts multipart/form-data POST at /depot,
# validates DSN phase 3.1 structure, returns CRM ACK XML.
# Accessed by erpnext_dsn via DSN_ENDPOINT=http://mock-net-entreprises:8080/depot
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-net-entreprises-app
  namespace: erp
data:
  app.py: |
    #!/usr/bin/env python3
    """
    Mock Net-Entreprises DSN depot — pure Python stdlib.

    POST /depot  multipart/form-data fields:
      fichier   DSN phase 3.1 text file (UTF-8)
      login     Net-Entreprises login (logged, not validated)
      mdp       password (accepted but not checked)

    Returns CRM (Compte Rendu Métier) XML — same schema as the real API.
    Code 00 = accepted, 99 = rejected with anomalie blocks.
    """
    from __future__ import annotations
    import uuid
    import logging
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from datetime import datetime, timezone
    from email import message_from_bytes
    from email.policy import compat32

    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s %(levelname)s %(message)s",
    )
    logger = logging.getLogger("mock-net-entreprises")

    PORT = 8080
    REQUIRED_BLOCKS = ["S10.G00.00", "S20.G00.05", "S90.G00.90"]
    EXPECTED_VERSION = "S10.G00.00.001:'06.1'"


    def validate_dsn(content: str) -> tuple[bool, list[str], int]:
        errors: list[str] = []
        for block in REQUIRED_BLOCKS:
            if block not in content:
                errors.append(f"Bloc obligatoire absent: {block}")
        if EXPECTED_VERSION not in content:
            errors.append("Version norme invalide — attendu 06.1")
        n = content.count("S20.G00.05.001:")
        return not errors, errors, n


    def build_ack(ref: str, n: int, errors: list[str]) -> bytes:
        now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        ok = not errors
        code = "00" if ok else "99"
        etat = "ACCEPTE" if ok else "REJETE"
        libelle = (
            "Traitement sans erreur — Fichier accepté"
            if ok
            else "Fichier rejeté — Erreur de structure DSN"
        )
        anomalies = "".join(
            f"\n  <crm:anomalie>"
            f"<crm:codeAnomalie>STRUCT-001</crm:codeAnomalie>"
            f"<crm:libelleAnomalie>{e}</crm:libelleAnomalie>"
            f"</crm:anomalie>"
            for e in errors
        )
        xml = (
            '<?xml version="1.0" encoding="UTF-8"?>\n'
            '<crm:compteRenduMetier xmlns:crm="urn:net-entreprises:crm:1.0" version="1.0">\n'
            f"  <crm:identifiantEnvoi>{ref}</crm:identifiantEnvoi>\n"
            f"  <crm:dateTraitement>{now}</crm:dateTraitement>\n"
            f"  <crm:etatTraitement>{etat}</crm:etatTraitement>\n"
            f"  <crm:codeRetour>{code}</crm:codeRetour>\n"
            f"  <crm:libelleRetour>{libelle}</crm:libelleRetour>\n"
            "  <crm:statistiques>\n"
            f"    <crm:nombreIndividus>{n}</crm:nombreIndividus>\n"
            "    <crm:nombreDeclarations>1</crm:nombreDeclarations>\n"
            f"  </crm:statistiques>{anomalies}\n"
            "</crm:compteRenduMetier>"
        )
        return xml.encode("utf-8")


    def parse_multipart(body: bytes, content_type: str) -> dict[str, bytes]:
        msg = message_from_bytes(
            b"Content-Type: " + content_type.encode() + b"\r\n\r\n" + body,
            policy=compat32,
        )
        fields: dict[str, bytes] = {}
        payload = msg.get_payload()
        if not isinstance(payload, list):
            return fields
        for part in payload:
            disp = part.get("Content-Disposition", "")
            name = None
            for seg in disp.split(";"):
                seg = seg.strip()
                if seg.startswith("name="):
                    name = seg[5:].strip('"')
            if name is None:
                continue
            raw = part.get_payload(decode=True)
            if raw is None:
                raw = (part.get_payload() or "").encode()
            fields[name] = raw
        return fields


    class DSNHandler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            logger.info(fmt, *args)

        def do_GET(self):
            if self.path == "/health":
                self._respond(200, b'{"status":"ok","service":"mock-net-entreprises"}',
                               "application/json")
            else:
                self._respond(404, b'{"error":"not found"}', "application/json")

        def do_POST(self):
            if self.path != "/depot":
                self._respond(404, b'{"error":"not found"}', "application/json")
                return

            ref = str(uuid.uuid4())[:8].upper()
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length)
            ct = self.headers.get("Content-Type", "")

            try:
                fields = parse_multipart(body, ct)
            except Exception as exc:
                logger.error("[%s] multipart parse error: %s", ref, exc)
                self._respond(400, build_ack(ref, 0, [f"Erreur parsing requête: {exc}"]),
                               "application/xml")
                return

            fichier_bytes = fields.get("fichier")
            login = (fields.get("login") or b"unknown").decode("utf-8", errors="replace")

            if not fichier_bytes:
                logger.warning("[%s] champ 'fichier' absent", ref)
                self._respond(400, build_ack(ref, 0, ["Champ 'fichier' manquant"]),
                               "application/xml")
                return

            content = fichier_bytes.decode("utf-8", errors="replace")
            logger.info("[%s] login=%s taille=%d octets", ref, login, len(content))
            for i, line in enumerate(content.splitlines()[:25]):
                logger.info("[%s] L%02d %s", ref, i + 1, line)

            ok, errors, n = validate_dsn(content)
            logger.info("[%s] %s individus=%d erreurs=%s",
                        ref, "ACCEPTE" if ok else "REJETE", n, errors or "aucune")
            self._respond(200, build_ack(ref, n, errors), "application/xml")

        def _respond(self, code: int, body: bytes, mime: str):
            self.send_response(code)
            self.send_header("Content-Type", f"{mime}; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)


    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", PORT), DSNHandler)
        logger.info("mock-net-entreprises démarré sur :%d", PORT)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-net-entreprises
  namespace: erp
  labels:
    app: mock-net-entreprises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-net-entreprises
  template:
    metadata:
      labels:
        app: mock-net-entreprises
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mock
          image: python:3.11-slim
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: app
          configMap:
            name: mock-net-entreprises-app
---
apiVersion: v1
kind: Service
metadata:
  name: mock-net-entreprises
  namespace: erp
spec:
  selector:
    app: mock-net-entreprises
  ports:
    - name: http
      port: 8080
      targetPort: 8080
