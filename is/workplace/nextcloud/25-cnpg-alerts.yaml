# Alert on stale CNPG backups / unhealthy cluster for nextcloud-postgres. CNPG exports
# cnpg_collector_last_available_backup_timestamp + cnpg_collector_up per cluster via the
# PodMonitor enabled on the Cluster. Placed in the monitoring namespace (kps rule selector);
# applied there by the nextcloud app (monitoring is an allowed AppProject destination, same as
# the cnpg-authentik app which applies its rule here).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-nextcloud
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kps
spec:
  groups:
    - name: cnpg-nextcloud
      # Backup-staleness now covered generically for every CNPG cluster by CNPGBackupStale in
      # platform/storage/backup-dr/00-prometheusrule.yaml (verified: it evaluates ns=nextcloud) —
      # the per-cluster BackupStale was removed here. The health alert stays (no generic equivalent yet).
      rules:
        - alert: CNPGNextcloudNotHealthy
          expr: |
            max(cnpg_collector_up{namespace="nextcloud"}) < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Nextcloud CNPG cluster reporting unhealthy"
            description: |
              The nextcloud-postgres CloudNativePG cluster is not reporting healthy instances.
              Nextcloud's DB is backed by this cluster → the workplace file/metadata store is at risk.
              Check: kubectl -n nextcloud get cluster nextcloud-postgres -o wide
