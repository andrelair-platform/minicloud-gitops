apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n-credentials
  namespace: automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: n8n-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: platform/n8n
        property: encryption_key
    - secretKey: N8N_SMTP_PASS
      remoteRef:
        key: platform/mail
        property: smtp-relay-password
---
# HR-12 non-access fan-out credentials (the GLPI software-provisioning ticket + the
# HMAC verification key). Source of truth = Vault (platform/glpi + platform/hr-lifecycle);
# ESO renders the secret the n8n Deployment consumes via `envFrom`. The GLPI tokens are
# (re)provisioned into Vault by minicloud-ops scripts/glpi/enable-api.sh; the signing key
# is the SAME key ERPNext signs with (platform/hr-lifecycle) — single source of truth so
# producer and consumer can never drift.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n-hr-glpi
  namespace: automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: n8n-hr-glpi
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GLPI_APP_TOKEN
      remoteRef:
        key: platform/glpi
        property: app-token
    - secretKey: GLPI_USER_TOKEN
      remoteRef:
        key: platform/glpi
        property: user-token
    - secretKey: GLPI_API_URL
      remoteRef:
        key: platform/glpi
        property: api-url
    - secretKey: HR_LIFECYCLE_SIGNING_KEY
      remoteRef:
        key: platform/hr-lifecycle
        property: signing-key
---
# ADR-013 — the ktayl-iam ↔ ERPNext integration creds the external-collaborator onboarding workflow uses:
# the ERPNext service token (HR Manager, creates the non-payroll Employee) + the IAM service key (to call
# the hr-worker-ref writeback). Source of truth = Vault (platform/ktayl-iam-integration, written by break-glass).
# Consumed by the n8n Deployment via envFrom → the workflow reads them as $env.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n-iam-integration
  namespace: automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: n8n-iam-integration
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ERPNEXT_API_KEY
      remoteRef:
        key: platform/ktayl-iam-integration
        property: erpnext-api-key
    - secretKey: ERPNEXT_API_SECRET
      remoteRef:
        key: platform/ktayl-iam-integration
        property: erpnext-api-secret
    - secretKey: IAM_SERVICE_KEY
      remoteRef:
        key: platform/ktayl-iam-integration
        property: service-key
