apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: n8n
    spec:
      priorityClassName: minicloud-workload
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.32.7
          ports:
            - containerPort: 5678
          env:
            - name: N8N_HOST
              value: "n8n.devandre.sbs"
            - name: N8N_PROTOCOL
              value: "https"
            - name: N8N_PORT
              value: "5678"
            - name: WEBHOOK_URL
              value: "https://n8n.devandre.sbs/"
            - name: GENERIC_TIMEZONE
              value: "Europe/Paris"
            - name: DB_TYPE
              value: "sqlite"
            - name: N8N_EMAIL_MODE
              value: "smtp"
            - name: N8N_SMTP_HOST
              value: "stalwart.mail.svc.cluster.local"
            - name: N8N_SMTP_PORT
              value: "587"
            - name: N8N_SMTP_USER
              value: "admin@devandre.sbs"
            - name: N8N_SMTP_SENDER
              value: "n8n@devandre.sbs"
            - name: N8N_SMTP_SSL
              value: "false"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
            # HR-12 fan-out: let workflow nodes read the GLPI tokens + signing key via $env
            # (n8n blocks env access in nodes by default). See the hr-lifecycle fan-out workflow.
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
            # allow the fan-out Code node to `require('crypto')` for HMAC signature verification
            - name: NODE_FUNCTION_ALLOW_BUILTIN
              value: "crypto"
          envFrom:
            - secretRef:
                name: n8n-credentials
            # HR-12 non-access fan-out creds: GLPI_APP_TOKEN, GLPI_USER_TOKEN, GLPI_API_URL,
            # HR_LIFECYCLE_SIGNING_KEY — rendered by ESO from Vault (platform/glpi +
            # platform/hr-lifecycle) via the n8n-hr-glpi ExternalSecret (01-externalsecret.yaml).
            # GLPI tokens are (re)provisioned into Vault by minicloud-ops scripts/glpi/enable-api.sh.
            - secretRef:
                name: n8n-hr-glpi
                optional: true
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
