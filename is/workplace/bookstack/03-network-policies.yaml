---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: intranet
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: intranet
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# BookStack web is reached only via ingress-nginx (public route lands here via the CF tunnel).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: intranet
spec:
  podSelector:
    matchLabels:
      app: bookstack
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: intranet
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: intranet
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: intranet
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
# BookStack → its MariaDB (same namespace) on 3306.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-mariadb
  namespace: intranet
spec:
  podSelector:
    matchLabels:
      app: bookstack
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: bookstack-mariadb
      ports:
        - {port: 3306}
---
# BookStack → Authentik for OIDC (discovery/token/jwks/userinfo) uses the PUBLIC issuer
# auth.devandre.sbs (required so the browser front-channel gets a reachable authorize URL). Inside the
# cluster, split-horizon DNS resolves auth.devandre.sbs → the ingress VIP 10.0.0.200, so the
# back-channel stays IN-cluster (no internet hairpin). Allow 443 to the ingress-nginx pods AND the VIP
# (10.0.0.200) — one of the two matches depending on how Cilium classifies the DNAT'd VIP. The cert
# there is minicloud-CA signed → the pod trusts it via the CA-trust initContainer (see the Deployment).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-oidc-ingress
  namespace: intranet
spec:
  podSelector:
    matchLabels:
      app: bookstack
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - ipBlock:
            cidr: 10.0.0.200/32
      ports:
        - {port: 443, protocol: TCP}
