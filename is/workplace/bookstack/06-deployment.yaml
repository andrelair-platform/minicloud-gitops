---
# BookStack web (intranet wiki / governance knowledge base). linuxserver image: nginx + php-fpm via
# s6-overlay. Native OIDC SSO to Authentik (per-user identity + group->role, for per-shelf roles).
# Single replica, RWO /config PVC -> strategy Recreate. No hostname pin (Longhorn is network-attached).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstack
  namespace: intranet
  annotations:
    # linuxserver/* uses s6-overlay which MUST start as root (uid 0) to set up perms then drops to
    # PUID/PGID 1000 — so it cannot satisfy runAsNonRoot (CKV_K8S_23), and its s6+nginx init needs the
    # default cap set (chown/setuid/setgid/net_bind), so capabilities cannot be fully dropped
    # (CKV_K8S_37). NET_RAW is dropped as the meaningful reduction. Every other control is kept
    # (read-only rootfs, no SA token, seccomp, resource limits, default-deny netpols, OIDC-gated,
    # not anon-public). Checkov reads these skips from the resource's OWN metadata.
    checkov.io/skip1: CKV_K8S_23=linuxserver s6-overlay requires root start; drops to PUID/PGID 1000
    checkov.io/skip2: CKV_K8S_37=s6+nginx init needs default caps (chown/setuid/net_bind); NET_RAW dropped
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookstack
  template:
    metadata:
      labels:
        app: bookstack
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Append the minicloud CA to the image's own public CA bundle (preserving public trust) so
        # BookStack's OIDC back-channel trusts the internal, minicloud-CA-signed auth.devandre.sbs
        # endpoint. Writes the combined bundle to an emptyDir the main container mounts over its
        # /etc/ssl/certs/ca-certificates.crt. Uses the same image to match the base bundle.
        - name: ca-trust
          image: ghcr.io/linuxserver/bookstack:26.09.1
          command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /ca-src/ca.crt > /ca-shared/ca-certificates.crt"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [NET_RAW]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: ca-src
              mountPath: /ca-src
              readOnly: true
            - name: ca-shared
              mountPath: /ca-shared
      containers:
        - name: bookstack
          image: ghcr.io/linuxserver/bookstack:26.09.1  # same image as lscr.io; ghcr is on the allowed-registries list
          ports:
            - containerPort: 80
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
            - name: APP_URL
              value: https://intranet.devandre.sbs
            - name: DB_HOST
              value: bookstack-mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: bookstack
            - name: DB_USERNAME
              value: bookstack
            # OIDC SSO -> Authentik (public issuer; back-channel hairpins via Cloudflare)
            - name: AUTH_METHOD
              value: oidc
            - name: AUTH_AUTO_INITIATE
              value: "false"
            - name: OIDC_NAME
              value: Authentik
            - name: OIDC_DISPLAY_NAME_CLAIMS
              value: name
            - name: OIDC_ISSUER
              value: https://auth.devandre.sbs/application/o/bookstack/
            - name: OIDC_ISSUER_DISCOVER
              value: "true"
            - name: OIDC_ADDITIONAL_SCOPES
              value: groups
            - name: OIDC_GROUPS_CLAIM
              value: groups
            - name: OIDC_USER_TO_GROUPS
              value: "true"
            - name: OIDC_REMOVE_FROM_GROUPS
              value: "true"
          envFrom:
            - secretRef:
                name: bookstack-app-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [NET_RAW]
          readinessProbe:
            httpGet:
              path: /status
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /status
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /config
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: ca-shared
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bookstack-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: ca-src
          configMap:
            name: minicloud-ca-bundle
        - name: ca-shared
          emptyDir: {}
