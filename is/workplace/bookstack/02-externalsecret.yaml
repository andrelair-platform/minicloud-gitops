---
# BookStack DB credentials (MariaDB root + bookstack-user password) from Vault.
# SEED (owner, read -s, never on the command line):
#   vault kv put secret/platform/bookstack mariadb-root-password=<...> mariadb-password=<...> app-key=base64:<...> oidc-client-secret=<...>
# (app-key + oidc-client-secret are consumed by the BookStack app in the next Phase-0 step.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bookstack-db-secret
  namespace: intranet
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bookstack-db-secret
    creationPolicy: Owner
  data:
    - secretKey: mariadb-root-password
      remoteRef:
        key: platform/bookstack
        property: mariadb-root-password
    - secretKey: mariadb-password
      remoteRef:
        key: platform/bookstack
        property: mariadb-password
