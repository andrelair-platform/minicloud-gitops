# Alert on stale CNPG backups / unhealthy cluster for synapse-postgres. CNPG exports
# cnpg_collector_last_available_backup_timestamp + cnpg_collector_up per cluster via the PodMonitor
# enabled on the Cluster. Placed in the monitoring namespace (kps rule selector); applied there by
# the matrix-synapse app (project minicloud-platform allows the monitoring destination, same as the
# cnpg-nextcloud/langfuse rules). Mirrored from nextcloud/langfuse.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-synapse
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kps
spec:
  groups:
    - name: cnpg-synapse
      # Backup-staleness now covered generically for every CNPG cluster by CNPGBackupStale in
      # platform/storage/backup-dr/00-prometheusrule.yaml (verified: it evaluates ns=chat) —
      # the per-cluster BackupStale was removed here. The health alert stays (no generic equivalent yet).
      rules:
        - alert: CNPGSynapseNotHealthy
          expr: |
            max(cnpg_collector_up{namespace="chat"}) < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Synapse CNPG cluster reporting unhealthy"
            description: |
              The synapse-postgres CloudNativePG cluster is not reporting healthy instances.
              Matrix/Synapse's DB is backed by this cluster → the chat service is at risk.
              Check: kubectl -n chat get cluster synapse-postgres -o wide
