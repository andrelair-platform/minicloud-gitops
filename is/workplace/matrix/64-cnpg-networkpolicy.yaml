# Allow the CloudNativePG operator (cnpg-system) to reach the synapse-postgres instances'
# status endpoint (:8000) + Postgres (:5432). Without it, chat's default-deny-ingress drops the
# operator's https://<pod>:8000/pg/status probe → the cluster never goes healthy (authentik-cnpg
# lesson; mirrored from nextcloud/langfuse). Synapse → DB (:5432) is already covered by the ns
# allow-same-namespace policy; Prometheus scrape (:9187) by allow-monitoring-scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator-synapse
  namespace: chat
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: synapse-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
