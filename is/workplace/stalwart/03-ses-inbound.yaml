---
# ESO ExternalSecret — pulls SES inbound credentials from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ses-inbound-secret
  namespace: mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ses-inbound-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: secret/platform/ses-inbound
        property: aws-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/platform/ses-inbound
        property: aws-secret-access-key
    - secretKey: SQS_QUEUE_URL
      remoteRef:
        key: secret/platform/ses-inbound
        property: sqs-url
    - secretKey: S3_BUCKET
      remoteRef:
        key: secret/platform/ses-inbound
        property: s3-bucket
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: secret/platform/ses-inbound
        property: aws-region
---
# ConfigMap — Python long-poll injector script
apiVersion: v1
kind: ConfigMap
metadata:
  name: ses-inbound-script
  namespace: mail
data:
  injector.py: |
    #!/usr/bin/env python3
    """
    SES Inbound Injector — polls SQS for new email notifications,
    downloads raw email from S3, injects into Stalwart via SMTP.
    """
    import os, json, boto3, smtplib, email, logging, time

    logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(message)s')
    log = logging.getLogger('ses-inbound')

    SQS_URL     = os.environ['SQS_QUEUE_URL']
    S3_BUCKET   = os.environ['S3_BUCKET']
    REGION      = os.environ.get('AWS_DEFAULT_REGION', 'eu-west-1')
    STALWART    = os.environ.get('STALWART_HOST', 'stalwart.mail.svc.cluster.local')
    SMTP_PORT   = int(os.environ.get('STALWART_PORT', '25'))
    # Only inject recipients whose domain Stalwart is authoritative for. SES's
    # `destination` lists EVERY To/Cc address, including external ones (e.g. gmail)
    # that SES already delivered directly — relaying those via Stalwart earns a
    # `550 Relay not allowed` on every attempt, and the retry loop then trips
    # Stalwart's rate limiter (`452`) so even the local recipient stops delivering.
    # Filtering to local domains eliminates that self-inflicted storm.
    LOCAL_DOMAINS = {d.strip().lower()
                     for d in os.environ.get('LOCAL_DOMAINS', 'devandre.sbs').split(',')
                     if d.strip()}
    # On a transient 4xx (Stalwart `452 Rate limit exceeded`) back off HARD so the
    # server's rate window can drain — knocking every few seconds keeps the bucket
    # saturated forever (the 2026-09-18 backlog stall). This self-paces delivery to
    # under Stalwart's limit instead of storming it.
    RATE_LIMIT_BACKOFF = int(os.environ.get('RATE_LIMIT_BACKOFF', '60'))

    sqs = boto3.client('sqs', region_name=REGION)
    s3  = boto3.client('s3',  region_name=REGION)

    class RateLimited(Exception):
        """All local recipients transiently refused (4xx) → retry after a long backoff."""

    def is_local(addr):
        return addr.rsplit('@', 1)[-1].lower() in LOCAL_DOMAINS

    def inject(raw_bytes, mail_from, rcpt_tos):
        try:
            with smtplib.SMTP(STALWART, SMTP_PORT, timeout=30) as smtp:
                smtp.ehlo('ses-inbound.mail.svc.cluster.local')
                # If ALL recipients are refused, sendmail raises SMTPRecipientsRefused
                # (no DATA sent). If some succeed it returns the refused ones.
                refused = smtp.sendmail(mail_from, rcpt_tos, raw_bytes)
        except smtplib.SMTPRecipientsRefused as e:
            refused = e.recipients
            if any(400 <= code < 500 for code, _ in refused.values()):
                # transient (rate limit) → retry later, do NOT delete
                raise RateLimited(f'all recipients transiently refused: {refused}')
            # all permanent (e.g. 550 mailbox does not exist) → nothing to do; drop
            # so it is not retried forever.
            log.warning('All recipients permanently refused (dropping): %s', refused)
            return
        transient = {r: v for r, v in refused.items() if 400 <= v[0] < 500}
        if transient:
            raise RateLimited(f'transient refusal after partial delivery: {transient}')
        if refused:
            log.warning('Permanently refused (dropped): %s', refused)
        log.info('Delivered %s → %s', mail_from,
                 [r for r in rcpt_tos if r not in refused])

    def process(msg):
        body = json.loads(msg['Body'])
        # SNS wraps the SES notification in Message field
        notification = json.loads(body['Message']) if 'Message' in body else body
        receipt = notification.get('receipt', {})
        mail    = notification.get('mail', {})

        # When receipt rule has both S3 and SNS actions, the SNS notification
        # describes the SNS action (type=SNS), not the S3 action. The S3 object
        # key is the inbound messageId assigned by SES, stored at {prefix}{messageId}.
        action    = receipt.get('action', {})
        mail_from = mail.get('source', '')
        rcpt_tos  = [r for r in mail.get('destination', []) if is_local(r)]

        # Try objectKey first (in case rule has only S3 action sending to SNS),
        # then fall back to mail.messageId (standard dual S3+SNS action setup).
        s3_key = action.get('objectKey', '') or f"inbound/{mail.get('messageId', '')}"

        if not s3_key or s3_key == 'inbound/':
            log.warning('No S3 key in notification, skipping. action=%s', action)
            return

        if not rcpt_tos:
            # Nothing Stalwart is authoritative for (external-only recipients that
            # SES already delivered). Clean up so it is not retried forever.
            log.info('No local recipients in %s; dropping S3 object.', s3_key)
            s3.delete_object(Bucket=S3_BUCKET, Key=s3_key)
            return

        log.info('Fetching s3://%s/%s', S3_BUCKET, s3_key)
        obj = s3.get_object(Bucket=S3_BUCKET, Key=s3_key)
        raw = obj['Body'].read()

        inject(raw, mail_from, rcpt_tos)

        # Clean up S3 object after successful delivery
        s3.delete_object(Bucket=S3_BUCKET, Key=s3_key)

    def main():
        log.info('SES inbound injector started — queue: %s (local domains: %s)',
                 SQS_URL, ','.join(sorted(LOCAL_DOMAINS)))
        while True:
            try:
                resp = sqs.receive_message(
                    QueueUrl=SQS_URL,
                    MaxNumberOfMessages=10,
                    WaitTimeSeconds=20,
                )
                for msg in resp.get('Messages', []):
                    try:
                        process(msg)
                        sqs.delete_message(
                            QueueUrl=SQS_URL,
                            ReceiptHandle=msg['ReceiptHandle'],
                        )
                    except RateLimited as e:
                        # Stalwart rate-limited us → give its window time to drain
                        # (leave the message on the queue; it retries next poll).
                        log.warning('Rate limited, backing off %ss: %s',
                                    RATE_LIMIT_BACKOFF, e)
                        time.sleep(RATE_LIMIT_BACKOFF)
                    except Exception as e:
                        # Back off so any other transient error can't become a
                        # tight hammering loop.
                        log.error('Failed to process message: %s', e)
                        time.sleep(3)
            except Exception as e:
                log.error('SQS poll error: %s', e)
                time.sleep(5)

    if __name__ == '__main__':
        main()
---
# Deployment — runs the injector in the mail namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ses-inbound
  namespace: mail
  labels:
    app: ses-inbound
    backstage.io/kubernetes-id: ses-inbound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ses-inbound
  template:
    metadata:
      labels:
        app: ses-inbound
        backstage.io/kubernetes-id: ses-inbound
      annotations:
        # Bump when injector.py changes so ArgoCD sync rolls the pod (the running
        # process does not re-read the mounted script). v2 = local-recipient filter;
        # v3 = rate-limit-aware backoff + drop permanently-refused messages.
        ses-inbound/injector-version: "3"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # Install boto3 into a shared emptyDir so the main container picks it up
        - name: install-deps
          image: python:3.12-slim
          command: ["pip", "install", "--target=/deps", "-q", "boto3"]
          volumeMounts:
            - name: deps
              mountPath: /deps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
      containers:
        - name: injector
          image: python:3.12-slim
          command: ["python3", "/scripts/injector.py"]
          env:
            - name: PYTHONPATH
              value: /deps
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ses-inbound-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ses-inbound-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: ses-inbound-secret
                  key: SQS_QUEUE_URL
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: ses-inbound-secret
                  key: S3_BUCKET
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: ses-inbound-secret
                  key: AWS_DEFAULT_REGION
            - name: STALWART_HOST
              value: stalwart.mail.svc.cluster.local
            - name: STALWART_PORT
              value: "25"
            - name: LOCAL_DOMAINS
              value: devandre.sbs
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: deps
              mountPath: /deps
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
      volumes:
        - name: script
          configMap:
            name: ses-inbound-script
            defaultMode: 0755
        - name: deps
          emptyDir: {}
