# Connection to the analytics Postgres (medallion DB). All values from env (ESO-injected in-cluster).
ktayl_analytics:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('ANALYTICS_PG_HOST') }}"
      port: "{{ env_var('ANALYTICS_PG_PORT', '5432') | int }}"
      user: "{{ env_var('ANALYTICS_PG_USER') }}"
      password: "{{ env_var('ANALYTICS_PG_PASSWORD') }}"
      dbname: "{{ env_var('ANALYTICS_PG_DB', 'analytics') }}"
      schema: business
      threads: 2
      sslmode: prefer
