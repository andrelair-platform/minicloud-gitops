version: 2

models:
  - name: policy_portfolio
    description: >
      Data product — one row per policy with premium (scheduled/paid/annualised) and total insured
      amount (TIV). The seed of the P2 portfolio view and the P1/P3 exposure view. Grain = policy.
    columns:
      - name: policy_id
        tests: [unique, not_null]
      - name: policy_number
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values: { values: ['draft','active','suspended','terminated'] }
      - name: scheduled_premium_minor
        description: "Sum of premium installment amounts (minor units). ≥ paid."
      - name: annualised_premium_eur
        description: "GWP proxy — Σ(installment × cadence multiplier) ÷ 100. Confirm minor-unit + installment semantics with the Policy domain before treating as authoritative GWP."
      - name: total_insured_amount_eur
        description: "TIV — Σ coverage insured_amount ÷ 100. Exposure seed for accumulation (P1/P3)."
