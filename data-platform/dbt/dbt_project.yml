name: ktayl_data_platform
version: 1.0.0
config-version: 2

# Data Platform Slice 1 — Policy Portfolio, grounded on the LIVE ktayl-policy-service source.
# Doctrine (EA blueprint): one thin vertical slice against a real source → just-enough medallion
# → one data product. NOT a generic connector framework for unbuilt sources.

profile: ktayl_analytics

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  ktayl_data_platform:
    staging:
      +schema: curated        # medallion: staging/curated layer
      +materialized: view
    marts:
      +schema: business       # medallion: business/serve layer (what Metabase reads)
      +materialized: table
