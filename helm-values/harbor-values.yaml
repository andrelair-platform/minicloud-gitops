# harborAdminPassword intentionally omitted — stored at ~/.harbor-admin on controller (mode 600).
# Harbor stores the admin password in its database; omitting prevents ArgoCD from resetting it.
# ArgoCD ignoreDifferences in apps/harbor.yaml covers the HARBOR_ADMIN_PASSWORD Secret field.
expose:
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
    className: nginx
    controller: default
    hosts:
      core: harbor.10.0.0.200.nip.io
  tls:
    certSource: secret
    enabled: true
    secret:
      secretName: harbor-tls-cert
  type: ingress
externalURL: https://harbor.devandre.sbs
persistence:
  persistentVolumeClaim:
    database:
      storageClass: longhorn
    jobservice:
      storageClass: longhorn
    redis:
      storageClass: longhorn
    registry:
      size: 20Gi
      storageClass: longhorn
    trivy:
      storageClass: longhorn
trivy:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

core:
  nodeSelector:
    kubernetes.io/hostname: fast-skunk

jobservice:
  nodeSelector:
    kubernetes.io/hostname: fast-skunk

registry:
  nodeSelector:
    kubernetes.io/hostname: fast-skunk
  controller:
    livenessProbe:
      timeoutSeconds: 15
    readinessProbe:
      timeoutSeconds: 15

database:
  internal:
    # Default /docker-healthcheck.sh probes: timeout=1s period=10s — accumulate
    # zombie processes under CPU pressure on fast-heron.
    livenessProbe:
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
