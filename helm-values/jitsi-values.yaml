publicURL: "https://meet.devandre.sbs"
tz: "Europe/Paris"

# External TURN server: Coturn on the controller (192.168.1.130), reachable
# from the internet via home router port-forward 3478+49152-49199 → 192.168.1.130.
# DNS: turn.devandre.sbs A 37.65.57.112 (unproxied).
# coturn.enabled=false: we run Coturn externally as Docker+systemd on the controller.
# TURN config injected into prosody via extraEnvFrom (chart gates it on coturn.enabled).
#
# IPv6 direct path (SFR DS-Lite / CGNAT clients): WebRTC browsers always request
# REQUESTED-ADDRESS-FAMILY=IPv4 for TURN allocations, so TURN cannot relay for
# DS-Lite clients whose inbound IPv4 is blocked at the AFTR. Instead JVB advertises
# its own IPv6 host candidates (star-kitten has global /64 from SFR RA) and phones
# connect directly over IPv6, bypassing TURN entirely.
# PREREQUISITE on star-kitten: sudo ufw allow 10000/udp
# SFR box GR140IG IPv6 rule (Sécurité→Accès→Réseau v6): dest=star-kitten IPv6, UDP 10000.
turnHost: "turn.devandre.sbs"

# No per-meeting JWT auth. Authentik forward-auth on the NGINX ingress
# protects access at the HTTP level — all employees authenticate via SSO
# before reaching any Jitsi UI. Room names serve as the shared secret inside.
enableAuth: false
enableGuests: true

# XMPP WebSocket disabled: NGINX + Cloudflare proxy can break WS upgrades on
# these paths. Colibri SCTP is the default JVB signalling channel.
websockets:
  colibri:
    enabled: false
  xmpp:
    enabled: false

web:
  replicaCount: 1

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: minicloud-ca
      cert-manager.io/duration: "2160h"
      cert-manager.io/renew-before: "720h"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/server-snippet: |
        location /outpost.goauthentik.io {
            proxy_pass              http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io;
            proxy_set_header        Host $host;
            proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
            add_header              Set-Cookie $auth_cookie;
            auth_request_set        $auth_cookie $upstream_http_set_cookie;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
        }
        location @goauthentik_proxy_signin {
            internal;
            add_header Set-Cookie $auth_cookie;
            return 302 /outpost.goauthentik.io/start?rd=$request_uri;
        }
      nginx.ingress.kubernetes.io/configuration-snippet: |
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page       401 = @goauthentik_proxy_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie $auth_cookie;
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        proxy_set_header X-authentik-username $authentik_username;
    hosts:
      - host: meet.devandre.sbs
        paths:
          - /
      - host: meet.10.0.0.200.nip.io
        paths:
          - /
    tls:
      - secretName: jitsi-tls
        hosts:
          - meet.devandre.sbs
          - meet.10.0.0.200.nip.io

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

prosody:
  # Inject TURN config — chart only does this when coturn.enabled=true,
  # so we bypass it via extraEnvFrom with our own ConfigMap + ESO secret.
  extraEnvFrom:
    - configMapRef:
        name: jitsi-coturn-config    # STUN_HOST, TURN_HOST, TURN_PORT, TURN_TRANSPORT
    - secretRef:
        name: jitsi-coturn-secret    # TURN_CREDENTIALS (HMAC shared secret)

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

jicofo:
  xmpp:
    # ESO-managed secret from Vault secret/platform/jitsi
    existingSecretName: jitsi-jicofo-secret

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

jvb:
  # Pin JVB to star-kitten (10.0.0.8). hostNetwork exposes all of star-kitten's
  # interfaces: 10.0.0.8 (LAN/Tailscale), 2a02:8424:6ee0:be01:fa75:a4ff:fef9:2fe9
  # and :fedd:dc5a (SFR RA global IPv6). JVB gathers all as host candidates.
  # - Tailscale/LAN clients: direct UDP to 10.0.0.8:10000
  # - SFR 5G clients (DS-Lite): direct UDP over IPv6 to star-kitten's IPv6:10000
  # - Other external clients: TURN relay via coturn on the controller
  useHostNetwork: true
  nodeSelector:
    kubernetes.io/hostname: star-kitten

  # 10.0.0.8 advertised for Tailscale/LAN clients. IPv6 candidates are gathered
  # automatically from host interfaces — no publicIPs entry needed for IPv6.
  publicIPs:
    - "10.0.0.8"
  stunServers: "turn.devandre.sbs:3478"
  useNodeIP: false

  UDPPort: 10000

  service:
    enabled: true
    type: ClusterIP

  xmpp:
    # ESO-managed secret from Vault secret/platform/jitsi
    existingSecretName: jitsi-jvb-secret

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 512Mi }

  metrics:
    enabled: false

coturn:
  enabled: false
