# harborAdminPassword intentionally omitted — stored at ~/.harbor-admin on controller (mode 600).
# Harbor stores the admin password in its database; omitting prevents ArgoCD from resetting it.
# ArgoCD ignoreDifferences in apps/harbor.yaml covers the HARBOR_ADMIN_PASSWORD Secret field.
expose:
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
    className: nginx
    controller: default
    hosts:
      core: harbor.10.0.0.200.nip.io
  tls:
    certSource: secret
    enabled: true
    secret:
      secretName: harbor-tls-cert
  type: ingress
# Harbor is Tailscale-only (operator tool, gitops#1180) — externalURL must be the
# internal host or the Harbor UI OIDC login redirects to the removed public route
# and 404s. NOTE: this does NOT affect the registry token realm (docker login/pull),
# which is derived from the request host and is already harbor.10.0.0.200.nip.io.
externalURL: https://harbor.10.0.0.200.nip.io
persistence:
  persistentVolumeClaim:
    database:
      storageClass: longhorn
    jobservice:
      storageClass: longhorn
    redis:
      storageClass: longhorn
    registry:
      size: 40Gi   # expanded from 20Gi (2026-08-24) — registry was 91% full, blobs not persisting → ImagePullBackOff
      storageClass: longhorn
    trivy:
      storageClass: longhorn
trivy:
  enabled: true
  # Off the control-plane node (set-hog) → a worker (SPOF hardening, epic #1189). Pinned
  # to loving-gannet, which already holds a healthy replica of trivy's Longhorn volume
  # (fast local attach). Still pinned (RWO placement stability); failover-unpinning is a
  # later pass once Longhorn node-down handling is trusted.
  nodeSelector:
    kubernetes.io/hostname: loving-gannet

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

caBundleSecretName: minicloud-ca-bundle

core:
  priorityClassName: minicloud-critical
  existingSecret: harbor-stable-secrets
  existingSecretKey: secret
  # No node pin — harbor-core is stateless (config from secret + DB), so it reschedules
  # to any healthy node on failure. (registry/jobservice/trivy keep pins: they own PVCs.)

updateStrategy:
  type: Recreate

jobservice:
  priorityClassName: minicloud-critical
  existingSecret: harbor-stable-secrets
  existingSecretKey: JOBSERVICE_SECRET
  nodeSelector:
    kubernetes.io/hostname: fast-skunk

registry:
  priorityClassName: minicloud-critical
  nodeSelector:
    kubernetes.io/hostname: fast-skunk
  controller:
    livenessProbe:
      timeoutSeconds: 15
    readinessProbe:
      timeoutSeconds: 15

redis:
  nodeSelector:
    kubernetes.io/hostname: set-hog

database:
  nodeSelector:
    kubernetes.io/hostname: set-hog
  internal:
    # Default /docker-healthcheck.sh probes: timeout=1s period=10s — accumulate
    # zombie processes under CPU pressure on fast-heron.
    livenessProbe:
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
