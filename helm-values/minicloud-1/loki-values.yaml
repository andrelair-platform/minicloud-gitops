backend:
  replicas: 0
chunksCache:
  enabled: false
deploymentMode: SingleBinary
gateway:
  enabled: false
loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  compactor:
    delete_request_store: filesystem
    retention_delete_delay: 2h
    retention_enabled: true
    working_directory: /var/loki/compactor
  limits_config:
    allow_structured_metadata: true
    retention_period: 720h
    volume_enabled: true
    # Promote OTel resource attributes to Loki stream labels when logs arrive
    # via the OTLP endpoint (/otlp/v1/logs) from the OTel Collector DaemonSet.
    # Short-name attributes (namespace, pod, etc.) are set by the OTel
    # transformprocessor to maintain backward compatibility with Promtail labels
    # and existing Grafana dashboards.
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes:
              - namespace
              - pod
              - node_name
              - container
              - app
              - job
      log_attributes:
        - action: index_label
          attributes:
            - level
  schemaConfig:
    configs:
    - from: "2025-01-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
lokiCanary:
  enabled: false
minio:
  enabled: false
monitoring:
  lokiCanary:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: true
read:
  replicas: 0
resultsCache:
  enabled: false
singleBinary:
  nodeSelector:
    kubernetes.io/hostname: set-hog
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 30Gi
    storageClass: longhorn
  replicas: 1
  podAnnotations:
    reloader.stakater.com/auto: "true"
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  # Pass alertmanager URL via CLI flag: the Loki chart v7.0.0 generates the
  # ruler: config block in its Helm template and overwrites any loki.ruler.*
  # values set in values.yaml. The -ruler.alertmanager-url flag bypasses this.
  extraArgs:
    - -ruler.alertmanager-url=http://kps-alertmanager.monitoring.svc:9093
  # Loki local ruler storage: <dir>/<tenant>/<namespace> where <namespace>
  # is a plain YAML FILE. subPath mounts the ConfigMap key as a file.
  # Namespace is "minicloud-alerts" (not "minicloud") to avoid the stale
  # directory left at /var/loki/rules/fake/minicloud by PR #233 — the ruler
  # skips directories when listing, so the stale dir is silently ignored.
  # API path: GET /loki/api/v1/rules/minicloud-alerts
  # One-time recovery: loki_index_20673 was zeroed during unclean node reboot
  # (2026-08-13 ThinkPad sprint). mmap size=0 crash on startup. rm -rf is safe
  # — tsdb-shipper-cache is a local read-cache rebuilt from /var/loki/chunks.
  # Init container is idempotent: rm -rf on non-existent dir is a no-op.
  initContainers:
    - name: clean-corrupted-tsdb-cache
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          rm -rf /var/loki/tsdb-shipper-cache/loki_index_20673
          echo "tsdb cache clean: $(ls /var/loki/tsdb-shipper-cache/ 2>/dev/null | tr '\n' ' ')"
      volumeMounts:
        - name: storage
          mountPath: /var/loki
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
  extraVolumes:
    - name: loki-rules
      configMap:
        name: loki-rules
  extraVolumeMounts:
    - name: loki-rules
      mountPath: /var/loki/rules/fake/minicloud-alerts
      subPath: app-alerts.yaml
      readOnly: true
test:
  enabled: false
write:
  replicas: 0
