# ERPNext v16.28.0 — Phase 79 — HR source of truth + ERP-1 French IS config
# Chart: erpnext/erpnext 8.0.67
# Namespace: erp | URL: https://erp.devandre.sbs
# Custom image: harbor.10.0.0.200.nip.io/library/erpnext-ktayl (adds factur-x + pypdf)
#
# Site name = domain — ERPNext routes requests by $host header to the right site.
# mariadb-sts.rootPassword is intentionally left empty here: the ESO ExternalSecret
# erpnext-mariadb-root pre-creates the k8s secret named "erpnext" with key
# mariadb-root-password. ArgoCD ignoreDifferences prevents Helm from overwriting it.

image:
  repository: harbor.10.0.0.200.nip.io/library/erpnext-ktayl
  tag: "v16.28.0-facturx-0a52e56"
  pullPolicy: IfNotPresent

nginx:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  # topologySpreadConstraints: [] prevents rolling update deadlock when nginx is
  # pinned to one node via podAffinity (same fix applied to gunicorn).
  topologySpreadConstraints: []
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: erpnext-gunicorn
          topologyKey: kubernetes.io/hostname

worker:
  gunicorn:
    replicaCount: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    livenessProbe:
      tcpSocket:
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      tcpSocket:
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    topologySpreadConstraints: []
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [fast-skunk]
  default:
    replicaCount: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-gunicorn
            topologyKey: kubernetes.io/hostname
  short:
    replicaCount: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 200m, memory: 256Mi }
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-gunicorn
            topologyKey: kubernetes.io/hostname
  long:
    replicaCount: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 200m, memory: 256Mi }
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-gunicorn
            topologyKey: kubernetes.io/hostname
  scheduler:
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-gunicorn
            topologyKey: kubernetes.io/hostname

socketio:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  # Default TCP socket probe: timeoutSeconds=1 fails under load. Node.js bind
  # is slow; 5s timeout + 30s period prevents restart storms.
  livenessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: erpnext-gunicorn
          topologyKey: kubernetes.io/hostname

persistence:
  worker:
    enabled: true
    storageClass: longhorn
    size: 8Gi
    accessModes:
      - ReadWriteOnce

ingress:
  enabled: false

jobs:
  configure:
    enabled: true
    fixVolume: true
    nodeSelector:
      kubernetes.io/hostname: fast-skunk

  # Site erp.devandre.sbs created 2026-07-19. Disabled to avoid spurious Job
  # runs on every ArgoCD sync (each sync creates a new timestamped Job).
  createSite:
    enabled: false
    siteName: "erp.devandre.sbs"
    adminExistingSecret: erpnext-admin-secret
    adminExistingSecretKey: ERPNEXT_ADMIN_PASSWORD
    installApps:
      - erpnext
    dbType: mariadb

# MariaDB StatefulSet — internal-only, password managed via ESO erpnext-mariadb-root.
# ArgoCD ignoreDifferences on the erpnext Secret prevents Helm from clobbering the
# ESO-owned value. The placeholder below is never actually applied when ESO wins the
# Server-Side Apply race (SSA field ownership).
mariadb-sts:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: set-hog
  image:
    repository: mariadb
    tag: "10.6"
    pullPolicy: IfNotPresent
  rootPassword: "placeholder-overridden-by-eso"
  persistence:
    storageClass: longhorn
    size: 8Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# Valkey (Redis fork) for cache and queue — enabled by default, keep bundled
# valkey-io/valkey-helm chart uses flat structure (no 'primary' key). Probes are
# hardcoded in the chart template and cannot be overridden via values.
# Move both pods off fast-heron to reduce blast radius of probe storms.
valkey-cache:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: fast-skunk
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }

valkey-queue:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: fast-skunk
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
