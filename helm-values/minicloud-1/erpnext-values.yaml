# ERPNext v16.28.0 — Phase 79 — HR source of truth + ERP-1/DSN French IS config
# Chart: erpnext/erpnext 8.0.67
# Namespace: erp | URL: https://erp.devandre.sbs
# Custom image: harbor.10.0.0.200.nip.io/library/erpnext-ktayl
#   adds: factur-x, pypdf, erpnext_facturx, erpnext_dsn
#
# Site name = domain — ERPNext routes requests by $host header to the right site.
# mariadb-sts.rootPassword is intentionally left empty here: the ESO ExternalSecret
# erpnext-mariadb-root pre-creates the k8s secret named "erpnext" with key
# mariadb-root-password. ArgoCD ignoreDifferences prevents Helm from overwriting it.
#
# DSN credentials: Vault secret/platform/net-entreprises → ESO ExternalSecret
# erpnext-dsn-config → k8s Secret erpnext-dsn-config (keys: login, password,
# siret, company_name). Injected as env vars to gunicorn + worker pods.

image:
  repository: harbor.10.0.0.200.nip.io/library/erpnext-ktayl
  tag: "v16.28.0-facturx-5eee7b9"
  pullPolicy: IfNotPresent

nginx:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  # Soft topologySpread (ScheduleAnyway) prevents a rolling-update deadlock:
  # the required podAffinity below pins nginx to gunicorn's node, and the chart's
  # DEFAULT topologySpread is whenUnsatisfiable=DoNotSchedule, which forbids the
  # surge pod from stacking there -> permanent Pending. Setting `[]` does NOT work:
  # an empty list is falsy in the chart's `{{- if .Values.nginx.topologySpreadConstraints }}`
  # so it falls back to the DoNotSchedule default (this was the #739 trap). A
  # NON-EMPTY list with ScheduleAnyway is honored by the chart.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: erpnext-nginx
          app.kubernetes.io/instance: erpnext-nginx
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: erpnext-gunicorn
          topologyKey: kubernetes.io/hostname

worker:
  gunicorn:
    replicaCount: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    livenessProbe:
      tcpSocket:
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      tcpSocket:
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    topologySpreadConstraints: []
    # DSN env vars must be in gunicorn as well — the /api/method/ endpoint runs
    # in gunicorn, not in a background worker.
    envVars:
      - name: DSN_TEST_MODE
        value: "true"
      - name: DSN_ENDPOINT
        value: "http://mock-net-entreprises.erp.svc.cluster.local:8080/depot"
      - name: DSN_LOGIN
        valueFrom:
          secretKeyRef:
            name: erpnext-dsn-config
            key: DSN_LOGIN
            optional: true
      - name: DSN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: erpnext-dsn-config
            key: DSN_PASSWORD
            optional: true
      - name: DSN_SIRET
        valueFrom:
          secretKeyRef:
            name: erpnext-dsn-config
            key: DSN_SIRET
            optional: true
      - name: DSN_COMPANY_NAME
        valueFrom:
          secretKeyRef:
            name: erpnext-dsn-config
            key: DSN_COMPANY_NAME
            optional: true
      # HR-12 — J/M/L lifecycle event emission (erpnext_hr_lifecycle). The /api/method/
      # emit_test_event endpoint runs in gunicorn, so it needs the signing key + fan-out URL
      # too; the actual publish runs in a background worker (below). Secret erpnext-hr-lifecycle
      # is ESO-managed from Vault (secret/platform/hr-lifecycle) — see manifests/erpnext/01-externalsecrets.yaml.
      - name: HR_LIFECYCLE_SIGNING_KEY
        valueFrom:
          secretKeyRef:
            name: erpnext-hr-lifecycle
            key: HR_LIFECYCLE_SIGNING_KEY
            optional: true
      - name: HR_N8N_WEBHOOK_URL
        valueFrom:
          secretKeyRef:
            name: erpnext-hr-lifecycle
            key: HR_N8N_WEBHOOK_URL
            optional: true
    affinity:
      nodeAffinity:
        # Soft PREFERENCE for fast-skunk, not a hard pin — passes the k8snohostnamepin guard
        # (scheduling.md / #1189) while keeping erpnext's RWO co-location: gunicorn (the
        # anchor that mounts the RWO sites volume) prefers fast-skunk; nginx/workers/socketio
        # follow it via podAffinity wherever it lands, and it can now fail over to another
        # node if fast-skunk is unavailable (volume migration unblocked 2026-09-25).
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [fast-skunk]
  default:
    replicaCount: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    # DSN env vars — injected into all worker pods so erpnext_dsn can submit
    # to Net-Entreprises from background jobs triggered via the API.
    envVars:
      - name: DSN_TEST_MODE
        value: "true"
      # DSN_ENDPOINT points to the on-cluster mock during dev/demo.
      # Flip to real Net-Entreprises URL once a real SIRET is available.
      - name: DSN_ENDPOINT
        value: "http://mock-net-entreprises.erp.svc.cluster.local:8080/depot"
      - name: DSN_LOGIN
        valueFrom:
          secretKeyRef:
            name: erpnext-dsn-config
            key: DSN_LOGIN
            optional: true
      - name: DSN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: erpnext-dsn-config
            key: DSN_PASSWORD
            optional: true
      - name: DSN_SIRET
        valueFrom:
          secretKeyRef:
            name: erpnext-dsn-config
            key: DSN_SIRET
            optional: true
      - name: DSN_COMPANY_NAME
        valueFrom:
          secretKeyRef:
            name: erpnext-dsn-config
            key: DSN_COMPANY_NAME
            optional: true
      # HR-12 — the background worker that publishes J/M/L events (frappe.enqueue → publish):
      # signs the event (HMAC) + publishes to NATS HR_LIFECYCLE + POSTs the n8n fan-out.
      - name: HR_LIFECYCLE_SIGNING_KEY
        valueFrom:
          secretKeyRef:
            name: erpnext-hr-lifecycle
            key: HR_LIFECYCLE_SIGNING_KEY
            optional: true
      - name: HR_N8N_WEBHOOK_URL
        valueFrom:
          secretKeyRef:
            name: erpnext-hr-lifecycle
            key: HR_N8N_WEBHOOK_URL
            optional: true
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-gunicorn
            topologyKey: kubernetes.io/hostname
  short:
    replicaCount: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 200m, memory: 256Mi }
    # HR-12 — the lifecycle publish is enqueued to the SHORT queue (queue="short"), so the short
    # worker MUST carry the signing key + fan-out URL (the gunicorn/default sections alone aren't enough).
    envVars:
      - name: HR_LIFECYCLE_SIGNING_KEY
        valueFrom:
          secretKeyRef:
            name: erpnext-hr-lifecycle
            key: HR_LIFECYCLE_SIGNING_KEY
            optional: true
      - name: HR_N8N_WEBHOOK_URL
        valueFrom:
          secretKeyRef:
            name: erpnext-hr-lifecycle
            key: HR_N8N_WEBHOOK_URL
            optional: true
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-gunicorn
            topologyKey: kubernetes.io/hostname
  long:
    replicaCount: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 200m, memory: 256Mi }
    # HR-12 — carry the signing key + fan-out URL here too (a future long-queue publish, and uniformity).
    envVars:
      - name: HR_LIFECYCLE_SIGNING_KEY
        valueFrom:
          secretKeyRef:
            name: erpnext-hr-lifecycle
            key: HR_LIFECYCLE_SIGNING_KEY
            optional: true
      - name: HR_N8N_WEBHOOK_URL
        valueFrom:
          secretKeyRef:
            name: erpnext-hr-lifecycle
            key: HR_N8N_WEBHOOK_URL
            optional: true
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-gunicorn
            topologyKey: kubernetes.io/hostname
  scheduler:
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-gunicorn
            topologyKey: kubernetes.io/hostname

socketio:
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  # Default TCP socket probe: timeoutSeconds=1 fails under load. Node.js bind
  # is slow; 5s timeout + 30s period prevents restart storms.
  livenessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: erpnext-gunicorn
          topologyKey: kubernetes.io/hostname

persistence:
  worker:
    enabled: true
    storageClass: longhorn
    size: 8Gi
    accessModes:
      - ReadWriteOnce

ingress:
  enabled: false

jobs:
  configure:
    enabled: true
    fixVolume: true
    # Co-locate with gunicorn (the RWO sites-PVC holder), NOT a hostname pin. Pinning to
    # fast-skunk caused a Multi-Attach error whenever the erpnext pods ran on another node
    # (the sites PVC is RWO — attachable only on the node already holding it). Follow gunicorn
    # like every other component does. See scheduling.md (no node-pin SPOFs).
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: erpnext-gunicorn
            topologyKey: kubernetes.io/hostname

  # Site erp.devandre.sbs created 2026-07-19. Disabled to avoid spurious Job
  # runs on every ArgoCD sync (each sync creates a new timestamped Job).
  createSite:
    enabled: false
    siteName: "erp.devandre.sbs"
    adminExistingSecret: erpnext-admin-secret
    adminExistingSecretKey: ERPNEXT_ADMIN_PASSWORD
    installApps:
      - erpnext
    dbType: mariadb

# MariaDB StatefulSet — internal-only, password managed via ESO erpnext-mariadb-root.
# ArgoCD ignoreDifferences on the erpnext Secret prevents Helm from clobbering the
# ESO-owned value. The placeholder below is never actually applied when ESO wins the
# Server-Side Apply race (SSA field ownership).
mariadb-sts:
  enabled: true
  # No hostname nodeSelector — the DB schedules automatically by node availability.
  # The Longhorn volume is RWO but network-attached with 3 replicas, so the pod can
  # run on any node. (The old "kubernetes.io/hostname: set-hog" pin was dead config:
  # the chart never rendered it into the StatefulSet, and set-hog held no replica.)
  image:
    repository: mariadb
    # Pinned to the running patch (was floating "10.6"). 10.6.27 freezes the DB
    # version while still allowing upstream base-OS security rebuilds of that patch.
    tag: "10.6.27"
    pullPolicy: IfNotPresent
  rootPassword: "placeholder-overridden-by-eso"
  persistence:
    storageClass: longhorn
    size: 8Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# Valkey (Redis fork) for cache and queue — enabled by default, keep bundled
# valkey-io/valkey-helm chart uses flat structure (no 'primary' key). Probes are
# hardcoded in the chart template and cannot be overridden via values.
# No node pins — the valkey cache/queue are stateless (no PVC), so they reschedule to
# any healthy node on failure (auto-failover; SPOF hardening). Previously pinned to
# fast-skunk to dodge fast-heron probe storms; failover resilience takes precedence.
valkey-cache:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }

valkey-queue:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
