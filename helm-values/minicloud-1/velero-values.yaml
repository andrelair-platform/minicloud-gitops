# Disable the velero-upgrade-crds pre-upgrade Job hook.
# The Job pod completes successfully but the k3s v1.36.1 Job controller
# never registers completion (uncountedTerminatedPods stays empty), which
# blocks every ArgoCD sync indefinitely. CRDs are already at the correct
# version for chart 12.0.1 — re-enable when upgrading the chart version.
upgradeCRDs: false

configuration:
  backupStorageLocation:
    - bucket: velero
      config:
        publicUrl: http://10.0.0.1:9000
        region: minio
        s3ForcePathStyle: "true"
        s3Url: http://10.0.0.1:9000
      default: true
      name: default
      provider: aws
  defaultBackupStorageLocation: default
  # Opt-in FS backup only — pods annotate with backup.velero.io/backup-volumes
  # defaultVolumesToFsBackup: true caused 74 "context deadline exceeded" errors
  # per backup: every pod triggered a node-agent list API call, saturating the
  # default 5 QPS rate limiter (3030 items → queue depth >> timeout budget).
  defaultVolumesToFsBackup: false
  # Raised from defaults (5 QPS / 10 burst) to handle 3000+ item cluster backup
  # without hitting the client rate limiter deadline.
  clientQPS: 100
  clientBurst: 200
  volumeSnapshotLocation: []

credentials:
  existingSecret: velero-credentials
  useSecret: true

deployNodeAgent: true

initContainers:
  - image: velero/velero-plugin-for-aws:v1.13.0
    imagePullPolicy: IfNotPresent
    name: velero-plugin-for-aws
    volumeMounts:
      - mountPath: /target
        name: plugins

metrics:
  enabled: true
  serviceMonitor:
    additionalLabels:
      release: kube-prometheus-stack
    enabled: true

nodeAgent:
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

schedules:
  daily-full:
    disabled: false
    schedule: "0 3 * * *"
    template:
      ttl: 168h
      itemOperationTimeout: 8h
      includedNamespaces:
        - "*"
      excludedNamespaces:
        - velero
        - kube-system
        - kube-public
        - kube-node-lease
        - backup-test
        # Expendable or re-buildable PV data — excluded to prevent disk exhaustion:
        # Prometheus: ephemeral metrics, rebuilt automatically on restart
        # Harbor: container images, re-pushable from source registries
        # ai: vLLM model cache is 12Gi of HuggingFace weights — re-downloadable,
        #     filled kopia repo to 22GiB and caused disk exhaustion 2026-08-07
        # langfuse: ClickHouse grew kopia repo to 14GiB — recover from DB dump if needed
        - monitoring
        - harbor
        - ai
        - langfuse
