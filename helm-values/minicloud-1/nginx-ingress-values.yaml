controller:
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
    controllerValue: "k8s.io/ingress-nginx"

  # HA (audit R-04): 2 controllers so a node reboot (kured) / k3s upgrade / pod crash
  # never blacks out ALL ingress. The L2-announced VIP 10.0.0.200 already fails over
  # between nodes; this gives it a second backing pod.
  replicaCount: 2
  # replicaCount>1 makes the chart render a PDB; minAvailable:1 keeps ≥1 controller
  # serving during voluntary disruptions (drains/upgrades).
  minAvailable: 1
  # Soft spread across nodes. ScheduleAnyway (not DoNotSchedule) on purpose: on this
  # capacity-constrained cluster a hard rule could leave the 2nd replica Pending if the
  # spread can't be satisfied — availability beats perfect placement.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Tight-quota rollout: ingress-nginx-quota caps limits.memory at 1Gi = exactly the two
  # controllers (2 x 512Mi). A default 25% surge tries to create a 3rd pod (+512Mi) →
  # FailedCreate "exceeded quota: ingress-nginx-quota" → the rollout wedges (bit us 34h+ on
  # rev 99c654786). maxSurge:0 rolls in place: take one old pod down (PDB minAvailable:1 keeps
  # the other serving via the 10.0.0.200 VIP), create its replacement, then repeat — peak stays
  # at 2 pods = 1Gi. See memory feedback_tight_quota_rollout_maxsurge.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  service:
    type: LoadBalancer
    loadBalancerIP: "10.0.0.200"

  config:
    # Per-request latency histogram: nginx_ingress_controller_request_duration_seconds_bucket
    enable-latency-metrics: "true"
    # Required for Authentik forward-auth server-snippet / configuration-snippet annotations
    allow-snippet-annotations: "true"
    # v1.12+: snippet annotations are risk level Critical, must be explicitly allowed
    annotations-risk-level: "Critical"
    # HSTS (replaces F5 server-snippets HSTS header)
    hsts: "true"
    hsts-max-age: "31536000"
    hsts-include-subdomains: "true"
    # Rate limiting zones (replaces F5 http-snippets)
    http-snippet: |
      limit_req_zone $binary_remote_addr zone=public_ratelimit:10m rate=20r/s;
      limit_req_zone $binary_remote_addr zone=auth_ratelimit:10m rate=5r/s;
    # Default upload size — overridden per-ingress via proxy-body-size annotation
    proxy-body-size: "100m"

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      # No label filter needed — kps uses serviceMonitorSelectorNilUsesHelmValues: false
