# PostgreSQL dedicated to matrix-synapse in the chat namespace.
# Decoupled from postgresql-ai so star-kitten maintenance does not affect Matrix.
# NOT hostname-pinned: the Longhorn RWO volume is network-attached (3 replicas), so
# the DB schedules by availability. A hard set-hog pin previously made it fail to
# schedule (Matrix DB down) when set-hog was cordoned — see the ERPNext MariaDB fix.
# Credentials from Vault via ESO: manifests/matrix/03-eso-postgresql-synapse-secret.yaml
#
# NOTE on the image: 18.4.0-noavx512 is a custom pgvector-no-AVX512 build (SIGILL fix
# for the ThinkPad CPUs). It is retained as the platform's only available PG18 image —
# the stock library/postgresql:18.4.0 base was GC'd and no bitnamilegacy PG18 exists.
# synapse itself does not use pgvector; the recompile is harmless here.

global:
  security:
    allowInsecureImages: true

image:
  registry: harbor.10.0.0.200.nip.io
  repository: library/postgresql
  tag: "18.4.0-noavx512"

auth:
  existingSecret: postgresql-synapse-secret
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: pg-password
  username: synapse
  database: synapse

primary:
  priorityClassName: minicloud-critical
  # No hostname nodeSelector — schedules on any available node (Longhorn RWO is
  # network-attached). Removed the set-hog pin that broke scheduling when cordoned.
  podLabels:
    backstage.io/kubernetes-id: postgresql-synapse

  # Synapse requires LC_COLLATE=C / LC_CTYPE=C for correct text handling.
  # Bitnami creates the DB before initdb runs; PGPASSWORD must be set
  # explicitly because the postgres user already has a password at this point.
  initdb:
    scripts:
      01-recreate-c-locale.sh: |
        #!/bin/bash
        set -e
        PGPASSWORD="$POSTGRESQL_POSTGRES_PASSWORD" psql -U postgres -c "DROP DATABASE IF EXISTS synapse;"
        PGPASSWORD="$POSTGRESQL_POSTGRES_PASSWORD" psql -U postgres -c "CREATE DATABASE synapse OWNER synapse ENCODING 'UTF8' LC_COLLATE='C' LC_CTYPE='C' TEMPLATE template0;"
        PGPASSWORD="$POSTGRESQL_POSTGRES_PASSWORD" psql -U postgres -d synapse -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO synapse; GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO synapse; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO synapse; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO synapse;"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi

metrics:
  enabled: false
