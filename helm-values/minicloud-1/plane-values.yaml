planeVersion: "v1.3.1"

ingress:
  enabled: true
  appHost: "plane.devandre.sbs"
  ingressClass: "nginx"
  ingress_annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"

ssl:
  tls_secret_name: "plane-tls"

redis:
  local_setup: true
  storageClass: "longhorn"
  volumeSize: "500Mi"

postgres:
  local_setup: true
  storageClass: "longhorn"
  volumeSize: "5Gi"

rabbitmq:
  local_setup: true
  storageClass: "longhorn"
  volumeSize: "500Mi"

minio:
  local_setup: true
  storageClass: "longhorn"
  volumeSize: "10Gi"
  # MED-03 (pentest 2026-08-16): pin off :latest.
  # 2026-09-27: MinIO paywalled its public images — docker.io/minio/minio and
  # quay.io/minio/minio no longer resolve anonymously, so the docker.io digest below
  # (14cea…) became NotFound → plane-ce-minio-wl-0 ImagePullBackOff for ~74d. Fix:
  # mirror the exact same image (RELEASE.2025-09-07T16-13-09Z, id 14cea…, the copy still
  # running as the controller MinIO) into Harbor (library/minio) and pull from there.
  # Same pattern as library/postgresql-noavx512 — an on-platform copy immune to upstream
  # removal. Harbor re-wraps the manifest so the digest differs (0812…) but content is identical.
  image: harbor.10.0.0.200.nip.io/library/minio:RELEASE.2025-09-07T16-13-09Z@sha256:0812f09f2a024d2e06192c911f280356c8ed9c37d8d3a9cd4c76420a75ef6862
  # image_mc left on docker.io: it's only used by a one-time bucket-setup job that already
  # completed (bucket "uploads" exists); no running/scheduled workload pulls it. If that job
  # ever needs to re-run, mirror minio/mc into Harbor the same way (the controller has no mc image cached).
  image_mc: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727

env:
  cors_allowed_origins: "https://plane.devandre.sbs,https://plane.10.0.0.200.nip.io"
  default_cluster_domain: cluster.local
  doc_upload_size_limit: "5242880"
  docstore_bucket: "uploads"
  api_key_rate_limit: "60/minute"
  webhook_allowed_hosts: "minicloud-plane.minicloud-plane-dev.svc.cluster.local"

# All secrets come from Vault via ESO — chart skips creating its own Secrets
external_secrets:
  app_env_existingSecret: "plane-app-secrets"
  pgdb_existingSecret: "plane-pgdb-secrets"
  rabbitmq_existingSecret: "plane-rabbitmq-secrets"
  doc_store_existingSecret: "plane-doc-store-secrets"
  live_env_existingSecret: "plane-live-secrets"

# Resource tuning — reduce defaults for homelab (8 components × 50m/50Mi requests)
web:
  memoryLimit: "512Mi"
  cpuLimit: "500m"
  memoryRequest: "128Mi"
  cpuRequest: "50m"

space:
  memoryLimit: "512Mi"
  cpuLimit: "500m"
  memoryRequest: "128Mi"
  cpuRequest: "50m"

admin:
  memoryLimit: "512Mi"
  cpuLimit: "500m"
  memoryRequest: "128Mi"
  cpuRequest: "50m"

live:
  memoryLimit: "512Mi"
  cpuLimit: "500m"
  memoryRequest: "128Mi"
  cpuRequest: "50m"

api:
  memoryLimit: "1Gi"
  cpuLimit: "1000m"
  memoryRequest: "256Mi"
  cpuRequest: "100m"

worker:
  memoryLimit: "1Gi"
  cpuLimit: "500m"
  memoryRequest: "256Mi"
  cpuRequest: "50m"

beatworker:
  memoryLimit: "256Mi"
  cpuLimit: "200m"
  memoryRequest: "64Mi"
  cpuRequest: "25m"
