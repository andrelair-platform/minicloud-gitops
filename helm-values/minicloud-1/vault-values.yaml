injector:
  enabled: true
  agentImage:
    repository: docker.io/hashicorp/vault
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

server:
  priorityClassName: minicloud-critical

  extraLabels:
    backstage.io/kubernetes-id: vault

  # Un-pinned from set-hog (audit R-03 / SM-2, interim step before full Raft HA in Stage 2).
  # A hostname pin made Vault unable to reschedule when set-hog is cordoned — the exact
  # failure class the DBs were un-pinned to avoid. The Raft data PVC is Longhorn
  # network-attached, and the seal is AWS KMS auto-unseal, so a rescheduled vault-0 comes
  # back unsealed automatically on any node. NOTE: applying this rolls vault-0 once (brief
  # Vault downtime). After it restarts, ESO may need a reconnect — see the VaultPodRestarted
  # runbook (kubectl rollout restart deploy/external-secrets -n external-secrets).
  updateStrategyType: RollingUpdate

  # Default readinessProbe runs exec `vault status` every 5s with 3s timeout.
  # Under CPU pressure the process hangs past 3s — containerd abandons it but the
  # process keeps running. The next probe spawns another, accumulating until the
  # node saturates (load 65+ observed 2026-07-31). Fix: 15s timeout + 30s period.
  readinessProbe:
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 3


  statefulSet:
    securityContext:
      container:
        capabilities:
          drop:
            - NET_RAW

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  serviceAccount:
    create: true

  extraEnvironmentVars:
    AWS_REGION: eu-west-1

  extraSecretEnvironmentVars:
    - envName: AWS_ACCESS_KEY_ID
      secretName: vault-kms-credentials
      secretKey: AWS_ACCESS_KEY_ID
    - envName: AWS_SECRET_ACCESS_KEY
      secretName: vault-kms-credentials
      secretKey: AWS_SECRET_ACCESS_KEY

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        telemetry {
          unauthenticated_metrics_access = true
        }
      }

      telemetry {
        prometheus_retention_time = "30"
        disable_hostname          = true
      }

      seal "awskms" {
        region     = "eu-west-1"
        kms_key_id = "arn:aws:kms:eu-west-1:625830750465:key/a562e4a3-3708-4656-b2f9-365a073f6457"
      }

      storage "raft" {
        path    = "/vault/data"
        node_id = "vault-0"
      }

      service_registration "kubernetes" {}

  ha:
    enabled: false

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    hosts:
      - host: vault.10.0.0.200.nip.io
        paths:
          - /
    tls:
      - hosts:
          - vault.10.0.0.200.nip.io
        secretName: vault-tls

ui:
  enabled: true
  serviceType: ClusterIP
