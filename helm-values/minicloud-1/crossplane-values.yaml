# Crossplane core (v2.4.3) — the composition-based "infrastructure control plane" (IDP Core
# Component #2, Infrastructure Orchestration). Phase 1 = install core + provider-kubernetes only;
# the ProviderConfig/RBAC + the XPostgresInstance XRD/Composition land in Phase 2 (verified against
# the live provider). Resource limits sized for the constrained 5-node cluster.
resourcesCrossplane:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

resourcesRBACManager:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# provider-kubernetes is installed as a Provider CR (platform/foundation/crossplane-config/) rather
# than here, so it can reference a DeploymentRuntimeConfig that pins its ServiceAccount name
# (provider-kubernetes) — a stable target for the scoped RBAC that lets it manage CNPG/netpol/ESO.
# (The chart-managed install uses a revision-hash SA name, which a ClusterRoleBinding can't track.)

# The composition function that renders the XPostgresInstance Composition pipeline.
function:
  packages:
    - xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.0
