chaosDaemon:
  hostNetwork: false
  runtime: containerd
  socketPath: /run/k3s/containerd/containerd.sock
controllerManager:
  nodeSelector:
    kubernetes.io/hostname: fast-skunk
  env:
    # k3s uses port 10250 for kubelet — the default WEBHOOK_PORT: 10250 causes
    # the k3s tunnel proxy to route webhook calls to the kubelet instead of the
    # chaos-mesh pod, returning 502. Port 9443 avoids this conflict.
    WEBHOOK_PORT: 9443
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
dashboard:
  create: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  securityMode: true
  serviceType: ClusterIP
dnsServer:
  create: false
webhook:
  certManager:
    # cert-manager cainjector automatically syncs caBundle in MWC/VWC.
    # Required in k3s: the k3s API server does not re-read VWC/MWC caBundle
    # updates from kubectl patches — only cert-manager's cainjector mechanism
    # triggers a proper in-memory refresh. Without this, webhook cert rotation
    # on pod restart causes permanent "x509: unknown authority" errors even
    # after manual caBundle patches.
    enabled: true
