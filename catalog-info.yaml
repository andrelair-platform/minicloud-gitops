---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: minicloud-gitops
  description: |
    Phase 12 — ArgoCD source-of-truth repo. Uses the App-of-Apps pattern
    rooted at bootstrap/root-app.yaml. Currently manages 4 child
    Applications: homer (migrated from raw kubectl), whoami (greenfield
    Phase 12 demo), platform-demo (Phase 13 CI/CD demo), event-demo
    (Phase 17 KEDA+NATS scale-to-zero demo). ArgoCD auto-syncs every
    ~3min with prune+selfHeal+ServerSideApply.
  annotations:
    backstage.io/source-location: url:https://github.com/andrelair-platform/minicloud-gitops
    github.com/project-slug: andrelair-platform/minicloud-gitops
    argocd/app-name: root
    # Capability-registry governance columns (§8) — ICT change governance (DORA, family 11).
    governance.ktayl-solution/applicable-policy: Politique gouvernance ICT (DORA)|https://intranet.devandre.sbs/books/it-security-dora-cadre-de-gouvernance/page/01-politique-policy
    governance.ktayl-solution/applicable-standard: Standard change management|https://intranet.devandre.sbs/books/it-security-dora-cadre-de-gouvernance/page/02-standard
    governance.ktayl-solution/applicable-guideline: Directive GitOps / déploiement|https://intranet.devandre.sbs/books/it-security-dora-cadre-de-gouvernance/page/03-directive-guideline
    governance.ktayl-solution/applicable-procedure: Procédure de changement (PR→prod)|https://intranet.devandre.sbs/books/it-security-dora-cadre-de-gouvernance/page/04-procedure
    governance.ktayl-solution/required-controls: PR + CODEOWNERS · commits signés GPG · cosign+SBOM · Gatekeeper/OPA · change-record audit
    governance.ktayl-solution/approval-authority: Platform Admins / CODEOWNERS
    governance.ktayl-solution/evidence-required: change-record issues · historique PR · historique ArgoCD · signatures de commits
  tags:
    - argocd
    - gitops
    - phase-12
  links:
    - url: https://andrelair-platform.github.io/minicloud-platform-docs/platform-roadmap/phase-12-gitops
      title: Phase 12 documentation
      icon: docs
    - url: https://argocd.devandre.sbs/applications/root
      title: ArgoCD root Application
      icon: dashboard
    - url: https://github.com/andrelair-platform/minicloud-gitops
      title: Source code
      icon: github
spec:
  type: tool
  lifecycle: production
  owner: andrelair-platform
  system: minicloud-platform
