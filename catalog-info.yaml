# ----------------------------------------------------------------------------
# User-facing vendor APIs (ADR-0001 API-management strategy, step 1 for vendors).
# Registered only where the app has a REAL API role in our architecture; the
# definitions are CURATED-MINIMAL + accurate (primary endpoints + auth) with an
# externalDocs link to the vendor's authoritative full reference — NOT a scraped
# or fabricated full spec. Same house pattern as litellm-api / minicloud-plane-api.
# Deliberately NOT registered: GLPI (we integrate via LDAP, not its REST API),
# Matrix/Temporal (async/gRPC → AsyncAPI later), and the no-integration UIs
# (BookStack/Docuseal/Vaultwarden/Adminer/Homer/SearXNG/Metabase/Jitsi/OnlyOffice).
# ----------------------------------------------------------------------------
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: authentik
  description: |
    Authentik — the platform identity provider. OIDC/OAuth2 SSO for every app,
    M2M client-credentials for service-to-service, and the REST v3 admin API
    used by the provisioning scripts (OIDC providers, LDAP outpost, users/groups).
  annotations:
    backstage.io/source-location: url:https://github.com/andrelair-platform/minicloud-gitops
    argocd/app-name: authentik
    backstage.io/kubernetes-id: authentik
  tags:
    - identity
    - sso
    - oidc
  links:
    - url: https://auth.devandre.sbs
      title: Authentik admin UI
      icon: web
    - url: https://argocd.devandre.sbs/applications/authentik
      title: ArgoCD Application
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: andrelair-platform
  system: minicloud-platform
  providesApis:
    - authentik-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: authentik-api
  title: Authentik — Identity API (OIDC + REST v3)
  description: Platform SSO (OIDC/OAuth2), M2M client-credentials, and the REST v3 admin API.
  tags:
    - openapi
    - identity
    - oidc
  links:
    - url: https://docs.goauthentik.io/developer-docs/api/
      title: Authentik API reference (authoritative)
      icon: docs
spec:
  type: openapi
  lifecycle: production
  owner: andrelair-platform
  system: minicloud-platform
  definition: |
    openapi: "3.0.3"
    info:
      title: Authentik — Identity API
      version: "2026.5"
      description: >
        Curated subset. OIDC endpoints back every app's SSO + service M2M;
        the REST v3 API is consumed by the platform provisioning scripts.
        Full reference: https://docs.goauthentik.io/developer-docs/api/
    externalDocs:
      url: https://docs.goauthentik.io/developer-docs/api/
      description: Full Authentik API
    servers:
      - url: https://auth.devandre.sbs
    paths:
      /application/o/token/:
        post:
          summary: OIDC token endpoint (authorization_code / client_credentials)
          responses:
            "200": { description: Access/ID token }
      /application/o/{slug}/.well-known/openid-configuration:
        get:
          summary: OIDC discovery document
          parameters:
            - { name: slug, in: path, required: true, schema: { type: string } }
          responses:
            "200": { description: OIDC provider metadata }
      /api/v3/core/users/:
        get:
          summary: List users (admin API, Bearer token)
          security: [{ bearerAuth: [] }]
          responses:
            "200": { description: Paginated users }
      /api/v3/core/applications/:
        get:
          summary: List applications
          security: [{ bearerAuth: [] }]
          responses:
            "200": { description: Paginated applications }
    components:
      securitySchemes:
        bearerAuth: { type: http, scheme: bearer, description: Authentik API token }
