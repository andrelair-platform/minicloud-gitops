spec:
  type: openapi
  lifecycle: production
  owner: andrelair-platform
  system: minicloud-platform
  definition: |
    openapi: "3.0.3"
    info:
      title: Harbor — Registry API
      version: "2.0"
      description: >
        Curated subset of the Harbor v2.0 API. Full live spec is served by Harbor
        itself at /api/v2.0/swagger.json (link above). Basic-auth (admin / robot).
    externalDocs:
      url: https://goharbor.io/docs/latest/build-customize-contribute/configure-swagger/
      description: Harbor API docs
    servers:
      - url: https://harbor.10.0.0.200.nip.io/api/v2.0
    security:
      - basicAuth: []
    paths:
      /health:
        get:
          summary: Overall system health
          responses:
            "200": { description: Component health list }
      /projects:
        get:
          summary: List projects
          responses:
            "200": { description: Project list }
      /projects/{project_name}/repositories:
        get:
          summary: List repositories in a project
          parameters:
            - { name: project_name, in: path, required: true, schema: { type: string } }
          responses:
            "200": { description: Repository list }
      /systeminfo:
        get:
          summary: General system info
          responses:
            "200": { description: System info }
    components:
      securitySchemes:
        basicAuth: { type: http, scheme: basic }
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: nextcloud-api
  title: Nextcloud — OCS + WebDAV API
  description: OCS provisioning/sharing API + WebDAV file access for the Digital Workplace.
  tags:
    - openapi
    - files
    - workplace
  links:
    - url: https://docs.nextcloud.com/server/latest/developer_manual/client_apis/index.html
      title: Nextcloud client APIs (authoritative)
      icon: docs
spec:
  type: openapi
  lifecycle: production
  owner: andrelair-platform
  system: ktayl-solution
  definition: |
    openapi: "3.0.3"
    info:
      title: Nextcloud — OCS + WebDAV
      version: "31"
      description: >
        Curated subset. OCS endpoints require the header OCS-APIRequest: true and
        basic auth (user + app password). WebDAV serves file access. Full ref:
        https://docs.nextcloud.com/server/latest/developer_manual/client_apis/index.html
    externalDocs:
      url: https://docs.nextcloud.com/server/latest/developer_manual/client_apis/index.html
      description: Nextcloud client APIs
    servers:
      - url: https://cloud.devandre.sbs
    security:
      - basicAuth: []
    paths:
      /ocs/v2.php/cloud/users:
        get:
          summary: List users (provisioning API)
          responses:
            "200": { description: User list (OCS envelope) }
        post:
          summary: Create a user
          responses:
            "200": { description: Created (OCS envelope) }
      /ocs/v2.php/apps/files_sharing/api/v1/shares:
        get:
          summary: List shares
          responses:
            "200": { description: Shares (OCS envelope) }
      /remote.php/dav/files/{user}/:
        get:
          summary: WebDAV file access (PROPFIND/GET/PUT)
          parameters:
            - { name: user, in: path, required: true, schema: { type: string } }
          responses:
            "207": { description: WebDAV multistatus }
    components:
      securitySchemes:
        basicAuth: { type: http, scheme: basic, description: user + app password }
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: n8n-api
  title: n8n — Public REST API + Webhooks
  description: Workflow/execution management (REST v1) + webhook triggers; the IS integration hub.
  tags:
    - openapi
    - automation
    - workflows
  links:
    - url: https://docs.n8n.io/api/
      title: n8n public API reference (authoritative)
      icon: docs
spec:
  type: openapi
  lifecycle: production
  owner: andrelair-platform
  system: minicloud-platform
  definition: |
    openapi: "3.0.3"
    info:
      title: n8n — Public API + Webhooks
      version: "1"
      description: >
        Curated subset. The REST v1 API manages workflows/executions
        (header X-N8N-API-KEY); /webhook/{path} endpoints trigger workflows
        from external events. Full ref: https://docs.n8n.io/api/
    externalDocs:
      url: https://docs.n8n.io/api/
      description: n8n public API
    servers:
      - url: https://n8n.devandre.sbs
    paths:
      /api/v1/workflows:
        get:
          summary: List workflows
          security: [{ apiKeyAuth: [] }]
          responses:
            "200": { description: Workflow list }
      /api/v1/executions:
        get:
          summary: List executions
          security: [{ apiKeyAuth: [] }]
          responses:
            "200": { description: Execution list }
      /webhook/{path}:
        post:
          summary: Trigger a workflow via its webhook node
          parameters:
            - { name: path, in: path, required: true, schema: { type: string } }
          responses:
            "200": { description: Workflow response }
    components:
      securitySchemes:
        apiKeyAuth: { type: apiKey, in: header, name: X-N8N-API-KEY }
