# S3 raw-lake DuckDB TRANSFORM (ADR-008) — the OLAP-engine half: dbt-duckdb reads Parquet from S3
# (reader role), runs the medallion (staging → marts), materialises the serving marts into CNPG (what
# Metabase reads).  S3 raw (Parquet) → DuckDB (dbt) → CNPG analytics.lake.* → Metabase.
# Keyless auth: dp-duckdb SA → Vault (role=data-lake-reader) → short-lived STS read creds.
# VERIFIED end-to-end live (policy.policy: 11 rows → S3 → dbt-duckdb → analytics.lake.policy_portfolio_lake).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dp-duckdb
  namespace: data-platform
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dp-lake-transform-policy
  namespace: data-platform
spec:
  schedule: "45 1 * * *" # after the producer lands raw Parquet (01:15)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: dp-duckdb
          restartPolicy: Never
          # DuckDB needs AVX2 — swift-mac (2012 MacBook) lacks it → "Illegal instruction". Require the
          # capability label (scheduling.md: a capability label, never a hostname pin — 5/6 nodes qualify).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - { key: minicloud.io/cpu-avx2, operator: In, values: ["true"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - { name: repo, emptyDir: {} }
            - { name: home, emptyDir: {} }
          initContainers:
            - name: clone
              image: docker.io/alpine/git:2.45.2
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              env:
                - { name: GIT_USER,  valueFrom: { secretKeyRef: { name: dp-git-token, key: GIT_USER } } }
                - { name: GIT_TOKEN, valueFrom: { secretKeyRef: { name: dp-git-token, key: GIT_TOKEN } } }
              command: ["sh", "-c", "git clone --depth 1 https://$GIT_USER:$GIT_TOKEN@github.com/andrelair-platform/ktayl-data-platform.git /repo"]
              volumeMounts: [{ name: repo, mountPath: /repo }]
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { cpu: "500m", memory: "256Mi" }
          containers:
            - name: dbt
              image: docker.io/library/python:3.12-slim
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              command: ["sh", "/repo/lake/dbt_duckdb/entrypoint.sh"]
              env:
                - { name: HOME, value: "/home" }
                - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
                - { name: VAULT_ROLE, value: "data-lake-reader" }
                - { name: VAULT_AWS_PATH, value: "aws/sts/data-lake-read" }
                - { name: AWS_REGION, value: "eu-west-1" }
                - { name: POLICY_GLOB, value: "s3://minicloud-data-lake-625830750465/raw/policy/policy/*/policy.parquet" }
                - { name: ANALYTICS_PG_HOST, value: "dp-postgres-rw.data-platform.svc.cluster.local" }
                - { name: ANALYTICS_PG_DB,   value: "analytics" }
                - { name: ANALYTICS_PG_USER,     valueFrom: { secretKeyRef: { name: dp-analytics-role, key: username } } }
                - { name: ANALYTICS_PG_PASSWORD, valueFrom: { secretKeyRef: { name: dp-analytics-role, key: password } } }
              volumeMounts:
                - { name: repo, mountPath: /repo }
                - { name: home, mountPath: /home }
              resources:
                requests: { cpu: "200m", memory: "256Mi" }
                limits: { cpu: "1", memory: "512Mi" }
