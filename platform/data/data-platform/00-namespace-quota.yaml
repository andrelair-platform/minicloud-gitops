---
# Data Platform (#5). Footprint grew with the production-adopted stack: CNPG (analytics/metabase/dagster
# DBs), the lake producer + DuckDB/dbt CronJobs, Metabase, Cube (semantic layer), and Dagster (webserver +
# daemon). Bumped to fit the Dagster daemon (ADR-011) — it loads a code server + runs the graph in-process.
apiVersion: v1
kind: Namespace
metadata:
  name: data-platform
  labels:
    kubernetes.io/metadata.name: data-platform
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-platform-quota
  namespace: data-platform
spec:
  hard:
    requests.cpu: "1500m"
    limits.cpu: "5"
    requests.memory: 2304Mi
    limits.memory: 6Gi
    count/pods: "14"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: data-platform-limits
  namespace: data-platform
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
