---
# Ingress is default-deny + explicit allows. EGRESS is intentionally unrestricted for slice 1:
# CNPG's initdb/instance-manager must reach the kube-apiserver, and under Cilium a standard
# NetworkPolicy `ipBlock` CIDR does NOT match the kube-apiserver identity (known Cilium gotcha —
# authentik's CNPG namespace likewise doesn't default-deny egress). Hardening follow-up: a
# CiliumNetworkPolicy egress with `toEntities: [kube-apiserver, world]` + DNS + the policy DB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: data-platform }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# intra-namespace ingress (CNPG replication, app→db)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-same-namespace, namespace: data-platform }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: data-platform } } }]
---
# CNPG operator → instance status endpoint (the gotcha: without it the cluster never goes healthy)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-cnpg-operator, namespace: data-platform }
spec:
  podSelector: { matchLabels: { cnpg.io/cluster: dp-postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cnpg-system } } }]
      ports: [{ protocol: TCP, port: 8000 }, { protocol: TCP, port: 5432 }]
---
# monitoring scrape (CNPG podmonitor :9187, metabase :3000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-monitoring-scrape, namespace: data-platform }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ protocol: TCP, port: 9187 }, { protocol: TCP, port: 3000 }]
---
# ingress-nginx → Metabase (:3000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-metabase, namespace: data-platform }
spec:
  podSelector: { matchLabels: { app: metabase } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
      ports: [{ protocol: TCP, port: 3000 }]
