---
# Read token to clone the (private) gitops repo so the lake jobs + Cube + Dagster run the in-repo code
# (no drift, no baked image). Reuses the Kargo git creds (Vault platform/kargo git-username/git-token).
# SHARED — consumed by 06-lake-producer, 07-lake-transform, 08-cube, 09-dagster. Keep.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: dp-git-token, namespace: data-platform }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: dp-git-token, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: GIT_USER
      remoteRef: { key: platform/kargo, property: git-username }
    - secretKey: GIT_TOKEN
      remoteRef: { key: platform/kargo, property: git-token }
