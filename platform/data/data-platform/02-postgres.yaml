---
# Analytics Postgres (medallion: schemas raw/curated/business in db `analytics`) + Metabase's own
# app db `metabase` on the same cluster. DERIVED, rebuildable data → 1 instance, no R2 PITR, no
# import bootstrap (unlike authentik-cnpg). Bump instances→2 if it ever holds non-reproducible state.
# AVX512 note: core Postgres (no pgvector) — didn't hit the noavx512 SIGILL; pin imageName only if it does.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dp-postgres
  namespace: data-platform
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  storage:
    size: 3Gi
    storageClass: longhorn
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 512Mi }
  monitoring:
    enablePodMonitor: true
  managed:
    roles:
      - name: analytics
        ensure: present
        login: true
        superuser: false
        passwordSecret: { name: dp-analytics-role }
      - name: metabase
        ensure: present
        login: true
        superuser: false
        passwordSecret: { name: dp-metabase-role }
  bootstrap:
    initdb:
      database: analytics
      owner: analytics
  # Backup to a dedicated per-cluster R2 bucket. Data is DERIVED/rebuildable (dbt re-run) → this is the
  # FAST recovery path, not the only one. Credential: shared platform/cloudflare R2 key (owner call).
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://cnpg-data-platform
      endpointURL: https://4d3a131c84ca31b951cba16a5b7db0c1.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId:
          name: cnpg-data-platform-r2
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-data-platform-r2
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
---
# R2 credentials for the Barman backup (shared platform/cloudflare key, bucket-isolated).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cnpg-data-platform-r2
  namespace: data-platform
spec:
  refreshInterval: 24h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: cnpg-data-platform-r2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: platform/cloudflare, property: r2-access-key-id }
    - secretKey: SECRET_ACCESS_KEY
      remoteRef: { key: platform/cloudflare, property: r2-secret-access-key }
---
# Daily base backup (WAL archived continuously by the Cluster's barmanObjectStore).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: dp-postgres-daily
  namespace: data-platform
spec:
  schedule: "0 0 4 * * *"
  backupOwnerReference: self
  cluster:
    name: dp-postgres
---
# Metabase's metadata database on the same cluster (declarative multi-DB — CNPG Database CR).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dp-metabase-db
  namespace: data-platform
spec:
  name: metabase
  owner: metabase
  cluster:
    name: dp-postgres
