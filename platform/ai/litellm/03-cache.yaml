---
# Valkey (Redis-compatible) cache for LiteLLM semantic prompt caching.
# Stores both exact-match keys and embedding vectors for similarity lookup (threshold 0.8).
# Single-node, no auth — internal cluster service only, not exposed externally.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litellm-cache
  namespace: ai
spec:
  serviceName: litellm-cache
  replicas: 1
  selector:
    matchLabels:
      app: litellm-cache
  template:
    metadata:
      labels:
        app: litellm-cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8.1-alpine
          args:
            - valkey-server
            - --maxmemory
            - 400mb
            - --maxmemory-policy
            - allkeys-lru
            # Pure in-memory cache — disable RDB + AOF so /data (emptyDir) is never
            # written. The semantic cache is disposable (LRU, repopulates), so it needs
            # no persistence; this + emptyDir removes the node-pin that stranded it
            # Pending after the swift-mac/star-kitten outage (#1147).
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      # emptyDir, not a local-path PVC: a disposable cache must reschedule on ANY
      # node. The old local-path PVC pinned the pod to one node → Pending whenever
      # that node was down/cordoned (#1147). Capped so it can't fill node ephemeral
      # storage (valkey itself is memory-capped at 400mb and no longer writes to disk).
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-cache
  namespace: ai
spec:
  selector:
    app: litellm-cache
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  clusterIP: None
