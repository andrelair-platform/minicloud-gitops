# Alert on stale CNPG backups / unhealthy cluster for langfuse-postgres. CNPG exports
# cnpg_collector_last_available_backup_timestamp + cnpg_collector_up per cluster via the
# PodMonitor enabled on the Cluster. Placed in the monitoring namespace (kps rule selector);
# applied there by the langfuse-base app (monitoring is an allowed AppProject destination, same
# as the cnpg-nextcloud rule). Mirrored from nextcloud-postgres.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-langfuse
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kps
spec:
  groups:
    - name: cnpg-langfuse
      rules:
        - alert: CNPGLangfuseBackupStale
          expr: |
            (time() - max(cnpg_collector_last_available_backup_timestamp{namespace="langfuse"})) / 3600 > 26
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Langfuse CNPG has no fresh R2 backup in 26+ hours"
            description: |
              The langfuse-postgres cluster's last available Barman/R2 backup is
              {{ $value | printf "%.1f" }} hours old (or the metric is absent → no backup yet).
              Check: kubectl -n langfuse get cluster langfuse-postgres
                     kubectl -n langfuse get backup,scheduledbackup
              Logs:  kubectl -n langfuse logs -l cnpg.io/cluster=langfuse-postgres -c postgres --tail=100

        - alert: CNPGLangfuseNotHealthy
          expr: |
            max(cnpg_collector_up{namespace="langfuse"}) < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Langfuse CNPG cluster reporting unhealthy"
            description: |
              The langfuse-postgres CloudNativePG cluster is not reporting healthy instances.
              Langfuse's metadata (traces/prompts/projects) is backed by this cluster → LLMOps
              observability is at risk.
              Check: kubectl -n langfuse get cluster langfuse-postgres -o wide
