# CNPG cluster-health alert for authentik-cnpg. Backup-staleness is now covered GENERICALLY for
# every CNPG cluster by CNPGBackupStale/CNPGBackupCritical in
# platform/storage/backup-dr/00-prometheusrule.yaml, so the per-cluster BackupStale was removed here
# (verified: the generic rule evaluates ns=authentik). Placed in the monitoring namespace (kps rule
# selector); applied there by the cnpg-authentik app (monitoring is an allowed AppProject destination).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-authentik
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kps
spec:
  groups:
    - name: cnpg-authentik
      rules:
        - alert: CNPGAuthentikNotHealthy
          expr: |
            max(cnpg_collector_up{namespace="authentik"}) < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Authentik CNPG cluster reporting unhealthy"
            description: |
              The authentik-cnpg CloudNativePG cluster is not reporting healthy instances.
              This is the PARALLEL cluster (Authentik still uses authentik-postgresql), so SSO
              is unaffected, but investigate before any cutover.
              Check: kubectl -n authentik get cluster authentik-cnpg -o wide
