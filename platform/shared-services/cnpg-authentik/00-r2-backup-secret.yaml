---
# R2 credentials for CloudNativePG's Barman object-store backup (WAL + base backups).
# Pulled from Vault secret/data/platform/cloudflare (store-relative key), same source as
# the Stage-0 velero R2 BSL. Consumed by the Cluster's backup.barmanObjectStore.s3Credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cnpg-authentik-r2
  namespace: authentik
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cnpg-authentik-r2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: platform/cloudflare, property: r2-access-key-id }
    - secretKey: SECRET_ACCESS_KEY
      remoteRef: { key: platform/cloudflare, property: r2-secret-access-key }
