apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghproj-exporter-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghproj-exporter-token
    creationPolicy: Owner
  data:
    # Reuse the existing GITOPS_TOKEN (already has project + repo + org scope — it's
    # the token the BMAD sync uses to write to boards). Read-only use here.
    - secretKey: token
      remoteRef:
        key: platform/ci-secrets
        property: gitops-token
