# Token for the ktayl-ldap outpost (ADR docs/mail-ldap-federation.md, #1686). The outpost token is
# generated by Authentik and stored in Vault by scripts/authentik/provision-ldap-outpost.sh (break-glass).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ldap-outpost-token
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: ldap-outpost-token, creationPolicy: Owner }
  data:
    - secretKey: AUTHENTIK_TOKEN
      remoteRef: { key: platform/authentik-ldap-outpost, property: token }
