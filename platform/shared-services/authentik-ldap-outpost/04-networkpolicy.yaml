# The authentik ns is default-deny-INGRESS. Consumers that authenticate/sync against Authentik over
# LDAP must be allowed → this outpost on the LDAP ports. Egress is open in this ns, so the outpost
# reaches authentik-server without an egress rule.
#   - mail (Stalwart): mailbox auth federated to Authentik.
#   - itsm (GLPI): LDAP directory sync — imports employees as ticket requesters (board #16).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mail-to-ldap-outpost
  namespace: authentik
spec:
  podSelector:
    matchLabels: { app: ktayl-ldap-outpost }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: mail }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: itsm }
      ports:
        - { protocol: TCP, port: 3389 }
        - { protocol: TCP, port: 6636 }
