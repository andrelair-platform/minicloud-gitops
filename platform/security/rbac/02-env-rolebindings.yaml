---
# Dev namespaces — dedicated Kubernetes editors get edit access.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-dev-edit
  namespace: platform-demo-dev
subjects:
  - kind: Group
    name: "oidc:k8s-dev-editors"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-dev-edit
  namespace: minicloud-plane-dev
subjects:
  - kind: Group
    name: "oidc:k8s-dev-editors"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
