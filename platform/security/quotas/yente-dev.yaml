---
# yente namespace (RC-02 S0): single-node OpenSearch (the heavy, JVM) + the yente API + the freshness
# exporter. Dev-only until the ktayl-core screening module consumes it.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: yente-dev-quota
  namespace: yente
spec:
  hard:
    requests.cpu: "1"
    limits.cpu: "4"
    requests.memory: 2560Mi
    limits.memory: 6Gi
    count/pods: "8"
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: yente-dev-limits
  namespace: yente
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "2"
        memory: 3Gi
