---
# sign namespace: DocuSeal document signing (single pod)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sign-quota
  namespace: sign
spec:
  hard:
    requests.cpu: 100m
    limits.cpu: "2"
    requests.memory: 256Mi
    limits.memory: 2Gi
    count/pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sign-limits
  namespace: sign
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
