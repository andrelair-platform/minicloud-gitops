apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNoPrivilegedContainers
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: no-privileged-containers
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - gatekeeper-system
            - metallb-system
            - longhorn-system
            - nfs-provisioner
            - node-problem-detector  # NPD DaemonSet runs privileged (hostPID + /var/log + /dev/kmsg) to monitor kernel/node health. Already exempted from require-non-root (#14), no-privilege-escalation (#15), no-hostpath (#18); this line closes the gap so it can be re-admitted after node reboot/drain.
            - cert-manager
            - ingress-nginx
            - chaos-mesh
            - velero
            - falco
            - kured
            - productivity
            - mail
            - sign
            - collab
            - monitoring
            - argo-rollouts
            - vpa-system
            - system-upgrade
            - chat
            - erp
