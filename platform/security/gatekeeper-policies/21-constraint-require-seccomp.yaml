apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireSeccomp
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: require-seccomp
spec:
  # MED-01: flipped warn -> deny. Safe because the assign-seccomp-runtimedefault mutator
  # (30-mutation-seccomp-runtimedefault.yaml) injects RuntimeDefault before validation, so
  # every new pod is made compliant at admission. Existing pods comply as they cycle.
  enforcementAction: deny
  match:
    # Pods ONLY. The rego reads object.spec.securityContext.seccompProfile, which exists
    # on Pods but NOT on workload objects (those carry it at spec.template.spec) — matching
    # Deployment/StatefulSet/DaemonSet here would falsely flag every workload and, under
    # deny, block their applies. The Pod is the enforcement point anyway: the Assign mutator
    # injects RuntimeDefault into every Pod before validation, so all pods comply.
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - gatekeeper-system
            - metallb-system
            - longhorn-system
            - nfs-provisioner
            - cert-manager
            - ingress-nginx
            - chaos-mesh
            - velero
            - falco
            - kured
            - productivity
            - mail
            - sign
            - collab
            - argo-rollouts
            - vpa-system
            - system-upgrade
            - chat
            - erp
