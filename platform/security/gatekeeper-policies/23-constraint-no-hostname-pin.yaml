apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNoHostnamePin
metadata:
  name: no-hostname-pin
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # DENY (enforcing) since 2026-09-25: all ~20 existing hostname pins were remediated
  # (removed, or softened to preferred, or exempt-labeled), the audit reached 0 violations,
  # and admission now BLOCKS new hostname-pinned Deploy/STS/DaemonSet/Rollout. Legit pins
  # (hostNetwork media, GPU, control-plane) opt out with the pod-template/workload label
  # scheduling.minicloud/hostname-pin-allowed=true. See scheduling.md / #1189.
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: ["argoproj.io"]
        kinds: ["Rollout"]
    namespaceSelector:
      matchExpressions:
        # System namespaces where node pinning is expected/benign — kept out of
        # the report so the signal is the app-workload SPOFs we actually care about.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - gatekeeper-system
