---
# Block all ingress to the monitoring namespace by default.
# Note: Prometheus scrapes OTHER namespaces (outbound connections from monitoring)
# — those are unaffected by this policy. This policy controls what can reach
# Prometheus/Grafana/Alertmanager FROM outside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Monitoring components talk to each other (Grafana → Prometheus, Alertmanager → Prometheus)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# NGINX ingress controller proxies browser traffic to Grafana (port 3000)
# and to Prometheus/Alertmanager if exposed via ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# kube-system pods push metrics to Prometheus pushgateway and expose metrics
# that the kube-prometheus-stack scrapes (kube-state-metrics, node-exporter)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-system
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
# observability namespace (Loki) reads from Prometheus for dashboards
# and Grafana reads Loki datasource cross-namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
---
# Argo Rollouts controller queries Prometheus to evaluate AnalysisRuns (port 9090)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argo-rollouts
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
      ports:
        - port: 9090
          protocol: TCP
---
# KEDA operator queries Prometheus to evaluate ScaledObject triggers (port 9090)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keda
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - port: 9090
          protocol: TCP
---
# Falco Sidekick pushes runtime security events to Alertmanager (port 9093)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-falco-sidekick
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: falco
      ports:
        - port: 9093
          protocol: TCP
---
# longhorn-backup-check CronJob (longhorn-system) POSTs alerts to Alertmanager (port 9093)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-backup-check
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
      ports:
        - port: 9093
          protocol: TCP
---
# Cilium entity-based replacement for ipBlock-based allow-cluster-nodes.
# In Cilium, traffic from cluster nodes (kubelet, kube-apiserver) carries
# remote-node or host identity — ipBlock CIDR rules do not match it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-node-entities
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
