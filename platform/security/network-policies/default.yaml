# NetworkPolicy for default — safety net for the 'default' namespace (HIGH-02 remediation).
#   No workload should ever run in 'default'. This applies a full default-deny
#   (ingress + egress) so that anything accidentally scheduled here is isolated
#   until an explicit policy is written. Empty ns today = zero blast radius.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: default}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-egress, namespace: default}
spec: {podSelector: {}, policyTypes: [Egress]}
