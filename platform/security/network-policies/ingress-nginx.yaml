---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ingress-nginx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: ingress-nginx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Cilium L2 announces 10.0.0.200 as the LoadBalancer VIP — traffic arrives from any source.
# ipBlock: 0.0.0.0/0 maps to the Cilium "world" entity (truly external traffic only).
# namespaceSelector: {} is required for in-cluster pods whose traffic carries pod identity
# (not world identity), e.g. kubelet image pulls via VIP, OIDC clients, Cloudflare Tunnel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-https
  namespace: ingress-nginx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - namespaceSelector: {}
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
---
# kube-apiserver health-checks and admission webhook calls reach the ingress controller
# from two source ranges:
#   10.0.0.0/24  - node physical IPs (MetalLB LB traffic, kubelet health checks)
#   10.42.0.0/16 - flannel pod CIDR; host processes (konnectivity proxy, kube-apiserver)
#                  use the node's flannel.1 bridge IP (e.g. 10.42.0.0) as source when
#                  sending cross-node traffic to pod IPs via VXLAN
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-nodes
  namespace: ingress-nginx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/24
        - ipBlock:
            cidr: 10.42.0.0/16
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: ingress-nginx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
---
# Cilium entity-based replacement for ipBlock-based allow-cluster-nodes.
# In Cilium, traffic from cluster nodes (kubelet, kube-apiserver) carries
# remote-node or host identity — ipBlock CIDR rules do not match it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-node-entities
  namespace: ingress-nginx
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
