# Longhorn backup target: MinIO at 10.0.0.1:9000, bucket "longhorn".
# Region string is arbitrary for MinIO — Longhorn uses AWS_ENDPOINTS from the secret.
# Longhorn 1.11+ manages the backup target via the BackupTarget CR; the old
# `backup-target` / `backup-target-credential-secret` Settings were REMOVED in 1.12
# (the webhook rejects them: "setting ... does not exist"). Migrated here 2026-10-02
# after the 1.6->1.12.1 climb; ArgoCD SSA adopts the live `default` BackupTarget in place.
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: "s3://longhorn@us-east-1/"
  credentialSecret: longhorn-backup-credentials
  pollInterval: 5m0s
---
# DISABLED — the Longhorn default. (least-effort was set here and WRONGLY commented as "the
# conservative default"; it is a NON-default that moves replicas whenever it deems a "healthier"
# placement exists.) It LOOKED inert while the topology was static (best-effort trial 2026-10-02
# moved ZERO replicas in ~1h on 4 static active nodes), but on 2026-10-24 — when fast-skunk was
# re-admitted after the power-incident recovery — it immediately THRASHED: it queued ~15 replica
# moves onto the rejoined node, driving transient degraded + a 9-volume faulted blip on prod DBs.
# Policy (docs/storage-hardening/phase1-execution-plan.md): auto-balance is a thrash on this
# topology — do NOT use it as the rebalance mechanism; de-concentrate via TARGETED, OBSERVED
# manual relocation instead (e.g. 2026-10-02 harbor-registry 3r->2r + the star-kitten hotspot
# move). See docs/reliability-longhorn-upgrade.md.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-auto-balance
  namespace: longhorn-system
value: "disabled"
---
# Run a lightweight data-integrity check immediately after every snapshot
# (daily at 01:00 UTC via the daily-snapshot recurring job).
# Catches replica divergence the same day instead of waiting for the
# weekly standalone scan (snapshot-data-integrity-cronjob: 0 0 */7 * *).
# 1.12 stores this as a per-data-engine map (was a scalar "true" pre-1.11) — match the
# live format so ArgoCD doesn't perpetually diff.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: snapshot-data-integrity-immediate-check-after-snapshot-creation
  namespace: longhorn-system
value: '{"v1":"true","v2":"true"}'
---
# Node-failure auto-failover for STATEFUL workloads. Default "do-nothing" means when a
# node goes down, Longhorn leaves the stuck pod in place → the StatefulSet/Deployment
# never reschedules it → no failover (the gap that stranded workloads in the 2026-09-18
# incidents). "delete-both-…" makes Longhorn delete the pod on a confirmed-down node so
# the controller recreates it on a healthy node and the RWO volume reattaches there.
# Safe: Longhorn's single-engine guarantee prevents split-brain; it only acts once the
# node is genuinely down (not a brief blip). Pairs with unpinning (a pinned pod still
# can't move) — see the auto-failover epic.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-down-pod-deletion-policy
  namespace: longhorn-system
value: "delete-both-statefulset-and-deployment-pod"
---
# Cap concurrent replica rebuilds per node at 2 (default 5). Tuned for this resource-
# constrained, aging-hardware cluster (ThinkPads + a 2012 MacBook), where both extremes fail:
#   5 → parallel rebuilds SATURATE node CPU/I-O; kubelet/instance-manager miss heartbeats,
#       replicas flap to `stopped`, the cluster THRASHES (fast-skunk CPU hit 98% at 5).
#   1 → a single stuck rebuild DEADLOCKS the node's only slot, blocking every other rebuild
#       on that node → the cluster can't heal without hand-deleting the stuck replica.
#   2 → the sweet spot: a stuck rebuild leaves a 2nd free slot (no deadlock), yet gentle
#       enough to avoid the saturation thrash. Observed live 2026-09-30 (fast-skunk 98%→31%
#       when dropped off 5; deadlock reproduced at 1).
# See memory [[feedback_longhorn_stale_rofs_after_churn]].
#
# 2026-10-11 REVERTED to "2" (tried "1" for the post-incident rebuild-sync churn — it did NOT
# converge either; degraded oscillated 32–36 for 9 min with no net drain, confirming the churn is
# a hardware-bound rebuild-SYNC limit, not a concurrency/contention one). "2" is the documented
# safe value (no deadlock, no thrash). The churn needs Phase-B/C remediation, not a knob —
# see docs/storage-hardening/phase1-execution-plan.md (Section 5) + implementation-backlog.md.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-replica-rebuild-per-node-limit
  namespace: longhorn-system
value: "2"
---
# Give a loaded instance manager enough time to answer its exec health check.
# During the 2026-10-24 recovery, fast-skunk repeatedly missed six 10-second
# probes while restarting 35 replicas; kubelet then killed the manager and
# reset every rebuild. This keeps failure detection bounded (~3 minutes with
# Longhorn's failureThreshold=6) without increasing rebuild concurrency.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: instance-manager-pod-liveness-probe-timeout
  namespace: longhorn-system
value: "30"
---
# Over-provisioning cap raised 100 -> 200 (2026-10-11). During the post-incident rebuild recovery,
# loving-gannet (the node that survived the cascade and accumulated ~47 replicas) hit the 100% cap
# (ScheduledTotal > StorageMax-StorageReserved) -> its disk went Schedulable=False -> stuck rebuilds
# could not place a replica (rebuilds=0). loving-gannet had ~47% real free space, so the 100% cap was
# the artificial blocker. 200% gives headroom on a cluster with genuine free space; revisit if actual
# disk usage (not allocation) approaches the minimal-available reserve. Root cause + resolution:
# docs/storage-hardening/phase1-execution-plan.md.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: storage-over-provisioning-percentage
  namespace: longhorn-system
value: "200"
---
# Automatic engine upgrade enabled (0 -> 3) 2026-10-11, part of the 1.12.1 -> 1.13.0 upgrade. With 0,
# engine images never auto-migrate and volumes stay on the old engine (the v1.12.1 WO:RW rebuild bug
# persisted even after the manager upgraded). 3 lets Longhorn migrate HEALTHY volumes' engines to the
# default (v1.13.0) automatically, per-node-capped so the migration doesn't thunder. (DEGRADED volumes
# still won't auto-upgrade — Longhorn defers those until healthy; they were handled by a controlled
# detach/reattach + retry-reset — see the execution plan.)
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-automatic-engine-upgrade-per-node-limit
  namespace: longhorn-system
value: "3"
---
# Default replica factor for NEW volumes = 2 (was the chart default 3, undeclared → implicitly 3).
# Lowered 3 -> 2 on 2026-10-24 after the per-workload RF rightsizing (see the RF POLICY below): a
# plain new volume should be DURABLE-by-default (2 copies = survives one node/disk loss) but not pay
# the 3-copy footprint that, on this 6-laptop cluster, drove the rebuild/scheduling churn during the
# power-incident recovery. 3-copy is reserved for nothing by default; app-HA stores DROP to 1 by hand.
#
# RF POLICY (per-workload, applied to existing volumes 2026-10-24 as live volume-CR patches — Longhorn
# persists numberOfReplicas per volume, so those values are NOT reverted by this default; this default
# only governs NEWLY created volumes):
#   * app-HA stores  -> RF1  : the app already keeps an independent copy per instance, so block-level
#                              replication is redundant. CNPG 2-instance clusters (authentik, ktayl,
#                              ktayl-iam, retrieva, underwriting-prod), Vault Raft (x3), NATS JetStream
#                              (x3), langfuse-zookeeper (x3), alertmanager (x2). (datastore-selection.md
#                              "App-HA 1r" tier.) Set these to 1 explicitly when the volume is created.
#   * single-copy durable -> RF2 : block RF is the ONLY redundancy (single-instance DBs/stores:
#                              synapse, backstage, erp, glpi, nextcloud, loki, mail, grafana, temporal,
#                              harbor-db, data-platform, sign, vaultwarden, n8n, plane-pgdb/minio...).
#                              NEVER below 2. This is what the new default 2 gives them for free.
#   * dev / regenerable -> RF1 : dev namespaces + caches/scratch (redis, valkey, rabbitmq, trivy, tempo).
# Reducing RF is the SAFE churn direction (deletes excess replicas, no rebuild); raising it rebuilds.
# Rationale + the incident: docs/storage-hardening/phase1-execution-plan.md.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: default-replica-count
  namespace: longhorn-system
value: "2"
