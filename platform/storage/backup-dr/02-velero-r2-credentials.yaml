---
# ESO ExternalSecret: pulls R2 credentials from Vault → velero namespace Secret.
# The Secret name matches what the R2 BackupStorageLocation references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-r2-credentials
  namespace: velero
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-r2-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Velero aws provider reads credentials in AWS credentials file format
        cloud: |
          [default]
          aws_access_key_id={{ .accessKeyId }}
          aws_secret_access_key={{ .secretAccessKey }}
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: secret/platform/cloudflare
        property: r2-access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: secret/platform/cloudflare
        property: r2-secret-access-key
