---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: k3s-backup-minio
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k3s-backup-minio
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: secret/platform/minio
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-sqlite-backup
  namespace: monitoring
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      template:
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          restartPolicy: OnFailure
          volumes:
            - name: k3s-server
              hostPath:
                # the whole server dir (was just server/db) so we can also back up the
                # bootstrap material a from-scratch rebuild needs (token + encryption key).
                path: /var/lib/rancher/k3s/server
                type: Directory
          containers:
            - name: backup
              # Self-contained image (sqlite + rclone + age baked in) built from
              # alpine:3.20 — see images/k3s-backup/. The old `apk add` at runtime
              # failed whenever DNS/CDN was unavailable (i.e. exactly mid-incident:
              # 2026-08-19 the backup was broken for days because bind9 flapping
              # blocked the Alpine package fetch). A DR backup must not depend on
              # the internet. :2.0 adds age for client-side encryption.
              image: harbor.10.0.0.200.nip.io/library/k3s-backup:2.0
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  DATE=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/tmp/k3s-state-${DATE}.db"

                  # Consistent snapshot via VACUUM INTO. Unlike ".backup" (the
                  # online-backup API, which RESTARTS whenever the source is
                  # written and therefore livelocks against kine's constant
                  # writes — it hung >10min on the hot ~1.4GB DB on 2026-08-19),
                  # VACUUM INTO uses a single read transaction: it completes in
                  # ~3s and also compacts the DB (drops free pages).
                  sqlite3 /k3s-server/db/state.db "VACUUM INTO '${BACKUP_FILE}'"

                  # Self-verify the snapshot BEFORE uploading. A corrupt backup that looks fine is
                  # worse than a missing one (false confidence at restore time). Fail the job — which
                  # trips the backup-freshness alert — if integrity_check isn't "ok" or kine is empty.
                  INTEG=$(sqlite3 "${BACKUP_FILE}" "PRAGMA integrity_check;")
                  ROWS=$(sqlite3 "${BACKUP_FILE}" "SELECT count(*) FROM kine;")
                  if [ "${INTEG}" != "ok" ] || [ "${ROWS}" -lt 1 ]; then
                    echo "FAIL: kine snapshot bad (integrity=${INTEG} rows=${ROWS})"; exit 1
                  fi
                  echo "snapshot verified: integrity=ok kine_rows=${ROWS}"
                  # Encrypt client-side with age (ASYMMETRIC — we hold only the recipient PUBLIC key;
                  # the private identity lives in Vault secret/platform/k3s-backup-age and is used ONLY
                  # at restore, so a compromised set-hog cannot decrypt its own offsite backups).
                  gzip -c "${BACKUP_FILE}" | age -r "${AGE_RECIPIENT}" -o "${BACKUP_FILE}.gz.age"
                  rm -f "${BACKUP_FILE}"

                  # Configure rclone for MinIO
                  cat > /tmp/rclone.conf << CONF
                  [minio]
                  type = s3
                  provider = Minio
                  access_key_id = admin
                  secret_access_key = ${MINIO_PASSWORD}
                  endpoint = http://10.0.0.1:9000
                  CONF

                  rclone --config /tmp/rclone.conf mkdir minio:k3s-backup 2>/dev/null || true
                  rclone --config /tmp/rclone.conf copy "${BACKUP_FILE}.gz.age" minio:k3s-backup/

                  # --- control-plane bootstrap material (rehearsal-proven 2026-09-27, DR Scenario G) ---
                  # A from-scratch set-hog rebuild needs, beyond state.db, the pieces that are NOT in the
                  # datastore and NOT regenerable:
                  #   token                       — decrypts the datastore bootstrap on restore; MUST be
                  #                                 byte-exact (a stray trailing newline = "bootstrap data
                  #                                 encrypted with different token" and k3s won't start).
                  #   cred/encryption-config.json — decrypts secrets-at-rest, else restored secrets are
                  #                                 unreadable ("identity transformer tried to read encrypted data").
                  # tls/ is deliberately EXCLUDED — k3s regenerates all certs from the datastore CA on
                  # restore; restoring old tls/ trips "certs newer than datastore, could cause a cluster outage".
                  BOOT="/tmp/k3s-bootstrap-${DATE}.tar.gz.age"
                  EXTRA=""
                  [ -f /k3s-server/cred/encryption-config.json ] && EXTRA="$EXTRA cred/encryption-config.json"
                  [ -f /k3s-server/cred/encryption-state.json ] && EXTRA="$EXTRA cred/encryption-state.json"
                  # This tarball holds the cluster token + secrets-encryption key — encrypt it with age too.
                  tar czf - -C /k3s-server token $EXTRA | age -r "${AGE_RECIPIENT}" -o "$BOOT"
                  rclone --config /tmp/rclone.conf copy "$BOOT" minio:k3s-backup/

                  # Rotate per prefix (keep 7 each) — state DBs and bootstrap tarballs independently.
                  for PREFIX in k3s-state k3s-bootstrap; do
                    N=$(rclone --config /tmp/rclone.conf lsf minio:k3s-backup/ | grep "^${PREFIX}-" | wc -l)
                    D=$((N - 7))
                    if [ "$D" -gt 0 ]; then
                      rclone --config /tmp/rclone.conf lsf minio:k3s-backup/ | grep "^${PREFIX}-" | \
                        sort | head -n "$D" | \
                        xargs -r -I{} rclone --config /tmp/rclone.conf delete "minio:k3s-backup/{}"
                    fi
                  done

                  echo "Backup complete: k3s-state-${DATE}.db.gz.age + k3s-bootstrap-${DATE}.tar.gz.age"
              volumeMounts:
                - name: k3s-server
                  mountPath: /k3s-server
              env:
                - name: MINIO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: k3s-backup-minio
                      key: password
                - name: AGE_RECIPIENT
                  # PUBLIC key only (safe to commit) — age encrypt-only. The private identity is in
                  # Vault secret/platform/k3s-backup-age (used at RESTORE) + a Vaultwarden break-glass
                  # copy (so a control-plane rebuild isn't blocked on Vault being up). Rotate: regen
                  # the keypair, update this value, re-store the identity; old backups need the old key.
                  value: age16dpg8jgk8x6rlugfaj0grt3kw8pqfe6xq8y4luw5y5mqz4s2zv8svrctzm
              securityContext:
                runAsUser: 0
                capabilities:
                  drop: [NET_RAW]
              resources:
                limits:
                  cpu: 500m
                  # Raised 256Mi -> 512Mi: the k3s SQLite DB has grown to
                  # ~1.4GB (476MB state.db + ~900MB WAL) and sqlite .backup +
                  # gzip + rclone need headroom as it grows.
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
