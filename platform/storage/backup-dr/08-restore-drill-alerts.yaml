# Alerts for the Stage 3 app-consistent backup + restore drill (audit R-07).
# Netpol-free: both jobs simply exit non-zero on failure; these alerts fire off the
# kube-state-metrics CronJob success timestamp (same pattern as K3sSQLiteBackupStale),
# so a failing OR non-running job is caught without any egress to Alertmanager.
# Separate file from 00-prometheusrule.yaml to avoid churn on the core backup-dr rules.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: restore-drill
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kps
spec:
  groups:
    - name: restore-drill
      rules:
        - alert: SynapseLogicalBackupStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob="synapse-logical-backup", namespace="chat"}) / 3600 > 26
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "App-consistent synapse logical backup has not succeeded in 26+ hours"
            description: |
              The synapse-logical-backup CronJob (pg_dump → MinIO db-logical/synapse) last
              succeeded {{ $value | printf "%.1f" }} hours ago. The app-consistent restore
              drill has nothing fresh to validate against.
              Check: kubectl get cronjob synapse-logical-backup -n chat
              Logs:  kubectl logs -n chat -l job-name --since=26h

        - alert: AppRestoreDrillStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob="app-restore-drill", namespace="velero"}) / 3600 > 26
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "App-consistent restore drill has not passed in 26+ hours"
            description: |
              The app-restore-drill CronJob last succeeded {{ $value | printf "%.1f" }} hours
              ago — it is either failing (the synapse dump does not restore cleanly / too few
              tables or rows) or not running. An untested restore is not a backup.
              Check: kubectl get cronjob app-restore-drill -n velero
              Logs:  kubectl logs -n velero -l job-name --since=26h

        # --- ktayl-prod (insurance) — dump + restore drill (P3 gap closure) ---
        - alert: KtaylLogicalBackupStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob="ktayl-logical-backup", namespace="ktayl-prod"}) / 3600 > 26
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ktayl-prod logical backup has not succeeded in 26+ hours"
            description: |
              The ktayl-logical-backup CronJob (pg_dump → MinIO db-logical/ktayl) last succeeded
              {{ $value | printf "%.1f" }} hours ago. Check: kubectl get cronjob ktayl-logical-backup -n ktayl-prod

        - alert: KtaylRestoreDrillStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob="ktayl-restore-drill", namespace="velero"}) / 3600 > 26
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "ktayl restore drill has not passed in 26+ hours"
            description: |
              The ktayl-restore-drill last succeeded {{ $value | printf "%.1f" }} hours ago — the
              insurance-business DB dump is either failing to restore or the drill is not running.
              Check: kubectl get cronjob ktayl-restore-drill -n velero

        # --- erpnext (HR/ERP) — dump + restore drill (P3 gap closure) ---
        - alert: ErpnextLogicalBackupStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob="erpnext-logical-backup", namespace="erp"}) / 3600 > 26
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "erpnext logical backup has not succeeded in 26+ hours"
            description: |
              The erpnext-logical-backup CronJob (mysqldump → MinIO db-logical/erpnext) last succeeded
              {{ $value | printf "%.1f" }} hours ago. Check: kubectl get cronjob erpnext-logical-backup -n erp

        - alert: ErpnextRestoreDrillStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob="erpnext-restore-drill", namespace="velero"}) / 3600 > 26
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "erpnext restore drill has not passed in 26+ hours"
            description: |
              The erpnext-restore-drill last succeeded {{ $value | printf "%.1f" }} hours ago — the
              ERP DB dump is either failing to restore or the drill is not running.
              Check: kubectl get cronjob erpnext-restore-drill -n velero
