# The Composition behind AppBundle. A function-patch-and-transform pipeline that renders TWO resources:
#   1. a NESTED PostgresInstance XR (composite-of-composites — Crossplane reconciles it via ITS own
#      Composition → CNPG Cluster + DB-netpol + the <appName>-cnpg-app secret);
#   2. a baseline app NetworkPolicy via provider-kubernetes (default-deny; allow ingress from
#      ingress-nginx, egress to DNS + the DB) — the platform's default-deny-egress posture
#      (workplace-architecture.md #7) as a STARTING point the app owner extends for extra egress.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: appbundle
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  compositeTypeRef:
    apiVersion: platform.minicloud/v1alpha1
    kind: AppBundle
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: crossplane-contrib-function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # ── 1. The database — a NESTED PostgresInstance XR (not a provider Object) ──────────
          - name: database
            base:
              apiVersion: platform.minicloud/v1alpha1
              kind: PostgresInstance
              metadata:
                name: placeholder
                namespace: placeholder
              spec:
                size: small
                storageSize: 1Gi
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appName
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.size
                toFieldPath: spec.size
              - type: FromCompositeFieldPath
                fromFieldPath: spec.storageSize
                toFieldPath: spec.storageSize
              # surface the connection secret the app mounts (<appName>-cnpg-app)
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.appName
                  strategy: string
                  string:
                    fmt: "%s-cnpg-app"
                toFieldPath: status.databaseSecret
                policy:
                  fromFieldPath: Required
          # ── 2. Baseline app NetworkPolicy (provider-kubernetes Object) ─────────────────────
          - name: app-netpol
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata:
                      name: placeholder
                      namespace: placeholder
                    spec:
                      podSelector:
                        matchLabels:
                          app: placeholder
                      policyTypes: ["Ingress", "Egress"]
                      ingress:
                        # reachable by the ingress controller (the app's only inbound path)
                        - from:
                            - namespaceSelector:
                                matchLabels:
                                  kubernetes.io/metadata.name: ingress-nginx
                      egress:
                        # [0] DNS (kube-dns) — always needed
                        - to:
                            - namespaceSelector: {}
                              podSelector:
                                matchLabels:
                                  k8s-app: kube-dns
                          ports:
                            - protocol: UDP
                              port: 53
                            - protocol: TCP
                              port: 53
                        # [1] the app's own database (same namespace, the CNPG pods)
                        - to:
                            - podSelector:
                                matchLabels:
                                  cnpg.io/cluster: placeholder
                          ports:
                            - protocol: TCP
                              port: 5432
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: { type: Format, fmt: "%s-baseline" }
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string: { type: Format, fmt: "%s-baseline" }
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appName
                toFieldPath: spec.forProvider.manifest.spec.podSelector.matchLabels.app
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appName
                toFieldPath: spec.forProvider.manifest.spec.egress[1].to[0].podSelector.matchLabels['cnpg.io/cluster']
                transforms:
                  - type: string
                    string: { type: Format, fmt: "%s-cnpg" }
