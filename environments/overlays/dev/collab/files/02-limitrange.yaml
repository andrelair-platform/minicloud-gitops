apiVersion: v1
kind: LimitRange
metadata:
  labels:
    env: dev
    team: collab
  name: dev-limits
  namespace: collab-dev
spec:
  limits:
    - type: Container
      default:
        cpu: "200m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "1"
        memory: "2Gi"
