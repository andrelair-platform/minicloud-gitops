---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Sync Cilium before MetalLB removal and before any app that depends on
    # L4 networking (ingress, Harbor, Authentik, etc.).
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: minicloud-platform
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      # 1.19.6 confirmed: kubeVersion >= 1.21.0 (no upper bound), valid for k3s 1.36
      targetRevision: "1.19.6"
      helm:
        releaseName: cilium
        valueFiles:
          - $values/helm-values/cilium-values.yaml
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    # No automated sync — CNI changes must be coordinated with the Ansible
    # node migration playbook. Enable automated after all nodes are on Cilium.
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # WireGuard keys are generated at runtime and stored in a Secret — ArgoCD
    # must not try to reconcile these back to null.
    - group: ""
      kind: Secret
      namespace: kube-system
      name: cilium-wireguard-keys
      jsonPointers:
        - /data
    # CiliumNode status is written by the agent, not the chart.
    - group: cilium.io
      kind: CiliumNode
      jsonPointers:
        - /status
    # CRD status and conversion webhook are managed by the operator.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/conversion/webhook/clientConfig/caBundle
