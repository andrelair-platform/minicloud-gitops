---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpnext
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  sources:
    - repoURL: https://helm.erpnext.com
      chart: erpnext
      targetRevision: 8.0.67
      helm:
        valueFiles:
          - $values/helm-values/minicloud-1/erpnext-values.yaml
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      path: manifests/erpnext
  destination:
    server: https://kubernetes.default.svc
    namespace: erp
  ignoreDifferences:
    # ESO owns the erpnext Secret (mariadb-root-password). Helm renders a
    # placeholder stringData value — ignore it so ESO wins field ownership.
    # ESO also adds reconcile.external-secrets.io/* labels and annotations.
    - group: ""
      kind: Secret
      name: erpnext
      jsonPointers:
        - /data
        - /metadata/labels
        - /metadata/annotations
    # Jobs get timestamp annotations on each render — ignore to stop restart loop
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/template/metadata
        - /spec/selector
    # priorityClassName set via kubectl patch — chart doesn't template this field.
    # (topologySpreadConstraints no longer ignored: nginx.topologySpreadConstraints is
    # now a NON-empty ScheduleAnyway list in values, which the chart honors — so git is
    # the source of truth and ArgoCD can enforce/selfHeal it. The old `[]` was falsy and
    # ignored by the chart, which is why it used to need suppression.)
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.priorityClassName
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.template.spec.priorityClassName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
