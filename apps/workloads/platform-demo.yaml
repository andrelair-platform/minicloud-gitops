apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/platform-demo/minicloud-1/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-demo-prod
  syncPolicy:
    # Git-gated automated production (PILOT — first prod app on auto-sync).
    # The approval gate lives upstream in Git, not in the ArgoCD UI:
    #   - CODEOWNERS requires @AndreLair review on services/*/minicloud-1/prod/
    #   - images are immutable SHA tags (never :latest)
    #   - the canary Rollout + http-regression-gate analysis auto-aborts on bad metrics
    # selfHeal corrects live drift back to Git; prune removes resources deleted
    # from Git. .spec.replicas stays in ignoreDifferences (below) so selfHeal does
    # NOT fight the KEDA HTTP add-on's 0<->2 scaling.
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      name: platform-demo
      namespace: platform-demo-prod
      jqPathExpressions:
        - .spec.replicas
        - .spec.template.metadata.annotations
