apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ktayl-policy-service-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # HGP golden path (GAP wrapper chart, prod): ONE Helm source. Wrapper depends on the library chart
  # (OCI) for the workload + Ingress; TLS cert + dedicated Postgres + app-secret ES + ghcr-pull ES are
  # wrapper templates (prodExtras). selectorLabels match the live Deployment selector → in-place flip,
  # Postgres StatefulSet kept verbatim → data preserved. releaseName kept = ktayl-policy-service.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/ktayl-policy-service/helm
    helm:
      releaseName: ktayl-policy-service
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ktayl-prod
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template
  syncPolicy:
    # Git-gated automated production (CODEOWNERS on apps/ + services/*/helm). Git owns replicas (2).
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
