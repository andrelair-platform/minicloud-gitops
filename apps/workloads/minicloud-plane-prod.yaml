apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minicloud-plane-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/minicloud-plane/minicloud-1/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: minicloud-plane-prod
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/template/metadata/annotations
    # ESO's webhook injects these defaults into the ghcr-pull ExternalSecret at
    # creation; they're never in git, so ignore them (with RespectIgnoreDifferences)
    # or the app is permanently OutOfSync / selfHeal fights ESO.
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
  syncPolicy:
    # Git-gated automated production. The approval gate lives upstream in Git:
    #   - CODEOWNERS requires @AndreLair review on services/*/minicloud-1/prod/
    #   - images are immutable SHA tags (never :latest)
    #   - the BlueGreen Rollout + preview-health-gate prePromotionAnalysis
    #     auto-aborts the promotion on bad metrics
    # selfHeal corrects live drift back to Git; prune removes resources deleted
    # from Git. Git owns .spec.replicas (prod patch-replicas=2, no autoscaler),
    # so selfHeal enforcing it is correct.
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
