apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minicloud-plane-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # HGP golden path (GAP wrapper chart, prod): ONE Helm source. Wrapper depends on the library chart
  # (OCI) — blueGreen Rollout, 2 static replicas — and carries the AnalysisTemplates, app-secrets ES,
  # SSO Ingress, cert, and ghcr-pull ES in templates/. releaseName kept = minicloud-plane.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/minicloud-plane/helm
    helm:
      releaseName: minicloud-plane
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: minicloud-plane-prod
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/template/metadata/annotations
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template
  syncPolicy:
    # Git-gated automated production. CODEOWNERS on apps/ + services/*/helm. blueGreen +
    # preview-health-gate prePromotionAnalysis auto-aborts a bad promotion. Git owns .spec.replicas.
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
