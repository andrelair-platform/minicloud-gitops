apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minicloud-plane-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # HGP golden path (prod): chart (ghcr OCI) + git values + git satellites (SSO Ingress, cert,
  # ghcr-pull ES, the 2 AnalysisTemplates, app-secrets ES). blueGreen Rollout, 2 static replicas.
  # values selectorLabels {app: minicloud-plane} match the live Rollout selector → in-place flip.
  sources:
    - repoURL: ghcr.io/andrelair-platform
      chart: minicloud-app-deployment
      targetRevision: 0.2.0
      helm:
        releaseName: minicloud-plane
        valueFiles:
          - $values/services/minicloud-plane/helm/values.yaml
          - $values/services/minicloud-plane/helm/values-prod.yaml
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      path: services/minicloud-plane/satellites/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: minicloud-plane-prod
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/template/metadata/annotations
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template
  syncPolicy:
    # Git-gated automated production. Gate lives upstream in Git (CODEOWNERS on apps/ +
    # services/*/helm|satellites/, immutable ghcr SHA promoted by Kargo via a values image.tag
    # bump). blueGreen + preview-health-gate prePromotionAnalysis auto-aborts a bad promotion.
    # Git owns .spec.replicas (values=2, no autoscaler) → selfHeal enforcing it is correct.
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
