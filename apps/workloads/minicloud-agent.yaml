apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minicloud-agent
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: minicloud-platform
  # HGP golden path (prod): chart from ghcr OCI + git values + git satellites (Certificate).
  sources:
    - repoURL: ghcr.io/andrelair-platform
      chart: minicloud-app-deployment
      targetRevision: 0.1.2
      helm:
        releaseName: minicloud-agent
        valueFiles:
          - $values/services/minicloud-agent/helm/values.yaml
          - $values/services/minicloud-agent/helm/values-prod.yaml
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      path: services/minicloud-agent/satellites
  destination: { server: https://kubernetes.default.svc, namespace: ai }
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
