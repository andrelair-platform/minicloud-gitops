apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ktayl-policy-service-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # ROLLED BACK to kustomize (2026-09-11): the HGP chart render crash-looped (exit 2,
  # no logs) despite byte-identical env/probes/securityContext to this overlay — under
  # diagnosis. Overlay restores working dev immediately (the kept rollback path).
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/ktayl-policy-service/minicloud-1/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ktayl
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
