apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ktayl-policy-service-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # HGP golden path: the workload is rendered from the shared minicloud-app-deployment
  # chart (pulled OCI from Harbor = dev registry), with per-app values from git ($values).
  # releaseName MUST stay ktayl-policy-service so resource names match the prior overlay.
  sources:
    - repoURL: harbor.10.0.0.200.nip.io/library
      chart: minicloud-app-deployment
      targetRevision: 0.1.1
      helm:
        releaseName: ktayl-policy-service
        valueFiles:
          - $values/services/ktayl-policy-service/helm/values.yaml
          - $values/services/ktayl-policy-service/helm/values-dev.yaml
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ktayl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
