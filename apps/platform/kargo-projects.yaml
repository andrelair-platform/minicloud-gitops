apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo-projects
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
        revision: main
        directories:
          - path: services/*/kargo
          # retrieva is wired via a DEDICATED app (apps/platform/kargo-retrieva.yaml),
          # NOT this ApplicationSet: its prod workload owns the bare `retrieva` ns, so
          # its Kargo project needs a separate ns (retrieva-kargo) that the ns=<dir>
          # convention here can't express. Excluded so it isn't generated twice.
          - path: services/retrieva/kargo
            exclude: true
  template:
    metadata:
      # services/<svc>/kargo  →  segments[1] == <svc>
      name: "kargo-{{ index .path.segments 1 }}"
      labels:
        app.kubernetes.io/part-of: kargo
    spec:
      project: minicloud-platform
      source:
        repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ index .path.segments 1 }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.target.deletionPolicy
