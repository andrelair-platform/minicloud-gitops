---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: manifests/langfuse-base
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse
  # ESO injects 4 defaults into each ExternalSecret spec at admission (never in git) → SSA sees drift.
  # Ignore them so the app stays Synced (the CNPG role + R2 ExternalSecrets added here, #langfuse-cnpg).
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
