---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Sync Cilium before MetalLB removal and before any app that depends on
    # L4 networking (ingress, Harbor, Authentik, etc.).
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: minicloud-platform
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      # 1.19.6 confirmed: kubeVersion >= 1.21.0 (no upper bound), valid for k3s 1.36
      targetRevision: "1.19.6"
      helm:
        releaseName: cilium
        valueFiles:
          - $values/helm-values/minicloud-1/cilium-values.yaml
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      path: manifests/cilium
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # WireGuard keys are generated at runtime and stored in a Secret — ArgoCD
    # must not try to reconcile these back to null.
    - group: ""
      kind: Secret
      namespace: kube-system
      name: cilium-wireguard-keys
      jsonPointers:
        - /data
    # Cilium generates TLS certs for Hubble at startup — not in git.
    - group: ""
      kind: Secret
      namespace: kube-system
      name: cilium-ca
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      namespace: kube-system
      name: hubble-relay-client-certs
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      namespace: kube-system
      name: hubble-server-certs
      jsonPointers:
        - /data
    # cert-manager writes status after issuing the Hubble UI cert.
    - group: cert-manager.io
      kind: Certificate
      namespace: kube-system
      name: hubble-ui-tls
      jsonPointers:
        - /status
    # CiliumNode status is written by the agent, not the chart.
    - group: cilium.io
      kind: CiliumNode
      jsonPointers:
        - /status
    # CiliumLoadBalancerIPPool status is written by the operator.
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
      jsonPointers:
        - /status
    # CiliumL2AnnouncementPolicy status is written by the operator.
    - group: cilium.io
      kind: CiliumL2AnnouncementPolicy
      jsonPointers:
        - /status
    # CRD status and conversion webhook are managed by the operator.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/conversion/webhook/clientConfig/caBundle
