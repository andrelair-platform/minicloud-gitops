apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minicloud-agent
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: minicloud-platform
  # HGP golden path (GAP wrapper chart, prod): ONE Helm source. Wrapper depends on the library chart
  # (OCI) + owns the prod TLS Certificate (templates/). ghcr-pull is a shared ai-ns ES (manifests/ai/).
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/minicloud-agent/helm
    helm:
      releaseName: minicloud-agent
      valueFiles:
        - values-prod.yaml
  destination: { server: https://kubernetes.default.svc, namespace: ai }
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
