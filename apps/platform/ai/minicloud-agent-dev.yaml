apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minicloud-agent-dev
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: minicloud-platform
  # HGP golden path (GAP wrapper chart): ONE Helm source. Wrapper depends on the library chart (OCI)
  # and owns the litellm-credentials ESO. releaseName kept = minicloud-agent. values.yaml is the chart
  # default; values-dev.yaml overlays it.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/minicloud-agent/helm
    helm:
      releaseName: minicloud-agent
      valueFiles:
        - values-dev.yaml
  destination: { server: https://kubernetes.default.svc, namespace: minicloud-agent-dev }
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
