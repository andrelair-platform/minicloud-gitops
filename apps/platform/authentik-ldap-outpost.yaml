---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-ldap-outpost
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: manifests/authentik-ldap-outpost
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  # Contains an ExternalSecret → ESO injects 4 default fields at admission that are never in git.
  # Ignore them (+ RespectIgnoreDifferences) so the app isn't permanently OutOfSync (gitops.md).
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
