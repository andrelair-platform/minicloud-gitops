---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  sources:
    - repoURL: https://go.temporal.io/helm-charts
      chart: temporal
      targetRevision: "1.6.0"
      helm:
        releaseName: temporal
        valueFiles:
          - $values/helm-values/minicloud-1/temporal-values.yaml
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      path: manifests/temporal
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
    # Bitnami PostgreSQL generates a random password secret on first install
    - group: ""
      kind: Secret
      name: temporal-postgresql
      jqPathExpressions:
        - .data
    # Kubernetes mutates VolumeClaimTemplates after creation — cannot patch on live StatefulSet
    - group: apps
      kind: StatefulSet
      name: temporal-postgresql
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].metadata.resourceVersion
        - .spec.volumeClaimTemplates[].metadata.uid
        - .spec.volumeClaimTemplates[].metadata.creationTimestamp
        - .spec.volumeClaimTemplates[].status
    # priorityClassName set via kubectl patch — chart doesn't template this field
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.priorityClassName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
