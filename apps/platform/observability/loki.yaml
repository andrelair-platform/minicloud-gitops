---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "7.0.0"
      helm:
        releaseName: loki
        valueFiles:
          - $values/helm-values/minicloud-1/loki-values.yaml
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      path: platform/observability/loki
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  ignoreDifferences:
    # StatefulSet claim templates are immutable after creation. The separately
    # managed storage-loki-0 PVC below owns online capacity expansion.
    - group: apps
      kind: StatefulSet
      name: loki
      namespace: observability
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
