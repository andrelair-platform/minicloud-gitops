apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  sources:
    # 1) ExternalDNS itself (kubernetes-sigs chart). Cloudflare provider, publishing
    #    CNAMEs to the Cloudflare Tunnel for the org namespace only. Full design +
    #    rationale: docs/dns-naming-and-externaldns.md.
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.22.0
      helm:
        releaseName: external-dns
        valuesObject:
          provider:
            name: cloudflare
          # CF API token from the ESO-rendered secret (source 2) — never in git.
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
          # ---- fail-safe scoping (see the ADR guard table) ----
          # Can ONLY ever touch the org namespace — never the portfolio (www/apex
          # devandre.sbs) nor retrieva.online nor the existing flat *.devandre.sbs.
          domainFilters:
            - ktayl.devandre.sbs
          # NEVER delete a record (worst case: an extra record, never a removal).
          policy: upsert-only
          registry: txt
          txtOwnerId: minicloud-externaldns
          txtPrefix: _extdns.
          sources:
            - ingress
          # Opt-in is the HOSTNAME: an Ingress is managed only when its host is under
          # ktayl.devandre.sbs (domainFilters) — combined with the per-record tunnel
          # target annotation, both set via the library ingress values (host +
          # annotations). No custom label is used because the shared library ingress
          # emits only standard app.labels (no hook for one) and the library can't be
          # republished from here (read-only ghcr token). Verified safe: no existing
          # Ingress uses a ktayl.devandre.sbs host → external-dns is idle today.
          # `cloudflare-proxied` defaults to false (DNS-only / grey cloud); it's
          # controlled per-record via external-dns.alpha.kubernetes.io/cloudflare-proxied.
          logLevel: info
          # Gatekeeper: non-root + no-priv-esc + drop caps + seccomp + resource limits.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
    # 2) The ESO ExternalSecret (+ namespace) that renders the CF token.
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      path: manifests/external-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # ESO webhook injects these defaults at creation → avoid permanent OutOfSync.
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
