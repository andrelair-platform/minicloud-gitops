apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: minicloud-platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.7
    helm:
      values: |
        installCRDs: true
        # HA — the durable fix for the recurring post-reboot ESO outage (x13/91d). A SINGLE controller
        # pod meant that whenever it landed on a flaky node (swift-mac losing kube-apiserver routing after
        # a power event), it could not mint its SA token → the vault-backend store went NotReady → ALL
        # ExternalSecrets stopped refreshing cluster-wide, until a human restarted cilium on that node.
        # Now: 2 replicas with leader election (one active, one hot standby) SPREAD across nodes — when the
        # leader's node can't reach the apiserver it can't renew its lease, and the standby on a healthy
        # node takes over automatically. Spread (not a swift-mac node-pin — scheduling.md "spread, don't
        # pin") so the two never co-locate. Ref: memory feedback_eso_vault_store_cilium_apiserver_after_reboot.
        replicaCount: 2
        leaderElect: true
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: external-secrets
                app.kubernetes.io/instance: external-secrets
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        webhook:
          create: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        certController:
          create: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
