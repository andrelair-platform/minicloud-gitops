---
# Longhorn CORE — Helm chart reconciled by ArgoCD (Finding A closure; adoption of the
# live 1.12.1 install previously managed by raw `kubectl apply`).
# Settings/recurring-jobs/pvc-labels/backup remain in the SEPARATE `longhorn-base` app.
#
# Adopted in-place via an attended, diff-gated first sync (2026-10-02); the one-time
# Helm-ownership-label rollout of longhorn-manager/ui is done, data plane verified intact
# (60/60 volumes healthy, instance-managers untouched, RW smoke PASS). Auto-sync enabled
# after that verification passed. See docs/reliability-longhorn-helm-migration.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: "1.12.1"
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/helm-values/minicloud-1/longhorn-values.yaml
    - repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
