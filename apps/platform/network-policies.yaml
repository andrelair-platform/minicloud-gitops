---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: manifests/network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Cilium's operator adds a .status field to every CiliumNetworkPolicy after
  # creation (its own bookkeeping, never in git). Without this, ArgoCD flags
  # every CNP as OutOfSync forever even though nothing is wrong — burying real
  # drift in cosmetic noise. Ignore the operator-managed status field.
  ignoreDifferences:
    - group: cilium.io
      kind: CiliumNetworkPolicy
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
