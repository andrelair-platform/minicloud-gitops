---
# The Authentik CloudNativePG cluster (audit R-06, Stage 4). Since the 2026-09-23 cutover
# this is Authentik's LIVE database (authentik-values.yaml postgresql.host: authentik-cnpg-rw);
# HA primary+replica with off-site PITR to R2. The bitnami authentik-postgresql was decommissioned.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: manifests/cnpg-authentik
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  # ESO webhook injects 4 defaults into ExternalSecrets → ignore to avoid permanent OutOfSync.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
    # The CNPG operator defaults these git-set subtrees after apply (harmless, operator-owned);
    # ignoring only the specific defaulted keys keeps ArgoCD watching the rest of the config.
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .spec.storage.resizeInUseVolumes
        - .spec.monitoring.customQueriesConfigMap
        - .spec.monitoring.disableDefaultQueries
        - .spec.backup.target
        - .spec.managed.roles[].connectionLimit
        - .spec.managed.roles[].inherit
        - .spec.bootstrap.initdb.encoding
        - .spec.bootstrap.initdb.localeCType
        - .spec.bootstrap.initdb.localeCollate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
