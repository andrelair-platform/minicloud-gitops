apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # HGP golden path (GAP wrapper chart, prod): ONE Helm source. Wrapper chart depends on the
  # minicloud-app-deployment library chart (OCI) + carries the SSO Ingress / ConfigMap /
  # AnalysisTemplate in templates/. ghcr image is Public (no imagePullSecret). Kargo bumps
  # minicloud-app-deployment.image.tag in values-prod.yaml.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/platform-demo/helm
    helm:
      releaseName: platform-demo
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-demo-prod
  syncPolicy:
    # Git-gated automated production. CODEOWNERS on apps/ + services/*/helm. canary Rollout +
    # http-regression-gate analysis auto-aborts a bad rollout. KEDA HTTP owns .spec.replicas.
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      name: platform-demo
      namespace: platform-demo-prod
      jqPathExpressions:
        - .spec.replicas
        - .spec.template.metadata.annotations
