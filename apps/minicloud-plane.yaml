apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minicloud-plane-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/minicloud-plane/minicloud-1/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: minicloud-plane-dev
  ignoreDifferences:
    # Rollout CRD doesn't support SSA — ArgoCD records op:Update not op:Apply.
    # Without this, VPA or manual scaling diffs cause permanent OutOfSync.
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
        - /spec/template/metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
