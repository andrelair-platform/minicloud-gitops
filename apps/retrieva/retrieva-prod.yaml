---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retrieva-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # HGP golden path (GAP wrapper chart, dual-workload, prod): ONE Helm source. Wrapper depends on the
  # library chart TWICE (aliased backend + frontend) + owns Mongo/Redis/netpol/ingress/cert/quota/ESO.
  # selectorLabels match the live immutable selectors → in-place flip; Mongo StatefulSet verbatim →
  # data preserved. Verified identical to the kustomize output via render-diff + proven in-place on dev.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/retrieva/helm
    helm:
      releaseName: retrieva
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: retrieva
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
    # CNPG operator-injected spec defaults (retrieva-cnpg) → else permanently OutOfSync. Mirrors ktayl.
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .spec.storage.resizeInUseVolumes
        - .spec.monitoring.customQueriesConfigMap
        - .spec.monitoring.disableDefaultQueries
        - .spec.backup.target
        - .spec.managed.roles[].connectionLimit
        - .spec.managed.roles[].inherit
        - .spec.bootstrap.initdb.encoding
        - .spec.bootstrap.initdb.localeCType
        - .spec.bootstrap.initdb.localeCollate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
