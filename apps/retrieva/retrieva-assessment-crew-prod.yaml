---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retrieva-assessment-crew-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # GAP wrapper chart (single workload) in the retrieva (prod) ns — ghcr SHA image + ghcr-pull.
  # Git-gated auto-sync (protected PR and required checks are the merge gate upstream).
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/retrieva-assessment-crew/helm
    helm:
      releaseName: retrieva-assessment-crew
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: retrieva
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
