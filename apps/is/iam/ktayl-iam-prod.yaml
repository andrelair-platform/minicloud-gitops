apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ktayl-iam-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # GAP wrapper chart (dual-workload: backend + frontend aliased library subcharts). ONE Helm source.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/ktayl-iam/helm
    helm:
      releaseName: ktayl-iam
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ktayl-iam-prod
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
    # CNPG operator injects spec defaults into the ktayl-iam-cnpg Cluster (managed-role +
    # initdb + monitoring + backup fields not in git) → SSA drift → OutOfSync. Ignore exactly the
    # operator-managed fields (mirrors the cnpg-authentik app, which uses managed.roles too).
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .spec.storage.resizeInUseVolumes
        - .spec.monitoring.customQueriesConfigMap
        - .spec.monitoring.disableDefaultQueries
        - .spec.backup.target
        - .spec.managed.roles[].connectionLimit
        - .spec.managed.roles[].inherit
        - .spec.bootstrap.initdb.encoding
        - .spec.bootstrap.initdb.localeCType
        - .spec.bootstrap.initdb.localeCollate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
