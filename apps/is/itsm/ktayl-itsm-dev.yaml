apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ktayl-itsm-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # GLPI ITSM (board #16, ITSM-01/S001). Wrapper chart with hand-written GLPI + MariaDB workloads
  # (GLPI is stateful → own PVCs; the stateless library subchart doesn't fit). Custom image built
  # from the ktayl-itsm repo. S001 = internal host only; S002 adds Authentik OIDC + the public route.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/ktayl-itsm/helm
    helm:
      releaseName: ktayl-itsm
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: itsm
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
