apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ktayl-policy-service-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # HGP golden path (GAP wrapper chart, dev): ONE Helm source. Wrapper depends on the library chart
  # (OCI) for the workload + Ingress; the dev TLS cert is a wrapper template. Postgres + app secret
  # live outside gitops (manual) → prodExtras off. releaseName kept = ktayl-policy-service.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/ktayl-policy-service/helm
    helm:
      releaseName: ktayl-policy-service
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ktayl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
