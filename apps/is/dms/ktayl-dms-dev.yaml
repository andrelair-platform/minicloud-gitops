apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ktayl-dms-dev
  namespace: argocd
  annotations:
    # SSA app + CNPG-mutated managed.roles → ArgoCD's client-side diff phantom-flags the Cluster OutOfSync
    # (kubectl server-side diff is clean). ServerSideDiff makes ArgoCD diff via a server dry-run → accurate.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # Paperless-ngx DMS engine (board #24, ADR-001 Phase 1). Standalone stateful chart (Paperless + CNPG +
  # tiny Redis + document PVCs); stock upstream image. SSO = native Authentik OIDC (django-allauth). The
  # paperless pod waits on the ESO `paperless-secrets` (Vault secret/platform/paperless) — seed that + the
  # Authentik `paperless` provider before this syncs live.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/ktayl-dms/helm
    helm:
      releaseName: ktayl-dms
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ktayl-dms
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .spec.storage.resizeInUseVolumes
        - .spec.monitoring.customQueriesConfigMap
        - .spec.monitoring.disableDefaultQueries
        - .spec.backup.target
        - .spec.bootstrap.initdb.encoding
        - .spec.bootstrap.initdb.localeCType
        - .spec.bootstrap.initdb.localeCollate
        - .spec.managed.roles[].connectionLimit
        - .spec.managed.roles[].inherit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
