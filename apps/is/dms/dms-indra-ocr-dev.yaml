apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dms-indra-ocr-dev
  namespace: argocd
spec:
  project: minicloud-platform
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/dms-indra-ocr/helm
    helm:
      releaseName: dms-indra-ocr
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ktayl-dms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
