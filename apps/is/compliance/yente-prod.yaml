apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yente-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: minicloud-platform
  # yente sanctions-screening engine — PROD (RC-02, board #15). Dedicated prod instance (yente API +
  # single-node OpenSearch + freshness exporter) in ns yente-prod. Consumed by ktayl-core-prod's screening
  # module at http://yente.yente-prod.svc:8000 (the bind/payment/intake HOLD gates fail CLOSED, so prod must
  # screen against THIS engine, never the dev one). Pulls the official free lists (OFAC/EU/UN/UK) from
  # data.opensanctions.org via the controlled egress netpol. First sync: OpenSearch builds the index
  # (a few min) before yente /readyz goes green — the ktayl-core prod promotion lands AFTER this is healthy.
  source:
    repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
    targetRevision: main
    path: services/yente/helm
    helm:
      releaseName: yente
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: yente-prod
  ignoreDifferences:
    # Cilium's webhook defaults enableDefaultDeny on CiliumNetworkPolicy specs (never in git) → SSA drift.
    - group: cilium.io
      kind: CiliumNetworkPolicy
      jqPathExpressions:
        - .spec.enableDefaultDeny
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
