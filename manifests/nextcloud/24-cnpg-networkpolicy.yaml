# Allow the CloudNativePG operator (cnpg-system) to reach the nextcloud-postgres instances'
# status endpoint (:8000) + Postgres (:5432). Without this, nextcloud's default-deny-ingress
# drops the operator's https://<pod>:8000/pg/status probe → "Instance Status Extraction Error"
# → the cluster never goes healthy (observed live on authentik-cnpg 2026-09-22). Nextcloud-app
# → DB (:5432) is already covered by the ns allow-same-namespace policy; monitoring scrape
# (:9187) by allow-monitoring-scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: nextcloud
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: nextcloud-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
