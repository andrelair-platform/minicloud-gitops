# Password source for the CNPG `nextcloud` role, sourced from the SAME Vault value Nextcloud
# already uses for its DB connection (platform/nextcloud-secrets → nextcloud-db-password, the
# key the helm chart's postgresql.auth.existingSecret consumes). Reusing it makes the CNPG
# cluster a drop-in: Nextcloud's own DB credentials stay valid; only the DB host changes.
# Consumed by the Cluster's spec.managed.roles[nextcloud].passwordSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-cnpg-role
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nextcloud-cnpg-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "nextcloud"
        password: "{{ .pgpass }}"
  data:
    - secretKey: pgpass
      remoteRef:
        key: platform/nextcloud-secrets
        property: nextcloud-db-password
