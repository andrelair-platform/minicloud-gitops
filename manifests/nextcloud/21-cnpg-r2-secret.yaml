---
# R2 credentials for CloudNativePG's Barman object-store backup (WAL + base backups).
# Pulled from Vault secret/data/platform/cloudflare (store-relative key), same source + bucket
# family as the authentik CNPG cluster. Consumed by the Cluster's backup.barmanObjectStore.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-cnpg-r2
  namespace: nextcloud
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nextcloud-cnpg-r2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: platform/cloudflare, property: r2-access-key-id }
    - secretKey: SECRET_ACCESS_KEY
      remoteRef: { key: platform/cloudflare, property: r2-secret-access-key }
