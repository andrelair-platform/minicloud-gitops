# minicloud Internal Root CA → appended to the Nextcloud pod's system trust bundle so the Mail app
# (PHP/Horde IMAP+SMTP) can verify Stalwart's minicloud-CA cert. Nextcloud's own
# `occ security:certificates` store only covers outbound HTTP (Guzzle), NOT the Mail app's TLS.
# An initContainer (runs as root) appends this CA to a copy of the base bundle in a shared emptyDir,
# which is then mounted over /etc/ssl/certs/ca-certificates.crt in the main container. (The image's
# own before-starting hook runs as www-data and CANNOT write /etc/ssl/certs — Permission denied — so
# the hook approach does not work; the initContainer does.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-ca-trust
  namespace: nextcloud
data:
  minicloud-ca.crt: |
