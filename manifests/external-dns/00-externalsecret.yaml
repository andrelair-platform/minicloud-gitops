---
# Namespace for ExternalDNS (Cloudflare provider). See ADR docs/dns-naming-and-externaldns.md.
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
# Cloudflare API token for ExternalDNS, rendered from Vault (never in git).
# Reuses the platform CF token (Zone:Read + DNS:Edit on devandre.sbs). A dedicated
# least-privilege token is a recommended hardening follow-up (see the ADR).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: platform/cloudflare      # vault-backend is KV v2 with path=secret → relative key
        property: api-token
