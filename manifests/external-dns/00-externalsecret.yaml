---
# Namespace for ExternalDNS (Cloudflare provider). See ADR docs/dns-naming-and-externaldns.md.
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
# Cloudflare API token for ExternalDNS, rendered from Vault (never in git).
# Uses the broad account-wide MINICLOUD token (platform/cloudflare api-token) —
# ACCEPTED RISK (2026-09-18): ExternalDNS's blast radius is already capped by its
# --domain-filter (ktayl.devandre.sbs) + upsert-only regardless of token scope, so
# this is only a defense-in-depth gap if the pod/secret leak. A dedicated scoped
# token (secret/platform/cloudflare-externaldns) is a deferred hardening — see the
# ADR docs/dns-naming-and-externaldns.md (Consequences).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: platform/cloudflare      # vault-backend is KV v2 with path=secret → relative key
        property: api-token
