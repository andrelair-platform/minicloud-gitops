---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mail
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: mail
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: mail
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: mail
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
---
# Allow n8n (automation ns) → Stalwart SMTP submission (587/STARTTLS) for the HR-12
# fan-out notify email. mail is default-deny-ingress; this is the explicit, port-scoped allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-automation-smtp
  namespace: mail
spec:
  podSelector:
    matchLabels:
      app: stalwart
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: automation
      ports:
        - protocol: TCP
          port: 587
---
# Allow Nextcloud (nextcloud ns) → Stalwart IMAP + SMTP submission so the Nextcloud Mail app
# (the browser 'Outlook') can read/send mail. IMAP 143 (STARTTLS) + 993 (implicit TLS) + 587 (submission).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nextcloud-mail
  namespace: mail
spec:
  podSelector:
    matchLabels:
      app: stalwart
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
      ports:
        - { protocol: TCP, port: 143 }
        - { protocol: TCP, port: 993 }
        - { protocol: TCP, port: 587 }
---
# Allow ktayl-iam (the HR Joiner handler, S016) → Stalwart JMAP (8080) to provision mailboxes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ktayl-iam-jmap
  namespace: mail
spec:
  podSelector:
    matchLabels:
      app: stalwart
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ktayl-iam
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-node-entities
  namespace: mail
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
