# NetworkPolicy for minicloud-crew-agent-dev — CrewAI agent — egresses to ai/litellm + ai/rag-ingest only  (HIGH-02 remediation)
#   Ingress: default-deny + same-ns + ingress-nginx + monitoring scrape.
#   Egress:  default-deny + DNS + all cluster-internal (blocks public internet =
#            prompt-injection / data-exfil risk).
# Cilium: ipBlock does NOT match intra-cluster identities, so the CiliumNetworkPolicies
# are what actually permit pod-to-pod + kubelet-probe traffic under a default-deny.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: minicloud-crew-agent-dev}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-same-namespace, namespace: minicloud-crew-agent-dev}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {}}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-nginx, namespace: minicloud-crew-agent-dev}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-monitoring-scrape, namespace: minicloud-crew-agent-dev}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-egress, namespace: minicloud-crew-agent-dev}
spec: {podSelector: {}, policyTypes: [Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns-egress, namespace: minicloud-crew-agent-dev}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-cluster-internal-egress, namespace: minicloud-crew-agent-dev}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress: [{to: [{ipBlock: {cidr: 10.0.0.0/8}}]}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-node-entities, namespace: minicloud-crew-agent-dev}
spec:
  endpointSelector: {}
  ingress: [{fromEntities: [host, remote-node]}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-cluster-egress, namespace: minicloud-crew-agent-dev}
spec:
  endpointSelector: {}
  egress: [{toEntities: [cluster]}]
