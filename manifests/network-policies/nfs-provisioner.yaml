---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nfs-provisioner
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: nfs-provisioner
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# kube-apiserver health-checks and webhook calls from cluster nodes
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-nodes
  namespace: nfs-provisioner
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/24
---
# Cilium entity-based replacement for ipBlock-based allow-cluster-nodes.
# In Cilium, traffic from cluster nodes (kubelet, kube-apiserver) carries
# remote-node or host identity — ipBlock CIDR rules do not match it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-node-entities
  namespace: nfs-provisioner
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
