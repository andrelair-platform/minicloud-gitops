# This file is intentionally empty.
#
# The CiliumClusterwideNetworkPolicy allow-remote-node-to-all was removed.
# It used endpointSelector: {} which applied an ingress restriction to ALL
# pods cluster-wide — including pods with no prior NetworkPolicy (CoreDNS,
# Longhorn). This silently broke DNS (pod-to-CoreDNS queries dropped) and
# all cross-namespace connectivity for unprotected namespaces.
#
# Fix: per-namespace CiliumNetworkPolicy allow-node-entities (kind: CiliumNetworkPolicy,
# not CiliumClusterwideNetworkPolicy) added to each file in this directory.
# Namespace-scoped policies only restrict endpoints that already have a
# default-deny NetworkPolicy — unprotected namespaces (kube-system, longhorn-system)
# remain default-allow.
