---
# BookStack app secrets from Vault. Target keys ARE the env var names BookStack reads (envFrom).
# oidc-client-id/oidc-client-secret were added to Vault by scripts/authentik/oidc-provider-to-vault.sh
# (in the minicloud-ops repo); app-key + mariadb-password were seeded earlier.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bookstack-app-secret
  namespace: intranet
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bookstack-app-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: platform/bookstack
        property: app-key
    - secretKey: DB_PASSWORD
      remoteRef:
        key: platform/bookstack
        property: mariadb-password
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: platform/bookstack
        property: oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: platform/bookstack
        property: oidc-client-secret
