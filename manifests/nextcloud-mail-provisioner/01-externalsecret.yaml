# The shared default mailbox password (same value the ktayl-iam Joiner sets on a new employee's
# Authentik identity + Stalwart mailbox — foundation A). The provisioner stores it as the IMAP/SMTP
# password on each auto-created Nextcloud Mail account, so webmail works out-of-the-box until the
# employee changes it. Sourced from Vault platform/ktayl-iam (key default-mailbox-password).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-mail-provisioner
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: nextcloud-mail-provisioner, creationPolicy: Owner }
  data:
    - secretKey: DEFAULT_MAILBOX_PASSWORD
      remoteRef: { key: platform/ktayl-iam, property: default-mailbox-password }
