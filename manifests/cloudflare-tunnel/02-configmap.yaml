---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare-tunnel
data:
  # Public (internet) routes only. Platform/ops + internal workplace tools are
  # DELIBERATELY NOT here — they are reachable only over Tailscale via their
  # *.10.0.0.200.nip.io Ingress (identity-as-perimeter; see the DNS ADR
  # docs/dns-naming-and-externaldns.md, Decision 3). Adding a tool here re-exposes
  # it publicly, so it needs a stated reason. `controller.devandre.sbs` (SSH) is the
  # Zero-Trust break-glass and MUST stay.
  config.yml: |
    tunnel: bf5117ec-5986-47f0-a3ce-b96ab8854d21
    credentials-file: /etc/cloudflared/credentials.json
    no-autoupdate: true

    ingress:
      # ── org / public-facing ──────────────────────────────────────────
      - hostname: demo.devandre.sbs
        service: https://10.0.0.200
        originRequest:
          noTLSVerify: true
          originServerName: platform-demo.10.0.0.200.nip.io

      # Authentik — the SSO IdP; stays public so public services can complete OAuth.
      - hostname: auth.devandre.sbs
        service: https://10.0.0.200
        originRequest:
          noTLSVerify: true
          originServerName: auth.10.0.0.200.nip.io

      # ── digital workplace (kept public for remote / external access) ──
      - hostname: chat.devandre.sbs
        service: https://10.0.0.200
        originRequest:
          noTLSVerify: true
          originServerName: chat.10.0.0.200.nip.io

      - hostname: vault-pw.devandre.sbs
        service: https://10.0.0.200
        originRequest:
          noTLSVerify: true
          originServerName: vault-pw.10.0.0.200.nip.io

      - hostname: cloud.devandre.sbs
        service: https://10.0.0.200
        originRequest:
          noTLSVerify: true
          originServerName: cloud.devandre.sbs

      # Docuseal — e-signature; external signers need to reach it → public.
      - hostname: sign.devandre.sbs
        service: https://10.0.0.200
        originRequest:
          noTLSVerify: true
          originServerName: sign.10.0.0.200.nip.io

      - hostname: matrix.devandre.sbs
        service: https://10.0.0.200
        originRequest:
          noTLSVerify: true
          originServerName: matrix.10.0.0.200.nip.io

      - hostname: element.devandre.sbs
        service: https://10.0.0.200
        originRequest:
          noTLSVerify: true
          originServerName: element.10.0.0.200.nip.io

      # ── retrieva.online (own apex domain, RTV-03e) ───────────────────
      - hostname: retrieva.online
        service: https://10.0.0.200
        originRequest:
          noTLSVerify: true
          originServerName: retrieva.online

      # ── break-glass (KEEP — emergency access if Tailscale is down) ───
      - hostname: controller.devandre.sbs
        service: ssh://10.0.0.1:22

      - service: http_status:404
