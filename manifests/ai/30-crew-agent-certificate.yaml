---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minicloud-crew-agent-tls
  namespace: ai
spec:
  dnsNames:
    - crew-agent.10.0.0.200.nip.io
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    name: minicloud-ca
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: minicloud-crew-agent-tls
