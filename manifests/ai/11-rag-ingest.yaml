apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-ingest
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-ingest
  template:
    metadata:
      labels:
        app: rag-ingest
        backstage.io/kubernetes-id: rag-ingest
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-ingest
          image: harbor.10.0.0.200.nip.io/library/rag-ingest:dev-6d249b5-amd64
          ports:
            - containerPort: 8001
          env:
            - name: PROXY_URL
              value: "http://markitdown-proxy.ai.svc.cluster.local:8000"
            - name: LITELLM_BASE_URL
              value: "http://litellm.ai.svc.cluster.local:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: master-key
            - name: QDRANT_URL
              value: "http://qdrant.ai.svc.cluster.local:6333"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-api-key
                  key: api-key
            # mistral-embed (EU, 1024-dim) via LiteLLM — replaces nomic-embed-text
            # which was an Ollama model, dropped from the cluster (broke embeddings,
            # issue #310). EU residency keeps restricted-document (P3) embeddings
            # in the EU per the governance matrix. Qdrant was empty → no re-embed.
            - name: EMBED_MODEL
              value: "mistral-embed"
            - name: EMBED_DIM
              value: "1024"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rag-ingest
  namespace: ai
spec:
  selector:
    app: rag-ingest
  ports:
    - port: 8001
      targetPort: 8001
