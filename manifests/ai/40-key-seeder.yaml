---
# PostSync Job: seeds LiteLLM teams with per-consumer rate limits and monthly budgets.
# Runs after every successful sync; safe to re-run (creates-or-updates each team).
# Teams are stored in the litellm PostgreSQL DB (store_model_in_db: true).
# To issue a virtual key for a team after seeding:
#   curl -X POST https://litellm.devandre.sbs/key/generate \
#     -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
#     -d '{"team_id":"open-webui","duration":"365d"}'
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-key-seeder
  namespace: ai
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: litellm-key-seeder
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seeder
          image: docker.io/curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: master-key
          command:
            - /bin/sh
            - -c
            - |
              set -e
              BASE_URL="http://litellm.ai.svc.cluster.local:4000"

              echo "Waiting for LiteLLM..."
              until curl -sf "${BASE_URL}/health/readiness" > /dev/null 2>&1; do
                sleep 5
              done
              echo "LiteLLM ready."

              seed_team() {
                TEAM_ID="$1"
                ALIAS="$2"
                TPM="$3"
                RPM="$4"
                BUDGET="$5"

                STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                  "${BASE_URL}/team/info?team_id=${TEAM_ID}" \
                  -H "Authorization: Bearer ${LITELLM_MASTER_KEY}")

                if [ "${STATUS}" = "200" ]; then
                  echo "Updating team: ${TEAM_ID}"
                  curl -sf -X POST "${BASE_URL}/team/update" \
                    -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
                    -H "Content-Type: application/json" \
                    -d "{\"team_id\":\"${TEAM_ID}\",\"tpm_limit\":${TPM},\"rpm_limit\":${RPM},\"max_budget\":${BUDGET},\"budget_duration\":\"30d\"}" \
                    > /dev/null
                else
                  echo "Creating team: ${TEAM_ID}"
                  curl -sf -X POST "${BASE_URL}/team/new" \
                    -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
                    -H "Content-Type: application/json" \
                    -d "{\"team_id\":\"${TEAM_ID}\",\"team_alias\":\"${ALIAS}\",\"tpm_limit\":${TPM},\"rpm_limit\":${RPM},\"max_budget\":${BUDGET},\"budget_duration\":\"30d\"}" \
                    > /dev/null
                fi
                echo "  tpm=${TPM} rpm=${RPM} budget=\$${BUDGET}/30d"
              }

              seed_team "open-webui"   "Open WebUI Users"       100000  60  10
              seed_team "phi3-ci"      "phi3-financial CI Eval" 200000 120  20
              seed_team "agents"       "Agent Runtimes"         150000  90  15
              seed_team "rag-pipeline" "RAG Ingest Pipeline"     50000  30   5

              echo "Team seeding complete."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
