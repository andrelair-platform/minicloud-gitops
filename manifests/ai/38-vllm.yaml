---
# vLLM — OpenAI-compatible model serving for Phi-3-mini-4k-instruct.
# Pinned to fast-heron (8 cores, ~10Gi RAM free) — the only node with enough
# headroom for Phi-3-mini-4k-instruct in float16 (~7.6Gi model weights).
#
# CPU-only mode: inference is slow (~30-90s/request) but functional for demo.
# When a GPU node is available, remove --device cpu and add nvidia.com/gpu resource.
# Note: --enable-lora is incompatible with --device=cpu in vLLM v0.6.6.
#       Re-enable it (with --max-lora-rank=64) when switching to GPU.
#
# First startup: init container downloads ~7.6Gi from HuggingFace (no probe timeout).
# Subsequent restarts: init container exits in ~2s (cache check), main container ready in ~5 min.
#
# HuggingFace token secret bootstrap (run once):
#   kubectl create secret generic hf-credentials -n ai \
#     --from-literal=token=hf_xxxx
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 12Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai
  labels:
    app: vllm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm
        backstage.io/kubernetes-id: vllm
    spec:
      nodeSelector:
        kubernetes.io/hostname: fast-heron
      enableServiceLinks: false
      initContainers:
        - name: model-downloader
          image: docker.io/vllm/vllm-openai:v0.6.6
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import sys, time, multiprocessing
              from pathlib import Path
              # Write sitecustomize.py so the engine subprocess (spawned fresh
              # via multiprocessing.get_context("spawn")) also patches CacheConfig
              # before determine_num_available_blocks runs.
              with open("/model-cache/sitecustomize.py", "w") as _f:
                  _f.write(
                      "import os\n"
                      "try:\n"
                      "    from vllm.config import CacheConfig\n"
                      "    CacheConfig.cpu_kvcache_space_bytes = (\n"
                      "        int(os.environ.get('VLLM_CPU_KVCACHE_SPACE', 4)) * (1024 ** 3))\n"
                      "except Exception:\n"
                      "    pass\n"
                  )
              cache_dir = "/model-cache"
              model_id = "microsoft/Phi-3-mini-4k-instruct"
              blobs_dir = Path(cache_dir) / "hub" / "models--microsoft--Phi-3-mini-4k-instruct" / "blobs"
              def is_cached():
                  if not blobs_dir.exists(): return False
                  if list(blobs_dir.glob("*.incomplete")): return False
                  return sum(f.stat().st_size for f in blobs_dir.glob("*")) > 7_000_000_000
              def do_download(model_id, cache_dir):
                  from huggingface_hub import snapshot_download
                  # No cache_dir arg — HF_HOME env var routes to /model-cache/hub/
                  # which is where vLLM reads from. Passing cache_dir="/model-cache"
                  # would write to /model-cache/models--.../ (wrong, no hub subdir).
                  snapshot_download(model_id)
              if is_cached():
                  print("Model fully cached, skipping download", flush=True)
                  sys.exit(0)
              for attempt in range(1, 20):
                  inc_size = lambda: sum(f.stat().st_size for f in blobs_dir.glob("*.incomplete")) if blobs_dir.exists() else 0
                  print(f"Attempt {attempt}: downloaded_GB={inc_size()/1e9:.2f}", flush=True)
                  p = multiprocessing.Process(target=do_download, args=(model_id, cache_dir))
                  p.start()
                  prev, stall = inc_size(), 0
                  while p.is_alive():
                      time.sleep(60)
                      curr = inc_size()
                      stall = stall + 1 if curr == prev else 0
                      prev = curr
                      print(f"  progress_GB={curr/1e9:.2f} stall_min={stall}", flush=True)
                      if stall >= 10:
                          print("Stall >10 min, killing downloader", flush=True)
                          p.kill()
                          break
                  p.join()
                  if is_cached():
                      print("Download complete", flush=True)
                      sys.exit(0)
                  print(f"Attempt {attempt} ended (exit={p.exitcode}), retrying in 30s", flush=True)
                  time.sleep(30)
              sys.exit(1)
          env:
            - name: HF_HOME
              value: /model-cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-credentials
                  key: token
                  optional: true
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.6.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # The GPU vllm image detects UnspecifiedPlatform (no GPU hardware),
          # so CpuPlatform.check_and_update_config never runs and
          # cache_config.cpu_kvcache_space_bytes is never set from
          # VLLM_CPU_KVCACHE_SPACE. Patching current_platform doesn't work
          # because `import vllm.platforms` triggers vllm/__init__.py which
          # imports vllm.config, which captures the stale UnspecifiedPlatform
          # in its module-level `from vllm.platforms import current_platform`
          # before our patch runs.
          #
          # Fix: set cpu_kvcache_space_bytes as a CacheConfig CLASS attribute
          # after normal import. Instance attribute lookup falls back to the
          # class, so self.cache_config.cpu_kvcache_space_bytes finds it
          # regardless of when CacheConfig instances are created.
          command:
            - python3
            - -c
            - |
              import os
              from vllm.config import CacheConfig
              CacheConfig.cpu_kvcache_space_bytes = (
                  int(os.environ.get("VLLM_CPU_KVCACHE_SPACE", 4)) * (1024 ** 3)
              )
              from runpy import run_module
              run_module("vllm.entrypoints.openai.api_server", run_name="__main__")
          args:
            - --model=microsoft/Phi-3-mini-4k-instruct
            - --device=cpu
            - --dtype=float16
            - --max-model-len=1024
            - --trust-remote-code
            - --disable-async-output-proc
            - --enforce-eager
            - --block-size=16
            - --worker-cls=vllm.worker.cpu_worker.CPUWorker
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /model-cache
            - name: PYTHONUNBUFFERED
              value: "1"
            # Makes Python find /model-cache/sitecustomize.py at startup of
            # every Python process including the engine subprocess (spawned
            # fresh via spawn, so parent-process monkey-patches don't carry).
            - name: PYTHONPATH
              value: /model-cache
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-credentials
                  key: token
                  optional: true
            # Bound KV cache to 4Gi on CPU
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "4"
            # hf_transfer parallel downloader hits semaphore exhaustion on CPU nodes
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 2000m
              memory: 6Gi
            limits:
              cpu: 7000m
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            # 120 × 30s + 60s = 61 minutes max; CPU loading takes ~45 min from PVC
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: ai
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
