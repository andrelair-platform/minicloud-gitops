---
# vLLM — OpenAI-compatible model serving for Phi-3-mini-4k-instruct.
# Pinned to fast-heron (8 cores, ~10Gi RAM free) — the only node with enough
# headroom for Phi-3-mini-4k-instruct in float16 (~7.6Gi model weights).
#
# CPU-only mode: inference is slow (~30-90s/request) but functional for demo.
# When a GPU node is available, remove --device cpu and add nvidia.com/gpu resource.
# Note: --enable-lora is incompatible with --device=cpu in vLLM v0.6.6.
#       Re-enable it (with --max-lora-rank=64) when switching to GPU.
#
# First startup: init container downloads ~7.6Gi from HuggingFace (no probe timeout).
# Subsequent restarts: init container exits in ~2s (cache check), main container ready in ~5 min.
#
# HuggingFace token secret bootstrap (run once):
#   kubectl create secret generic hf-credentials -n ai \
#     --from-literal=token=hf_xxxx
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 12Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai
  labels:
    app: vllm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm
        backstage.io/kubernetes-id: vllm
    spec:
      nodeSelector:
        kubernetes.io/hostname: fast-heron
      enableServiceLinks: false
      initContainers:
        - name: model-downloader
          image: docker.io/vllm/vllm-openai:v0.6.6
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import sys, time, signal
              from pathlib import Path
              cache_dir = "/model-cache"
              model_id = "microsoft/Phi-3-mini-4k-instruct"
              blobs_dir = Path(cache_dir) / "hub" / "models--microsoft--Phi-3-mini-4k-instruct" / "blobs"
              def is_cached():
                  if not blobs_dir.exists(): return False
                  incomplete = list(blobs_dir.glob("*.incomplete"))
                  if incomplete: return False
                  size = sum(f.stat().st_size for f in blobs_dir.glob("*"))
                  return size > 7_000_000_000
              if is_cached():
                  print(f"Model fully cached, skipping download")
                  sys.exit(0)
              from huggingface_hub import snapshot_download
              for attempt in range(1, 20):
                  try:
                      incomplete = list(blobs_dir.glob("*.incomplete")) if blobs_dir.exists() else []
                      done = sum(f.stat().st_size for f in blobs_dir.glob("*") if not f.name.endswith(".incomplete")) if blobs_dir.exists() else 0
                      print(f"Attempt {attempt}: incomplete={len(incomplete)} cached_MB={done//1048576}")
                      snapshot_download(model_id, cache_dir=cache_dir)
                      print("Download complete")
                      sys.exit(0)
                  except Exception as e:
                      print(f"Attempt {attempt} failed: {e}", flush=True)
                      time.sleep(30)
              sys.exit(1)
          env:
            - name: HF_HOME
              value: /model-cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-credentials
                  key: token
                  optional: true
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.6.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          args:
            - --model=microsoft/Phi-3-mini-4k-instruct
            - --device=cpu
            - --dtype=float16
            - --max-model-len=1024
            - --trust-remote-code
            - --disable-async-output-proc
            - --enforce-eager
            - --worker-cls=vllm.worker.cpu_worker.CPUWorker
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /model-cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-credentials
                  key: token
                  optional: true
            # Bound KV cache to 4Gi on CPU
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "4"
            # hf_transfer parallel downloader hits semaphore exhaustion on CPU nodes
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 2000m
              memory: 6Gi
            limits:
              cpu: 7000m
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            # 120 × 30s + 60s = 61 minutes max; CPU loading takes ~45 min from PVC
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: ai
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
