---
# Vault path: secret/platform/qdrant  key: api-key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qdrant-api-key
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: qdrant-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: secret/platform/qdrant
        property: api-key
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  serviceName: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: fast-skunk
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.11.0
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-api-key
                  key: api-key
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/storage/snapshots
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    # apiVersion/kind/volumeMode sont défaultés par k8s à la création → sans eux
    # dans git, ArgoCD voit un diff permanent sur le StatefulSet (jamais Synced →
    # backoff selfHeal). Les déclarer explicitement fait matcher live=git.
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: qdrant-storage
        labels:
          recurring-job-group.longhorn.io/daily-snapshot: enabled
          recurring-job-group.longhorn.io/daily-backup: enabled
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        volumeMode: Filesystem
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: ai
spec:
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
