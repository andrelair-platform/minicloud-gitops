---
# Allow LiteLLM pods to reach cloud model providers (Groq, Mistral, OpenAI, etc.) on port 443.
# The default-deny-egress + allow-cluster-egress (CiliumNetworkPolicy) in manifests/network-policies/ai.yaml
# block all internet egress by default; pods that need internet access get an explicit policy here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-cloud-egress
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
# Allow minicloud-agent to reach DuckDuckGo (web_search tool) and any public HTTPS endpoint.
# Cluster-internal egress (LiteLLM, rag-ingest) is already covered by allow-cluster-egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-internet-egress
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app: minicloud-agent
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
# Allow minicloud-crew-agent to reach DuckDuckGo (web_search) and public HTTPS endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-crew-agent-internet-egress
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app: minicloud-crew-agent
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
# Allow vLLM to pull model weights from HuggingFace Hub at startup.
# Also used for adapter downloads when --lora-modules points to a HF repo.
# After the model is cached in the PVC, internet egress is no longer needed —
# but keeping the policy allows adapter hot-reload without pod restarts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-huggingface-egress
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
# Allow Flowise to reach external model APIs and tool integrations over HTTPS.
# Cluster-internal traffic (LiteLLM :4000, postgresql-ai :5432) is covered by
# the default allow-cluster-egress CiliumNetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flowise-internet-egress
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app: flowise
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
