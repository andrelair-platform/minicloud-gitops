# Shared dockerconfigjson imagePullSecret for the ai namespace — lets prod
# workloads (minicloud-agent, minicloud-crew-agent) pull their Internal ghcr.io
# images. Creds come from Vault secret/platform/ghcr (read:packages token).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: platform/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: platform/ghcr
        property: token
