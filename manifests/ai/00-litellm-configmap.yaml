apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      # ── SENSITIVITY ROUTING (story #305) — model_info.access_group ─────────
      # Each model is tagged with the sensitivity tiers it MAY serve, per
      # docs/ai-governance/model-governance-matrix.md. Virtual keys (#306) then
      # restrict a caller to a tier via `models: ["<group>"]`:
      #   onprem = P3/Restricted (on-cluster only) · eu = P2/Confidential (EU
      #   residency) · us = P1/Internal (US enterprise). Models with NO
      #   access_group are P0/Public-ONLY (untrusted/free/CN: groq, nvidia,
      #   hf, ollama-cloud, deepseek-CN) — reachable only by unrestricted keys.
      # Access_group is per-DEPLOYMENT: e.g. phi3-financial has a Groq backend
      # (untagged→P0) AND a vLLM backend (onprem) — an "onprem" key only hits
      # the vLLM one. PII is masked globally before any cloud call (Presidio
      # guardrail default_on, below).
      # ── phi3-financial — domain-restricted AI financial assistant ─────────
      # System prompt injected at request time by LangfusePromptHandler.
      # Two backends registered under the same virtual name; LiteLLM routes
      # by least-busy + weight:
      #   Groq llama-3.1-8b-instant: sub-1s cloud inference (primary, weight 10).
      #   vLLM Phi-3-mini-4k-instruct: on-cluster CPU inference, ~30-90s (fallback, weight 1).
      - model_name: phi3-financial
        litellm_params:
          model: groq/llama-3.1-8b-instant
          api_key: os.environ/GROQ_API_KEY
          weight: 10

      - model_name: phi3-financial
        litellm_params:
          model: openai/microsoft/Phi-3-mini-4k-instruct
          api_base: http://vllm.ai.svc.cluster.local:8000/v1
          api_key: none
          weight: 1
        model_info:
          access_group: ["onprem", "eu", "us"]

      # deepseek-r1:7b — cloud reasoning specialist (DeepSeek API)
      - model_name: deepseek-r1:7b
        litellm_params:
          model: deepseek/deepseek-reasoner
          api_key: os.environ/DEEPSEEK_API_KEY

      # ── FINE-TUNED LOCAL MODELS (vLLM on-cluster) ────────────────────────
      # phi3-financial-ft: fine-tuned Phi-3-mini served by vLLM (CPU, fast-heron).
      # Adapter loaded from HuggingFace Hub after Colab QLoRA training run.
      # Expect 30-90s latency until a GPU node is available.
      - model_name: phi3-financial-ft
        litellm_params:
          model: openai/microsoft/Phi-3-mini-4k-instruct
          api_base: http://vllm.ai.svc.cluster.local:8000/v1
          api_key: none
        model_info:
          access_group: ["onprem", "eu", "us"]

      # ── AGENT RUNTIMES ────────────────────────────────────────────────────
      # research-agent: single ReAct agent (LangGraph), fast, simple queries.
      - model_name: research-agent
        litellm_params:
          model: openai/research-agent
          api_base: http://minicloud-agent.ai.svc.cluster.local:8080/v1
          api_key: none
        model_info:
          access_group: ["onprem", "eu", "us"]

      # deep-research-agent: three-agent CrewAI crew (Researcher → Analyst →
      # Compliance Checker). Use for complex advisory tasks that need synthesis
      # and regulatory validation. Slower than research-agent (~60–120s).
      - model_name: deep-research-agent
        litellm_params:
          model: openai/deep-research-agent
          api_base: http://minicloud-crew-agent.ai.svc.cluster.local:8081/v1
          api_key: none
        model_info:
          access_group: ["onprem", "eu", "us"]

      # ── EMBEDDINGS ────────────────────────────────────────────────────────
      # text-embedding-3-small — OpenAI 1536-dim cloud embedding model (US/P1).
      # (rag-ingest now uses mistral-embed EU/1024-dim — see #310.)
      - model_name: text-embedding-3-small
        litellm_params:
          model: openai/text-embedding-3-small
          api_key: os.environ/OPENAI_API_KEY
        model_info:
          access_group: ["us"]

      # mistral-embed — Mistral 1024-dim (= dimension bge-m3), fort multilingue FR.
      # Utilisé par Retrieva (remplace l'Ollama bge-m3 local, drop du cluster).
      - model_name: mistral-embed
        litellm_params:
          model: mistral/mistral-embed
          api_key: os.environ/MISTRAL_API_KEY
        model_info:
          access_group: ["eu", "us"]

      # ── CLOUD FALLBACK ────────────────────────────────────────────────────
      - model_name: groq-fallback
        litellm_params:
          model: groq/llama-3.1-8b-instant
          api_key: os.environ/GROQ_API_KEY

      - model_name: deepseek-chat
        litellm_params:
          model: deepseek/deepseek-chat
          api_key: os.environ/DEEPSEEK_API_KEY

      - model_name: mistral-large
        litellm_params:
          model: mistral/mistral-large-latest
          api_key: os.environ/MISTRAL_API_KEY
        model_info:
          access_group: ["eu", "us"]

      - model_name: mistral-small
        litellm_params:
          model: mistral/mistral-small-latest
          api_key: os.environ/MISTRAL_API_KEY
        model_info:
          access_group: ["eu", "us"]

      # ── CLOUD MODELS (premium + standard tiers via virtual key allowlist) ──
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
        model_info:
          access_group: ["us"]

      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY
        model_info:
          access_group: ["us"]

      # Hugging Face Serverless Inference via featherless-ai (free tier)
      - model_name: hf-qwen
        litellm_params:
          model: openai/Qwen/Qwen2.5-1.5B-Instruct
          api_base: https://router.huggingface.co/featherless-ai/v1
          api_key: os.environ/HUGGINGFACE_API_KEY

      - model_name: hf-gemma
        litellm_params:
          model: openai/google/gemma-2-2b-it
          api_base: https://router.huggingface.co/featherless-ai/v1
          api_key: os.environ/HUGGINGFACE_API_KEY

      # Anthropic Claude
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-3-5-sonnet-20241022
          api_key: os.environ/ANTHROPIC_API_KEY
        model_info:
          access_group: ["us"]

      - model_name: claude-haiku
        litellm_params:
          model: anthropic/claude-3-haiku-20240307
          api_key: os.environ/ANTHROPIC_API_KEY
        model_info:
          access_group: ["us"]

      # Google Gemini 2.5 Flash
      - model_name: gemini-2.0-flash
        litellm_params:
          model: gemini/gemini-2.5-flash
          api_key: os.environ/GEMINI_API_KEY
        model_info:
          access_group: ["us"]

      - model_name: gemini-1.5-pro
        litellm_params:
          model: gemini/gemini-2.5-flash
          api_key: os.environ/GEMINI_API_KEY
        model_info:
          access_group: ["us"]

      # ── NVIDIA NIM (build.nvidia.com — OpenAI-compatible, free inference tier) ─
      - model_name: nvidia-nemotron-70b
        litellm_params:
          model: openai/nvidia/llama-3.1-nemotron-70b-instruct
          api_base: https://integrate.api.nvidia.com/v1
          api_key: os.environ/NVIDIA_API_KEY

      - model_name: nvidia-llama-8b
        litellm_params:
          model: openai/meta/llama-3.1-8b-instruct
          api_base: https://integrate.api.nvidia.com/v1
          api_key: os.environ/NVIDIA_API_KEY

      - model_name: nvidia-deepseek-r1
        litellm_params:
          model: openai/deepseek-ai/deepseek-r1
          api_base: https://integrate.api.nvidia.com/v1
          api_key: os.environ/NVIDIA_API_KEY

      # ── OLLAMA CLOUD (ollama.com — tier Turbo, génération LLM) ─────────────
      # Modèle `ollama-cloud` déclaré 3× avec 3 clés → LiteLLM load-balance
      # (routing least-busy) pour répartir les rate-limits. Utilisé par Retrieva
      # pour la génération de réponses (remplace le Groq d'origine).
      - model_name: ollama-cloud
        litellm_params:
          model: openai/gpt-oss:120b
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_CLOUD_KEY_1
      - model_name: ollama-cloud
        litellm_params:
          model: openai/gpt-oss:120b
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_CLOUD_KEY_2
      - model_name: ollama-cloud
        litellm_params:
          model: openai/gpt-oss:120b
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_CLOUD_KEY_3

      # ── AWS BEDROCK (EU-resident, enterprise-governed — story #303) ────────
      # Mistral Large on Bedrock eu-west-1: EU jurisdiction + contractual
      # no-training → governance class P2/Confidential (see docs/ai-governance/
      # model-governance-matrix.md). Runtime IAM user litellm-bedrock
      # (bedrock:InvokeModel only). Cost = tokens on-demand.
      - model_name: bedrock-mistral-large
        litellm_params:
          model: bedrock/mistral.mistral-large-2402-v1:0
          aws_access_key_id: os.environ/AWS_BEDROCK_ACCESS_KEY_ID
          aws_secret_access_key: os.environ/AWS_BEDROCK_SECRET_ACCESS_KEY
          aws_region_name: eu-west-1
        model_info:
          access_group: ["eu", "us"]

      # ── AZURE OPENAI (EU / Sweden Central — story #304) ────────────────────
      # gpt-4.1-mini, Standard regional deployment = EU residency + contractual
      # no-training → governance class P2/Confidential. Account minicloud-openai
      # (OpenTofu in minicloud-cloud). Cost = tokens (Standard, no PTU).
      - model_name: azure-gpt-4.1-mini
        litellm_params:
          model: azure/gpt-4.1-mini
          api_base: os.environ/AZURE_OPENAI_ENDPOINT
          api_key: os.environ/AZURE_OPENAI_API_KEY
          api_version: "2024-10-21"
        model_info:
          access_group: ["eu", "us"]

    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      timeout: 300
      cooldown_time: 60
      allowed_fails: 3

    litellm_settings:
      require_auth_for_metrics_endpoint: false
      drop_params: true
      cache: true
      cache_params:
        type: redis-semantic
        redis_url: redis://litellm-cache.ai.svc.cluster.local:6379
        ttl: 600
        namespace: litellm
        similarity_threshold: 0.8
      # LlamaGuard runs first (list order) — blocks unsafe content before prompt injection.
      # Presidio PII masking runs independently via the guardrails section (pre_call).
      callbacks: ["llamaguard_handler.LlamaGuardHandler", "langfuse_prompt_handler.LangfusePromptHandler"]
      success_callback: ["langfuse", "prometheus"]
      failure_callback: ["prometheus"]

    # PII / DLP guardrail — anonymizes prompts before they reach any cloud provider API.
    # Fail-open: if Presidio is temporarily unavailable, requests pass through.
    # DATE_TIME, LOCATION, URL excluded: required for financial analysis context.
    guardrails:
      - guardrail_name: "presidio-pii-masking"
        litellm_params:
          guardrail: presidio
          mode: pre_call
          presidio_analyzer_api_base: "http://presidio-analyzer.ai.svc.cluster.local:3000"
          presidio_anonymizer_api_base: "http://presidio-anonymizer.ai.svc.cluster.local:3000"
          default_on: true
          pii_entities_config:
            CREDIT_CARD: MASK
            CRYPTO: MASK
            EMAIL_ADDRESS: MASK
            IBAN_CODE: MASK
            IP_ADDRESS: MASK
            NRP: MASK
            PERSON: MASK
            PHONE_NUMBER: MASK
            US_SSN: MASK
            US_ITIN: MASK
            US_PASSPORT: MASK

    general_settings:
      store_model_in_db: true
      public_routes: ["/v1/models", "/health"]
      detect_secrets_on_all_keys: false
