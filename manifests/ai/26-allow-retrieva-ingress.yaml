---
# Allow the retrieva namespaces (prod + dev) to reach shared AI services:
# LiteLLM (4000) + Qdrant (6333/6334). The ai namespace is default-deny-ingress.
# (RTV-03) Prod routes to EU cloud, dev to the free tier — both via LiteLLM.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-retrieva-to-litellm
  namespace: ai
spec:
  podSelector:
    matchLabels: { app: litellm }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [retrieva, retrieva-dev]
      ports:
        - { protocol: TCP, port: 4000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-retrieva-to-qdrant
  namespace: ai
spec:
  podSelector:
    matchLabels: { app: qdrant }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [retrieva, retrieva-dev]
      ports:
        - { protocol: TCP, port: 6333 }
        - { protocol: TCP, port: 6334 }
