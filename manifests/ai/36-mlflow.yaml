---
# MLflow tracking server — experiment tracking, run history, model registry.
# Backend store: postgresql-ai (mlflow DB).
# Artifact store: /mlflow-artifacts (Longhorn PVC, 10Gi).
#   → Upgrade path: replace with s3://mlflow-artifacts pointing to MinIO when ready.
#
# Secret bootstrap (run once, then ESO keeps it in sync):
#   vault kv put secret/ai/mlflow \
#     database-password="$(openssl rand -hex 20)"
#
#   kubectl create secret generic mlflow-credentials -n ai \
#     --from-literal=database-password=<value>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ai
  labels:
    app: mlflow
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mlflow
        backstage.io/kubernetes-id: mlflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          command:
            - mlflow
            - server
            - --backend-store-uri
            - postgresql://mlflow:$(MLFLOW_DB_PASSWORD)@postgresql-ai.ai.svc.cluster.local:5432/mlflow
            - --artifacts-destination
            - /mlflow-artifacts
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
            - --gunicorn-opts
            - "--timeout 120"
          env:
            - name: MLFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-credentials
                  key: database-password
          volumeMounts:
            - name: artifacts
              mountPath: /mlflow-artifacts
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ai
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
