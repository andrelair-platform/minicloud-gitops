apiVersion: v1
kind: ConfigMap
metadata:
  name: llamaguard-handler
  namespace: ai
  annotations:
    # Mounted into the LiteLLM pod at /app/llamaguard_handler.py
    # Registered in litellm_settings.callbacks alongside LangfusePromptHandler.
    # Update this ConfigMap + restart LiteLLM to change classification behaviour.
data:
  handler.py: |
    """
    LlamaGuardHandler — LiteLLM pre-call content safety filter.

    Classifies every user message with Meta LlamaGuard-3-8B served via Groq.
    Blocks requests that violate the enterprise safety profile (see BLOCKED_CATEGORIES).

    Enterprise safety profile — blocked:
      S1  Violent Crimes          S2  Non-Violent Crimes
      S3  Sex-Related Crimes      S4  Child Sexual Exploitation
      S5  Defamation              S9  Indiscriminate Weapons
      S10 Hate                    S11 Suicide & Self-Harm

    Allowed through (business advisory use cases):
      S6  Specialized Advice (financial / insurance / legal advisory is the platform's purpose)
      S7  Privacy (handled separately by Presidio PII masking pre-call)
      S8  Intellectual Property
      S12 Sexual Content
      S13 Elections
      S14 Code Interpreter Abuse

    Fail-open: if Groq is unavailable, the request proceeds with a warning log.
    The Presidio guardrail (default_on: true) is not affected by this handler.
    """

    import logging
    import os
    from typing import Optional

    logger = logging.getLogger(__name__)

    BLOCKED_CATEGORIES = {"S1", "S2", "S3", "S4", "S5", "S9", "S10", "S11"}

    CATEGORY_LABELS = {
        "S1": "Violent Crimes",
        "S2": "Non-Violent Crimes",
        "S3": "Sex-Related Crimes",
        "S4": "Child Sexual Exploitation",
        "S5": "Defamation",
        "S9": "Indiscriminate Weapons",
        "S10": "Hate",
        "S11": "Suicide & Self-Harm",
    }


    def _extract_user_message(messages: list) -> Optional[str]:
        for msg in reversed(messages):
            if not isinstance(msg, dict):
                continue
            if msg.get("role") != "user":
                continue
            content = msg.get("content", "")
            if isinstance(content, str):
                return content
            if isinstance(content, list):
                return " ".join(
                    p.get("text", "") for p in content if p.get("type") == "text"
                )
        return None


    async def _classify(user_message: str) -> tuple[bool, list[str]]:
        """Call LlamaGuard-3-8B via Groq and return (is_safe, [violated_category_codes])."""
        try:
            import litellm

            response = await litellm.acompletion(
                model="groq/llama-guard-3-8b",
                messages=[{"role": "user", "content": user_message}],
                api_key=os.environ.get("GROQ_API_KEY"),
                max_tokens=50,
                temperature=0,
            )
            raw = response.choices[0].message.content.strip()
            lines = [ln.strip() for ln in raw.splitlines() if ln.strip()]
            if not lines:
                return True, []

            verdict = lines[0].lower()
            if verdict == "safe":
                return True, []

            categories: list[str] = []
            if len(lines) > 1:
                categories = [c.strip() for c in lines[1].split(",") if c.strip()]
            return False, categories

        except Exception as exc:
            logger.warning(
                "[LlamaGuardHandler] Groq classification failed (%s) — fail-open, request proceeds.",
                exc,
            )
            return True, []


    try:
        from litellm.integrations.custom_logger import CustomLogger as _Base
    except ImportError:
        _Base = object  # type: ignore[assignment,misc]


    class _LlamaGuardHandler(_Base):  # type: ignore[misc]
        """
        Registered in litellm_settings.callbacks.
        Runs before any other pre-call logic (ordering is list order in config).
        Raises ValueError to block the request; LiteLLM returns HTTP 400 to the caller.
        """

        async def async_pre_call_hook(
            self,
            user_api_key_dict,
            cache,
            data: dict,
            call_type: str,
        ) -> dict:
            messages = data.get("messages", [])
            user_message = _extract_user_message(messages)

            if not user_message:
                return data

            is_safe, violated = await _classify(user_message)

            if is_safe:
                return data

            blocked = [c for c in violated if c in BLOCKED_CATEGORIES]
            if not blocked:
                # Flagged categories are not in our blocked set — log and allow
                logger.info(
                    "[LlamaGuardHandler] Non-blocked categories flagged: %s — allowed through.",
                    ", ".join(violated),
                )
                return data

            labels = [CATEGORY_LABELS.get(c, c) for c in blocked]
            logger.warning(
                "[LlamaGuardHandler] Request blocked — safety categories: %s",
                ", ".join(labels),
            )
            raise ValueError(
                f"Content safety policy violation: {', '.join(labels)}. "
                "This request has been blocked by the platform content safety guardrail."
            )


    # Module-level instance required by LiteLLM's get_instance_fn — same pattern
    # as LangfusePromptHandler (class would cause 'missing self' errors at call time).
    LlamaGuardHandler = _LlamaGuardHandler()
