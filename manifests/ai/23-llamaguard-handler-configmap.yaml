apiVersion: v1
kind: ConfigMap
metadata:
  name: llamaguard-handler
  namespace: ai
  annotations:
    # Mounted into the LiteLLM pod at /app/llamaguard_handler.py
    # Registered in litellm_settings.callbacks alongside LangfusePromptHandler.
    # Update this ConfigMap + restart LiteLLM to change classification behaviour.
    #
    # Model history:
    #   groq/llama-guard-3-8b        — decommissioned 2025-06-06
    #   groq/meta-llama/llama-guard-4-12b — deprecated 2026-03-05
    #   groq/openai/gpt-oss-safeguard-20b — current (custom-policy JSON format)
data:
  handler.py: |
    """
    LlamaGuardHandler — LiteLLM pre-call content safety filter.

    Classifies every user message with openai/gpt-oss-safeguard-20b served via Groq.
    The model uses a custom safety policy (SAFETY_POLICY_PROMPT) and returns JSON:
      {"violation": 0|1, "category": "<name>", "reasoning": "<text>"}

    Blocked categories (defined in SAFETY_POLICY_PROMPT and BLOCKED_CATEGORIES):
      violent_crimes, weapons, terrorism, csam, hate_speech,
      self_harm, non_violent_crimes

    Allowed through (business advisory use cases):
      financial/insurance/legal advisory, medical information, general knowledge,
      professional/business topics (platform purpose is regulated-industry advisory)

    Fail-open: if Groq is unavailable, the request proceeds with a warning log.
    The Presidio guardrail (default_on: true) is not affected by this handler.
    """

    import json
    import logging
    import os
    from typing import Optional

    logger = logging.getLogger(__name__)

    BLOCKED_CATEGORIES = {
        "violent_crimes",
        "weapons",
        "terrorism",
        "csam",
        "hate_speech",
        "self_harm",
        "non_violent_crimes",
    }

    SAFETY_POLICY_PROMPT = """\
You are a content safety classifier for an enterprise financial and insurance advisory platform.
Evaluate the user message and return ONLY a JSON object with exactly these fields:
  {"violation": <0 or 1>, "category": "<category name or empty string>", "reasoning": "<brief>"}

Blocked categories (violation=1):
  violent_crimes   — instructions for violence, murder, assault
  weapons          — instructions for creating weapons, explosives, pipe bombs, etc.
  terrorism        — planning or facilitating terrorist or mass-casualty acts
  csam             — any sexual content involving minors
  hate_speech      — incitement against people based on protected characteristics
  self_harm        — detailed methods for suicide or self-injury
  non_violent_crimes — step-by-step instructions for fraud, hacking, drug synthesis, etc.

Always allowed (violation=0) regardless of sensitivity:
  Financial and insurance advisory (regulation, compliance, products, risk)
  Legal information and professional guidance
  Medical information (general health, not self-harm methods)
  General knowledge, history, science, business topics
  Coding assistance and technical questions

Return ONLY the JSON object — no markdown, no extra text."""


    def _extract_user_message(messages: list) -> Optional[str]:
        for msg in reversed(messages):
            if not isinstance(msg, dict):
                continue
            if msg.get("role") != "user":
                continue
            content = msg.get("content", "")
            if isinstance(content, str):
                return content
            if isinstance(content, list):
                return " ".join(
                    p.get("text", "") for p in content if p.get("type") == "text"
                )
        return None


    async def _classify(user_message: str) -> tuple[bool, str]:
        """Call gpt-oss-safeguard-20b via Groq and return (is_safe, category_name)."""
        try:
            import litellm

            response = await litellm.acompletion(
                model="groq/openai/gpt-oss-safeguard-20b",
                messages=[
                    {"role": "system", "content": SAFETY_POLICY_PROMPT},
                    {"role": "user", "content": user_message},
                ],
                api_key=os.environ.get("GROQ_API_KEY"),
                max_tokens=150,
                temperature=0,
            )
            raw = response.choices[0].message.content.strip()
            # Strip markdown code fences if the model adds them
            if raw.startswith("```"):
                raw = raw.split("```")[1]
                if raw.startswith("json"):
                    raw = raw[4:]
            result = json.loads(raw)
            violation = int(result.get("violation", 0))
            category = str(result.get("category", "")).strip().lower()
            if violation == 1 and category:
                return False, category
            return True, ""

        except Exception as exc:
            logger.warning(
                "[LlamaGuardHandler] Groq classification failed (%s) — fail-open, request proceeds.",
                exc,
            )
            return True, ""


    try:
        from litellm.integrations.custom_logger import CustomLogger as _Base
    except ImportError:
        _Base = object  # type: ignore[assignment,misc]


    class _LlamaGuardHandler(_Base):  # type: ignore[misc]
        """
        Registered in litellm_settings.callbacks.
        Runs before any other pre-call logic (ordering is list order in config).
        Raises ValueError to block the request; LiteLLM returns HTTP 400 to the caller.
        """

        async def async_pre_call_hook(
            self,
            user_api_key_dict,
            cache,
            data: dict,
            call_type: str,
        ) -> dict:
            messages = data.get("messages", [])
            user_message = _extract_user_message(messages)

            if not user_message:
                return data

            is_safe, category = await _classify(user_message)

            if is_safe:
                return data

            if category not in BLOCKED_CATEGORIES:
                logger.info(
                    "[LlamaGuardHandler] Category '%s' not in blocked set — allowed through.",
                    category,
                )
                return data

            logger.warning(
                "[LlamaGuardHandler] Request blocked — safety category: %s", category
            )
            raise ValueError(
                f"Content safety policy violation: {category}. "
                "This request has been blocked by the platform content safety guardrail."
            )


    # Module-level instance required by LiteLLM's get_instance_fn — same pattern
    # as LangfusePromptHandler (class would cause 'missing self' errors at call time).
    LlamaGuardHandler = _LlamaGuardHandler()
