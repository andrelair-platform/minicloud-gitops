apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infrastructure-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kps
spec:
  groups:
    - name: node-availability
      rules:
        # A node that stops being Ready (kubelet stops posting → Ready=Unknown, or
        # Ready=False) is DOWN. CRITICAL: on 2026-08-28 fast-skunk powered off and
        # stranded the ArgoCD application-controller (StatefulSet) → ArgoCD stopped
        # reconciling for ~24h, unnoticed. The built-in KubeNodeNotReady is
        # severity=warning (→ in-cluster logger only); this critical variant routes
        # to email + Slack so a node-down is never silent again.
        - alert: NodeDown
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            runbook_url: "https://andrelair-platform.github.io/minicloud-platform-docs/docs/runbooks/node-not-ready"
            summary: "Node {{ $labels.node }} is DOWN (NotReady/Unknown) for >10m"
            description: |
              Node {{ $labels.node }} has not reported Ready for over 10 minutes
              (kubelet stopped posting status, or the machine is powered off).
              A down node can strand StatefulSet pods (e.g. the ArgoCD
              application-controller) and freeze GitOps reconciliation.

              Check & recover:
                kubectl get node {{ $labels.node }}
                ping <node-ip>                                            # powered off / off-network?
                ssh controller "maas ktayl machine power-on <system_id>"  # if off
                ssh <node> "sudo systemctl status k3s-agent"              # if up

    - name: node-scheduling
      rules:
        - alert: NodeSchedulingDisabled
          expr: |
            kube_node_spec_unschedulable == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: "https://andrelair-platform.github.io/minicloud-platform-docs/docs/runbooks/node-not-ready"
            summary: "Node {{ $labels.node }} is cordoned (unschedulable)"
            description: |
              Node {{ $labels.node }} has spec.unschedulable=true for more than 30 minutes.
              If unintentional: kubectl uncordon {{ $labels.node }}
              If intentional (maintenance): add a note in CLAUDE.md.

              NOTE — swift-mac (10.0.0.10, MacBook Pro 2012) never auto-restarts after power
              failure due to Apple SMC limitation. Manual power button press required.
              After boot, rejoin the cluster:
                ssh swift-mac "sudo systemctl start k3s-agent"

    - name: node-stability
      rules:
        - alert: NodeFrequentlyNotReady
          expr: |
            changes(kube_node_status_condition{condition="Ready",status="true"}[24h]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: "https://andrelair-platform.github.io/minicloud-platform-docs/docs/runbooks/node-not-ready"
            summary: "Node {{ $labels.node }} toggled Ready/NotReady {{ $value | printf \"%.0f\" }} times in 24h"
            description: |
              Node {{ $labels.node }} has been unstable — Ready condition changed
              {{ $value | printf "%.0f" }} times in 24 hours.

              General recovery:
                kubectl describe node {{ $labels.node }}
                ssh <node> "sudo systemctl status k3s-agent && sudo journalctl -u k3s-agent -n 50"

              swift-mac specific (Apple SMC — never auto-restarts after power failure):
                Physical power button press required to boot.
                After boot: ssh swift-mac "sudo systemctl start k3s-agent"
                Check Longhorn multipathd issue: ssh swift-mac "sudo multipath -ll | grep -i iet"
                If IET VIRTUAL-DISK claimed as mpatha: sudo multipath -f mpatha
                Permanent fix already applied in /etc/multipath.conf on all nodes.

              After full power failure — controller NAT may be lost (iptables not persistent):
                ssh -t controller "sudo sh -c 'iptables-restore < /etc/iptables/rules.v4'"
                ssh controller "sudo iptables -I FORWARD -s 10.0.0.0/24 -j ACCEPT"
                ssh controller "sudo iptables -I FORWARD -d 10.0.0.0/24 -j ACCEPT"
                ssh controller "sudo iptables -I FORWARD -s 10.42.0.0/16 -j ACCEPT"
                ssh controller "sudo iptables -I FORWARD -d 10.42.0.0/16 -j ACCEPT"
                Symptom: ArgoCD shows 'context deadline exceeded' reaching GitHub.

    - name: pod-lifecycle
      rules:
        - alert: PodStuckPending
          expr: |
            sum by (namespace, pod) (
              kube_pod_status_phase{phase="Pending"} == 1
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: "https://andrelair-platform.github.io/minicloud-platform-docs/docs/runbooks/pod-stuck-pending"
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck Pending for >5m"
            description: |
              Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending for >5 minutes.

              Diagnose:
                kubectl describe pod {{ $labels.pod }} -n {{ $labels.namespace }}
                kubectl get events -n {{ $labels.namespace }} --sort-by='.lastTimestamp' | tail -20

              Common causes:
                - Image pull failure: check Harbor registry and Tailscale connectivity
                - Insufficient resources: kubectl describe nodes | grep -A5 Allocated
                - PVC not bound: kubectl get pvc -n {{ $labels.namespace }}
                - Longhorn volume stuck: check Longhorn UI at https://longhorn.10.0.0.200.nip.io
                - Gatekeeper policy violation: check admission webhook errors in describe output
                - After power failure: controller NAT may be down — see NodeFrequentlyNotReady runbook

        - alert: ContainerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            runbook_url: "https://andrelair-platform.github.io/minicloud-platform-docs/docs/runbooks/oom-killed"
            summary: "OOMKill: {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}"
            description: |
              Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
              was terminated by the kernel OOM killer.

              Investigate:
                kubectl describe pod {{ $labels.pod }} -n {{ $labels.namespace }}
                kubectl get vpa -n {{ $labels.namespace }}
                kubectl top pod {{ $labels.pod }} -n {{ $labels.namespace }}

              Fix options (in order of preference):
                1. VPA recommendation: check kubectl get vpa -n {{ $labels.namespace }} for suggested limits
                2. Raise memory limit in the relevant helm-values/*.yaml file and push
                3. If VPA updateMode=Off: switch to Auto after reviewing recommendation (7+ days data)
              Known OOMKill-prone workloads: ArgoCD controller (bumped 2Gi→3Gi 2026-07-24),
              Authentik server (bumped to 1280Mi 2026-07-18).
