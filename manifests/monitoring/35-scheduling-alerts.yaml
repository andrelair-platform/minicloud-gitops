apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scheduling-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: scheduling.pending
      rules:
        # Fast-detection guard for the node-pin SPOF pattern. On 2026-09-25 grafana
        # sat Pending (FailedScheduling) for ~38 min — hard-pinned to a full node —
        # with no alert. This fires within 10 min so a scheduling failure (node full /
        # cordoned / down, or a hostname nodeSelector/affinity pin with no schedulable
        # node) is caught fast instead of discovered by a 503. See gitops.md *Scheduling*.
        - alert: KubePodStuckPending
          expr: >-
            sum by (namespace, pod) (
              kube_pod_status_phase{phase="Pending"}
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck Pending >10m"
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} has been Pending for over 10 minutes —
              likely FailedScheduling. Common cause on this cluster: a hostname
              nodeSelector/affinity pin whose node is full/cordoned/down (the SPOF pattern
              the k8snohostnamepin Gatekeeper policy guards against). Run
              `kubectl describe pod {{ $labels.pod }} -n {{ $labels.namespace }}`.
        # Escalate if it stays wedged much longer (real outage territory).
        - alert: KubePodStuckPendingCritical
          expr: >-
            sum by (namespace, pod) (
              kube_pod_status_phase{phase="Pending"}
            ) > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} Pending >30m (likely outage)"
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} has been unschedulable for 30+ minutes.
              If this is a singleton workload its Service now has no ready endpoints (503).
              Check node capacity / cordons / node-pin affinity.
