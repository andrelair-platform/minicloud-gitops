apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-resource-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: node.cpu
      rules:
        # kps built-in NodeCPUHighUsage fires at >90% severity:info (silenced to null).
        # These custom rules enforce the stated thresholds: warning at 80% for 10m,
        # critical at 95% for 5m, covering both cluster nodes and the controller (10.0.0.1:9100).
        - alert: NodeCPUWarning
          expr: >-
            sum without(mode) (
              avg without(cpu) (
                rate(node_cpu_seconds_total{mode!~"idle|iowait"}[2m])
              )
            ) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} CPU >80% for 10 min ({{ $value | humanize }}%)"
            description: >-
              Node {{ $labels.instance }} CPU usage has been above 80% for 10 minutes.
              Current value: {{ $value | humanize }}%.

        - alert: NodeCPUCritical
          expr: >-
            sum without(mode) (
              avg without(cpu) (
                rate(node_cpu_seconds_total{mode!~"idle|iowait"}[2m])
              )
            ) * 100 > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} CPU >95% for 5 min ({{ $value | humanize }}%)"
            description: >-
              Node {{ $labels.instance }} CPU usage critically high at {{ $value | humanize }}%.
              Node may be unresponsive or evicting pods.

    - name: node.memory
      rules:
        # kps built-in NodeMemoryHighUtilization fires at >90% severity:warning (webhook-logger only).
        # These rules fire at 85% with email notification path via severity:warning→webhook-critical.
        - alert: NodeMemoryWarning
          expr: >-
            100 - (
              node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes * 100
            ) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} memory >85% used ({{ $value | humanize }}%)"
            description: >-
              Node {{ $labels.instance }} memory usage above 85% for 10 minutes.
              Current: {{ $value | humanize }}%. OOMKill risk increases above 90%.

        - alert: NodeMemoryCritical
          expr: >-
            100 - (
              node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes * 100
            ) > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} memory >95% used — OOMKill imminent"
            description: >-
              Node {{ $labels.instance }} memory at {{ $value | humanize }}%.
              OOMKill events likely. Check for memory leaks or undersized pod limits.

      # Node availability / health — catches the failure mode where a node stays
      # cordoned (or flags a read-only filesystem) unnoticed. On 2026-08-23 both
      # set-hog and star-kitten latched a stale ReadonlyFilesystem NPD condition and
      # were cordoned; set-hog then sat cordoned for 4 days unnoticed, taking Matrix's
      # DB down when its pod later rescheduled. These alerts close that blind spot.
      - name: node.health
        rules:
          # kured/system-upgrade cordon a node for minutes during reboots, so the
          # 2h window avoids false positives while still catching a forgotten cordon.
          - alert: NodeCordonedTooLong
            expr: kube_node_spec_unschedulable == 1
            for: 2h
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.node }} cordoned (SchedulingDisabled) for >2h"
              description: >-
                Node {{ $labels.node }} has been cordoned (unschedulable) for over 2
                hours. If not a deliberate maintenance, uncordon it:
                `kubectl uncordon {{ $labels.node }}`. A forgotten cordon silently
                removes capacity and can strand pods pinned to that node.
          - alert: NodeReadonlyFilesystem
            expr: kube_node_status_condition{condition="ReadonlyFilesystem",status="true"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.node }} reports ReadonlyFilesystem for >15m"
              description: >-
                node-problem-detector flags a read-only filesystem on {{ $labels.node }}
                (often a Longhorn iSCSI EXT4 remount-RO). Verify the FS
                (`findmnt -no OPTIONS /`); if writable the condition is a stale NPD
                latch — restart the NPD pod on the node to clear it, then uncordon.
