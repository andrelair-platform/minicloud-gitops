# SES SMTP password for Alertmanager → SES direct email path.
# The password is rendered into a k8s Secret from Vault and mounted into Alertmanager
# (alertmanagerSpec.secrets) so it is referenced via smtp_auth_password_file and NEVER
# committed to this (public) repo. The SES SMTP username is an AWS access-key ID
# (non-secret per AWS's model) and is set inline in the alertmanager config.
# Rationale: the in-cluster Stalwart→SES relay was silently dropping alert mail
# (2026-09-16 outage lesson); pointing Alertmanager straight at SES removes the
# fragile Stalwart hop and decouples alerting from the in-cluster mail server.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-ses
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-ses
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: secret/platform/ses
        property: SES_SMTP_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
