apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - longhorn-system
  selector:
    matchLabels:
      app.kubernetes.io/name: longhorn
      app.kubernetes.io/instance: longhorn
  endpoints:
    - port: manager
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
