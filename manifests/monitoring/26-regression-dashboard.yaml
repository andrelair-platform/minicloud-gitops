apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-regression
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  regression-detection.json: |
    {
      "title": "Deployment Regression Detection",
      "uid": "minicloud-regression",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-3h", "to": "now"},
      "tags": ["regression", "deployment", "slo"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "service",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "query": "label_values(job:http_requests_total:rate5m, service)",
            "label": "Service",
            "multi": false,
            "includeAll": false,
            "refresh": 2
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "query": "label_values(job:http_requests_total:rate5m{service=\"$service\"}, namespace)",
            "label": "Namespace",
            "multi": false,
            "includeAll": false,
            "refresh": 2
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "grafana", "uid": "-- Grafana --"},
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "enable": true,
            "expr": "changes(kube_deployment_metadata_generation{namespace=\"$namespace\"}[2m]) > 0",
            "hide": false,
            "iconColor": "blue",
            "name": "Deployment events",
            "step": "60s",
            "titleFormat": "Deploy: {{namespace}}",
            "useValueForTime": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "p95 Latency — Current vs Baseline (1h ago)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {"lineWidth": 2}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Baseline (1h ago)"},
                "properties": [
                  {"id": "custom.lineStyle", "value": {"dash": [8, 4], "fill": "dash"}},
                  {"id": "color", "value": {"fixedColor": "semi-dark-orange", "mode": "fixed"}},
                  {"id": "custom.lineWidth", "value": 1}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Current"},
                "properties": [
                  {"id": "color", "value": {"fixedColor": "blue", "mode": "fixed"}}
                ]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Current",
              "expr": "job:http_request_duration_p95:rate5m{service=\"$service\", namespace=\"$namespace\"}"
            },
            {
              "refId": "B",
              "legendFormat": "Baseline (1h ago)",
              "expr": "job:http_request_duration_p95:rate5m{service=\"$service\", namespace=\"$namespace\"} offset 1h"
            }
          ]
        },
        {
          "id": 2,
          "title": "p95 Latency Regression Ratio (current / 1h ago)",
          "type": "stat",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1.5},
                  {"color": "red", "value": 2}
                ]
              },
              "mappings": []
            }
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Latency ratio",
              "expr": "job:http_request_duration_p95:rate5m{service=\"$service\", namespace=\"$namespace\"} / (job:http_request_duration_p95:rate5m{service=\"$service\", namespace=\"$namespace\"} offset 1h)"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error Rate — Current vs Baseline (1h ago)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {"lineWidth": 2}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Baseline (1h ago)"},
                "properties": [
                  {"id": "custom.lineStyle", "value": {"dash": [8, 4], "fill": "dash"}},
                  {"id": "color", "value": {"fixedColor": "semi-dark-orange", "mode": "fixed"}},
                  {"id": "custom.lineWidth", "value": 1}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Current"},
                "properties": [
                  {"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}
                ]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Current",
              "expr": "job:http_requests_error_fraction:rate5m{service=\"$service\", namespace=\"$namespace\"}"
            },
            {
              "refId": "B",
              "legendFormat": "Baseline (1h ago)",
              "expr": "job:http_requests_error_fraction:rate5m{service=\"$service\", namespace=\"$namespace\"} offset 1h"
            }
          ]
        },
        {
          "id": 4,
          "title": "Error Rate Δ (current − baseline)",
          "type": "stat",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.01},
                  {"color": "red", "value": 0.05}
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Error rate increase",
              "expr": "job:http_requests_error_fraction:rate5m{service=\"$service\", namespace=\"$namespace\"} - (job:http_requests_error_fraction:rate5m{service=\"$service\", namespace=\"$namespace\"} offset 1h)"
            }
          ]
        },
        {
          "id": 5,
          "title": "Throughput RPS — Current vs Baseline (1h ago)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {"lineWidth": 2}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Baseline (1h ago)"},
                "properties": [
                  {"id": "custom.lineStyle", "value": {"dash": [8, 4], "fill": "dash"}},
                  {"id": "color", "value": {"fixedColor": "semi-dark-orange", "mode": "fixed"}},
                  {"id": "custom.lineWidth", "value": 1}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Current"},
                "properties": [
                  {"id": "color", "value": {"fixedColor": "green", "mode": "fixed"}}
                ]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Current",
              "expr": "job:http_requests_total:rate5m{service=\"$service\", namespace=\"$namespace\"}"
            },
            {
              "refId": "B",
              "legendFormat": "Baseline (1h ago)",
              "expr": "job:http_requests_total:rate5m{service=\"$service\", namespace=\"$namespace\"} offset 1h"
            }
          ]
        },
        {
          "id": 6,
          "title": "Throughput Ratio (current / 1h ago)",
          "type": "stat",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 0.7},
                  {"color": "green", "value": 0.9}
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Throughput ratio",
              "expr": "job:http_requests_total:rate5m{service=\"$service\", namespace=\"$namespace\"} / (job:http_requests_total:rate5m{service=\"$service\", namespace=\"$namespace\"} offset 1h)"
            }
          ]
        },
        {
          "id": 7,
          "title": "CPU Usage — Current vs Baseline (1h ago)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"lineWidth": 2}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Baseline (1h ago)"},
                "properties": [
                  {"id": "custom.lineStyle", "value": {"dash": [8, 4], "fill": "dash"}},
                  {"id": "color", "value": {"fixedColor": "semi-dark-orange", "mode": "fixed"}},
                  {"id": "custom.lineWidth", "value": 1}
                ]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Current ({{pod}})",
              "expr": "job:container_cpu_usage:rate5m{namespace=\"$namespace\"}"
            },
            {
              "refId": "B",
              "legendFormat": "Baseline ({{pod}})",
              "expr": "job:container_cpu_usage:rate5m{namespace=\"$namespace\"} offset 1h"
            }
          ]
        },
        {
          "id": 8,
          "title": "Memory Working Set — Current vs Baseline (1h ago)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {"lineWidth": 2}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Baseline (1h ago)"},
                "properties": [
                  {"id": "custom.lineStyle", "value": {"dash": [8, 4], "fill": "dash"}},
                  {"id": "color", "value": {"fixedColor": "semi-dark-orange", "mode": "fixed"}},
                  {"id": "custom.lineWidth", "value": 1}
                ]
              }
            ]
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Current ({{pod}})",
              "expr": "job:container_memory_working_set:bytes{namespace=\"$namespace\"}"
            },
            {
              "refId": "B",
              "legendFormat": "Baseline ({{pod}})",
              "expr": "job:container_memory_working_set:bytes{namespace=\"$namespace\"} offset 1h"
            }
          ]
        },
        {
          "id": 9,
          "title": "Active Regression Alerts",
          "type": "table",
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 32},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {"custom": {"filterable": true}},
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "severity"},
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {"options": {"warning": {"color": "yellow", "index": 0, "text": "warning"}}, "type": "value"},
                      {"options": {"critical": {"color": "red", "index": 1, "text": "critical"}}, "type": "value"}
                    ]
                  },
                  {"id": "custom.displayMode", "value": "color-background"}
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "alertname", "desc": false}]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ALERTS{regression=\"true\"}",
              "instant": true,
              "legendFormat": "",
              "format": "table"
            }
          ],
          "transformations": [
            {"id": "filterFieldsByName", "options": {"include": {"names": ["alertname", "namespace", "service", "severity", "Value"]}}}
          ]
        }
      ]
    }
