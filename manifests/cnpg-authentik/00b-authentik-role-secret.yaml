# Password source for the CNPG `authentik` role, sourced from the SAME Vault value Authentik
# already uses for its DB connection (platform/authentik-env → AUTHENTIK_POSTGRESQL__PASSWORD,
# verified md5-identical to the live bitnami authentik-postgres-secret). This is what makes the
# cluster a TRUE drop-in: at cutover only postgresql.host changes; Authentik's own credentials
# stay valid. Consumed by the Cluster's spec.managed.roles[authentik].passwordSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-cnpg-role
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-cnpg-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "authentik"
        password: "{{ .pgpass }}"
  data:
    - secretKey: pgpass
      remoteRef:
        key: platform/authentik-env
        property: AUTHENTIK_POSTGRESQL__PASSWORD
