---
# Redis for Retrieva (BullMQ queues + cache). Password from ESO secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: retrieva
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: docker.io/valkey/valkey:8.1-alpine
          command:
            - sh
            - -c
            - exec valkey-server --requirepass "$REDIS_PASSWORD" --maxmemory 200mb --maxmemory-policy noeviction --appendonly yes
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: redis-password } }
          ports:
            - { containerPort: 6379, name: redis }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            exec: { command: ["sh","-c","valkey-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 320Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: retrieva
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: retrieva
spec:
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379, name: redis }
