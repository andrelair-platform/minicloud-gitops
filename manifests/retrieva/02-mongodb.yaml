---
# MongoDB on-cluster for Retrieva (replaces external MongoDB Atlas).
# Official mongo image; root user `retrieva` created from the ESO secret;
# app connects with authSource=admin (see mongodb-uri in Vault).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: retrieva
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mongodb
          image: docker.io/library/mongo:7.0
          args: ["--auth"]
          ports:
            - { containerPort: 27017, name: mongo }
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: retrieva
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: retrieva-secrets, key: mongo-password } }
            - name: MONGO_INITDB_DATABASE
              value: retrieva
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            exec: { command: ["mongosh","--quiet","--eval","db.adminCommand('ping')"] }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1500Mi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          recurring-job-group.longhorn.io/daily-backup: enabled
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        volumeMode: Filesystem
        resources:
          requests: { storage: 3Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: retrieva
spec:
  selector: { app: mongodb }
  ports:
    - { port: 27017, targetPort: 27017, name: mongo }
