apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loki-tls
  namespace: observability
spec:
  dnsNames:
    - loki.10.0.0.200.nip.io
  duration: 2160h0m0s
  renewBefore: 720h0m0s
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: minicloud-ca
  secretName: loki-tls
  usages:
    - digital signature
    - key encipherment
