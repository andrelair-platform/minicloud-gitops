---
# ============================================================================
# BUSINESS "Company Portal" — birthright, all authenticated staff.
# Shows ONLY business + workplace apps. Engineering/operator tools live in the
# separate homer-eng portal (06-eng-configmap.yaml), gated to engineer roles.
# RBAC model: ktayl-iam #17 (IGA-02) docs/access-role-model.md + docs/homer-rbac-spec.md.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: homer
data:
  config.yml: |
    title: ktayl — Company Portal
    subtitle: "Business workplace — SSO via Authentik"
    header: true
    footer: false
    stylesheet:
      - "assets/custom.css"
    # Access-tier legend — every service is tagged by how it's reached:
    #   🟢 Public   (green tag)  = reachable from anywhere (public URL + SSO login)
    #   🟠 Tailscale (amber tag) = internal tool, requires the Tailscale VPN
    message:
      style: "is-info"
      title: "Your workplace"
      content: 'Business & collaboration apps. <span class="tag is-success">Public</span> reachable anywhere (SSO) &nbsp;·&nbsp; <span class="tag is-warning">Tailscale</span> internal (VPN + minicloud CA). Engineers: the platform tools are on the <b>Engineering Portal</b> (homer-eng, Tailscale).'
    colors:
      light:
        highlight-primary: '#3367d6'
        highlight-secondary: '#4285f4'
        highlight-hover: '#5a95f5'
        background: '#f2f4f8'
        card-background: '#ffffff'
        text: '#363636'
        text-header: '#ffffff'
        text-title: '#303030'
        text-subtitle: '#424242'
        card-shadow: rgba(0, 0, 0, 0.1)
        link: '#3273dc'
        link-hover: '#363636'
      dark:
        highlight-primary: '#3367d6'
        highlight-secondary: '#4285f4'
        highlight-hover: '#5a95f5'
        background: '#131313'
        card-background: '#2b2b2b'
        text: '#eaeaea'
        text-header: '#ffffff'
        text-title: '#fafafa'
        text-subtitle: '#f5f5f5'
        card-shadow: rgba(0, 0, 0, 0.4)
        link: '#3273dc'
        link-hover: '#ffdd57'
    services:
    - name: Workplace & Collaboration
      icon: fas fa-users
      items:
      - name: Mail
        icon: fas fa-envelope
        subtitle: "Self-hosted email — Stalwart, webmail + IMAP/SMTP — login with full email address"
        tag: Public
        tagstyle: is-success
        url: https://mail.devandre.sbs/webmail
        target: _blank
      - name: Chat
        icon: fas fa-comments
        subtitle: "AI assistant — Open WebUI, grounded RAG + web search"
        tag: Public
        tagstyle: is-success
        url: https://chat.devandre.sbs
        target: _blank
      - name: Nextcloud
        icon: fas fa-cloud
        subtitle: "Document collaboration & file sharing — OnlyOffice integration"
        tag: Public
        tagstyle: is-success
        url: https://cloud.devandre.sbs
        target: _blank
      - name: Element
        icon: fas fa-comment-dots
        subtitle: "Team chat — Matrix/Synapse, E2E encryption"
        tag: Public
        tagstyle: is-success
        url: https://element.devandre.sbs
        target: _blank
      - name: Jitsi Meet
        icon: fas fa-video
        subtitle: "Video conferencing — Spaces, screen share"
        tag: Public
        tagstyle: is-success
        url: https://meet.devandre.sbs
        target: _blank
      - name: Sign
        icon: fas fa-file-signature
        subtitle: "e-Signature — Docuseal, PDF templates, audit trail, eIDAS-compatible"
        tag: Public
        tagstyle: is-success
        url: https://sign.devandre.sbs
        target: _blank
      - name: Vaultwarden
        icon: fas fa-user-shield
        subtitle: "Password manager — Bitwarden-compatible"
        tag: Public
        tagstyle: is-success
        url: https://vault-pw.devandre.sbs
        target: _blank
    - name: Insurance Business
      icon: fas fa-briefcase
      items:
      - name: ERPNext
        icon: fas fa-building
        subtitle: "HR / ERP / Finance — Frappe, HR source of truth"
        tag: Public
        tagstyle: is-success
        url: https://erp.devandre.sbs
        target: _blank
      - name: ktayl-solution
        icon: fas fa-briefcase
        subtitle: "Insurance platform — 7 Lines of Business"
        tag: Public
        tagstyle: is-success
        url: https://ktayl.devandre.sbs
        target: _blank
  # Force the access-tier tag badge ALWAYS visible. Homer's theme collapses the
  # tag to a sliver and hides its text until card hover; override to the hovered
  # state permanently so Public / Tailscale is readable at a glance.
  custom.css: |
    body #main-section .card .tag {
      width: auto !important;
      padding: 0 0.6em !important;
    }
    body #main-section .card .tag .tag-text {
      display: block !important;
    }
