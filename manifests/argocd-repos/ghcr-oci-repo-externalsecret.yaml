# ArgoCD Helm-OCI repository credential for ghcr (prod chart registry).
# Lets the repo-server pull minicloud-app-deployment from ghcr.io/andrelair-platform for -prod apps.
# Reuses the existing Vault ghcr read token (secret/platform/ghcr). ghcr uses a public CA — no
# argocd-tls-certs-cm entry needed (unlike Harbor). See docs/helm-golden-path.md.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-oci-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-oci-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: ghcr-oci
        type: helm
        url: ghcr.io/andrelair-platform
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: platform/ghcr, property: username }
    - secretKey: password
      remoteRef: { key: platform/ghcr, property: token }
