# ArgoCD Helm-OCI repository credential for Harbor (dev chart registry).
# Lets the repo-server pull the minicloud-app-deployment chart (HGP golden path) from
# harbor.10.0.0.200.nip.io/library. Robot creds come from Vault via ESO — never in git.
# CA trust for harbor is configured in helm-values/.../argocd-values.yaml (configs.tls.certificates).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-oci-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-oci-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: harbor-oci
        type: helm
        url: harbor.10.0.0.200.nip.io/library
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: platform/harbor-oci
        property: username
    - secretKey: password
      remoteRef:
        key: platform/harbor-oci
        property: password
