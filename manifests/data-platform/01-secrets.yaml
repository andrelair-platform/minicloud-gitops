---
# All from Vault secret/platform/data-platform (provision out-of-band before first sync):
#   analytics-password · metabase-db-password · metabase-secret-key
#   policy-pg-host · policy-pg-user · policy-pg-password · policy-pg-db  (read-only on the policy DB)
# CNPG managed-role password for `analytics` (dbt + ingest write; Metabase reads).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dp-analytics-role
  namespace: data-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: dp-analytics-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "analytics"
        password: "{{ .pw }}"
  data:
    - secretKey: pw
      remoteRef: { key: platform/data-platform, property: analytics-password }
---
# CNPG managed-role password for `metabase` (owns the metabase app DB).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dp-metabase-role
  namespace: data-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: dp-metabase-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "metabase"
        password: "{{ .pw }}"
  data:
    - secretKey: pw
      remoteRef: { key: platform/data-platform, property: metabase-db-password }
---
# Read-only connection to the live ktayl-policy-service DB (ingestion source).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dp-policy-source
  namespace: data-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: dp-policy-source
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POLICY_PG_HOST
      remoteRef: { key: platform/data-platform, property: policy-pg-host }
    - secretKey: POLICY_PG_USER
      remoteRef: { key: platform/data-platform, property: policy-pg-user }
    - secretKey: POLICY_PG_PASSWORD
      remoteRef: { key: platform/data-platform, property: policy-pg-password }
    - secretKey: POLICY_PG_DB
      remoteRef: { key: platform/data-platform, property: policy-pg-db }
---
# Metabase app env (its own metadata DB on the same CNPG cluster + encryption key).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dp-metabase-app
  namespace: data-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: dp-metabase-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        MB_DB_TYPE: "postgres"
        MB_DB_HOST: "dp-postgres-rw.data-platform.svc.cluster.local"
        MB_DB_PORT: "5432"
        MB_DB_DBNAME: "metabase"
        MB_DB_USER: "metabase"
        MB_DB_PASS: "{{ .mbpw }}"
        MB_ENCRYPTION_SECRET_KEY: "{{ .enc }}"
  data:
    - secretKey: mbpw
      remoteRef: { key: platform/data-platform, property: metabase-db-password }
    - secretKey: enc
      remoteRef: { key: platform/data-platform, property: metabase-secret-key }
