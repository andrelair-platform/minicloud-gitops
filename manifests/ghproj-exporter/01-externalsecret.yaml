apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghproj-exporter-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghproj-exporter-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform/ghproj-exporter
        property: token
