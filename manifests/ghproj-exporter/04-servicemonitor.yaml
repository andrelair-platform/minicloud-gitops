apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ghproj-exporter
  namespace: monitoring
  labels:
    app: ghproj-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ghproj-exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
