# ktayl-ldap outpost — the LDAP bridge that lets Stalwart authenticate mail against Authentik.
# GitOps-tracked workload (NOT Authentik auto-deployed — the outpost is service_connection=None).
# Connects back to the Authentik core over the in-cluster http svc; egress is open in this ns.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ktayl-ldap-outpost
  namespace: authentik
  labels: { app: ktayl-ldap-outpost }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ktayl-ldap-outpost }
  template:
    metadata:
      labels: { app: ktayl-ldap-outpost }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ldap
          image: ghcr.io/goauthentik/ldap:2026.5.3
          env:
            - name: AUTHENTIK_HOST
              value: http://authentik-server.authentik.svc.cluster.local:80
            - name: AUTHENTIK_INSECURE
              value: "false"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef: { name: ldap-outpost-token, key: AUTHENTIK_TOKEN }
          ports:
            - { name: ldap, containerPort: 3389 }
            - { name: ldaps, containerPort: 6636 }
            - { name: metrics, containerPort: 9300 }
          readinessProbe:
            tcpSocket: { port: 3389 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3389 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
