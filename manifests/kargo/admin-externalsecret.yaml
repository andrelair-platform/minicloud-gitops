apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kargo-api
  namespace: kargo
spec:
  # Renders the `kargo-api` secret the chart consumes via api.secret.name — so the
  # admin password hash + JWT signing key come from Vault, never from git or Helm
  # values. token-signing-key is pre-generated; admin-password-hash is set by the
  # owner (empty until then → admin login stays disabled, API waits, nothing leaks).
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-api
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ADMIN_ACCOUNT_PASSWORD_HASH: "{{ .passwordHash }}"
        ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: "{{ .signingKey }}"
  data:
    - secretKey: passwordHash
      remoteRef:
        key: platform/kargo
        property: admin-password-hash
    - secretKey: signingKey
      remoteRef:
        key: platform/kargo
        property: token-signing-key
