apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kargo
  namespace: kargo
  annotations:
    # Kargo's API/UI speaks HTTP (TLS terminated here — api.tls.terminatedUpstream=true).
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kargo.10.0.0.200.nip.io
      secretName: kargo-tls
  rules:
    - host: kargo.10.0.0.200.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kargo-api
                # Verify with: kubectl -n kargo get svc kargo-api -o jsonpath='{.spec.ports}'
                port:
                  number: 443
