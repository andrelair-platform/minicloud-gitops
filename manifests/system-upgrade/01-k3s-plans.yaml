# k3s upgrade Plans — system-upgrade-controller
#
# Upgrade sequence:
#   1. Server plan runs first (set-hog, the single control-plane node).
#   2. Agent plan's prepare step waits for server plan to complete.
#   3. Workers upgrade one at a time (concurrency: 1).
#
# To upgrade: change `version:` below and commit. ArgoCD auto-syncs the Plan.
# To PAUSE: set concurrency: 0 on both plans (commit, sync, then revert when ready).
#
# IMPORTANT — ArgoCD auto-sync and upgrade jobs:
#   Do not trigger a sync while the SUC controller is running upgrade Job pods.
#   The Job pods are owned by the Plan; ArgoCD sees them as "out of sync" and
#   may delete them if selfHeal is enabled. Pause auto-sync or add an ignoreDifferences
#   entry for Job resources during active upgrade windows.
#
# Current cluster version: v1.36.3+k3s1 (all 5 nodes as of 2026-07-28).
# Next target: bump version below when a new k3s release is validated.
#
# DRAIN GOTCHA — set-hog hosts many PDB-protected StatefulSets (Prometheus,
# Loki, postgresql-synapse, Stalwart) pinned via nodeSelector. Standard eviction
# is blocked by PDBs, causing drain timeout. Fix: disableEviction: true skips
# the eviction API and directly deletes pods, bypassing PDB checks. Pinned
# StatefulSets restart on the same node after upgrade (cannot reschedule).
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  concurrency: 1
  # operator: Exists is preferred over matchLabels: "true" — the label value
  # varies across k3s versions; Exists matches regardless of value.
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  serviceAccountName: system-upgrade
  cordon: true
  drain:
    force: true
    ignoreDaemonSets: true
    deleteEmptydirData: true
    disableEviction: true        # bypass PDB checks — set-hog has many pinned StatefulSets
    timeout: 300
  version: v1.36.3+k3s1
  upgrade:
    image: rancher/k3s-upgrade
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - effect: NoExecute
      operator: Exists
    - effect: NoSchedule
      operator: Exists
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
spec:
  concurrency: 1
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  serviceAccountName: system-upgrade
  cordon: true
  drain:
    force: true
    ignoreDaemonSets: true       # required: Longhorn and other DaemonSet pods
    deleteEmptydirData: true     # required: many system pods use emptyDir
    disableEviction: true        # bypass PDB checks — consistent with server plan
    timeout: 300
  prepare:
    # Blocks agent upgrades until the server plan has completed.
    image: rancher/k3s-upgrade
    args:
      - prepare
      - k3s-server
  version: v1.36.3+k3s1
  upgrade:
    image: rancher/k3s-upgrade
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - effect: NoExecute
      operator: Exists
    - effect: NoSchedule
      operator: Exists
