---
# Default deny all ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: langfuse
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress from nginx ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: langfuse
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# Allow same-namespace traffic (ClickHouse, Redis, langfuse pods)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: langfuse
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: langfuse
---
# Allow Prometheus scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: langfuse
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
        - port: 3000
---
# Allow LiteLLM (ai namespace) to call Langfuse web API for tracing
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-tracing
  namespace: langfuse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
      ports:
        - port: 3000
---
# Allow app-level LLMOps tracing from product namespaces (Langfuse core SDK → langfuse web API).
# LiteLLM (ai ns) is covered above; this is for apps that send their own Trace→span→generation
# hierarchy directly (retrieva backend). Add a product's namespaces here when it starts app-tracing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-tracing
  namespace: langfuse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: retrieva
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: retrieva-dev
      ports:
        - port: 3000
---
# Allow kube-apiserver webhook calls (flannel VTEP 10.42.0.0/24 for worker nodes)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-webhook
  namespace: langfuse
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/24
        - ipBlock:
            cidr: 10.42.0.0/24
---
# Cilium: allow kubelet liveness/readiness probes (host + remote-node entities).
# Without this, default-deny-ingress blocks probe traffic from the kubelet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-node-entities
  namespace: langfuse
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
