# R2 credentials for CloudNativePG's Barman object-store backup (WAL + base backups).
# Same source + bucket family as the authentik/nextcloud CNPG clusters (Vault platform/cloudflare).
# Consumed by the Cluster's backup.barmanObjectStore.s3Credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-cnpg-r2
  namespace: langfuse
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-cnpg-r2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: platform/cloudflare, property: r2-access-key-id }
    - secretKey: SECRET_ACCESS_KEY
      remoteRef: { key: platform/cloudflare, property: r2-secret-access-key }
