# Langfuse CloudNativePG cluster — gives Langfuse its OWN, backed-up metadata DB, off the shared
# `postgresql-ai` StatefulSet in the `ai` ns (which is a raw single-instance STS on the custom
# `noavx512` base = no PITR + the GC'd-image SPOF + a noisy-neighbour/cross-ns coupling). Langfuse
# metadata is plain relational — it does NOT use pgvector — so the operator-default
# ghcr.io/cloudnative-pg/postgresql image is correct (no noavx512 base needed).
#
# Standardises Langfuse onto CNPG like authentik/claims/underwriting/nextcloud/data-platform:
# automated base+WAL backup to R2 (PITR), managed role, dedicated instance.
#
# Bootstrap = an EMPTY db `langfuse` owned by role `langfuse`; the data is moved by a supervised
# pg_dump (from postgresql-ai) → pg_restore (into this cluster) at cutover — see the migration
# runbook. The role password equals the value Langfuse already uses (04- ESO) → drop-in: at cutover
# only DATABASE_HOST changes (postgresql-ai.ai.svc → langfuse-postgres-rw.langfuse.svc).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: langfuse-postgres
  namespace: langfuse
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised

  storage:
    size: 3Gi
    storageClass: longhorn

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  monitoring:
    enablePodMonitor: true

  # Manage the `langfuse` role's password = the value Langfuse already uses (Vault platform/langfuse
  # → db-password, via the 04- ESO). Drop-in at cutover.
  managed:
    roles:
      - name: langfuse
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: langfuse-cnpg-role

  # Empty database `langfuse` owned by role `langfuse` (NOT the CNPG default app/app) — pg_restore
  # loads the migrated schema+rows into a DB the langfuse role owns.
  bootstrap:
    initdb:
      database: langfuse
      owner: langfuse

  # Off-site PITR to R2 — same dedicated bucket as authentik/nextcloud CNPG.
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://minicloud-cnpg-offsite/langfuse
      endpointURL: https://4d3a131c84ca31b951cba16a5b7db0c1.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId:
          name: langfuse-cnpg-r2
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: langfuse-cnpg-r2
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
