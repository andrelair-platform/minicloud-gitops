# Password for the CNPG `langfuse` role — sourced from the SAME Vault value Langfuse already uses
# for its DB connection (platform/langfuse → db-password; the `langfuse-secrets` key `password` the
# chart's DATABASE_PASSWORD consumes). Reusing it makes the new CNPG cluster a DROP-IN at cutover:
# Langfuse's DB credentials stay valid; only DATABASE_HOST changes (postgresql-ai → langfuse-postgres-rw).
# Consumed by the Cluster's spec.managed.roles[langfuse].passwordSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-cnpg-role
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-cnpg-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "langfuse"
        password: "{{ .pgpass }}"
  data:
    - secretKey: pgpass
      remoteRef:
        key: platform/langfuse
        property: db-password
