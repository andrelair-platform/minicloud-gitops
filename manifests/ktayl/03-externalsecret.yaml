---
# Postgres credentials — password for the ktayl-postgres StatefulSet.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-postgres-secret
  namespace: ktayl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: ktayl/policy-service/postgres
        property: password
---
# Application secrets — DSN, NATS URL, JWKS URL, MinIO credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ktayl-policy-service-secret
  namespace: ktayl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ktayl-policy-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DSN
      remoteRef:
        key: ktayl/policy-service/app
        property: DSN
    - secretKey: NATS_URL
      remoteRef:
        key: ktayl/policy-service/app
        property: NATS_URL
    - secretKey: AUTHENTIK_JWKS_URL
      remoteRef:
        key: ktayl/policy-service/app
        property: AUTHENTIK_JWKS_URL
    - secretKey: MINIO_ENDPOINT
      remoteRef:
        key: ktayl/policy-service/app
        property: MINIO_ENDPOINT
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: ktayl/policy-service/app
        property: MINIO_ACCESS_KEY
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: ktayl/policy-service/app
        property: MINIO_SECRET_KEY
