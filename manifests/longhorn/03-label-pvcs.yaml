apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-pvc-labeler
  namespace: longhorn-system
---
# Minimal: only needs to patch PVC labels across namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-pvc-labeler
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-pvc-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-pvc-labeler
subjects:
  - kind: ServiceAccount
    name: longhorn-pvc-labeler
    namespace: longhorn-system
---
# PostSync hook: idempotent — safe to re-run on every ArgoCD sync.
# Adds recurring-job-group.longhorn.io/backup=enabled to critical PVCs.
# Longhorn propagates this label from PVC to the backing volume automatically.
apiVersion: batch/v1
kind: Job
metadata:
  name: label-longhorn-backup-pvcs
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    # BeforeHookCreation: delete existing job before each sync → guarantees
    # a fresh pod is created with the current image (Job spec is immutable).
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: longhorn-pvc-labeler
      restartPolicy: OnFailure
      containers:
        - name: labeler
          # alpine:3.21 has wget built in — no extra packages, no kubectl image needed.
          # Patches PVC labels directly via the k8s REST API using the pod's SA token.
          image: docker.io/alpine:3.21
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache curl -q
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API=https://kubernetes.default.svc
              PATCH='{"metadata":{"labels":{"recurring-job-group.longhorn.io/backup":"enabled"}}}'

              label() {
                curl -sf --cacert "$CA" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/merge-patch+json" \
                  -X PATCH -d "$PATCH" \
                  "$API/api/v1/namespaces/$1/persistentvolumeclaims/$2" > /dev/null \
                  && echo "labeled $1/$2" || echo "FAILED $1/$2"
              }

              # Identity / auth / secrets
              label authentik    data-authentik-postgresql-0
              label vault        data-vault-0
              label vaultwarden  vaultwarden-data

              # Core business data
              label erp          data-erpnext-mariadb-sts-0
              label erp          erpnext
              label mail         data-stalwart-0
              label productivity pvc-plane-ce-pgdb-vol-plane-ce-pgdb-wl-0
              label productivity pvc-plane-ce-minio-vol-plane-ce-minio-wl-0

              # Communication
              label chat         matrix-synapse
              label sign         docuseal-data

              # AI / platform services
              label ai           data-postgresql-ai-0
              label ai           open-webui
              label backstage    data-backstage-postgresql-0
              label harbor       database-data-harbor-database-0
              label harbor       harbor-registry
              label langfuse     data-langfuse-clickhouse-shard0-0

              # Messaging (NATS JetStream persistence)
              label messaging    nats-js-nats-0
              label messaging    nats-js-nats-1
              label messaging    nats-js-nats-2

              # Nextcloud
              label nextcloud    data-nextcloud-postgresql-0
              label nextcloud    nextcloud-nextcloud

              echo "All PVCs labeled for Longhorn backup group"
