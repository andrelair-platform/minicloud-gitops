apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-pvc-labeler
  namespace: longhorn-system
---
# Needs to GET PVCs (to resolve volume name) and PATCH Longhorn volumes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-pvc-labeler
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-pvc-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-pvc-labeler
subjects:
  - kind: ServiceAccount
    name: longhorn-pvc-labeler
    namespace: longhorn-system
---
# PostSync hook: idempotent — safe to re-run on every ArgoCD sync.
# Labels Longhorn volume CRs directly (not PVCs — Longhorn v1.6 does not
# auto-propagate PVC labels to volume objects for existing volumes).
# BeforeHookCreation ensures Job spec is re-created fresh each sync
# (Kubernetes Jobs are immutable; SSA cannot update the pod template).
apiVersion: batch/v1
kind: Job
metadata:
  name: label-longhorn-backup-volumes
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: longhorn-pvc-labeler
      restartPolicy: OnFailure
      containers:
        - name: labeler
          image: docker.io/alpine:3.21
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache curl -q
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API=https://kubernetes.default.svc
              LABEL_PATCH='{"metadata":{"labels":{"recurring-job-group.longhorn.io/backup":"enabled"}}}'

              # Resolve PVC → Longhorn volume name, then PATCH the volume CR.
              # Longhorn reads recurring job groups from the volume object labels.
              labelVol() {
                ns=$1; pvc=$2
                volname=$(curl -sf --cacert "$CA" \
                  -H "Authorization: Bearer $TOKEN" \
                  "$API/api/v1/namespaces/$ns/persistentvolumeclaims/$pvc" \
                  | grep -o '"volumeName":"[^"]*"' | cut -d'"' -f4)
                if [ -z "$volname" ]; then echo "SKIP $ns/$pvc (not found)"; return; fi
                curl -sf --cacert "$CA" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/merge-patch+json" \
                  -X PATCH -d "$LABEL_PATCH" \
                  "$API/apis/longhorn.io/v1beta2/namespaces/longhorn-system/volumes/$volname" \
                  > /dev/null && echo "labeled $ns/$pvc -> $volname" || echo "FAILED $ns/$pvc"
              }

              # Identity / auth / secrets
              labelVol authentik    data-authentik-postgresql-0
              labelVol vault        data-vault-0
              labelVol vaultwarden  vaultwarden-data

              # Core business data
              labelVol erp          data-erpnext-mariadb-sts-0
              labelVol erp          erpnext
              labelVol mail         data-stalwart-0
              labelVol productivity pvc-plane-ce-pgdb-vol-plane-ce-pgdb-wl-0
              labelVol productivity pvc-plane-ce-minio-vol-plane-ce-minio-wl-0

              # Communication
              labelVol chat         matrix-synapse
              labelVol sign         docuseal-data

              # AI / platform services
              labelVol ai           data-postgresql-ai-0
              labelVol ai           open-webui
              labelVol backstage    data-backstage-postgresql-0
              labelVol harbor       database-data-harbor-database-0
              labelVol harbor       harbor-registry
              labelVol langfuse     data-langfuse-clickhouse-shard0-0

              # Messaging (NATS JetStream persistence)
              labelVol messaging    nats-js-nats-0
              labelVol messaging    nats-js-nats-1
              labelVol messaging    nats-js-nats-2

              # Nextcloud
              labelVol nextcloud    data-nextcloud-postgresql-0
              labelVol nextcloud    nextcloud-nextcloud

              echo "All Longhorn volumes labeled for backup recurring job group"
