# Longhorn backup target: MinIO at 10.0.0.1:9000, bucket "longhorn".
# Region string is arbitrary for MinIO — Longhorn uses AWS_ENDPOINTS from the secret.
# Longhorn 1.11+ manages the backup target via the BackupTarget CR; the old
# `backup-target` / `backup-target-credential-secret` Settings were REMOVED in 1.12
# (the webhook rejects them: "setting ... does not exist"). Migrated here 2026-10-02
# after the 1.6->1.12.1 climb; ArgoCD SSA adopts the live `default` BackupTarget in place.
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: "s3://longhorn@us-east-1/"
  credentialSecret: longhorn-backup-credentials
  pollInterval: 5m0s
---
# Kept at least-effort (the conservative default: moves one replica at a time, only when a
# healthier placement exists). best-effort was TRIALLED 2026-10-02 (Objective 2) and proved
# INERT on this topology — 4 active storage nodes (set-hog + swift-mac are allowScheduling=
# false) + soft-anti-affinity + mostly-3r volumes leave it no placement it deems "strictly
# healthier", so it moved ZERO replicas in ~1h (loving-gannet stayed at 41). Reverted — no
# reason to run a non-default that earns nothing. The Objective-2 exposure win came from
# TARGETED manual levers instead: harbor-registry 3r->2r (-33 GiB total) + relocating the
# star-kitten hotspot copy (113->80 GiB). See docs/reliability-longhorn-upgrade.md.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-auto-balance
  namespace: longhorn-system
value: "least-effort"
---
# Run a lightweight data-integrity check immediately after every snapshot
# (daily at 01:00 UTC via the daily-snapshot recurring job).
# Catches replica divergence the same day instead of waiting for the
# weekly standalone scan (snapshot-data-integrity-cronjob: 0 0 */7 * *).
# 1.12 stores this as a per-data-engine map (was a scalar "true" pre-1.11) — match the
# live format so ArgoCD doesn't perpetually diff.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: snapshot-data-integrity-immediate-check-after-snapshot-creation
  namespace: longhorn-system
value: '{"v1":"true","v2":"true"}'
---
# Node-failure auto-failover for STATEFUL workloads. Default "do-nothing" means when a
# node goes down, Longhorn leaves the stuck pod in place → the StatefulSet/Deployment
# never reschedules it → no failover (the gap that stranded workloads in the 2026-09-18
# incidents). "delete-both-…" makes Longhorn delete the pod on a confirmed-down node so
# the controller recreates it on a healthy node and the RWO volume reattaches there.
# Safe: Longhorn's single-engine guarantee prevents split-brain; it only acts once the
# node is genuinely down (not a brief blip). Pairs with unpinning (a pinned pod still
# can't move) — see the auto-failover epic.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-down-pod-deletion-policy
  namespace: longhorn-system
value: "delete-both-statefulset-and-deployment-pod"
---
# Cap concurrent replica rebuilds per node at 2 (default 5). Tuned for this resource-
# constrained, aging-hardware cluster (ThinkPads + a 2012 MacBook), where both extremes fail:
#   5 → parallel rebuilds SATURATE node CPU/I-O; kubelet/instance-manager miss heartbeats,
#       replicas flap to `stopped`, the cluster THRASHES (fast-skunk CPU hit 98% at 5).
#   1 → a single stuck rebuild DEADLOCKS the node's only slot, blocking every other rebuild
#       on that node → the cluster can't heal without hand-deleting the stuck replica.
#   2 → the sweet spot: a stuck rebuild leaves a 2nd free slot (no deadlock), yet gentle
#       enough to avoid the saturation thrash. Observed live 2026-09-30 (fast-skunk 98%→31%
#       when dropped off 5; deadlock reproduced at 1).
# See memory [[feedback_longhorn_stale_rofs_after_churn]].
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-replica-rebuild-per-node-limit
  namespace: longhorn-system
value: "2"
