---
# Distributes the minicloud root CA (public cert) to EVERY namespace as ConfigMap
# `minicloud-ca-bundle` (key ca.crt) + a Secret of the same name. New apps trust the internal
# PKI at RUNTIME by mounting this + setting NODE_EXTRA_CA_CERTS — no custom CA-baked image needed.
# CA rotation = update this inLine PEM (+ the vault issuer) once; trust-manager fans it out.
# The CA cert is PUBLIC (only the private key is secret) → safe to commit.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: minicloud-ca-bundle
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after the trust-manager chart (CRDs) installs
spec:
  sources:
    - inLine: |
        -----BEGIN CERTIFICATE-----
        MIICAzCCAaigAwIBAgIUXS8lZg8k9yh42Gyd7EBDeQpvrnAwCgYIKoZIzj0EAwIw
        XzEbMBkGA1UEChMSYW5kcmVsYWlyLXBsYXRmb3JtMRswGQYDVQQLExJtaW5pY2xv
        dWQgcGxhdGZvcm0xIzAhBgNVBAMTGm1pbmljbG91ZCBJbnRlcm5hbCBSb290IENB
        MB4XDTI2MDUwOTExNTY0NloXDTM2MDUwNjExNTY0NlowXzEbMBkGA1UEChMSYW5k
        cmVsYWlyLXBsYXRmb3JtMRswGQYDVQQLExJtaW5pY2xvdWQgcGxhdGZvcm0xIzAh
        BgNVBAMTGm1pbmljbG91ZCBJbnRlcm5hbCBSb290IENBMFkwEwYHKoZIzj0CAQYI
        KoZIzj0DAQcDQgAEIYSIb9sazO1MO/DE8TFIpQYnlPmh+mVpe7p+lBl7gouSefd/
        SUAJd0t7xNMqWqmgnyaMiiw0TohHA3sh1YcHNKNCMEAwDgYDVR0PAQH/BAQDAgKk
        MA8GA1UdEwEB/wQFMAMBAf8wHQYDVR0OBBYEFACl2vBxhgRX0PvqGapck0sM4efd
        MAoGCCqGSM49BAMCA0kAMEYCIQCApyHzARqV3RlzFR5uIdpwyyUyGJugM89NXvWv
        bEJ7gQIhAJq5mnZKS/EJTMPYzkuq33K4g+FJp2zt+VpUkg24ETKO
        -----END CERTIFICATE-----
  target:
    configMap:
      key: ca.crt
    secret:
      key: ca.crt
    namespaceSelector:
      matchLabels: {}   # empty = all namespaces
