apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireResourceLimits
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: require-resource-limits
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - gatekeeper-system
            - cert-manager
            - longhorn-system
            - monitoring       # prometheus-operator sidecars don't set limits by design
            - observability    # loki/tempo infra
            - metallb-system
            - ingress
            - chaos-mesh
            - velero
            - harbor           # multi-service chart; LimitRange injects runtime defaults
            - messaging        # nats reloader/prom-exporter sidecars; LimitRange covers runtime
            - nfs-provisioner  # infrastructure component with variable I/O
            - productivity     # Plane CE bundled PG/Redis/RabbitMQ/MinIO StatefulSets don't expose resource limits in chart values
            - mail             # ses-inbound sidecar container has resources:{} — chart doesn't support per-sidecar limits
            - sign
            - argo-rollouts    # argo-rollouts and argo-rollouts-dashboard Deployments have no limits in upstream chart
            - vpa-system
            - system-upgrade
            - chat             # matrix-synapse-redis StatefulSet has no limits; signing key Job lacks chart limit support
            - erp              # erpnext-scheduler Deployment has no limits in chart values
            - temporal         # Temporal server chart generates init/config containers without resource limits — cannot override in chart values
