---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: k3s-backup-minio
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k3s-backup-minio
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: secret/platform/minio
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-sqlite-backup
  namespace: monitoring
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      template:
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          restartPolicy: OnFailure
          volumes:
            - name: k3s-db
              hostPath:
                path: /var/lib/rancher/k3s/server/db
                type: Directory
          containers:
            - name: backup
              # Self-contained image (sqlite + rclone baked in) built from
              # alpine:3.20 — see the k3s-backup image in Harbor. The old
              # `apk add` at runtime failed whenever DNS/CDN was unavailable
              # (i.e. exactly mid-incident: 2026-08-19 the backup was broken
              # for days because bind9 flapping blocked the Alpine package
              # fetch on set-hog). A DR backup must not depend on the internet.
              image: harbor.10.0.0.200.nip.io/library/k3s-backup:1.0
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  DATE=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/tmp/k3s-state-${DATE}.db"

                  # Consistent snapshot via VACUUM INTO. Unlike ".backup" (the
                  # online-backup API, which RESTARTS whenever the source is
                  # written and therefore livelocks against kine's constant
                  # writes — it hung >10min on the hot ~1.4GB DB on 2026-08-19),
                  # VACUUM INTO uses a single read transaction: it completes in
                  # ~3s and also compacts the DB (drops free pages).
                  sqlite3 /db/state.db "VACUUM INTO '${BACKUP_FILE}'"
                  gzip "${BACKUP_FILE}"

                  # Configure rclone for MinIO
                  cat > /tmp/rclone.conf << CONF
                  [minio]
                  type = s3
                  provider = Minio
                  access_key_id = admin
                  secret_access_key = ${MINIO_PASSWORD}
                  endpoint = http://10.0.0.1:9000
                  CONF

                  rclone --config /tmp/rclone.conf mkdir minio:k3s-backup 2>/dev/null || true
                  rclone --config /tmp/rclone.conf copy "${BACKUP_FILE}.gz" minio:k3s-backup/

                  # Rotate: keep 7, delete oldest
                  FILE_COUNT=$(rclone --config /tmp/rclone.conf ls minio:k3s-backup/ | wc -l)
                  DELETE_COUNT=$((FILE_COUNT - 7))
                  if [ "$DELETE_COUNT" -gt 0 ]; then
                    rclone --config /tmp/rclone.conf ls minio:k3s-backup/ | \
                      sort | awk '{print $NF}' | head -n "$DELETE_COUNT" | \
                      xargs -r -I{} rclone --config /tmp/rclone.conf delete "minio:k3s-backup/{}"
                  fi

                  echo "Backup complete: k3s-state-${DATE}.db.gz (kept $((FILE_COUNT > 7 ? 7 : FILE_COUNT)) of $FILE_COUNT files)"
              volumeMounts:
                - name: k3s-db
                  mountPath: /db
              env:
                - name: MINIO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: k3s-backup-minio
                      key: password
              securityContext:
                runAsUser: 0
                capabilities:
                  drop: [NET_RAW]
              resources:
                limits:
                  cpu: 500m
                  # Raised 256Mi -> 512Mi: the k3s SQLite DB has grown to
                  # ~1.4GB (476MB state.db + ~900MB WAL) and sqlite .backup +
                  # gzip + rclone need headroom as it grows.
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
