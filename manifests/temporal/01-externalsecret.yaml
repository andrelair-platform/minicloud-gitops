---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: temporal-db-secret
  namespace: temporal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: temporal-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/temporal
        property: postgresql-password
