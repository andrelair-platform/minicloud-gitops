---
# Main ingress — Authentik forward auth protects the Temporal Web UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-web
  namespace: temporal
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      auth_request /outpost.goauthentik.io/auth/nginx;
      error_page 401 = @goauthentik_proxy_signin;
      auth_request_set $auth_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_cookie;
      auth_request_set $authentik_username $upstream_http_x_authentik_username;
      auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
      proxy_set_header X-authentik-username $authentik_username;
      proxy_set_header X-authentik-groups $authentik_groups;
    nginx.ingress.kubernetes.io/server-snippet: |
      location /outpost.goauthentik.io {
        proxy_pass https://ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local:9443;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        add_header Set-Cookie $auth_cookie;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
      }
      error_page 401 @goauthentik_proxy_signin;
      location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$request_uri;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - temporal.10.0.0.200.nip.io
        - temporal.devandre.sbs
      secretName: temporal-tls
  rules:
    - host: temporal.10.0.0.200.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-web
                port:
                  number: 8080
    - host: temporal.devandre.sbs
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-web
                port:
                  number: 8080
