apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erpnext-admin-secret
  namespace: erp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: erpnext-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: ERPNEXT_ADMIN_PASSWORD
      remoteRef:
        key: secret/platform/erpnext
        property: ERPNEXT_ADMIN_PASSWORD
---
# The ERPNext Helm chart creates a secret named <release-name> (erpnext) with
# key mariadb-root-password — pre-create it via ESO so the password never
# appears in values.yaml. ArgoCD ignoreDifferences on this Secret prevents
# the Helm-rendered stringData from overwriting what ESO owns.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erpnext-mariadb-root
  namespace: erp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: erpnext
    creationPolicy: Owner
  data:
    - secretKey: mariadb-root-password
      remoteRef:
        key: secret/platform/erpnext
        property: ERPNEXT_DB_ROOT_PASSWORD
---
# DSN phase 3.1 — Net-Entreprises credentials (ERP-4).
# Vault path: secret/platform/net-entreprises
# Keys: login, password, siret, company_name
# DSN_TEST_MODE and DSN_ENDPOINT are static (qualification until go-live).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erpnext-dsn-config
  namespace: erp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: erpnext-dsn-config
    creationPolicy: Owner
  data:
    - secretKey: DSN_LOGIN
      remoteRef:
        key: secret/platform/net-entreprises
        property: login
    - secretKey: DSN_PASSWORD
      remoteRef:
        key: secret/platform/net-entreprises
        property: password
    - secretKey: DSN_SIRET
      remoteRef:
        key: secret/platform/net-entreprises
        property: siret
    - secretKey: DSN_COMPANY_NAME
      remoteRef:
        key: secret/platform/net-entreprises
        property: company_name
---
# HR-12 — J/M/L lifecycle event signing key + the n8n fan-out webhook URL.
# Vault path: secret/platform/hr-lifecycle (keys: signing-key, n8n-webhook-url).
# The gunicorn + both workers consume these via secretKeyRef (erpnext-values.yaml):
#   HR_LIFECYCLE_SIGNING_KEY — the HMAC-SHA256 key publish() signs each event with
#     (the SAME key n8n verifies with — single source of truth, they cannot drift).
#   HR_N8N_WEBHOOK_URL       — empty => the n8n fan-out leg is skipped (off). Set it in
#     Vault to turn the fan-out ON (NATS publish is unaffected either way).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erpnext-hr-lifecycle
  namespace: erp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: erpnext-hr-lifecycle
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: HR_LIFECYCLE_SIGNING_KEY
      remoteRef:
        key: secret/platform/hr-lifecycle
        property: signing-key
    - secretKey: HR_N8N_WEBHOOK_URL
      remoteRef:
        key: secret/platform/hr-lifecycle
        property: n8n-webhook-url
