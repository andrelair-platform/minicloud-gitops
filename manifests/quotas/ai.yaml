---
# ai namespace: LiteLLM, Open WebUI, docling, markitdown, RAG ingest, presidio, minicloud-agent
# Bumped requests.memory 8→12Gi 2026-08-02: minicloud-agent (256Mi) pushed LiteLLM rolling
# update over quota (7.05Gi used, new pod needs 2Gi headroom for RollingUpdate concurrency).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-quota
  namespace: ai
spec:
  hard:
    requests.cpu: "6"
    limits.cpu: "24"
    requests.memory: 12Gi
    limits.memory: 40Gi
    count/pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-limits
  namespace: ai
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
