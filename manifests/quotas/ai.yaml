---
# ai namespace: LiteLLM, Open WebUI, docling, markitdown, RAG ingest, presidio, minicloud-agent,
# MLflow, vLLM (Phi-3-mini CPU mode).
# Bumped requests.memory 8→12Gi 2026-08-02: minicloud-agent rolling update headroom.
# Bumped LimitRange max cpu 4→8 / memory 8→14Gi 2026-08-02: vLLM needs 7 CPU / 12Gi.
# Bumped pods 20→25 and requests.cpu 6→10 for vLLM + MLflow.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-quota
  namespace: ai
spec:
  hard:
    requests.cpu: "10"
    limits.cpu: "32"
    requests.memory: 16Gi
    limits.memory: 56Gi
    count/pods: "25"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-limits
  namespace: ai
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "8"
        memory: 14Gi
