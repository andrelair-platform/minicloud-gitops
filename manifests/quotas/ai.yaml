---
# ai namespace: LiteLLM, Open WebUI, docling, markitdown, RAG ingest, presidio
# Ollama removed 2026-08-02. Remaining limits: ~12 CPU / ~24Gi across ~11 pods.
# Ceiling set 2x remaining usage.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-quota
  namespace: ai
spec:
  hard:
    requests.cpu: "6"
    limits.cpu: "24"
    requests.memory: 8Gi
    limits.memory: 40Gi
    count/pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-limits
  namespace: ai
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
