---
# nextcloud namespace: Nextcloud, OnlyOffice document server
# OnlyOffice can spike to 2+ CPU during document conversion — limit set accordingly.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nextcloud-quota
  namespace: nextcloud
spec:
  hard:
    # Sized for Nextcloud + the OnlyOffice document server. OnlyOffice requests
    # 250m/1Gi (limits 2/3Gi) and Nextcloud already uses ~350m/832Mi, so the prior
    # 500m/1Gi requests couldn't admit OnlyOffice (it sat 0/1 for 44d). Raised to fit.
    requests.cpu: "1"
    limits.cpu: "6"
    requests.memory: 3Gi
    limits.memory: 8Gi
    count/pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: nextcloud-limits
  namespace: nextcloud
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
