---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: minicloud-plane-staging
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limits
  namespace: minicloud-plane-staging
spec:
  limits:
    - type: Container
      default:
        cpu: "200m"
        memory: "256Mi"
      defaultRequest:
        cpu: "10m"
        memory: "32Mi"
      max:
        cpu: "1"
        memory: "1Gi"
