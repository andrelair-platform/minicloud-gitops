---
# chat namespace: Matrix Synapse (500m/1Gi), Element Web (100m/128Mi), Redis (no limits — see note)
# Gatekeeper require-resource-limits excludes this ns; matrix-synapse-redis has no limits.
# LimitRange injects defaults on next pod restart. Helm values need updating before
# removing chat from the Gatekeeper exclusion list.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: chat-quota
  namespace: chat
spec:
  hard:
    # Bumped 2026-10-06 for the synapse-postgres CNPG migration: during Phase 1→5 the new CNPG
    # cluster (100m/256Mi) + the transient restore-drill pod run ALONGSIDE the old postgresql-synapse
    # STS (50m/128Mi). Can be tightened back toward ~750m/1.5Gi after the old STS is deleted at cleanup.
    requests.cpu: "1"
    limits.cpu: "4"
    requests.memory: 2Gi
    limits.memory: 6Gi
    count/pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: chat-limits
  namespace: chat
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
