---
# langfuse namespace: ClickHouse, Langfuse web, worker, migration job, postgres
apiVersion: v1
kind: ResourceQuota
metadata:
  name: langfuse-quota
  namespace: langfuse
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "8"
    requests.memory: 4Gi
    limits.memory: 20Gi
    count/pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: langfuse-limits
  namespace: langfuse
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
