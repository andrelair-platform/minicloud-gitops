---
# langfuse namespace: ClickHouse, Langfuse web, worker, migration job, postgres
apiVersion: v1
kind: ResourceQuota
metadata:
  name: langfuse-quota
  namespace: langfuse
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "8"
    # 6Gi (was 4Gi): steady-state use is ~3.7Gi, so 4Gi left ZERO surge headroom —
    # any rollout's new pod hit "exceeded quota: requests.memory" (FailedCreate) and
    # langfuse could never redeploy. 6Gi gives room for a single surge pod on rollout.
    requests.memory: 6Gi
    limits.memory: 20Gi
    count/pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: langfuse-limits
  namespace: langfuse
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
