---
# Authentik peak: ~197m CPU / 889Mi memory (server 49m/437Mi, worker 78m/271Mi, postgres 70m/181Mi).
# Bumped for the Stage-4 PARALLEL CloudNativePG cluster (2 instances @ 100m/256Mi req, 500m/512Mi lim)
# + its transient import bootstrap job, running alongside the existing bitnami postgres until cutover.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: authentik-quota
  namespace: authentik
spec:
  hard:
    requests.cpu: "1500m"
    limits.cpu: "4"
    requests.memory: 3Gi
    limits.memory: 5Gi
    count/pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: authentik-limits
  namespace: authentik
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 512Mi
      defaultRequest:
        cpu: 10m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
