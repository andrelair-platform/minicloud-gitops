---
# collab namespace: Jitsi Meet — JVB (1 CPU/512Mi), prosody/jicofo/web (500m/256Mi each)
# JVB uses hostNetwork for media — quota applies to pod CPU/memory, not network bandwidth.
# Measured limits total: ~2.5 CPU / ~1.25Gi. Ceiling sized for JVB horizontal scaling.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: collab-quota
  namespace: collab
spec:
  hard:
    requests.cpu: 500m
    limits.cpu: "6"
    requests.memory: 512Mi
    limits.memory: 4Gi
    count/pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: collab-limits
  namespace: collab
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 2Gi
