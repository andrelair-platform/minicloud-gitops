---
# collab namespace: Jitsi Meet — JVB (256Mi req), prosody/jicofo/web (128Mi req each)
# Steady state: 4 pods × ~160Mi avg = 640Mi. Extra 360Mi covers one RollingUpdate surge.
# JVB uses hostNetwork for media — quota applies to pod CPU/memory, not network bandwidth.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: collab-quota
  namespace: collab
spec:
  hard:
    requests.cpu: 500m
    limits.cpu: "6"
    requests.memory: 1Gi
    limits.memory: 4Gi
    count/pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: collab-limits
  namespace: collab
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 2Gi
