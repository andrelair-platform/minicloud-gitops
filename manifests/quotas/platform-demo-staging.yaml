---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: platform-demo-staging
spec:
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limits
  namespace: platform-demo-staging
spec:
  limits:
    - type: Container
      default:
        cpu: "200m"
        memory: "256Mi"
      defaultRequest:
        cpu: "10m"
        memory: "32Mi"
      max:
        cpu: "1"
        memory: "1Gi"
