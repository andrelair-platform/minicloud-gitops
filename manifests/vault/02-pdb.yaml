# PodDisruptionBudget for the Vault Raft HA quorum (audit R-03, Stage 2).
# maxUnavailable: 1 keeps 2 of 3 raft nodes up during node drains (kured) and k3s
# upgrades — enough for quorum, so voluntary disruptions never lose the secrets layer.
# Standalone (not chart-generated) + a distinct name so it can't collide with any object
# the vault Helm app manages. Only meaningful once server.ha.replicas: 3 is in effect
# (vault-values.yaml) — a PDB on a single replica would block all drains of its node.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vault-server-quorum
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
      component: server
