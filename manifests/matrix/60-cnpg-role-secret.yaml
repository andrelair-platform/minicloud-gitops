# Password for the CNPG `synapse` role — sourced from the SAME Vault value Synapse already uses
# (platform/postgresql-synapse → pg-password; the `postgresql-synapse-secret` key the ananace chart's
# externalPostgresql.existingSecret consumes). Reusing it makes the new CNPG cluster a DROP-IN at
# cutover: Synapse's DB credential stays valid; only externalPostgresql.host changes
# (postgresql-synapse → synapse-postgres-rw). Consumed by the Cluster's managed.roles[synapse].passwordSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: synapse-cnpg-role
  namespace: chat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: synapse-cnpg-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "synapse"
        password: "{{ .pgpass }}"
  data:
    - secretKey: pgpass
      remoteRef:
        key: platform/postgresql-synapse
        property: pg-password
